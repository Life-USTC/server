name: Deployment Ordering

# Observe the currently configured production owner. Cloudflare Git builds are
# observed until the dedicated promotion owner is activated; then its separate
# read-only status credential supplies readiness and pending-write evidence.
# This workflow never deploys or reruns source CI and holds no write credential.

on:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deployment-ordering
  cancel-in-progress: true

jobs:
  verify:
    name: Verify delivered production commit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      github.repository == 'Life-USTC/server' &&
      (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
      vars.PROMOTION_OBSERVER_ORIGIN != '' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository))
    permissions:
      contents: read
      checks: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 20

      - name: Setup Bun environment
        uses: ./.github/actions/setup-bun-env

      - name: Verify delivered production commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_PUBLIC_ORIGIN: ${{ vars.APP_PUBLIC_ORIGIN || 'https://life-ustc.tiankaima.dev' }}
          PROMOTION_OBSERVER_ORIGIN: ${{ vars.PROMOTION_OBSERVER_ORIGIN }}
          PROMOTION_OBSERVER_TOKEN: ${{ secrets.PROMOTION_OBSERVER_TOKEN }}
        run: bun run scripts/deploy/verify-deployment-ordering.ts
