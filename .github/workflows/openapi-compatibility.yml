name: OpenAPI compatibility

on:
  pull_request:
    branches: ["**"]
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  breaking-changes:
    name: OpenAPI breaking changes
    runs-on: blacksmith-4vcpu-ubuntu-2604
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: useblacksmith/checkout@v1 # v7.0.1

      - name: Fetch base branch
        shell: bash
        run: >-
          git fetch --no-tags --depth=1 origin
          "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"

      - name: Check OpenAPI compatibility
        uses: oasdiff/oasdiff-action/breaking@17214aea5113d728707fdd7d84bc811f4850fe3a # v0.1.22
        with:
          base: origin/${{ github.base_ref }}:public/openapi.generated.json
          revision: HEAD:public/openapi.generated.json
          fail-on: ${{ !contains(github.event.pull_request.labels.*.name, 'api-breaking-approved') && 'WARN' || '' }}
          review: false
