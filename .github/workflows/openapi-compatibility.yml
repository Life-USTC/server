name: OpenAPI compatibility

on:
  pull_request:
    branches: ["**"]
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  breaking-changes:
    name: OpenAPI breaking changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch base branch
        shell: bash
        run: >-
          git fetch --no-tags --depth=1 origin
          "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"

      - name: Check OpenAPI compatibility
        uses: oasdiff/oasdiff-action/breaking@9ce3a29eb0e6478dd0140932a678c7fb59d08f22 # v0.1.20
        with:
          base: origin/${{ github.base_ref }}:public/openapi.generated.json
          revision: HEAD:public/openapi.generated.json
          fail-on: ${{ !contains(github.event.pull_request.labels.*.name, 'api-breaking-approved') && 'WARN' || '' }}
          review: false
