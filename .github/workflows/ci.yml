name: CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]

jobs:
  check:
    name: Check
    permissions:
      contents: read
    uses: ./.github/workflows/bun-job.yml
    with:
      job-phase: ci:verify

  test-unit:
    name: Unit test coverage
    permissions:
      contents: read
    uses: ./.github/workflows/bun-job.yml
    with:
      job-phase: ci:unit
      upload-artifact-name: vitest-coverage
      upload-artifact-path: coverage
      upload-artifact-no-files-found: warn
      upload-artifact-always: true

  test-integration:
    name: MCP Integration Test (${{ matrix.index }}/4)
    strategy:
      fail-fast: false
      matrix:
        include:
          - index: 1
            database: life_ustc_integration_1
          - index: 2
            database: life_ustc_integration_2
          - index: 3
            database: life_ustc_integration_3
          - index: 4
            database: life_ustc_integration_4
    permissions:
      contents: read
    uses: ./.github/workflows/db-backed-bun-job.yml
    with:
      # Runtime connection URLs are derived from this disposable database.
      database-name: ${{ matrix.database }}
      job-phase: ci:integration
      vitest-shard: ${{ matrix.index }}/4
      timeout-minutes: 60

  test-rest:
    name: REST API Test (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1/8
            database: life_ustc_rest_1
            artifact: api-1
          - shard: 2/8
            database: life_ustc_rest_2
            artifact: api-2
          - shard: 3/8
            database: life_ustc_rest_3
            artifact: api-3
          - shard: 4/8
            database: life_ustc_rest_4
            artifact: api-4
          - shard: 5/8
            database: life_ustc_rest_5
            artifact: api-5
          - shard: 6/8
            database: life_ustc_rest_6
            artifact: api-6
          - shard: 7/8
            database: life_ustc_rest_7
            artifact: api-7
          - shard: 8/8
            database: life_ustc_rest_8
            artifact: api-8
    needs: build-e2e-artifacts
    permissions:
      contents: read
    uses: ./.github/workflows/db-backed-bun-job.yml
    with:
      database-name: ${{ matrix.database }}
      job-phase: ci:rest
      e2e-shard: ${{ matrix.shard }}
      timeout-minutes: 60
      download-artifact-name: e2e-svelte-kit
      download-artifact-path: .svelte-kit
      upload-artifact-name: playwright-report-integration-${{ matrix.artifact }}
      # Keep API Playwright and per-test Worker diagnostics when integration
      # infrastructure fails before a report can be rendered.
      upload-artifact-path: playwright-report/
      upload-artifact-no-files-found: ignore
      upload-artifact-always: true
  test-rls:
    name: PostgreSQL RLS Isolation Test
    permissions:
      contents: read
    uses: ./.github/workflows/db-backed-bun-job.yml
    with:
      database-name: life_ustc_rls
      job-phase: ci:rls

  build-e2e-artifacts:
    name: Build E2E artifacts
    permissions:
      contents: read
    uses: ./.github/workflows/bun-job.yml
    with:
      webhook-secret: e2e-ci-secret
      extra-env: NO_PROXY=127.0.0.1,localhost,::1
      job-phase: ci:e2e:build-artifacts
      upload-artifact-name: e2e-svelte-kit
      upload-artifact-path: .svelte-kit
      upload-artifact-no-files-found: error
      upload-artifact-include-hidden-files: true

  static-loader-image:
    name: Static Loader Image
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Build static loader image
        shell: bash
        run: |
          source .github/scripts/retry.sh
          retry_command 3 15 "docker build" : \
            docker build --target loader -t life-ustc-static-loader:check .
      - name: Smoke test static loader image
        run: |
          docker run --rm --entrypoint sh life-ustc-static-loader:check -c '
            command -v bun
            command -v curl
            test -x /usr/local/bin/docker-entrypoint.load.sh
            test -x scripts/load-static-sqlite.sh
            test -f src/static-loader/cli.ts
            test -d src/generated/prisma-node
          '
      - name: Dry-run static loader image
        shell: bash
        run: |
          set -euo pipefail

          network="static-loader-check-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          postgres="static-loader-postgres-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          report_dir="${RUNNER_TEMP}/static-loader-report"
          mkdir -p "${report_dir}"
          bun tests/fixtures/static-loader-snapshot.ts "${report_dir}/fixture.sqlite"

          cleanup() {
            docker rm -f "${postgres}" >/dev/null 2>&1 || true
            docker network rm "${network}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker network create "${network}"
          docker run -d --rm \
            --name "${postgres}" \
            --network "${network}" \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=life_ustc_static_loader \
            postgres:16

          for attempt in $(seq 1 60); do
            if docker exec "${postgres}" pg_isready -U postgres -d life_ustc_static_loader >/dev/null 2>&1; then
              break
            fi
            if [ "${attempt}" -eq 60 ]; then
              echo "Postgres did not become ready" >&2
              exit 1
            fi
            sleep 1
          done

          docker run --rm \
            --network "${network}" \
            -v "${report_dir}:/tmp/static-loader-report" \
            -v "${report_dir}/fixture.sqlite:/tmp/static-loader-fixture.sqlite:ro" \
            -e DATABASE_URL="postgresql://postgres:postgres@${postgres}:5432/life_ustc_static_loader" \
            -e STATIC_SNAPSHOT_PATH=/tmp/static-loader-fixture.sqlite \
            -e STATIC_LOADER_DRY_RUN=true \
            -e STATIC_LOADER_STATS_FILE=/tmp/static-loader-report/report.json \
            life-ustc-static-loader:check

          REPORT_PATH="${report_dir}/report.json" bun -e '
            const report = await Bun.file(process.env.REPORT_PATH).json();
            if (
              report.mode !== "dry-run" ||
              report.outcome !== "rolled-back" ||
              report.databaseRecordCounts !== null ||
              report.snapshot?.schemaVersion !== "6" ||
              report.reconciliation?.sectionPresence?.status !== "applied" ||
              !Number.isInteger(
                report.reconciliation?.sectionPresence
                  ?.missingSectionCount,
              ) ||
              !/^[a-f0-9]{64}$/.test(report.snapshot?.sha256 ?? "")
            ) {
              throw new Error("Static loader report has invalid dry-run semantics");
            }
            for (const [table, count] of Object.entries({
              semesters: 1, courses: 1, sections: 1, teachers: 1,
              scheduleGroups: 1, schedules: 1, exams: 1,
              rooms: 1, buildings: 1, campuses: 1,
            })) {
              if (report.plannedRecordCounts?.[table] !== count) {
                throw new Error(`Static loader fixture did not exercise ${table}`);
              }
            }
          '

          # Check the real database as well as the reported rollback outcome.
          remaining_rows="$(docker exec "${postgres}" psql -U postgres -d life_ustc_static_loader -X -qAt -v ON_ERROR_STOP=1 -c '
            SELECT (SELECT COUNT(*) FROM "Course")
                 + (SELECT COUNT(*) FROM "Section")
                 + (SELECT COUNT(*) FROM "Teacher")
                 + (SELECT COUNT(*) FROM "TeacherAssignment")
                 + (SELECT COUNT(*) FROM "RoomType")
                 + (SELECT COUNT(*) FROM "Schedule")
                 + (SELECT COUNT(*) FROM "Exam")
                 + (SELECT COUNT(*) FROM "StaticImportState");
          ')"
          test "${remaining_rows}" = "0"

  test-e2e:
    name: E2E Test (${{ matrix.shard }})
    needs: build-e2e-artifacts
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1/8
            artifact: shard-1
            database: life_ustc_e2e_1
          - shard: 2/8
            artifact: shard-2
            database: life_ustc_e2e_2
          - shard: 3/8
            artifact: shard-3
            database: life_ustc_e2e_3
          - shard: 4/8
            artifact: shard-4
            database: life_ustc_e2e_4
          - shard: 5/8
            artifact: shard-5
            database: life_ustc_e2e_5
          - shard: 6/8
            artifact: shard-6
            database: life_ustc_e2e_6
          - shard: 7/8
            artifact: shard-7
            database: life_ustc_e2e_7
          - shard: 8/8
            artifact: shard-8
            database: life_ustc_e2e_8
    permissions:
      contents: read
    uses: ./.github/workflows/db-backed-bun-job.yml
    with:
      database-name: ${{ matrix.database }}
      install-playwright: true
      webhook-secret: e2e-ci-secret
      extra-env: |
        NO_PROXY=127.0.0.1,localhost,::1
      download-artifact-name: e2e-svelte-kit
      download-artifact-path: .svelte-kit
      job-phase: ci:e2e:test
      e2e-shard: ${{ matrix.shard }}
      upload-artifact-name: playwright-report-${{ matrix.artifact }}
      # Includes native traces, per-test Worker logs and owned resource identities.
      upload-artifact-path: playwright-report/
      upload-artifact-no-files-found: ignore
      upload-artifact-always: true

  test-visual-regression:
    name: Visual regression (opt-in)
    if: ${{ vars.VISUAL_REGRESSION == '1' }}
    needs: build-e2e-artifacts
    permissions:
      contents: read
    uses: ./.github/workflows/db-backed-bun-job.yml
    with:
      database-name: life_ustc_visual
      install-playwright: true
      webhook-secret: e2e-ci-secret
      extra-env: |
        NO_PROXY=127.0.0.1,localhost,::1
        VISUAL_REGRESSION=1
      download-artifact-name: e2e-svelte-kit
      download-artifact-path: .svelte-kit
      job-phase: ci:visual-regression
      timeout-minutes: 45
      upload-artifact-name: playwright-report-visual
      # Includes visual Playwright output and per-test Worker logs.
      upload-artifact-path: playwright-report/
      upload-artifact-no-files-found: ignore
      upload-artifact-always: true

  # This protected check name is retained for branch protection. It aggregates
  # native CI outcomes and document validity, not requirement/test coverage.
  specification-evidence:
    name: Specification execution evidence
    needs: [check, build-e2e-artifacts, static-loader-image, test-unit, test-integration, test-rest, test-rls, test-e2e]
    if: ${{ always() }}
    permissions:
      contents: read
    uses: ./.github/workflows/bun-job.yml
    with:
      job-phase: ci:required-jobs
      required-job-results: ${{ toJSON(needs) }}
