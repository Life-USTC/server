name: CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]

# Keep PR checks on their pull-request ref, separate from manual branch runs.
# New runs replace obsolete work on that ref without stopping main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # Only jobs declaring PostgreSQL connect; builds use the same datasource URL.
  FUNCTION_OWNER_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/life_ustc_test
  DATABASE_URL: postgresql://life_ustc_runtime:runtime-test-password@127.0.0.1:5432/life_ustc_test
  AUTH_DATABASE_URL: postgresql://life_ustc_auth_runtime:auth-runtime-test-password@127.0.0.1:5432/life_ustc_test
  MAINTENANCE_DATABASE_URL: postgresql://life_ustc_maintenance_runtime:maintenance-runtime-test-password@127.0.0.1:5432/life_ustc_test
  CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE: postgresql://life_ustc_runtime:runtime-test-password@127.0.0.1:5432/life_ustc_test
  CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE_AUTH: postgresql://life_ustc_auth_runtime:auth-runtime-test-password@127.0.0.1:5432/life_ustc_test
  CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE_MAINTENANCE: postgresql://life_ustc_maintenance_runtime:maintenance-runtime-test-password@127.0.0.1:5432/life_ustc_test

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Source / Checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-bun-env
      - name: Verify development seed guard
        run: bash tests/ci/seed-guard.test.sh
      - name: Generate application and database clients
        run: bun run app:prepare
      - name: Check Cloudflare bindings
        run: bunx wrangler types --include-runtime=false --check
      - name: Check formatting and lint
        run: bunx biome check
      - name: Validate feature specifications
        run: bun run specs:check
      - name: Check Svelte components
        run: bunx svelte-check --tsconfig ./tsconfig.json
      - name: Check TypeScript
        run: |
          bunx tsc --noEmit -p tsconfig.typecheck.json
          bunx tsc --noEmit -p tsconfig.typecheck.tests.json
      - name: Verify OpenAPI parity
        run: bun run openapi:check

  test-unit:
    name: Application / Unit coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GRAPHQL_SCHEMA_SKIP_BASE_COMPATIBILITY: "true"
    steps:
      - *checkout
      - uses: ./.github/actions/setup-bun-env
      - name: Generate application and database clients
        run: bun run app:prepare
      - name: Run unit tests and check coverage
        run: bunx vitest run --coverage
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: vitest-coverage
          path: coverage
          if-no-files-found: warn
          retention-days: 14

  test-plan:
    name: Tests / Inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.inventory.outputs.matrix }}
    env: &worker-env
      AUTH_SECRET: e2e-dev-secret-not-for-production
      WEBHOOK_SECRET: e2e-ci-secret
      WEBHOOK_LOGIN_ENABLED: "true"
      NO_PROXY: 127.0.0.1,localhost,::1
    steps:
      - *checkout
      - uses: ./.github/actions/setup-bun-env
      - name: Generate application and database clients
        run: bun run app:prepare
      - id: inventory
        name: Collect domain and verification combinations
        run: bun tests/ci/test-matrix.ts

  test-domain:
    name: ${{ matrix.domain }} / ${{ matrix.method }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: [test-plan, build-e2e-artifacts]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.test-plan.outputs.matrix) }}
    env: *worker-env
    services: &test-database
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: life_ustc_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - *checkout
      - uses: ./.github/actions/setup-bun-env
      - name: Install Chromium
        if: ${{ matrix.browser }}
        run: bunx playwright install --with-deps --only-shell chromium
      - name: Download application and Worker build
        if: ${{ matrix.http || matrix.browser }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: test-build
          path: .svelte-kit
      - uses: ./.github/actions/setup-test-database
      - name: Service and in-process contracts
        if: ${{ matrix.integration }}
        env:
          INTEGRATION_FILES: ${{ toJSON(matrix.integrationFiles) }}
        run: bunx vitest run --config vitest.integration.config.ts --tags-filter='@${{ matrix.domain }}/${{ matrix.method }}'
      - name: Worker request contracts
        if: ${{ matrix.http }}
        run: bunx playwright test --config playwright.api.config.ts --fully-parallel --workers=2 --grep='@${{ matrix.domain }}/${{ matrix.method }}( |$)'
      - name: Browser and consumer contracts
        if: ${{ matrix.browser }}
        run: bunx playwright test --project=chromium --project=mobile-chrome --fully-parallel --workers=2 --grep='@${{ matrix.domain }}/${{ matrix.method }}( |$)'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() && (matrix.http || matrix.browser) }}
        with:
          name: playwright-report-${{ matrix.domain }}-${{ matrix.method }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  test-rls:
    name: Database / Permissions
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services: *test-database
    steps:
      - *checkout
      - uses: ./.github/actions/setup-bun-env
      - uses: ./.github/actions/setup-test-database
      - name: Verify permission bootstrap is repeatable
        run: psql "$FUNCTION_OWNER_DATABASE_URL" -X --quiet --single-transaction --file=tests/integration/fixtures/rls-runtime-bootstrap.sql
      - name: Verify runtime roles
        env:
          RLS_TEST_ENABLED: "true"
          AUTH_ROLE_TEST_ENABLED: "true"
          FUNCTION_OWNER_ROLE_TEST_ENABLED: "true"
          MAINTENANCE_ROLE_TEST_ENABLED: "true"
        run: |
          bunx vitest run \
            --config vitest.integration.config.ts \
            tests/integration/rls-database-contract.test.ts \
            tests/integration/auth-runtime-contract.test.ts \
            tests/integration/maintenance-runtime-contract.test.ts \
            tests/integration/function-owner-role-contract.test.ts \
            tests/integration/*-rls.test.ts
          bunx vitest run \
            --config vitest.integration.config.ts \
            --tags-filter=@Database/Permissions \
            tests/integration/feature-event-store.test.ts

  build-e2e-artifacts:
    name: Application / Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env: *worker-env
    steps:
      - *checkout
      - uses: ./.github/actions/setup-bun-env
      - name: Build application
        run: bun run build
      - name: Build isolated test Worker
        run: bun run build:test-worker
      - name: Check public page client budgets
        run: bun tests/ci/public-route-client-budget.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-build
          path: |
            .svelte-kit/cloudflare
            .svelte-kit/test-worker
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  static-loader-image:
    name: Static loader / Container image
    runs-on: ubuntu-latest
    services: *test-database
    steps:
      - *checkout
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Build static loader image
        run: docker build --target loader -t life-ustc-static-loader:check .
      - name: Verify static loader image and dry-run rollback
        env:
          DATABASE_URL: ${{ env.FUNCTION_OWNER_DATABASE_URL }}
        run: bun tests/ci/static-loader-image.ts

  specification-evidence:
    # Keep the protected check name; documents are validated by Source / Checks.
    name: Specification execution evidence / run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [check, build-e2e-artifacts, static-loader-image, test-unit, test-plan, test-domain, test-rls]
    if: ${{ always() }}
    permissions: {}
    steps:
      - name: Reject unsuccessful test or build jobs
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: exit 1
