name: Dependency upgrade repair

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  generate-biome-repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/life_ustc_ci
    steps:
      - name: Checkout dependency branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Migrate Biome configuration
        run: bunx biome migrate --write

      - name: Replace unsafe optional-chain assertion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("tests/unit/workspace-navigation-summary.test.ts")
          source = path.read_text(encoding="utf-8")
          pattern = re.compile(
              r'^[ \t]+const sql = \(queryRawMock\.mock\.calls\[0\]\?\.\[0\] as TemplateStringsArray\)\.join\(\n[ \t]+"\?",\n[ \t]+\);',
              re.MULTILINE,
          )
          replacement = "\n".join(
              [
                  "    const [query] = queryRawMock.mock.calls[0] ?? [];",
                  "    expect(query).toBeDefined();",
                  '    const sql = (query as TemplateStringsArray).join("?");',
              ]
          )
          source, count = pattern.subn(replacement, source, count=1)
          if count != 1:
              raise SystemExit("expected unsafe optional-chain assertion was not found")
          path.write_text(source, encoding="utf-8")
          PY

      - name: Apply Biome formatter and safe fixes
        run: bunx biome check --write || true

      - name: Verify Biome checks
        run: bunx biome check

      - name: Verify focused unit test
        run: |
          bun run app:prepare
          bunx vitest run tests/unit/workspace-navigation-summary.test.ts

      - name: Commit generated repair
        run: |
          set -euo pipefail
          git add biome.json tests
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix(deps): migrate repository to Biome 2.5'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
