name: Dependency asset diagnostic

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  compare-client-assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/life_ustc_ci
    steps:
      - name: Checkout baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          path: baseline

      - name: Checkout dependency branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: candidate/.bun-version

      - name: Build baseline
        working-directory: baseline
        run: |
          bun install --frozen-lockfile
          bun run app:prepare
          bun run build

      - name: Build dependency branch
        working-directory: candidate
        run: |
          bun install --frozen-lockfile
          bun run app:prepare
          bun run build

      - name: Compare public-route client assets
        run: |
          cat > asset-report.mjs <<'EOF'
          import { createHash } from "node:crypto";
          import { access, readFile } from "node:fs/promises";
          import { basename, resolve } from "node:path";
          import { pathToFileURL } from "node:url";
          import { gzipSync } from "node:zlib";

          const root = resolve(process.argv[2]);
          const label = process.argv[3] ?? basename(root);
          const manifestModule = await import(
            `${pathToFileURL(resolve(root, ".svelte-kit/output/server/manifest.js")).href}?${Date.now()}`
          );
          const { manifest } = manifestModule;
          const route = manifest._.routes.find((candidate) => candidate.id === "/");
          if (!route?.page) throw new Error("Cannot resolve the homepage route");

          const scripts = new Set(manifest._.client.imports);
          const stylesheets = new Set(manifest._.client.stylesheets);
          const nodeIndexes = [
            ...route.page.layouts.filter((index) => index !== undefined),
            route.page.leaf,
          ];

          for (const index of nodeIndexes) {
            const node = await readFile(
              resolve(root, `.svelte-kit/output/server/nodes/${index}.js`),
              "utf8",
            );
            for (const [, kind, files] of node.matchAll(
              /export const (imports|stylesheets) = (\[[^;]*\]);/g,
            )) {
              const target = kind === "imports" ? scripts : stylesheets;
              for (const file of JSON.parse(files)) target.add(file);
            }
          }

          const reverseSources = new Map();
          for (const candidate of [
            resolve(root, ".svelte-kit/output/client/.vite/manifest.json"),
            resolve(root, ".svelte-kit/output/client/manifest.json"),
          ]) {
            try {
              await access(candidate);
            } catch {
              continue;
            }
            const viteManifest = JSON.parse(await readFile(candidate, "utf8"));
            for (const [source, entry] of Object.entries(viteManifest)) {
              for (const file of [
                entry.file,
                ...(entry.css ?? []),
                ...(entry.assets ?? []),
              ].filter(Boolean)) {
                const sources = reverseSources.get(file) ?? new Set();
                sources.add(source);
                reverseSources.set(file, sources);
              }
            }
          }

          const assets = [];
          for (const file of [...scripts, ...stylesheets].sort()) {
            const bytes = await readFile(
              resolve(root, ".svelte-kit/output/client", file),
            );
            assets.push({
              file,
              type: stylesheets.has(file) ? "css" : "js",
              bytes: bytes.byteLength,
              gzipBytes: gzipSync(bytes, { level: 9 }).byteLength,
              sha256: createHash("sha256").update(bytes).digest("hex"),
              sources: [...(reverseSources.get(file) ?? [])].sort(),
            });
          }

          console.log(
            JSON.stringify(
              {
                label,
                requestCount: assets.length,
                gzipBytes: assets.reduce((sum, asset) => sum + asset.gzipBytes, 0),
                assets,
              },
              null,
              2,
            ),
          );
          EOF

          cat > compare-assets.mjs <<'EOF'
          import { readFile } from "node:fs/promises";

          const baseline = JSON.parse(await readFile("baseline-assets.json", "utf8"));
          const candidate = JSON.parse(await readFile("candidate-assets.json", "utf8"));
          console.log(
            `TOTAL baseline=${baseline.requestCount} requests/${baseline.gzipBytes} gzip bytes ` +
              `candidate=${candidate.requestCount} requests/${candidate.gzipBytes} gzip bytes ` +
              `delta=${candidate.requestCount - baseline.requestCount} requests/` +
              `${candidate.gzipBytes - baseline.gzipBytes} gzip bytes`,
          );

          const baselineByHash = new Map(
            baseline.assets.map((asset) => [asset.sha256, asset]),
          );
          const candidateByHash = new Map(
            candidate.assets.map((asset) => [asset.sha256, asset]),
          );
          const added = candidate.assets
            .filter((asset) => !baselineByHash.has(asset.sha256))
            .sort((a, b) => b.gzipBytes - a.gzipBytes);
          const removed = baseline.assets
            .filter((asset) => !candidateByHash.has(asset.sha256))
            .sort((a, b) => b.gzipBytes - a.gzipBytes);

          const render = (asset) =>
            `${asset.type.toUpperCase()} ${asset.gzipBytes} gzip/${asset.bytes} raw ` +
            `${asset.file}${asset.sources.length ? ` <- ${asset.sources.join(", ")}` : ""}`;
          console.log("\nCANDIDATE-ONLY CONTENT");
          for (const asset of added) console.log(`+ ${render(asset)}`);
          console.log("\nBASELINE-ONLY CONTENT");
          for (const asset of removed) console.log(`- ${render(asset)}`);
          EOF

          bun asset-report.mjs baseline baseline > baseline-assets.json
          bun asset-report.mjs candidate candidate > candidate-assets.json
          bun compare-assets.mjs

      - name: Compare tailwind-variants distribution
        run: |
          echo '--- baseline ---'
          find baseline/node_modules/tailwind-variants -maxdepth 2 -type f -printf '%s %p\n' | sort -nr | head -20
          echo '--- candidate ---'
          find candidate/node_modules/tailwind-variants -maxdepth 2 -type f -printf '%s %p\n' | sort -nr | head -20
