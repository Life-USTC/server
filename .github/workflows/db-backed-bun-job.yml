name: DB-backed Bun job

on:
  workflow_call:
    outputs:
      artifact-url:
        description: URL for the uploaded artifact, when artifact upload is enabled.
        value: ${{ jobs.run.outputs.artifact-url }}
    inputs:
      database-name:
        required: true
        type: string
      job-phase:
        required: true
        type: string
      e2e-shard:
        required: false
        type: string
        default: ""
      timeout-minutes:
        required: false
        type: number
        default: 30
      install-playwright:
        required: false
        type: boolean
        default: false
      webhook-secret:
        required: false
        type: string
        default: ""
      extra-env:
        required: false
        type: string
        default: ""
      download-artifact-name:
        required: false
        type: string
        default: ""
      download-artifact-path:
        required: false
        type: string
        default: "."
      upload-artifact-name:
        required: false
        type: string
        default: ""
      upload-artifact-path:
        required: false
        type: string
        default: ""
      upload-artifact-no-files-found:
        required: false
        type: string
        default: ignore
      upload-artifact-retention-days:
        required: false
        type: number
        default: 14
      upload-artifact-always:
        required: false
        type: boolean
        default: false
      upload-artifact-include-hidden-files:
        required: false
        type: boolean
        default: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    outputs:
      artifact-url: ${{ steps.upload-artifact.outputs.artifact-url }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ${{ inputs.database-name }}
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure job environment
        shell: bash
        run: |
          {
            echo "DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/${{ inputs.database-name }}"
            echo "ALLOW_DATABASE_SEED=true"
            if [ -n "${{ inputs.webhook-secret }}" ]; then
              echo "WEBHOOK_SECRET=${{ inputs.webhook-secret }}"
            fi
            if [ -n "${{ inputs.extra-env }}" ]; then
              printf '%s\n' "${{ inputs.extra-env }}"
            fi
          } >> "$GITHUB_ENV"

      - name: Setup workspace
        uses: ./.github/actions/setup-bun-env
        with:
          install-playwright: ${{ inputs.install-playwright && 'true' || 'false' }}

      - name: Install PostgreSQL client
        if: ${{ inputs.job-phase == 'ci:integration' || inputs.job-phase == 'ci:rls' || inputs.job-phase == 'ci:e2e:test' }}
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Download artifact
        if: ${{ inputs.download-artifact-name != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.download-artifact-name }}
          path: ${{ inputs.download-artifact-path }}

      - name: Run job phase
        shell: bash
        env:
          E2E_SHARD: ${{ inputs.e2e-shard }}
          JOB_PHASE: ${{ inputs.job-phase }}
        run: |
          run_e2e_test_phase() {
            if [[ ! "$E2E_SHARD" =~ ^[1-9][0-9]*/[1-9][0-9]*$ ]]; then
              echo "::error::ci:e2e:test requires e2e-shard in current/total format."
              exit 1
            fi

            bun run app:prepare
            bun run db:migrate:deploy
            bunx prisma db seed
            bunx playwright test --shard="$E2E_SHARD"
          }

          case "$JOB_PHASE" in
            ci:verify)
              bash tests/ci/retry.test.sh
              bash tests/ci/seed-guard.test.sh
              bun run app:prepare
              bunx wrangler types --include-runtime=false --check
              bunx biome check
              bunx svelte-check --tsconfig ./tsconfig.json
              bunx tsc --noEmit -p tsconfig.typecheck.json
              bunx tsc --noEmit -p tsconfig.typecheck.tests.json
              bunx tsc --noEmit -p tsconfig.typecheck.operational.json
              bunx vitest run
              ;;
            ci:integration)
              bun run app:prepare
              bun run db:migrate:deploy
              bunx prisma db seed
              # The canonical scenario must be safe to load repeatedly.
              bunx prisma db seed
              bunx vitest run --config vitest.integration.config.ts
              ;;
            ci:rls)
              bun run app:prepare
              bun run db:migrate:deploy
              bunx prisma db seed
              # Keep the RLS database setup idempotent like ci:integration.
              bunx prisma db seed
              for _ in 1 2; do
                PGPASSWORD=postgres psql "$DATABASE_URL" -X \
                  --single-transaction \
                  --set=database_name="${{ inputs.database-name }}" \
                  --file=tests/integration/fixtures/rls-runtime-bootstrap.sql
              done
              runtime_database_url="postgresql://life_ustc_runtime:runtime-test-password@127.0.0.1:5432/${{ inputs.database-name }}"
              expected_table_privileges="$(psql "$runtime_database_url" -X -tA \
                --file=prisma/roles/export-app-runtime-table-privileges.sql)"
              expected_function_privileges='public.comment_attachment_summaries(p_comment_ids text[]):EXECUTE'
              expected_function_privileges+=',public.comment_reaction_summaries(comment_ids text[]):EXECUTE'
              expected_function_privileges+=',public.find_downloadable_upload(p_upload_id text):EXECUTE'
              expected_function_privileges+=',public.get_public_profile_homework_completions(p_user_id text, p_since timestamp without time zone):EXECUTE'
              expected_function_privileges+=',public.get_public_profile_upload_stats(p_user_id text, p_since timestamp without time zone):EXECUTE'
              psql "$runtime_database_url" -X \
                --set=expected_role=life_ustc_runtime \
                --set=expected_schema_privileges=public:USAGE \
                --set=expected_table_privileges="$expected_table_privileges" \
                --set=expected_column_privileges= \
                --set=expected_sequence_privileges= \
                --set=expected_function_privileges="$expected_function_privileges" \
                --file=prisma/roles/verify-app-runtime.sql
              export FUNCTION_OWNER_DATABASE_URL="$DATABASE_URL"
              export DATABASE_URL="$runtime_database_url"
              export AUTH_DATABASE_URL="postgresql://life_ustc_auth_runtime:auth-runtime-test-password@127.0.0.1:5432/${{ inputs.database-name }}"
              export MAINTENANCE_DATABASE_URL="postgresql://life_ustc_maintenance_runtime:maintenance-runtime-test-password@127.0.0.1:5432/${{ inputs.database-name }}"
              export RLS_TEST_ENABLED=true
              export AUTH_ROLE_TEST_ENABLED=true
              export FUNCTION_OWNER_ROLE_TEST_ENABLED=true
              export MAINTENANCE_ROLE_TEST_ENABLED=true
              bunx vitest run \
                --config vitest.integration.config.ts \
                tests/integration/rls-database-contract.test.ts
              bunx vitest run \
                --config vitest.integration.config.ts \
                tests/integration/auth-runtime-contract.test.ts
              AUTH_SECRET=rls-test-secret-at-least-32-bytes \
                bunx vitest run \
                  --config vitest.integration.config.ts \
                  tests/integration/better-auth-update-user-security.test.ts
              bunx vitest run \
                --config vitest.integration.config.ts \
                tests/integration/maintenance-runtime-contract.test.ts
              bunx vitest run \
                --config vitest.integration.config.ts \
                tests/integration/function-owner-role-contract.test.ts
              bunx vitest run \
                --config vitest.integration.config.ts \
                tests/integration/todo-rls.test.ts
              bunx vitest run \
                --config vitest.integration.config.ts \
                tests/integration/personal-preferences-rls.test.ts
              bunx vitest run \
                --config vitest.integration.config.ts \
                tests/integration/comment-reaction-rls.test.ts
              bunx vitest run \
                --config vitest.integration.config.ts \
                tests/integration/upload-rls.test.ts
              bunx vitest run \
                --config vitest.integration.config.ts \
                tests/integration/homework-completion-rls.test.ts
              ;;
            ci:e2e:build-artifacts)
              bun run app:prepare
              bun run build
              bash tests/ci/public-route-client-budget.test.sh
              ;;
            ci:e2e:test)
              run_e2e_test_phase
              ;;
            *)
              echo "::error::Unknown DB-backed Bun job phase: $JOB_PHASE"
              exit 1
              ;;
          esac

      - name: Verify OpenAPI parity
        if: ${{ inputs.job-phase == 'ci:verify' }}
        shell: bash
        run: bun run openapi:check

      - name: Verify GraphQL schema compatibility
        if: ${{ inputs.job-phase == 'ci:verify' }}
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          base_sha="${{ github.event.pull_request.base.sha }}"
          if grep -Eq '^[a-z]+(\([^)]+\))?!:' <<< "$PR_TITLE"; then
            bunx vitest run tests/unit/graphql-schema-snapshot.test.ts
          elif [ -n "$base_sha" ]; then
            git fetch --no-tags --depth=1 origin "$base_sha"
            GRAPHQL_SCHEMA_BASE_REF="$base_sha" bunx vitest run tests/unit/graphql-schema-snapshot.test.ts
          else
            bunx vitest run tests/unit/graphql-schema-snapshot.test.ts
          fi

      - name: Upload artifact
        id: upload-artifact
        if: ${{ always() && inputs.upload-artifact-path != '' && (inputs.upload-artifact-always || success()) }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.upload-artifact-name }}
          path: ${{ inputs.upload-artifact-path }}
          if-no-files-found: ${{ inputs.upload-artifact-no-files-found }}
          retention-days: ${{ inputs.upload-artifact-retention-days }}
          include-hidden-files: ${{ inputs.upload-artifact-include-hidden-files }}
