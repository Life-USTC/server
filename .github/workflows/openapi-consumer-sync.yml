name: OpenAPI consumer sync

on:
  push:
    branches: ["main"]
    paths:
      - public/openapi.generated.json
  workflow_dispatch:

jobs:
  dispatch:
    name: Notify OpenAPI consumers
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Dispatch exact server revision
        shell: bash
        # OPENAPI_SYNC_TOKEN needs repository dispatch access to Life-USTC/bot
        # and Life-USTC/cli. The scheduled consumer checks remain the backup,
        # but a missing token on the canonical repository must fail this job
        # loudly instead of reporting a silent, indistinguishable success
        # (see https://github.com/Life-USTC/server/issues/955). A fork
        # legitimately cannot hold this repository's secrets, so the same
        # condition there is a warning, not a failure.
        env:
          GH_TOKEN: ${{ secrets.OPENAPI_SYNC_TOKEN }}
          IS_CANONICAL_REPO: ${{ github.repository == 'Life-USTC/server' }}
        run: |
          set -euo pipefail

          if [[ -z "${GH_TOKEN:-}" ]]; then
            if [[ "${IS_CANONICAL_REPO}" == "true" ]]; then
              echo "::error::OPENAPI_SYNC_TOKEN is not configured on Life-USTC/server; consumer dispatch cannot run. Configure the secret so Life-USTC/bot and Life-USTC/cli are notified immediately (see issue #955)."
              {
                echo "### OpenAPI consumer dispatch FAILED"
                echo "OPENAPI_SYNC_TOKEN is not configured on the canonical repository. Consumers will not hear about this change until their daily scheduled sync runs. Configure the \`OPENAPI_SYNC_TOKEN\` repository secret to fix this."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi

            echo "::warning::OPENAPI_SYNC_TOKEN is not configured; consumer dispatch was skipped. This is expected outside Life-USTC/server (e.g. a fork), which cannot hold this repository's secrets."
            {
              echo "### OpenAPI consumer dispatch skipped"
              echo "OPENAPI_SYNC_TOKEN is unavailable in this context (expected on a fork); scheduled consumer checks remain the fallback."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          failures=0
          for repository in Life-USTC/bot Life-USTC/cli; do
            if ! gh api --method POST "repos/${repository}/dispatches" \
              --field event_type=openapi-updated \
              --field "client_payload[server_sha]=${GITHUB_SHA}"; then
              echo "::error::Failed to dispatch openapi-updated to ${repository} for server revision ${GITHUB_SHA}."
              failures=$((failures + 1))
            fi
          done

          if [[ "${failures}" -gt 0 ]]; then
            {
              echo "### OpenAPI consumer dispatch FAILED"
              echo "${failures} of 2 consumer dispatch(es) failed for server revision \`${GITHUB_SHA}\`. See the job log for details."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "### OpenAPI consumers notified" >> "$GITHUB_STEP_SUMMARY"
          echo "Dispatched server revision \`${GITHUB_SHA}\` to Life-USTC/bot and Life-USTC/cli." >> "$GITHUB_STEP_SUMMARY"
