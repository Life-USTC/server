name: Dependency release validation

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  semantic-release-dry-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout dependency branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup workspace
        uses: ./.github/actions/setup-bun-env

      - name: Exercise complete release analysis
        run: |
          set -euo pipefail
          git config user.name dependency-validation
          git config user.email dependency-validation@users.noreply.github.com
          git checkout -B "$RELEASE_BRANCH"
          git commit --allow-empty -m 'feat: validate semantic-release changelog upgrade'
          env \
            -u CI \
            -u GITHUB_ACTIONS \
            -u GITHUB_REF \
            -u GITHUB_HEAD_REF \
            -u GITHUB_BASE_REF \
            -u GITHUB_EVENT_NAME \
            -u GITHUB_EVENT_PATH \
            bun run release --dry-run --no-ci --branches "$RELEASE_BRANCH"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
