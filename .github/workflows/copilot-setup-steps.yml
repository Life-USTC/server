name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .bun-version
      - .github/actions/setup-bun-env/action.yml
      - .github/workflows/copilot-setup-steps.yml
      - .github/actions/setup-test-database/action.yml
      - bun.lock
      - package.json
      - prisma.config.ts
      - prisma/migrations/**
      - prisma/roles/**
      - tests/ci/setup-runtime-database.sh
      - tests/integration/fixtures/rls-runtime-bootstrap.sql
      - prisma/schema.prisma
      - svelte.config.js
      - svelte.openapi.json
      - tests/e2e/fixtures/scenario.json
  pull_request:
    paths:
      - .bun-version
      - .github/actions/setup-bun-env/action.yml
      - .github/workflows/copilot-setup-steps.yml
      - .github/actions/setup-test-database/action.yml
      - bun.lock
      - package.json
      - prisma.config.ts
      - prisma/migrations/**
      - prisma/roles/**
      - tests/ci/setup-runtime-database.sh
      - tests/integration/fixtures/rls-runtime-bootstrap.sql
      - prisma/schema.prisma
      - svelte.config.js
      - svelte.openapi.json
      - tests/e2e/fixtures/scenario.json

jobs:
  # The job name must be exactly `copilot-setup-steps`
  copilot-setup-steps:
    runs-on: ubuntu-24.04
    timeout-minutes: 59
    permissions:
      contents: read
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/life_ustc_copilot
      WEBHOOK_LOGIN_ENABLED: "true"
      WEBHOOK_SECRET: copilot-local-secret
      AUTH_SECRET: e2e-dev-secret-not-for-production
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: life_ustc_copilot
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup workspace
        uses: ./.github/actions/setup-bun-env

      - name: Prepare database and generated artifacts
        uses: ./.github/actions/setup-test-database
