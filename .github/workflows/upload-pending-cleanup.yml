name: Upload Pending Storage Cleanup

on:
  schedule:
    - cron: "7 */2 * * *"
  workflow_dispatch:

concurrency:
  group: upload-pending-storage-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    name: Clean stale upload pending storage
    if: github.event_name == 'schedule' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun environment
        uses: ./.github/actions/setup-bun-env

      - name: Generate SvelteKit types
        run: bun run svelte:sync

      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/life_ustc_generate
        run: bun run db:generate

      - name: Clean stale upload pending storage
        env:
          DATABASE_URL: ${{ secrets.MAINTENANCE_DATABASE_URL }}
        run: bun run upload:cleanup
