name: GraphQL compatibility

on:
  pull_request:
    branches: ["**"]
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  breaking-changes:
    name: GraphQL breaking changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup workspace
        uses: ./.github/actions/setup-bun-env

      - name: Prepare generated application types
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/life_ustc_graphql_contract
        run: bun run app:prepare

      - name: Fetch base branch
        shell: bash
        run: >-
          git fetch --no-tags --depth=1 origin
          "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"

      - name: Verify canonical GraphQL schema snapshot
        env:
          GRAPHQL_SCHEMA_SKIP_BASE_COMPATIBILITY: "true"
        run: bunx vitest run tests/unit/graphql-schema-snapshot.test.ts

      - name: Block unapproved breaking changes
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'graphql-breaking-approved') }}
        env:
          GRAPHQL_SCHEMA_BASE_REF: "origin/${{ github.base_ref }}"
        run: >-
          bunx vitest run tests/unit/graphql-schema-snapshot.test.ts
          -t "does not break the configured base schema"

      - name: Acknowledge approved breaking changes
        if: ${{ contains(github.event.pull_request.labels.*.name, 'graphql-breaking-approved') }}
        run: echo "GraphQL base compatibility change approved by label."
