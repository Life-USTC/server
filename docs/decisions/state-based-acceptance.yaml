kind: decision
id: state-based-acceptance
title: Independent mutation and consumer acceptance
date: '2026-09-28'
status: accepted
refs:
- feature: subscription
context:
- Combining every writer, consumer and boundary in a single acceptance test repeats setup and lets an
  early failure prevent unrelated entrypoints from being checked.
- Successful responses, matching interfaces and consumed specification fields do not independently
  establish committed state or correct product requirements.
decisions:
- Maintain requirements and test references manually. Schema validation checks document structure
  and business references; ordinary test execution does not certify semantic requirement coverage.
- Prepare each mutation case's precondition independently, then exercise the operation through its
  real browser or network entrypoint. Update, remove and repeat-operation cases must not depend on
  an earlier create action, whether in another test or an earlier CRUD step in the same test.
- Check native protocol outcomes and independently observe committed state and unchanged unrelated
  state against explicit expected values. Preserve permission and rejected-write assertions.
- Prepare consumer fixtures independently of the mutation under test. Verify each supported reader's
  permitted projection, filtering and presentation against explicit expected business facts.
- Keep operation adapters separate from fixture preparation and state observation. Do not call the
  product use-case as the adapter or reuse its projection logic to compute expected results.
- Verify promised navigation, refresh, cache and asynchronous effects in the module that owns each
  behavior. Mutation and consumer cases do not require a separate cross-entrypoint or complete-journey
  layer that repeats the same obligations.
consequences:
- This decision defines the target organization, not a claim that every existing test has migrated.
  Review each module's independent setup and unique assertions before removing repeated flows.
- Database observation establishes stored effects, not user-visible freshness, object storage or
  queue completion. Observe each relevant effect at its own boundary.
