kind: decision
id: young-event-field-exposure
title: Expose useful Young event fields through shared serialization
date: '2026-09-02'
status: accepted
refs:
- feature: young-event
context:
- At approval, upstream snapshots preserved approximately 137 keys per record but only 16 were promoted to
  server columns; the Web did not render rawJson and GraphQL did not expose it.
- The user requested broad useful field exposure and explicitly approved public display of event contact names
  and phone numbers.
- The registrationStatus field was null or zero in all 2,556 examined records and had never carried data during
  its first day in production.
decisions:
- Promote useful public fields while keeping internal workflow and management fields in rawJson. Do not add
  registration or attendance writes or change upstream scraping.
- Preserve upstream HTML in storage and apply one sanitizer and image rewrite during serialization for Web,
  REST, GraphQL, and MCP.
- Keep long rich-text bodies out of collection summaries because one body can be tens of kilobytes.
- Use validated upstream image paths as shared R2 cache keys because image bytes do not depend on the event.
  The image proxy carries no upstream authentication token.
- Name upstream creation and modification fields createdAtUpstream and updatedAtUpstream to avoid confusion
  with server row timestamps.
- Delete registrationStatus across storage and interfaces; the approved breaking change removed a field that
  had never carried useful data.
- Join dynamically stored places children through parent_store_id to avoid silently dropping venue records.
consequences:
- Public event contacts are intentional. Raw upstream workflow fields are not promoted to ordinary UI.
- HTML safety and image normalization belong to shared serialization, so transports do not develop independent
  rendering rules.
- Current feature requirements define field shapes and display order; historical implementation sketches, nullable
  places, and the proposed GraphQL JSON scalar do not override them.
- Upstream applyNum was observed as zero for ongoing events and peopleNum was often null; missing values must
  not be fabricated.
field_mappings:
- field: description
  upstream: baseContent
  meaning: 活动介绍正文（HTML 富文本，含 <img>）
- field: participationNotes
  upstream: conceive
  meaning: 参与方式/注意事项（HTML）
- field: activityLevel
  upstream: activityLevel_dictText
  meaning: 活动级别（院级/校级/省级/国家级…）
- field: module
  upstream: module_dictText
  meaning: 二课堂模块（德/智/体/美/劳）
- field: form
  upstream: form_dictText
  meaning: 参与形式（现场参与/提交作品…）
- field: grades
  upstream: nj
  meaning: 面向年级（逗号分隔原始值，如 1,2,3,4,5,6）
- field: sponsor
  upstream: sponsor_dictText
  meaning: 主办单位（与 organizer 承办单位区分）
- field: contactName
  upstream: linkMan
  meaning: 联系人姓名
- field: contactTel
  upstream: tel
  meaning: 联系人电话
- field: duration
  upstream: duration
  meaning: 活动持续时长（小时，≠学时）
- field: serviceHour
  upstream: serviceHour
  meaning: 志愿服务时长
- field: sumHours
  upstream: sumHours
  meaning: 累计认定学时（已结束活动）
- field: sumPersons
  upstream: sumPersons
  meaning: 累计参与人次（已结束活动）
- field: partakeNum
  upstream: partakeNum
  meaning: 实际参与人数
- field: favCount
  upstream: favCount
  meaning: 收藏数
- field: limitNum
  upstream: itemLimitNum
  meaning: 名额上限（另一口径）
- field: createdAtUpstream
  upstream: createTime
  meaning: 上游创建时间（Asia/Shanghai）
- field: auditedAt
  upstream: auditTime
  meaning: 上游审核时间
- field: updatedAtUpstream
  upstream: updateTime
  meaning: 上游更新时间
- field: places
  upstream: itemPlaceDTO.places[]
  meaning: 分时段场地：[{ placeInfo, placeSt, placeEt }]
