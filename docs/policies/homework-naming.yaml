kind: policy
id: homework-naming
title: Optional homework authoring guidance
requirements: []
enforcement: advisory
title_patterns:
- pattern: 第{N}次作业
  when: Numbered sequence (default)
  example: 第一次作业
- pattern: '{主题}作业'
  when: One-off or themed
  example: 期中论文作业
avoid_examples:
- 第一章作业
- 组合数学第一次作业
- CONT6102P 第一次作业
description_fields:
- label: 题目
  required: true
  unknown: 未记录
- label: 提交方式
  required: false
  examples:
  - 电子版
  - 纸质版
- label: 提交地址
  required: false
  examples:
  - URL
- label: 备注
  required: false
  examples:
  - deadlines
  - formats
topics:
- id: title
  title: Title
- id: description
  title: Description
guidance:
- The title patterns and ordered description bullets below are optional authoring suggestions, not validation
  rules. Custom valid titles and Markdown descriptions remain accepted.
- Choose the numbered or themed title example when it suits the task. Course identity is usually already provided
  by the attached section.
- The description template includes a problem statement; unknown optional template fields can be omitted. The
  template required flag does not constrain saved user content.
