rationale:
- Mobile catalog detail order has one owner, ui.layout-principles-3; the identical detail-two-column-stream
  restatement was removed without changing the required order.
- The single-column homework/todo overlay requirement, including reachable actions and absence of a second
  facts/status rail, is owned by ui.layout-principles-5 rather than two overlapping layout requirements.
- Public course and section code styling is owned by ui.data-table-cells-3. Secondary metadata styling retains
  its independent legibility and disambiguation obligation without repeating the code-specific rule.
- This compact context follows the name-first identity rule.
- 'Primary properties identify the object or answer the immediate task: display title/name, distinguishing
  code, due/departure/start time, status, and primary action state.'
- 'Secondary properties support disambiguation and comparison: localized secondary name, semester, campus/location,
  teacher/department, counts, section code, and short metadata.'
- 'Tertiary properties support audit or exact reconstruction: internal IDs, raw timestamps, platform metadata,
  long nested relations, and repeated parent objects.'
- REST may expose fuller records for application clients.
- May still appear on workspace surfaces that switch distinct task contexts (for example workspace calendar/homework
  branches).
- 'Course and teacher offering history, 20-item pagination, retired-record inclusion and #sections navigation
  are owned by course.bounded-detail-history and teacher.bounded-detail-history; repeating the same behavior
  here would create a second acceptance owner.'
- Detail orientation requires recognizable entity identity and a route back to its owning collection. Persistent
  navigation or an explicit parent link can provide this; breadcrumb styling is not required.
- The former ui.workspace-mobile-priority-2 duplicates calendar.mobile-agenda-first for mobile date-grouped
  agendas and calendar.views for the declared desktop grids; those feature requirements own their acceptance.
- The former ui.model-property-priority-primary-3 duplicates section.student-identity-teachers, which retains
  course name plus teachers as primary identity and section code as secondary across student-facing views.
