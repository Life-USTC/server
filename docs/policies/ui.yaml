kind: policy
id: ui
title: Shared interface presentation
requirements:
- id: ui.layout-principles-1
  category: presentation
  topic: layout-principles
  rule: Desktop course, section, and teacher detail pages place introductions, descriptions, homework content,
    and comments in the main reading column.
- id: ui.layout-principles-2
  category: presentation
  topic: layout-principles
  rule: Desktop catalog detail pages place identifiers, structured facts, and related actions in a facts sidebar.
    Workspace task views and task-detail overlays use their own declared action-first order.
- id: ui.layout-principles-3
  category: presentation
  topic: layout-principles
  rule: At mobile widths, catalog detail pages render the hero, compact identity facts, the main reading stream,
    and remaining secondary facts in that order. Workspace views and overlays follow their own declared content
    order.
- id: ui.layout-principles-4
  category: presentation
  topic: layout-principles
  rule: Shared collection and detail layouts reuse the existing feature-neutral layout, panel, navigation,
    and form primitives. Feature components own domain-specific data and interactions.
- id: ui.layout-principles-5
  category: presentation
  topic: layout-principles
  rule: Homework and todo detail overlays use one scrollable content column with a visible sticky title. Their
    content order is due date/time, relative urgency, remaining facts, reading content, then discussion when
    available.
- id: ui.layout-principles-6
  category: presentation
  topic: layout-principles
  rule: Homework and todo detail overlays do not introduce a second facts/status rail. Their primary content
    and actions remain reachable within the single scrollable column.
- id: ui.list-table-1
  category: presentation
  topic: list-table
  rule: Collection pages use the shared PageLayout, PageHeader, and Panel primitives, with filters before the
    results summary and results, followed by pagination.
- id: ui.list-table-2
  category: presentation
  topic: list-table
  rule: SearchField owns the application search-shortcut handler; collection pages do not register a competing
    handler for the same shortcut.
- id: ui.list-table-3
  category: presentation
  topic: list-table
  rule: Advanced list filters use one labeled Sheet containing the complete declared filter form and explicit
    Apply and dismiss actions.
- id: ui.list-table-4
  category: presentation
  topic: list-table
  rule: Opening advanced filters initializes draft values from the current applied URL query. Closing the sheet
    without Apply leaves the URL and results unchanged.
- id: ui.list-table-5
  category: presentation
  topic: list-table
  rule: Applying advanced filters submits the current search query and all draft filter values and resets pagination.
    A primary search change preserves the already applied advanced filters.
- id: ui.list-table-6
  category: presentation
  topic: list-table
  rule: At narrow widths, compact lists do not cause horizontal document overflow. Wide comparison tables retain
    their required columns inside a horizontally scrollable table region.
- id: ui.list-table-7
  category: presentation
  topic: list-table
  rule: News keeps title-led rows.
- id: ui.list-table-8
  category: presentation
  topic: list-table
  rule: Query parsing, caching and URL builders remain in features.
- id: ui.list-table-9
  category: presentation
  topic: list-table
  rule: Route tabs use PageSectionNav; settings retains DetailSectionNav.
- id: ui.data-table-cells-1
  category: presentation
  topic: data-table-cells
  rule: Desktop table rows in the same list reserve the same secondary-line space when optional secondary text
    is absent; longer content must remain accessible without clipping controls.
- id: ui.data-table-cells-2
  category: presentation
  topic: data-table-cells
  rule: A truncated text cell makes its complete value available to pointer, keyboard, and touch users. The
    accessible text retains the complete value.
- id: ui.data-table-cells-3
  category: presentation
  topic: data-table-cells
  rule: Course and section codes use plain monospace text, never badge styling.
- id: ui.data-table-cells-4
  category: presentation
  topic: data-table-cells
  rule: Header labels and cell content share the same column edge; textual and categorical values align left,
    while numeric measures and counts align right.
- id: ui.data-table-cells-5
  category: presentation
  topic: data-table-cells
  rule: Purely decorative blank table placeholders are absent from the accessibility tree. Meaningful unknown
    or TBD labels remain exposed.
- id: ui.data-table-cells-6
  category: presentation
  topic: data-table-cells
  rule: Numeric, status, control, and action cells do not receive truncation tooltips when their content fits.
- id: ui.detail-hero-2
  category: presentation
  topic: detail-hero
  rule: Contains breadcrumb, h1, and an optional subtitle.
- id: ui.detail-hero-3
  category: presentation
  topic: detail-hero
  rule: h1 uses the primary display name of the current object, not an internal ID.
- id: ui.detail-hero-4
  category: presentation
  topic: detail-hero
  rule: Mobile catalog detail heroes keep public course or section codes and concise context visible alongside
    long localized names without horizontal overflow. Database row IDs and JW IDs do not substitute for that
    display context.
- id: ui.detail-hero-5
  category: presentation
  topic: detail-hero
  rule: Course codes live in the title region, in plain monospace text before the name; the localized name
    remains the dominant h1.
  acceptance:
    given: The actual Worker renders the specified page with the seeded or isolated fixture used by this test.
    when: The named browser test performs the relevant navigation, input, or viewport transition.
    then:
    - Course codes live in the title region, in plain monospace text before the name; the localized name remains
      the dominant h1.
    test:
      file: tests/e2e/src/app/courses/[jwId]/test.ts
      name: ui.detail-hero-5
- id: ui.detail-two-column-stream-1
  category: presentation
  topic: detail-two-column-stream
  rule: Course, section, and teacher detail pages expose a continuous reading stream and a desktop facts sidebar.
    In-page navigation uses fragment anchors rather than tab query parameters or legacy detail-subroute links.
- id: ui.detail-two-column-stream-2
  category: presentation
  topic: detail-two-column-stream
  rule: 'Section: intro → schedule → exams → homework → comments.'
- id: ui.detail-two-column-stream-3
  category: presentation
  topic: detail-two-column-stream
  rule: 'Course/teacher: intro → offerings → comments.'
- id: ui.detail-two-column-stream-4
  category: presentation
  topic: detail-two-column-stream
  rule: Each catalog detail sidebar contains that feature’s structured facts and applicable actions. Section
    detail includes teachers and section subscription/calendar actions; course and teacher pages do not invent
    section-specific actions without a selected section.
- id: ui.detail-two-column-stream-5
  category: presentation
  topic: detail-two-column-stream
  rule: Catalog detail mobile order is hero, compact identity facts, main reading stream, then remaining secondary
    facts.
- id: ui.detail-two-column-stream-6
  category: presentation
  topic: detail-two-column-stream
  rule: Public catalog detail HTML contains no personalized comment visibility or moderation permission state.
    The comment panel loads viewer-dependent results through its private client request.
- id: ui.detail-two-column-stream-7
  category: presentation
  topic: detail-two-column-stream
  rule: Hash anchors scroll in-page.
- id: ui.model-property-priority-1
  category: presentation
  topic: model-property-priority
  rule: Each feature declares its identifying, task-critical, and disambiguating display fields in presentation
    data. UI and compact MCP projections retain those declared fields; JSON object key order is not a presentation
    contract.
- id: ui.model-property-priority-primary-2
  category: presentation
  topic: model-property-priority-primary
  rule: Each declared list, card, detail, and assistant projection puts its primary identity in that view’s
    title or leading summary slot; task-critical time and status remain available in its primary content.
- id: ui.model-property-priority-primary-3
  category: presentation
  topic: model-property-priority-primary
  rule: For teaching sections, student-facing primary identity is course name plus teachers, not section code.
- id: ui.model-property-priority-secondary-2
  category: presentation
  topic: model-property-priority-secondary
  rule: Secondary metadata uses shared secondary-text styling without hiding required disambiguation. Public
    course and section codes retain their plain monospace style rather than badge styling.
- id: ui.model-property-priority-tertiary-2
  category: presentation
  topic: model-property-priority-tertiary
  rule: Ordinary UI de-emphasizes internal reconstruction metadata. MCP default projections include only the
    fields declared by that tool; full mode still obeys all secret and private-field exclusions.
- id: ui.model-property-priority-surfaces-2
  category: presentation
  topic: model-property-priority-surfaces
  rule: MCP tools declare a compact default projection and, where supported, an explicit full projection. Default
    preserves the task identity and important disambiguation; full adds only explicitly allowed fields. No
    deprecated summary input is part of the supported contract.
- id: ui.basic-info-card-2
  category: presentation
  topic: basic-info-card
  rule: Displays structured fields; does not carry comment or homework interactions.
- id: ui.context-tabs-3
  category: presentation
  topic: context-tabs
  rule: Context navigation uses a scrollable horizontal row on mobile and a vertical rail on desktop. The active
    destination has aria-current=page and is scrolled into view; overflow does not make destinations unreachable.
- id: ui.global-search-results-1
  category: presentation
  topic: global-search-results
  rule: Catalog group order is sections → teachers → courses → links, then signed-in homeworks and todos.
- id: ui.global-search-results-2
  category: presentation
  topic: global-search-results
  rule: Section items use title `course.namePrimary · teachers` (fall back to course name · section code when
    teachers are empty) and description `semester · campus · section.code` with code last.
- id: ui.global-search-results-3
  category: presentation
  topic: global-search-results
  rule: Course items use title `course.namePrimary` and description `course.code`.
- id: ui.global-search-results-4
  category: presentation
  topic: global-search-results
  rule: Teacher search results use the localized teacher name as title. Their secondary context uses department
    when present, otherwise the public teacher code; absent context does not expose a database row ID.
- id: ui.shell-layout-1
  category: presentation
  topic: shell-layout
  rule: Desktop sidebar and main content scroll independently.
- id: ui.shell-layout-2
  category: presentation
  topic: shell-layout
  rule: Signed-in desktop navigation groups personal task destinations under Workspace. Explore and admin destinations
    use distinct expandable groups, and admin entries are visible only to an authorized administrator.
  acceptance:
    given: The actual Worker renders the specified page with the seeded or isolated fixture used by this test.
    when: The named browser test performs the relevant navigation, input, or viewport transition.
    then:
    - Signed-in desktop navigation groups personal task destinations under Workspace. Explore and admin destinations
      use distinct expandable groups, and admin entries are visible only to an authorized administrator.
    test:
      file: tests/e2e/src/app/test.ts
      name: ui.shell-layout-2
- id: ui.shell-layout-3
  category: presentation
  topic: shell-layout
  rule: A destination row is either a link or a disclosure, never both.
- id: ui.shell-layout-4
  category: presentation
  topic: shell-layout
  rule: Signed-in mobile navigation exposes Today, Calendar, Tasks, and Explore. The content layout reserves
    navigation height and the device safe-area inset so the final content is not covered.
- id: ui.shell-layout-5
  category: presentation
  topic: shell-layout
  rule: The topbar exposes language and theme controls. Signed-in desktop profile actions use the sidebar footer;
    mobile profile actions remain available from the mobile shell.
- id: ui.shell-layout-7
  category: presentation
  topic: shell-layout
  rule: Anonymous topbars retain Sign in.
- id: ui.shell-layout-8
  category: presentation
  topic: shell-layout
  expectation:
    kind: target_size
    surface: web
    target: mobile topbar controls and primary navigation links
    viewport:
      width: 390
      height: 844
    min_width: 44
    min_height: 44
  applies_to:
  - shell
  acceptance:
    given: The actual Worker renders the specified page with the seeded or isolated fixture used by this test.
    when: The named browser test performs the relevant navigation, input, or viewport transition.
    then:
    - Rendered mobile topbar and primary-navigation hit targets meet the declared width and height at the declared
      viewport.
    test:
      file: tests/e2e/src/app/test.ts
      name: ui.shell-layout-8
- id: ui.shell-layout-9
  category: presentation
  topic: shell-layout
  rule: A stored light/dark preference is applied to the document before application hydration, using a bootstrap
    script authorized by the response CSP.
  acceptance:
    given: The actual Worker renders the specified page with the seeded or isolated fixture used by this test.
    when: The named browser test performs the relevant navigation, input, or viewport transition.
    then:
    - A stored light/dark preference is applied to the document before application hydration, using a bootstrap
      script authorized by the response CSP.
    test:
      file: tests/e2e/src/app/test.ts
      name: ui.shell-layout-9
- id: ui.workspace-footer-policy-1
  category: presentation
  topic: workspace-footer-policy
  rule: Public discovery, content, policy, and marketing pages retain the public footer.
- id: ui.workspace-footer-policy-2
  category: presentation
  topic: workspace-footer-policy
  rule: Workspace, /account/settings/*, /admin/*, and /account/welcome pages do not append the public footer.
- id: ui.workspace-filters-and-empty-states-1
  category: presentation
  topic: workspace-filters-and-empty-states
  rule: Homework, todo, and exam status filters retain the selected value through repeated activation, empty
    results, and completing the last pending task. Only an explicit selection or clear action changes the applied
    filter.
- id: ui.workspace-filters-and-empty-states-2
  category: presentation
  topic: workspace-filters-and-empty-states
  rule: Status-filter controls remain disabled until hydrated. Once interactive, activation updates their selected
    visual and accessible state without waiting for the results request to finish.
- id: ui.workspace-filters-and-empty-states-3
  category: presentation
  topic: workspace-filters-and-empty-states
  rule: Homework, todo, and exam filtered-empty states share compact left-aligned text with no decorative icon
    or filled background. Desktop tables retain their headers; an outline clear-filter action appears below
    the explanation.
- id: ui.workspace-filters-and-empty-states-5
  category: presentation
  topic: workspace-filters-and-empty-states
  rule: Filter-empty results explain the selection and offer clear-filter.
- id: ui.workspace-filters-and-empty-states-6
  category: presentation
  topic: workspace-filters-and-empty-states
  rule: 'Setup-empty states offer a relevant authorized next action: task creation for an empty todo list and
    subscription setup for learning views that require subscribed sections.'
- id: ui.settings-navigation-1
  category: presentation
  topic: settings-navigation
  rule: Settings navigation uses a desktop rail and a horizontally scrollable mobile row containing every declared
    settings destination with localized labels.
  acceptance:
    given: The actual Worker renders the specified page with the seeded or isolated fixture used by this test.
    when: The named browser test performs the relevant navigation, input, or viewport transition.
    then:
    - Settings navigation uses a desktop rail and a horizontally scrollable mobile row containing every declared
      settings destination with localized labels.
    test:
      file: tests/e2e/src/app/settings/test.ts
      name: ui.settings-navigation-1
- id: ui.settings-navigation-2
  category: presentation
  topic: settings-navigation
  rule: The default settings destination is /account/settings/profile. Canonical settings navigation does not
    depend on legacy tab query inputs.
  acceptance:
    given: The actual Worker renders the specified page with the seeded or isolated fixture used by this test.
    when: The named browser test performs the relevant navigation, input, or viewport transition.
    then:
    - The default settings destination is /account/settings/profile. Canonical settings navigation does not
      depend on legacy tab query inputs.
    test:
      file: tests/e2e/src/app/settings/test.ts
      name: ui.settings-navigation-2
- id: ui.settings-navigation-4
  category: presentation
  topic: settings-navigation
  rule: Preferences reuse the shared theme mechanism and /api/account/preferences for server-supported preferences.
    Theme remains a browser preference; locale changes do not add locale URL segments.
- id: ui.settings-navigation-5
  category: presentation
  topic: settings-navigation
  rule: Application authorizations and linked sign-in providers occupy distinct settings destinations. Revoking
    an authorization requires explicit confirmation for the selected application.
- id: ui.settings-navigation-6
  category: presentation
  topic: settings-navigation
  rule: Within settings navigation, exactly one link identifies the active page with aria-current=page, and
    that link is visible in the mobile scroll region after navigation.
  acceptance:
    given: The actual Worker renders the specified page with the seeded or isolated fixture used by this test.
    when: The named browser test performs the relevant navigation, input, or viewport transition.
    then:
    - Within settings navigation, exactly one link identifies the active page with aria-current=page, and that
      link is visible in the mobile scroll region after navigation.
    test:
      file: tests/e2e/src/app/settings/test.ts
      name: ui.settings-navigation-6
- id: ui.settings-navigation-7
  category: presentation
  topic: settings-navigation
  rule: Destructive account controls are grouped in the separate danger settings destination rather than interspersed
    with routine profile or preference controls.
- id: ui.contribution-heatmap-1
  category: presentation
  topic: contribution-heatmap
  rule: Contribution history uses a horizontally scrollable heatmap region when its date range exceeds the
    available width. Scrolling exposes all dates without causing horizontal document overflow.
- id: ui.contribution-heatmap-2
  category: presentation
  topic: contribution-heatmap
  rule: Each contribution day exposes its localized date/count to keyboard, touch, and assistive-technology
    users.
- id: ui.workspace-page-identity-1
  category: presentation
  topic: workspace-page-identity
  rule: Every signed-in workspace branch exposes exactly one localized level-one heading.
- id: ui.workspace-page-identity-2
  category: presentation
  topic: workspace-page-identity
  rule: The main content landmark uses the same localized branch label.
- id: ui.workspace-page-identity-3
  category: presentation
  topic: workspace-page-identity
  rule: The document title identifies the active branch before the Life@USTC suffix.
- id: ui.workspace-page-identity-4
  category: presentation
  topic: workspace-page-identity
  rule: After a canonical workspace-root redirect, the final route determines the localized heading, main landmark
    label, and document title. Legacy query values do not define workspace identity.
- id: ui.workspace-mobile-priority-1
  category: presentation
  topic: workspace-mobile-priority
  rule: Mobile workspace overview displays its next learning/task actions before website-directory shortcuts,
    within a layout that does not overflow the viewport horizontally.
  acceptance:
    given: The actual Worker renders the specified page with the seeded or isolated fixture used by this test.
    when: The named browser test performs the relevant navigation, input, or viewport transition.
    then:
    - Mobile workspace overview displays its next learning/task actions before website-directory shortcuts,
      within a layout that does not overflow the viewport horizontally.
    test:
      file: tests/e2e/src/app/workspace/test.ts
      name: ui.workspace-mobile-priority-1
- id: ui.workspace-mobile-priority-2
  category: presentation
  topic: workspace-mobile-priority
  rule: Mobile workspace calendar presents events as a date-grouped agenda with event title and available time/location
    context. Desktop retains the declared semester, month, and week grid views.
- id: ui.workspace-mobile-priority-3
  category: presentation
  topic: workspace-mobile-priority
  rule: Mobile homework, todo, and exam toolbars keep status filters directly available. Where card/list modes
    exist, an accessible overflow menu changes display mode; primary control hit targets are at least 44 by
    44 CSS pixels.
- id: ui.social-sharing-metadata-1
  category: presentation
  topic: social-sharing-metadata
  rule: Rendered pages provide one localized description and one Open Graph/Twitter card set. Account, OAuth,
    admin, and private workspace metadata uses non-sensitive page descriptions and never embeds credentials
    or private task content.
- id: ui.social-sharing-metadata-2
  category: presentation
  topic: social-sharing-metadata
  rule: Canonical and Open Graph URLs are absolute and use the configured application origin. They exclude
    query strings, fragments, credentials, and authorization continuation parameters.
  acceptance:
    given: Public paths, an attacker-origin path, and a private settings path carrying secret query parameters
      and fragments.
    when: The production social-metadata builder creates canonical URLs.
    then:
    - Canonical URLs use only the configured application origin and exclude query, fragment, credentials and
      secret parameters.
    test:
      file: tests/unit/lib/misc/social-metadata-policy-acceptance.test.ts
      name: ui.social-sharing-metadata-2
- id: ui.social-sharing-metadata-3
  category: presentation
  topic: social-sharing-metadata
  rule: Public course, section, and teacher detail metadata uses the canonical entity-root URL and controlled
    localized summaries rather than editable user-authored descriptions. This does not require supporting obsolete
    detail subroutes.
- id: ui.social-sharing-metadata-4
  category: presentation
  topic: social-sharing-metadata
  rule: Social metadata describes the fixed Life@USTC PNG card as 1200 by 630 pixels, with explicit MIME type
    and localized alternative text.
  acceptance:
    given: Chinese and English metadata requests with their localized alternative text.
    when: The production social-metadata builder creates the image descriptor.
    then:
    - The descriptor is a 1200 by 630 PNG with the provided localized alternative text.
    test:
      file: tests/unit/lib/misc/social-metadata-policy-acceptance.test.ts
      name: ui.social-sharing-metadata-4
- id: ui.social-sharing-metadata-5
  category: presentation
  topic: social-sharing-metadata
  rule: Every page and locale uses the same fixed /open-graph.png static asset without query parameters.
  acceptance:
    given: Several public/private page paths in both locales, followed by a page-copy override.
    when: The production metadata builder and updater produce social images.
    then:
    - Every result keeps the same fixed /open-graph.png URL with no query parameters.
    test:
      file: tests/unit/lib/misc/social-metadata-policy-acceptance.test.ts
      name: ui.social-sharing-metadata-5
- id: ui.social-sharing-metadata-6
  category: presentation
  topic: social-sharing-metadata
  rule: The fixed social image contains no page titles, profile names, or avatars. It is delivered as a static
    asset without invoking application rendering.
- id: ui.localized-count-copy-1
  category: presentation
  topic: localized-count-copy
  rule: User-visible English count copy distinguishes singular from plural forms; Chinese may share one count
    template when its grammar does not change.
- id: ui.navigation-landmarks-1
  category: presentation
  topic: navigation-landmarks
  rule: The visible desktop primary-navigation landmark is named Primary navigation in English and 主导航 in Chinese.
- id: ui.navigation-landmarks-2
  category: presentation
  topic: navigation-landmarks
  rule: 'Signed-in mobile: distinct Mobile primary navigation / 移动主导航 and Secondary navigation / 次级导航 landmarks.'
- id: ui.navigation-landmarks-3
  category: presentation
  topic: navigation-landmarks
  rule: Each navigation landmark contains at most one aria-current=page link. Separate primary and secondary
    navigation landmarks may each identify their own active destination.
- id: ui.navigation-landmarks-4
  category: presentation
  topic: navigation-landmarks
  rule: The first focusable shell control is a localized skip link that moves keyboard focus to main content.
  acceptance:
    given: The actual Worker renders the specified page with the seeded or isolated fixture used by this test.
    when: The named browser test performs the relevant navigation, input, or viewport transition.
    then:
    - The first focusable shell control is a localized skip link that moves keyboard focus to main content.
    test:
      file: tests/e2e/src/app/test.ts
      name: ui.navigation-landmarks-4
- id: ui.navigation-landmarks-5
  category: presentation
  topic: navigation-landmarks
  rule: Campus services navigation exposes distinct entries for the academic catalog, Young activities, and
    news, each linking to its canonical destination.
- id: ui.navigation-landmarks-6
  category: presentation
  topic: navigation-landmarks
  rule: Public notices and private activity reminders are separate navigation destinations. A user’s reminder
    badge counts only unread, unexpired notifications belonging to that user.
- id: ui.navigation-landmarks-7
  category: presentation
  topic: navigation-landmarks
  rule: Activity and calendar navigation preserves the applied filters when opening a detail and returning
    to the list. The active view remains programmatically identified.
- id: ui.list-pagination-filter-state
  category: presentation
  topic: list-table
  rule: Collection pagination links preserve the applied search query and filters while changing only pagination
    state; browser back/forward restores the corresponding query and results.
- id: ui.theme-system-response
  category: presentation
  topic: shell-layout
  rule: Selecting light, dark, or system updates the displayed theme and saved preference. While system is
    selected, a subsequent OS color-scheme change updates the displayed theme.
  acceptance:
    given: The actual Worker renders the specified page with the seeded or isolated fixture used by this test.
    when: The named browser test performs the relevant navigation, input, or viewport transition.
    then:
    - Selecting light, dark, or system updates the displayed theme and saved preference. While system is selected,
      a subsequent OS color-scheme change updates the displayed theme.
    test:
      file: tests/e2e/src/app/test.ts
      name: ui.theme-system-response
- id: ui.theme-no-js
  category: presentation
  topic: shell-layout
  rule: With JavaScript disabled, the page remains readable and its CSS follows the operating-system color
    scheme.
  acceptance:
    given: The actual Worker renders the specified page with the seeded or isolated fixture used by this test.
    when: The named browser test performs the relevant navigation, input, or viewport transition.
    then:
    - With JavaScript disabled, the page remains readable and its CSS follows the operating-system color scheme.
    test:
      file: tests/e2e/src/app/test.ts
      name: ui.theme-no-js
- id: ui.footer-navigation-landmark
  category: presentation
  topic: navigation-landmarks
  rule: Public footer links are contained in a distinct navigation landmark.
