      name: ui.navigation-landmarks-5
- id: ui.navigation-landmarks-6
  category: presentation
  topic: navigation-landmarks
  rule: Public notices and private activity reminders are separate navigation destinations. A user's reminder
    badge counts only unread, unexpired notifications belonging to that user.
  acceptance:
    given: Two isolated users, with and without academic subscriptions, have different unread, read and expired activity notices.
    when: Each signed-in browser opens desktop/mobile navigation, visits activity reminders and marks one owned notice read.
    then:
    - Public News & Notices and Activity reminders have distinct links; only private reminders display the exact owner count.
    - Reminder lists exclude expired and foreign-owner notices while retaining the owner's read history.
    - Marking a notice read updates the badge and removes the badge at zero.
    test:
      file: tests/e2e/src/app/shared-policy/navigation-context.test.ts
      name: ui.navigation-landmarks-6
- id: ui.navigation-landmarks-7
  category: presentation
  topic: navigation-landmarks
  rule: Activity and calendar navigation preserves the applied filters when opening a detail and returning
    to the list. The active view remains programmatically identified.
  acceptance:
    given: Isolated activities match every supported list and calendar filter, with activity and signup dates and more than one result page.
    when: A browser opens a detail from page two of the activity list and from day, week and month calendar views under both time bases, then follows the detail return link.
    then:
    - Detail and return links preserve the exact originating filters, pagination and calendar date/view; returned records remain present and the active browse and calendar views are programmatically identified.
    test:
      file: tests/e2e/src/app/shared-policy/young-return-navigation.test.ts
      name: ui.navigation-landmarks-7
- id: ui.list-pagination-filter-state
  category: presentation
  topic: list-table
  rule: Outside the six public browse collections covered by ui.public-browse-pagination-state, collection pagination links preserve the applied search query and filters while changing only pagination
    state; browser back/forward restores the corresponding query and results.
  rationale: The remaining current paginated collections are uploads, administrative users, activity subscriptions, followed organizers, unread/all notifications, organizer activity history, and course/teacher section histories. Directories without pagination are outside this pagination requirement.
  acceptance:
    given: Isolated fixtures provide twenty-five records for each remaining paginated collection and real signed-in administrative access where required.
    when: The browser checks every pagination href, activates the second page with the keyboard, and traverses back and forward under supported search, view and unread filters.
    then:
    - Links change only page or sectionsPage while preserving the collection query; second-page records are disjoint, and history restores the exact records and active-page state for both pages.
    test:
      file: tests/e2e/src/app/shared-policy/other-collection-pagination.test.ts
      name: ui.list-pagination-filter-state
- id: ui.public-browse-pagination-state
  category: presentation
  topic: list-table
  rule: Pagination links in public course, teacher, section, Young event, Young organizer and news browse collections preserve all applied search/filter values while changing only the page. Browser back and forward restore that query and its corresponding records.
  acceptance:
    given: Each public collection has two result pages under its supported search and filters.
    when: The browser inspects every pagination link, activates page two with the keyboard, and traverses back and forward.
    then:
    - Every link preserves the applied query apart from page; the two pages show disjoint records and browser history restores each page's query, records and active page marker.
    test:
      file: tests/e2e/src/app/shared-policy/public-browse-layout.test.ts
      name: ui.public-browse-pagination-state
