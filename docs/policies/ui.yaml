kind: policy
id: ui
title: Shared interface presentation
requirements:
- id: ui.layout-principles-1
  category: presentation
  topic: layout-principles
  rule: Desktop course, section, and teacher detail pages place introductions, descriptions, homework content,
    and comments in the main reading column.
  acceptance:
    given: Public course, section, and teacher details have introductions and comments; the section also has
      homework.
    when: An anonymous browser opens each detail at 1280 pixels and measures the reading sections relative to
      the facts sidebar.
    then:
    - Desktop course, section, and teacher detail pages place introductions, descriptions, homework content,
      and comments in the main reading column.
    test:
      file: tests/e2e/src/app/shared-policy/test.ts
      name: ui.layout-principles-1
- id: ui.layout-principles-2
  category: presentation
  topic: layout-principles
  rule: Desktop course, section, and teacher detail pages place structured secondary facts in a separate facts
    sidebar.
  acceptance:
    given: Public course, section, and teacher details have structured overview facts.
    when: An anonymous browser opens each detail at 1280 pixels and measures the visible facts sidebar relative
      to the introduction.
    then:
    - Desktop course, section, and teacher detail pages place structured secondary facts in a separate facts
      sidebar.
    test:
      file: tests/e2e/src/app/shared-policy/test.ts
      name: ui.layout-principles-2
- id: ui.layout-principles-3
  category: presentation
  topic: layout-principles
  rule: At mobile widths, catalog detail pages render the hero, compact identity facts, the main reading stream,
    and remaining secondary facts in that order. Workspace views and overlays follow their own declared content
    order.
  acceptance:
    given: Isolated course, teacher, and section details include compact identity facts, a description,
      and remaining secondary facts in Chinese and English.
    when: A browser renders each detail at 390 pixels, then resizes the same page to 1280 pixels.
    then:
    - Mobile DOM and visible geometry order the hero, compact identity facts, reading stream, and remaining
      facts without horizontal document overflow.
    - Course level/category, teacher department/title, and section teachers/campus appear before reading;
      the section retains one linked teachers anchor.
    - Desktop places identity and remaining facts to the right of the reading stream.
    test:
      file: tests/e2e/src/app/shared-policy/catalog-mobile-hierarchy.test.ts
      name: ui.layout-principles-3
- id: ui.layout-principles-4
  category: presentation
  topic: layout-principles
  rule: Shared collection and detail layouts reuse the existing feature-neutral layout, panel, navigation,
    and form primitives. Feature components own domain-specific data and interactions.
- id: ui.layout-principles-5
  category: presentation
  topic: layout-principles
  rule: Homework and todo detail overlays use one scrollable content column with a visible sticky title. Their
    content order is due date/time, relative urgency, remaining facts, reading content, then discussion when
    available. Primary content and actions remain reachable within that column without a second facts/status rail.
- id: ui.list-table-1
  category: presentation
  topic: list-table
  rule: Collection pages use the shared PageLayout, PageHeader, and Panel primitives, with filters before the
    results summary and results, followed by pagination.
- id: ui.list-table-2
  category: presentation
  topic: list-table
  rule: SearchField owns the application search-shortcut handler; collection pages do not register a competing
    handler for the same shortcut.
- id: ui.list-table-3
  category: presentation
  topic: list-table
  rule: Advanced list filters use one labeled Sheet containing the complete declared filter form and explicit
    Apply and dismiss actions.
  acceptance:
    given: The seeded course, teacher, and section collections expose their declared advanced filters.
    when: An anonymous browser opens each advanced-filter sheet and inspects its accessible name, form fields, Apply action, and explicit Close action.
    then:
    - Exactly one named sheet contains every declared advanced field and one form.
    - Apply is visible and Close dismisses the sheet.
    test:
      file: tests/e2e/src/app/shared-policy/catalog-filters.test.ts
      name: ui.list-table-3
- id: ui.list-table-4
  category: presentation
  topic: list-table
  rule: Opening advanced filters initializes draft values from the current applied URL query. Closing the sheet
    without Apply leaves the URL and results unchanged.
  acceptance:
    given: Course, teacher, and section URLs apply all advanced filters to a seeded matching result.
    when: The browser opens each sheet, changes every draft, dismisses through Close and Escape, then reopens it.
    then:
    - Draft values initialize from the applied URL on every opening.
    - Dismissing without Apply preserves both the exact URL and rendered results.
    test:
      file: tests/e2e/src/app/shared-policy/catalog-filters.test.ts
      name: ui.list-table-4
- id: ui.list-table-5
  category: presentation
  topic: list-table
  rule: Applying advanced filters submits the current search query and all draft filter values and resets pagination.
    A primary search change preserves the already applied advanced filters.
  acceptance:
    given: Each catalog collection has a search query and page=2 before the advanced sheet opens.
    when: The browser fills every advanced field, applies the form, and then changes the primary search query.
    then:
    - Apply retains the search and every draft value, removes the page parameter, and shows the matching seeded result.
    - Primary search changes preserve every applied advanced filter and still show the matching result.
    test:
      file: tests/e2e/src/app/shared-policy/catalog-filters.test.ts
      name: ui.list-table-5
- id: ui.list-table-6
  category: presentation
  topic: list-table
  rule: At narrow widths, compact lists do not cause horizontal document overflow. Wide comparison tables retain
    their required columns inside a horizontally scrollable table region.
- id: ui.list-table-7
  category: presentation
  topic: list-table
  rule: News keeps title-led rows.
- id: ui.list-table-8
  category: presentation
  topic: list-table
  rule: Query parsing, caching and URL builders remain in features.
- id: ui.list-table-9
  category: presentation
  topic: list-table
  rule: Route tabs use PageSectionNav; settings retains DetailSectionNav.
- id: ui.data-table-cells-1
  category: presentation
  topic: data-table-cells
  rule: Desktop table rows in the same list reserve the same secondary-line space when optional secondary text
    is absent; longer content must remain accessible without clipping controls.
- id: ui.data-table-cells-2
  category: presentation
  topic: data-table-cells
  rule: A truncated text cell makes its complete value available to pointer, keyboard, and touch users. The
    accessible text retains the complete value.
  acceptance:
    given: An isolated teaching section has a long course title, public section code, and teacher name.
    when: A browser opens the section list with a pointer and keyboard, then with touch input at tablet and
      mobile widths.
    then:
    - Each desktop value is actually truncated and hovering exposes its complete tooltip text.
    - Keyboard focus exposes each complete value and accessible text; Escape dismisses each tooltip.
    - Touch layouts display the complete titles, codes, and teacher descriptions without clipping or horizontal
      page overflow, and tapping the result navigates to its detail.
    test:
      file: tests/e2e/src/app/shared-policy/catalog-identity.test.ts
      name: ui.data-table-cells-2
- id: ui.data-table-cells-3
  category: presentation
  topic: data-table-cells
  rule: Course and section codes use plain monospace text, never badge styling.
  acceptance:
    given: An isolated course, teaching section, and teacher expose public codes in catalog lists, detail headers,
      and teaching-section history.
    when: A browser opens those surfaces at desktop and mobile widths.
    then:
    - Every visible occurrence of each public course or section code uses a computed monospace font.
    - None of those code labels is rendered inside a badge.
    test:
      file: tests/e2e/src/app/shared-policy/catalog-identity.test.ts
      name: ui.data-table-cells-3
- id: ui.data-table-cells-4
  category: presentation
  topic: data-table-cells
  rule: Header labels and cell content share the same column edge; textual and categorical values align left,
    while numeric measures and counts align right.
- id: ui.data-table-cells-5
  category: presentation
  topic: data-table-cells
  rule: Purely decorative blank table placeholders are absent from the accessibility tree. Meaningful unknown
    or TBD labels remain exposed.
- id: ui.data-table-cells-6
  category: presentation
  topic: data-table-cells
  rule: Numeric, status, control, and action cells do not receive truncation tooltips when their content fits.
- id: ui.detail-hero-2
  category: presentation
  topic: detail-hero
  rule: A directly opened course, section, or teacher detail page provides a reachable link to its owning collection
    without requiring browser history.
  acceptance:
    given: An anonymous user directly opens a course, section, or teacher detail at 1280 and 390 pixels.
    when: The user opens the mobile menu when needed and activates the shell link to that entity type’s owning
      collection.
    then:
    - A directly opened course, section, or teacher detail page provides a reachable link to its owning collection
      without requiring browser history.
    test:
      file: tests/e2e/src/app/shared-policy/test.ts
      name: ui.detail-hero-2
- id: ui.detail-hero-3
  category: presentation
  topic: detail-hero
  rule: h1 uses the primary display name of the current object, not an internal ID.
  acceptance:
    given: A seeded course, section, and teacher have Chinese and English display names.
    when: An anonymous browser selects Chinese and then English and loads each detail to read its level-one
      heading.
    then:
    - h1 uses the primary display name of the current object, not an internal ID.
    test:
      file: tests/e2e/src/app/shared-policy/test.ts
      name: ui.detail-hero-3
- id: ui.detail-hero-4
  category: presentation
  topic: detail-hero
  rule: Mobile catalog detail heroes keep public course or section codes and concise context visible alongside
    long localized names without horizontal overflow. Database row IDs and JW IDs do not substitute for that
    display context.
- id: ui.detail-hero-5
  category: presentation
  topic: detail-hero
  rule: Course codes live in the title region, in plain monospace text before the name; the localized name
    remains the dominant h1.
  acceptance:
    given: An anonymous user opens a course detail with a public code at a 390-by-844 viewport.
    when: The browser measures the title, code, and document width, then follows the comments fragment.
    then:
    - Course codes live in the title region, in plain monospace text before the name; the localized name remains
      the dominant h1.
    test:
      file: tests/e2e/src/app/courses/[jwId]/test.ts
      name: ui.detail-hero-5
- id: ui.detail-two-column-stream-1
  category: presentation
  topic: detail-two-column-stream
  rule: Course, section, and teacher detail pages expose a continuous reading stream and a desktop facts sidebar.
    In-page navigation uses fragment anchors rather than tab query parameters or legacy detail-subroute links.
- id: ui.detail-two-column-stream-2
  category: presentation
  topic: detail-two-column-stream
  expectation:
    kind: ordered_items
    surface: web
    target: section detail reading sections
    items:
    - introduction
    - calendar
    - exams
    - homework
    - comments
  acceptance:
    given: A public section detail contains introduction, calendar, exams, homework, and comments sections.
    when: The browser loads the detail at 1280 and 390 pixels and reads the section DOM order and vertical geometry.
    then:
    - Rendered reading sections follow the declared ordered_items expectation at desktop and mobile widths.
    test:
      file: tests/e2e/src/app/shared-policy/test.ts
      name: ui.detail-two-column-stream-2
  applies_to:
  - detail-two-column-stream
- id: ui.detail-two-column-stream-3
  category: presentation
  topic: detail-two-column-stream
  expectation:
    kind: ordered_items
    surface: web
    target: course and teacher detail reading sections
    items:
    - introduction
    - sections
    - comments
  acceptance:
    given: Public course and teacher details contain introduction, teaching-section, and comments sections.
    when: The browser loads both details at 1280 and 390 pixels and reads the section DOM order and vertical
      geometry.
    then:
    - Rendered reading sections follow the declared ordered_items expectation at desktop and mobile widths.
    test:
      file: tests/e2e/src/app/shared-policy/test.ts
      name: ui.detail-two-column-stream-3
  applies_to:
  - detail-two-column-stream
- id: ui.detail-two-column-stream-4
  category: presentation
  topic: detail-two-column-stream
  rule: Each catalog detail sidebar contains that feature’s structured facts and applicable actions. Section
    detail includes teachers and section subscription/calendar actions; course and teacher pages do not invent
    section-specific actions without a selected section.
- id: ui.detail-two-column-stream-6
  category: presentation
  topic: detail-two-column-stream
  rule: Public catalog detail HTML contains no personalized comment visibility or moderation permission state.
    The comment panel loads viewer-dependent results through its private client request.
  acceptance:
    given: Isolated owner, ordinary viewer, and administrator accounts and an anonymous browser visit
      course, section, and teacher details containing fixture public, logged-in-only, and hidden comments.
    when: Each browser loads the raw HTML and holds the comment client request before allowing it to complete.
    then:
    - Raw HTML includes neither fixture comment IDs/bodies nor viewer user IDs, and no fixture comments
      render before the private client response arrives.
    - The no-store client response identifies the current viewer and supplies the permitted comment bodies
      and owner edit/delete actions; ordinary catalog reads expose no administrator moderation capabilities.
    - Rendered comments match the current viewer's visibility instead of inheriting a previous visitor's data.
    test:
      file: tests/e2e/src/app/shared-policy/catalog-comment-privacy.test.ts
      name: ui.detail-two-column-stream-6
- id: ui.detail-two-column-stream-7
  category: presentation
  topic: detail-two-column-stream
  rule: Hash anchors scroll in-page.
- id: ui.model-property-priority-1
  category: presentation
  topic: model-property-priority
  rule: Each feature declares its identifying, task-critical, and disambiguating display fields in presentation
    data. UI and compact MCP projections retain those declared fields; JSON object key order is not a presentation
    contract.
- id: ui.model-property-priority-primary-2
  category: presentation
  topic: model-property-priority-primary
  rule: Each declared list, card, detail, and assistant projection puts its primary identity in that view’s
    title or leading summary slot; task-critical time and status remain available in its primary content.
- id: ui.model-property-priority-secondary-2
  category: presentation
  topic: model-property-priority-secondary
  rule: Secondary metadata uses shared secondary-text styling without hiding required disambiguation.
- id: ui.model-property-priority-tertiary-2
  category: presentation
  topic: model-property-priority-tertiary
  rule: Ordinary UI de-emphasizes internal reconstruction metadata. MCP default projections include only the
    fields declared by that tool; full mode still obeys all secret and private-field exclusions.
- id: ui.model-property-priority-surfaces-2
  category: presentation
  topic: model-property-priority-surfaces
  rule: MCP tools declare a compact default projection and, where supported, an explicit full projection. Default
    preserves the task identity and important disambiguation; full adds only explicitly allowed fields. No
    deprecated summary input is part of the supported contract.
- id: ui.basic-info-card-2
  category: presentation
  topic: basic-info-card
  rule: Displays structured fields; does not carry comment or homework interactions.
- id: ui.context-tabs-3
  category: presentation
  topic: context-tabs
  rule: Context navigation uses a scrollable horizontal row on mobile and a vertical rail on desktop. The active
    destination has aria-current=page and is scrolled into view; overflow does not make destinations unreachable.
- id: ui.global-search-results-1
  category: presentation
  topic: global-search-results
  rule: Catalog group order is sections → teachers → courses → links, then signed-in homeworks and todos.
  acceptance:
    given: A query matches an isolated course, section, and teacher, a shipped campus link, and an isolated
      user's subscribed homework and owned todo.
    when: The browser searches anonymously and then with that user's real session.
    then:
    - Anonymous results contain nonempty sections, teachers, courses, and links groups in that order without
      the private homework or todo.
    - Signed-in results keep the same public group order and append homeworks then todos, including the user's
      matching task in its respective group.
    test:
      file: tests/e2e/src/app/shared-policy/catalog-identity.test.ts
      name: ui.global-search-results-1
- id: ui.global-search-results-2
  category: presentation
  topic: global-search-results
  rule: Section items use title `course.namePrimary · teachers` (fall back to course name · section code when
    teachers are empty) and description `semester · campus · section.code` with code last.
  acceptance:
    given: An isolated section has two bilingual teachers, a bilingual campus, and an explicitly historical
      semester; another offering has no teacher, campus, or semester.
    when: An anonymous browser searches both offerings in Chinese and English and opens each result.
    then:
    - The complete section shows localized course and teacher names in its title, followed by the historical
      semester, localized campus, and public section code in its description.
    - The incomplete section uses the public code after its course title and localized Unknown before the
      final code in its description, without empty campus separators.
    - Both results navigate to the corresponding canonical section detail.
    test:
      file: tests/e2e/src/app/shared-policy/catalog-identity.test.ts
      name: ui.global-search-results-2
- id: ui.global-search-results-3
  category: presentation
  topic: global-search-results
  rule: Course items use title `course.namePrimary` and description `course.code`.
  acceptance:
    given: An isolated course has distinct Chinese and English names and a public course code.
    when: An anonymous browser searches its code in each locale and opens its result.
    then:
    - The result contains exactly its localized course name followed by its public code.
    - Opening it reaches the canonical course detail identified by its public JW ID.
    test:
      file: tests/e2e/src/app/shared-policy/catalog-identity.test.ts
      name: ui.global-search-results-3
- id: ui.global-search-results-4
  category: presentation
  topic: global-search-results
  rule: Teacher search results use the localized teacher name as title. Their secondary context uses department
    when present, otherwise the public teacher code; absent context does not expose a database row ID.
  acceptance:
    given: Three isolated teachers have a bilingual department, only a public code, or neither source of secondary
      context.
    when: An anonymous browser searches them in Chinese and English and opens a teacher result.
    then:
    - Each result leads with the localized teacher name and follows it with the localized department or public
      teacher code when available.
    - Missing secondary context adds no internal database or JW identifier.
    - Opening the result reaches that teacher's canonical detail page.
    test:
      file: tests/e2e/src/app/shared-policy/catalog-identity.test.ts
      name: ui.global-search-results-4
- id: ui.shell-layout-1
  category: presentation
  topic: shell-layout
  rule: Desktop sidebar and main content scroll independently.
  acceptance:
    given: A short desktop viewport displays a long public document and overflowing sidebar navigation.
    when: The user wheels each pane separately and uses Home in the focused content pane.
    then:
    - Scrolling either pane changes only its own scroll position; the document viewport remains stationary.
    - Keyboard scrolling returns main content to its beginning without moving the sidebar.
    test:
      file: tests/e2e/src/app/shared-policy/shell-layout.test.ts
      name: ui.shell-layout-1
- id: ui.shell-layout-2
  category: presentation
  topic: shell-layout
  rule: Signed-in desktop navigation groups personal task destinations under Workspace. Explore and admin destinations
    use distinct expandable groups, and admin entries are visible only to an authorized administrator.
  acceptance:
    given: A signed-in user opens the workspace calendar at a 1440-by-900 viewport.
    when: The browser inspects the visible primary navigation, its current-page link, and the expanded campus-services
      group.
    then:
    - Signed-in desktop navigation groups personal task destinations under Workspace. Explore and admin destinations
      use distinct expandable groups, and admin entries are visible only to an authorized administrator.
    test:
      file: tests/e2e/src/app/test.ts
      name: ui.shell-layout-2
- id: ui.shell-layout-3
  category: presentation
  topic: shell-layout
  rule: A destination row is either a link or a disclosure, never both.
  acceptance:
    given: The public desktop navigation and mobile drawer contain the expanded campus-services group.
    when: The user toggles the group with the keyboard and then activates the Shuttle Bus destination.
    then:
    - The group is a disclosure button without a URL; toggling it changes expanded state and child visibility
      without navigating.
    - Destination controls are anchors with URLs and no disclosure state, with no nested button-and-link controls.
    - Activating the destination reaches the canonical bus page rather than toggling a submenu.
    test:
      file: tests/e2e/src/app/shared-policy/shell-layout.test.ts
      name: ui.shell-layout-3
- id: ui.shell-layout-4
  category: presentation
  topic: shell-layout
  rule: Signed-in mobile navigation exposes Today, Calendar, Tasks, and Explore. The content layout reserves
    navigation height and the device safe-area inset so the final content is not covered.
  acceptance:
    given: A signed-in user opens the mobile shell and a long public document.
    when: The user activates every primary destination with the keyboard and the real browser emulates bottom
      safe-area insets of zero and 34 pixels.
    then:
    - Today, Calendar, Tasks, and Explore reach their canonical routes and identify the active destination.
    - Navigation padding and content reservation include the emulated safe-area inset.
    - After scrolling to the document end, its final text is fully above the navigation bar with no horizontal
      document overflow.
    test:
      file: tests/e2e/src/app/shared-policy/shell-layout.test.ts
      name: ui.shell-layout-4
- id: ui.shell-layout-5
  category: presentation
  topic: shell-layout
  rule: The topbar exposes language and theme controls. Signed-in desktop profile actions use the sidebar footer;
    mobile profile actions remain available from the mobile shell.
  acceptance:
    given: An isolated signed-in user opens a workspace page at desktop and mobile widths.
    when: The user opens language, theme, and profile menus with the keyboard and closes them with Escape.
    then:
    - Language and theme controls are visible in the topbar and expose selectable menu items.
    - Profile actions are available from the sidebar footer on desktop and the mobile drawer, including personal
      page, settings, and sign out.
    - Escape restores focus to each menu trigger.
    test:
      file: tests/e2e/src/app/shared-policy/shell-layout.test.ts
      name: ui.shell-layout-5
- id: ui.shell-layout-7
  category: presentation
  topic: shell-layout
  rule: Anonymous topbars retain Sign in.
  acceptance:
    given: An anonymous visitor opens the landing page, course catalog, and terms page at desktop and mobile widths.
    when: The visitor focuses the topbar Sign in link and presses Enter.
    then:
    - Each topbar exposes a visible Sign in link to the canonical account sign-in route.
    - Keyboard activation reaches the sign-in page and its main heading.
    test:
      file: tests/e2e/src/app/shared-policy/shell-layout.test.ts
      name: ui.shell-layout-7
- id: ui.shell-layout-8
  category: presentation
  topic: shell-layout
  expectation:
    kind: target_size
    surface: web
    target: mobile topbar controls and primary navigation links
    viewport:
      width: 390
      height: 844
    min_width: 44
    min_height: 44
  applies_to:
  - shell
  acceptance:
    given: A signed-in administrator opens workspace todos at the viewport declared by the target-size expectation.
    when: The browser measures the mobile primary links and menu, language, and theme controls, then opens the
      navigation drawer.
    then:
    - Rendered mobile topbar and primary-navigation hit targets meet the declared width and height at the declared
      viewport.
    test:
      file: tests/e2e/src/app/test.ts
      name: ui.shell-layout-8
- id: ui.shell-layout-9
  category: presentation
  topic: shell-layout
  rule: A stored light/dark preference is applied to the document before application hydration, using a bootstrap
    script authorized by the response CSP.
  acceptance:
    given: The browser saves a dark theme preference while the operating-system color scheme is light, and application
      hydration scripts are blocked.
    when: The anonymous home document loads and the browser inspects its initial theme and the bootstrap script’s
      CSP nonce.
    then:
    - A stored light/dark preference is applied to the document before application hydration, using a bootstrap
      script authorized by the response CSP.
    test:
      file: tests/e2e/src/app/test.ts
      name: ui.shell-layout-9
- id: ui.workspace-footer-policy-1
  category: presentation
  topic: workspace-footer-policy
  rule: Public discovery, policy, and marketing pages retain the public footer. Focused catalog detail pages
    may omit the footer; their legal and help navigation remains required by ui.public-legal-help-navigation.
  acceptance:
    given: Public discovery, policy, and usage pages with no authenticated viewer.
    when: The browser loads representative pages at desktop and mobile widths.
    then:
    - A visible public footer retains navigable Terms, Privacy, and usage links.
    test:
      file: tests/e2e/src/app/shared-policy/test.ts
      name: ui.workspace-footer-policy-1
- id: ui.workspace-footer-policy-2
  category: presentation
  topic: workspace-footer-policy
  rule: Workspace, /account/settings/*, /admin/*, and /account/welcome pages do not append the public footer.
  acceptance:
    given: The public terms page exposes footer navigation and an isolated administrator has a complete profile.
    when: The user opens workspace views, account settings, and administration pages, then opens onboarding with
      their own profile made incomplete.
    then:
    - Workspace, settings, and administration routes omit the public footer navigation.
    - The incomplete profile reaches the canonical welcome route, which also omits the public footer.
    test:
      file: tests/e2e/src/app/shared-policy/shell-layout.test.ts
      name: ui.workspace-footer-policy-2
- id: ui.workspace-filters-and-empty-states-1
  category: presentation
  topic: workspace-filters-and-empty-states
  rule: Homework, todo, and exam status filters retain the selected value through repeated activation, empty
    results, and completing the last pending task. Only an explicit selection or clear action changes the applied
    filter.
  acceptance:
    given: An isolated signed-in user has completed task records and, in a second case, one pending record,
      on each homework, todo, and exam page at desktop and mobile widths.
    when: The user repeatedly clicks and keyboard-activates filters while offline; after reconnecting, the user
      completes the last pending record and clears the resulting filter-empty state.
    then:
    - Homework, todo, and exam status filters retain the selected value through repeated activation, empty
      results, and completing the last pending task. Only an explicit selection or clear action changes the
      applied filter.
    test:
      file: tests/e2e/src/app/workspace/task-filters.test.ts
      name: ui.workspace-filters-and-empty-states-1
- id: ui.workspace-filters-and-empty-states-2
  category: presentation
  topic: workspace-filters-and-empty-states
  rule: Status-filter controls remain disabled until hydrated. Once interactive, activation updates their selected
    visual and accessible state without waiting for the results request to finish.
  acceptance:
    given: A signed-in browser opens each homework, todo, and exam page while its application hydration scripts
      are held.
    when: The browser checks all three filter controls before releasing the scripts, then switches among all,
      completed, and incomplete while offline.
    then:
    - Status-filter controls remain disabled until hydrated. Once interactive, activation updates their selected
      visual and accessible state without waiting for the results request to finish.
    test:
      file: tests/e2e/src/app/workspace/task-filter-readiness.test.ts
      name: ui.workspace-filters-and-empty-states-2
- id: ui.workspace-filters-and-empty-states-3
  category: presentation
  topic: workspace-filters-and-empty-states
  rule: Homework, todo, and exam filtered-empty states share compact left-aligned text with no decorative icon
    or filled background. Desktop tables retain their headers; an outline clear-filter action appears below
    the explanation.
  acceptance:
    given: An isolated user has completed homework, todo, and exam records and no pending records.
    when: The browser loads each page’s pending filter at desktop and mobile widths and inspects empty-state
      geometry, colors, icon, action, and table header visibility.
    then:
    - Homework, todo, and exam filtered-empty states share compact left-aligned text with no decorative icon
      or filled background. Desktop tables retain their headers; an outline clear-filter action appears below
      the explanation.
    test:
      file: tests/e2e/src/app/shared-policy/test.ts
      name: ui.workspace-filters-and-empty-states-3
- id: ui.workspace-filters-and-empty-states-5
  category: presentation
  topic: workspace-filters-and-empty-states
  rule: Filter-empty results explain the selection and offer clear-filter.
  acceptance:
    given: An isolated user has completed homework, todo, and exam records and no pending records.
    when: The browser reads each pending-filter explanation and activates Clear filter.
    then:
    - Filter-empty results explain the selection and offer clear-filter.
    test:
      file: tests/e2e/src/app/shared-policy/test.ts
      name: ui.workspace-filters-and-empty-states-5
- id: ui.workspace-filters-and-empty-states-6
  category: presentation
  topic: workspace-filters-and-empty-states
  rule: 'Setup-empty states offer a relevant authorized next action: task creation for an empty todo list and
    subscription setup for learning views that require subscribed sections.'
- id: ui.settings-navigation-1
  category: presentation
  topic: settings-navigation
  rule: Settings navigation uses a desktop rail and a horizontally scrollable mobile row containing every declared
    settings destination with localized labels.
  acceptance:
    given: A signed-in user opens the default profile-settings page at 390 pixels.
    when: The browser measures the mobile navigation and panel, then reloads settings at 1280 pixels and measures
      their desktop placement.
    then:
    - Settings navigation uses a desktop rail and a horizontally scrollable mobile row containing every declared
      settings destination with localized labels.
    test:
      file: tests/e2e/src/app/settings/test.ts
      name: ui.settings-navigation-1
- id: ui.settings-navigation-2
  category: presentation
  topic: settings-navigation
  rule: The default settings destination is /account/settings/profile. Canonical settings navigation does not
    depend on legacy tab query inputs.
  acceptance:
    given: A signed-in user requests the settings root without a subsection or tab query.
    when: The browser follows the root redirect and inspects the resulting profile form.
    then:
    - The default settings destination is /account/settings/profile. Canonical settings navigation does not
      depend on legacy tab query inputs.
    test:
      file: tests/e2e/src/app/settings/test.ts
      name: ui.settings-navigation-2
- id: ui.settings-navigation-4
  category: presentation
  topic: settings-navigation
  rule: Preferences reuse the shared theme mechanism and /api/account/preferences for server-supported preferences.
    Theme remains a browser preference; locale changes do not add locale URL segments.
- id: ui.settings-navigation-5
  category: presentation
  topic: settings-navigation
  rule: Application authorizations and linked sign-in providers occupy distinct settings destinations. Revoking
    an authorization requires explicit confirmation for the selected application.
- id: ui.settings-navigation-6
  category: presentation
  topic: settings-navigation
  rule: Within settings navigation, exactly one link identifies the active page with aria-current=page, and
    that link is visible in the mobile scroll region after navigation.
  acceptance:
    given: A signed-in user selects Chinese and directly opens danger settings.
    when: The browser reloads danger settings at 280, 320, and 375 pixels and measures the current link within
      the horizontally scrollable navigation and edge fades.
    then:
    - Within settings navigation, exactly one link identifies the active page with aria-current=page, and that
      link is visible in the mobile scroll region after navigation.
    test:
      file: tests/e2e/src/app/settings/test.ts
      name: ui.settings-navigation-6
- id: ui.settings-navigation-7
  category: presentation
  topic: settings-navigation
  rule: Destructive account controls are grouped in the separate danger settings destination rather than interspersed
    with routine profile or preference controls.
  acceptance:
    given: An isolated signed-in user opens each settings destination in Chinese on desktop and English
      on mobile.
    when: The browser inspects profile, preferences, linked accounts, security, authorizations and danger.
    then:
    - Only the active danger destination renders the visible account deletion region and its single trigger.
    - Routine destinations render neither the deletion trigger nor an account deletion form.
    test:
      file: tests/e2e/src/app/shared-policy/page-identity.test.ts
      name: ui.settings-navigation-7
- id: ui.contribution-heatmap-1
  category: presentation
  topic: contribution-heatmap
  rule: Contribution history uses a horizontally scrollable heatmap region when its date range exceeds the
    available width. Scrolling exposes all dates without causing horizontal document overflow.
- id: ui.contribution-heatmap-2
  category: presentation
  topic: contribution-heatmap
  rule: Each contribution day exposes its localized date/count to keyboard, touch, and assistive-technology
    users.
- id: ui.workspace-page-identity-1
  category: presentation
  topic: workspace-page-identity
  rule: Every signed-in workspace branch exposes exactly one localized level-one heading.
  acceptance:
    given: A user is signed in with Chinese at 1280 pixels and then English at 390 pixels.
    when: The browser directly opens overview, calendar, homework, todos, exams, and subscriptions and counts
      and reads each level-one heading.
    then:
    - Every signed-in workspace branch exposes exactly one localized level-one heading.
    test:
      file: tests/e2e/src/app/shared-policy/test.ts
      name: ui.workspace-page-identity-1
- id: ui.workspace-page-identity-2
  category: presentation
  topic: workspace-page-identity
  rule: The main content landmark uses the same localized branch label.
  acceptance:
    given: A user is signed in with Chinese at 1280 pixels and then English at 390 pixels.
    when: The browser directly opens overview, calendar, homework, todos, exams, and subscriptions and counts
      and reads the accessible name of each main landmark.
    then:
    - The main content landmark uses the same localized branch label.
    test:
      file: tests/e2e/src/app/shared-policy/test.ts
      name: ui.workspace-page-identity-2
- id: ui.workspace-page-identity-3
  category: presentation
  topic: workspace-page-identity
  rule: The document title identifies the active branch before the Life@USTC suffix.
  acceptance:
    given: A user is signed in with Chinese at 1280 pixels and then English at 390 pixels.
    when: The browser directly opens overview, calendar, homework, todos, exams, and subscriptions and reads
      each document title.
    then:
    - The document title identifies the active branch before the Life@USTC suffix.
    test:
      file: tests/e2e/src/app/shared-policy/test.ts
      name: ui.workspace-page-identity-3
- id: ui.workspace-page-identity-4
  category: presentation
  topic: workspace-page-identity
  rule: After a canonical workspace-root redirect, the final route determines the localized heading, main landmark
    label, and document title. Legacy query values do not define workspace identity.
  acceptance:
    given: An isolated signed-in user uses Chinese on desktop and English on mobile.
    when: The browser follows workspace-root redirects for default, calendar, homework, todo, exam and
      invalid selectors, then opens a semantic todo route carrying a stale calendar selector.
    then:
    - The final semantic route determines the single level-one heading, main landmark name and document title.
    - Root redirects remove tab selectors; a stale selector cannot rename an existing semantic route.
    test:
      file: tests/e2e/src/app/shared-policy/page-identity.test.ts
      name: ui.workspace-page-identity-4
- id: ui.workspace-mobile-priority-1
  category: presentation
  topic: workspace-mobile-priority
  rule: Mobile workspace overview displays its next learning/task actions before website-directory shortcuts,
    within a layout that does not overflow the viewport horizontally.
  acceptance:
    given: A signed-in user opens the workspace overview at a 390-by-844 viewport.
    when: The browser measures the next-action section against the website-shortcuts section and the document
      against the viewport width.
    then:
    - Mobile workspace overview displays its next learning/task actions before website-directory shortcuts,
      within a layout that does not overflow the viewport horizontally.
    test:
      file: tests/e2e/src/app/workspace/test.ts
      name: ui.workspace-mobile-priority-1
- id: ui.workspace-mobile-priority-3
  category: presentation
  topic: workspace-mobile-priority
  rule: Mobile homework, todo, and exam toolbars keep status filters directly available. Where card/list modes
    exist, an accessible overflow menu changes display mode; primary control hit targets are at least 44 by
    44 CSS pixels.
- id: ui.social-sharing-metadata-1
  category: presentation
  topic: social-sharing-metadata
  rule: Rendered pages provide one localized description and one Open Graph/Twitter card set. Account, OAuth,
    admin, and private workspace metadata uses non-sensitive page descriptions and never embeds credentials
    or private task content.
- id: ui.social-sharing-metadata-2
  category: presentation
  topic: social-sharing-metadata
  rule: Canonical and Open Graph URLs are absolute and use the configured application origin. They exclude
    query strings, fragments, credentials, and authorization continuation parameters.
  acceptance:
    given: Public paths, an attacker-origin path, and a private settings path carrying secret query parameters
      and fragments.
    when: The production social-metadata builder creates canonical URLs.
    then:
    - Canonical URLs use only the configured application origin and exclude query, fragment, credentials and
      secret parameters.
    test:
      file: tests/unit/lib/misc/social-metadata-policy-acceptance.test.ts
      name: ui.social-sharing-metadata-2
- id: ui.social-sharing-metadata-3
  category: presentation
  topic: social-sharing-metadata
  rule: Public course, section, and teacher detail metadata uses the canonical entity-root URL and controlled
    localized summaries rather than editable user-authored descriptions. This does not require supporting obsolete
    detail subroutes.
  acceptance:
    given: Isolated course, section, and teacher records each have a user-authored description containing
      a unique marker.
    when: Chinese and English clients fetch their current entity-root pages with query and fragment noise.
    then:
    - Actual SSR metadata contains exactly one complete card set with the entity-root canonical URL and
      the controlled localized entity summary.
    - Authored description content is present in page data but never copied into social descriptions or titles.
    test:
      file: tests/e2e/src/app/courses/social-metadata.test.ts
      name: ui.social-sharing-metadata-3
- id: ui.social-sharing-metadata-4
  category: presentation
  topic: social-sharing-metadata
  rule: Social metadata describes the fixed Life@USTC PNG card as 1200 by 630 pixels, with explicit MIME type
    and localized alternative text.
  acceptance:
    given: Chinese and English metadata requests with their localized alternative text.
    when: The production social-metadata builder creates the image descriptor.
    then:
    - The descriptor is a 1200 by 630 PNG with the provided localized alternative text.
    test:
      file: tests/unit/lib/misc/social-metadata-policy-acceptance.test.ts
      name: ui.social-sharing-metadata-4
- id: ui.social-sharing-metadata-5
  category: presentation
  topic: social-sharing-metadata
  rule: Every page and locale uses the same fixed /open-graph.png static asset without query parameters.
  acceptance:
    given: Several public/private page paths in both locales, followed by a page-copy override.
    when: The production metadata builder and updater produce social images.
    then:
    - Every result keeps the same fixed /open-graph.png URL with no query parameters.
    test:
      file: tests/unit/lib/misc/social-metadata-policy-acceptance.test.ts
      name: ui.social-sharing-metadata-5
- id: ui.social-sharing-metadata-6
  category: presentation
  topic: social-sharing-metadata
  rule: The fixed social image contains no page titles, profile names, or avatars. It is delivered as a static
    asset without invoking application rendering.
  acceptance:
    given: The fixed bundled 1200 by 630 PNG and requests with unrelated title/profile/avatar query parameters.
    when: Clients issue ordinary GET, query-bearing GET, HEAD, and conditional requests for /open-graph.png.
    then:
    - Both GETs return the exact bundled static bytes, with PNG metadata and public asset caching; query
      parameters never affect the image.
    - Static delivery has no application request ID, HEAD has no body, and a matching ETag returns 304.
    test:
      file: tests/e2e/src/app/courses/social-metadata.test.ts
      name: ui.social-sharing-metadata-6
- id: ui.localized-count-copy-1
