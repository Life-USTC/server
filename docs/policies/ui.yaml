kind: policy
id: ui
title: Shared interface presentation
requirements:
- id: ui.layout-principles-1
  category: presentation
  topic: layout-principles
  rule: Desktop course, section, and teacher detail pages place introductions, descriptions, homework content,
    and comments in the main reading column.
  acceptance:
    given: Public course, section, and teacher details have introductions and comments; the section also has
      homework.
    when: An anonymous browser opens each detail at 1280 pixels and measures the reading sections relative to
      the facts sidebar.
    then:
    - Desktop course, section, and teacher detail pages place introductions, descriptions, homework content,
      and comments in the main reading column.
    test:
      file: tests/e2e/src/app/shared-policy/test.ts
      name: ui.layout-principles-1
- id: ui.layout-principles-2
  category: presentation
  topic: layout-principles
  rule: Desktop course, section, and teacher detail pages place structured secondary facts in a separate facts
    sidebar.
  acceptance:
    given: Public course, section, and teacher details have structured overview facts.
    when: An anonymous browser opens each detail at 1280 pixels and measures the visible facts sidebar relative
      to the introduction.
    then:
    - Desktop course, section, and teacher detail pages place structured secondary facts in a separate facts
      sidebar.
    test:
      file: tests/e2e/src/app/shared-policy/test.ts
      name: ui.layout-principles-2
- id: ui.layout-principles-3
  category: presentation
  topic: layout-principles
  rule: At mobile widths, catalog detail pages render the hero, compact identity facts, the main reading stream,
    and remaining secondary facts in that order. Workspace views and overlays follow their own declared content
    order.
  acceptance:
    given: Isolated course, teacher, and section details include compact identity facts, a description,
      and remaining secondary facts in Chinese and English.
    when: A browser renders each detail at 390 pixels, then resizes the same page to 1280 pixels.
    then:
    - Mobile DOM and visible geometry order the hero, compact identity facts, reading stream, and remaining
      facts without horizontal document overflow.
    - Course level/category, teacher department/title, and section teachers/campus appear before reading;
      the section retains one linked teachers anchor.
    - Desktop places identity and remaining facts to the right of the reading stream.
    test:
      file: tests/e2e/src/app/shared-policy/catalog-mobile-hierarchy.test.ts
      name: ui.layout-principles-3
- id: ui.layout-principles-4
  category: presentation
  topic: layout-principles
  rule: Shared collection and detail layouts reuse the feature-neutral primitives appropriate to their structure. Public browse panels use PageLayout, PageHeader and Panel; other workspace and administrative pages use PageLayout and PageHeader. Course and teacher details use DetailPageLayout, section detail reuses PageHeader in its streaming shell, profiles reuse Card, and homework/todo overlays reuse Dialog. Route navigation and local settings navigation reuse PageSectionNav and DetailSectionNav respectively; catalog/Young filters and workspace task/profile identity fields reuse Field. The shared layout, navigation and form primitives do not import feature, server, route-state or database modules.
  rationale: Section streaming and profile identity composition have specific layout needs; primitive reuse does not require turning those shells into browse panels. Feature data and interaction ownership remains independently required by ui.feature-interaction-ownership.
  acceptance:
    given: The collection, detail, overlay, route/local navigation and form owners, plus shared layout/navigation/form implementations.
    when: Parse Svelte compiler ASTs, follow actually rendered imported feature components, and inspect the shared primitives' import dependencies.
    then:
    - Each owner renders the applicable shared primitive through its component tree; unused imports do not count, and the shared primitives have no feature/server/route-state/database imports.
    test:
      file: tests/unit/lib/components/layout-primitive-ownership.test.ts
      name: ui.layout-principles-4
- id: ui.feature-interaction-ownership
  category: presentation
  topic: layout-principles
  rule: Feature components own domain-specific data and interactions rather than embedding that domain behavior in feature-neutral layout, panel, navigation or form primitives.
- id: ui.layout-principles-5
  category: presentation
  topic: layout-principles
  rule: Homework and todo detail overlays use one scrollable content column with a title that stays visible.
    Their content order is due date/time, relative urgency, remaining facts, reading content, then discussion
    when available. Primary content and actions remain reachable without a second facts/status rail.
  acceptance:
    given: An isolated owner has homework and a todo with a known future deadline and long reading content.
    when: Each actual detail overlay opens at 1280, 390 and 320 pixels, and the user scrolls to its reading end and discussion where available.
    then:
    - Due date, relative urgency, facts and reading content have one column in the required order, followed by homework discussion.
    - Exactly one content viewport scrolls; the title remains visible at the same position while the reading content moves.
    - Bottom actions remain visible, enabled and keyboard-focusable without horizontal overflow.
    test:
      file: tests/e2e/src/app/shared-policy/task-overlay-layout.test.ts
      name: ui.layout-principles-5
- id: ui.list-table-1
  category: presentation
  topic: list-table
  rule: Public course, teacher, section, Young event, Young organizer and news browse collections use PageLayout, PageHeader and Panel, with visible filters before the result summary and records, followed by pagination.
  rationale: Administrative and personal workspaces deliberately use their shared workspace structures; ui.layout-principles-4 owns primitive reuse. Their applicable collection ordering remains in ui.other-collection-order.
  acceptance:
    given: Isolated data provides more than one page of results for each of the six public browse collections.
    when: A browser opens the filtered first page at mobile and desktop widths.
    then:
    - The shared page frame contains its heading and panel; visible filters precede the result summary and records, and pagination follows in the panel footer.
    test:
      file: tests/e2e/src/app/shared-policy/public-browse-layout.test.ts
      name: ui.list-table-1
- id: ui.other-collection-order
  category: presentation
  topic: list-table
  rule: Other collection surfaces, including link and publication-source directories, workspace uploads and activity reminders, and administrative lists, put their page heading before the applicable filters, result summary and records; available pagination follows the records. Their layout uses the shared primitives required by ui.layout-principles-4.
- id: ui.list-table-2
  category: presentation
  topic: list-table
  rule: SearchField owns the application search-shortcut handler; collection pages do not register a competing
    handler for the same shortcut.
  acceptance:
    given: Every application TypeScript module and parsed Svelte component script, plus the actual page/global
      shortcut predicates.
    when: Inspect registration-helper imports and calls through compiler ASTs and evaluate Ctrl/Command K
      with and without Shift.
    then:
    - SearchField is the sole importer and caller of the page-search registration helper.
    - The current page and global search handlers recognize disjoint Shift and non-Shift key combinations.
    test:
      file: tests/unit/lib/browser/search-shortcut-ownership.test.ts
      name: ui.list-table-2
- id: ui.list-table-3
  category: presentation
  topic: list-table
  rule: Advanced list filters use one labeled Sheet containing the complete declared filter form and explicit
    Apply and dismiss actions.
  acceptance:
    given: The seeded course, teacher, and section collections expose their declared advanced filters.
    when: An anonymous browser opens each advanced-filter sheet and inspects its accessible name, form fields, Apply action, and explicit Close action.
    then:
    - Exactly one named sheet contains every declared advanced field and one form.
    - Apply is visible and Close dismisses the sheet.
    test:
      file: tests/e2e/src/app/shared-policy/catalog-filters.test.ts
      name: ui.list-table-3
- id: ui.list-table-4
  category: presentation
  topic: list-table
  rule: Opening advanced filters initializes draft values from the current applied URL query. Closing the sheet
    without Apply leaves the URL and results unchanged.
  acceptance:
    given: Course, teacher, and section URLs apply all advanced filters to a seeded matching result.
    when: The browser opens each sheet, changes every draft, dismisses through Close and Escape, then reopens it.
    then:
    - Draft values initialize from the applied URL on every opening.
    - Dismissing without Apply preserves both the exact URL and rendered results.
    test:
      file: tests/e2e/src/app/shared-policy/catalog-filters.test.ts
      name: ui.list-table-4
- id: ui.list-table-5
  category: presentation
  topic: list-table
  rule: Applying advanced filters submits the current search query and all draft filter values and resets pagination.
    A primary search change preserves the already applied advanced filters.
  acceptance:
    given: Each catalog collection has a search query and page=2 before the advanced sheet opens.
    when: The browser fills every advanced field, applies the form, and then changes the primary search query.
    then:
    - Apply retains the search and every draft value, removes the page parameter, and shows the matching seeded result.
    - Primary search changes preserve every applied advanced filter and still show the matching result.
    test:
      file: tests/e2e/src/app/shared-policy/catalog-filters.test.ts
      name: ui.list-table-5
- id: ui.list-table-6
  category: presentation
  topic: list-table
  rule: Outside the six public browse collections covered by ui.public-browse-responsive-lists, compact lists do not cause horizontal document overflow at narrow widths. Wide comparison tables retain their required columns inside a horizontally scrollable table region.
- id: ui.public-browse-responsive-lists
  category: presentation
  topic: list-table
  rule: Public course, teacher, section, Young event, Young organizer and news browse collections display compact records without horizontal document overflow at narrow widths, including long entity names and publication summaries.
  acceptance:
    given: Isolated long-name records populate the first page of each of the six public browse collections.
    when: A browser opens each filtered collection at 320 and 390 pixels and scrolls every record into view.
    then:
    - Twenty compact records remain rendered and fit within the viewport; the document has no horizontal overflow and the active pagination page remains identified.
    test:
      file: tests/e2e/src/app/shared-policy/public-browse-layout.test.ts
      name: ui.public-browse-responsive-lists
- id: ui.list-table-7
  category: presentation
  topic: list-table
  rule: News keeps title-led rows.
  acceptance:
    given: An isolated news source contains more than one page of publications with titles and source/date metadata.
    when: The browser renders its first page at mobile and desktop widths.
    then:
    - Every result begins with a linked level-two title above smaller source/date metadata and links to its article detail.
    test:
      file: tests/e2e/src/app/news/test.ts
      name: ui.list-table-7
- id: ui.list-table-8
  category: presentation
  topic: list-table
  rule: Query parsing, caching and URL builders remain in features.
  rationale: Collection route loaders delegate their domain queries to feature modules. Shared collection layout, header, panel, navigation, search and pagination primitives receive prepared values and callbacks; generic cache infrastructure is not feature query logic.
  acceptance:
    given: The public catalog, links, second-classroom and news collection route loaders and their shared collection primitives.
    when: TypeScript parses each module and the Svelte compiler extracts primitive scripts.
    then:
    - Every route invokes an imported feature service without local URL query parsing, cache access or database imports; shared primitives do not import feature/state/query modules or fetch data.
    test:
      file: tests/unit/lib/components/collection-query-ownership.test.ts
      name: ui.list-table-8
- id: ui.list-table-9
  category: presentation
  topic: list-table
  rule: Route tabs use PageSectionNav; settings retains DetailSectionNav.
  rationale: This component ownership boundary covers second-classroom browse/detail/reminder tabs, moderation tabs and publication source grouping. App-shell navigation, calendar date controls and document anchor indexes are separate navigation concerns.
  acceptance:
    given: Every current route-tab owner and the settings page controller.
    when: The Svelte compiler resolves the actually rendered imported component graph for each owner.
    then:
    - Route-tab graphs render PageSectionNav and never DetailSectionNav; the settings graph renders DetailSectionNav and never PageSectionNav.
    test:
      file: tests/unit/lib/components/navigation-ownership.test.ts
      name: ui.list-table-9
- id: ui.data-table-cells-1
  category: presentation
  topic: data-table-cells
  rule: Desktop table rows in the same list reserve the same secondary-line space when optional secondary text
    is absent; longer content must remain accessible without clipping controls.
  rationale: The current optional secondary text fields in desktop table rows are bus-version source messages, comment moderation notes, suspension usernames, and user suspension details; other table rows use single-line fields or required secondary facts.
  acceptance:
    given: Isolated administrative rows populate, omit and lengthen each optional secondary field across bus versions, comments, suspensions and users.
    when: A desktop browser measures the secondary line, exposes long content and scrolls each row action into view.
    then:
    - Missing secondary text retains the populated line height, long text remains available through the shared truncation interaction, and row controls remain fully visible.
    test:
      file: tests/e2e/src/app/shared-policy/admin-table-cell-policies.test.ts
      name: ui.data-table-cells-1
- id: ui.data-table-cells-2
  category: presentation
  topic: data-table-cells
  rule: A truncated text cell makes its complete value available to pointer, keyboard, and touch users. The
    accessible text retains the complete value.
  acceptance:
    given: An isolated teaching section has a long course title, public section code, and teacher name.
    when: A browser opens the section list with a pointer and keyboard, then with touch input at tablet and
      mobile widths.
    then:
    - Each desktop value is actually truncated and hovering exposes its complete tooltip text.
    - Keyboard focus exposes each complete value and accessible text; Escape dismisses each tooltip.
    - Touch layouts display the complete titles, codes, and teacher descriptions without clipping or horizontal
      page overflow, and tapping the result navigates to its detail.
    test:
      file: tests/e2e/src/app/shared-policy/catalog-identity.test.ts
      name: ui.data-table-cells-2
- id: ui.data-table-cells-3
  category: presentation
  topic: data-table-cells
  rule: Course and section codes use plain monospace text, never badge styling.
  acceptance:
    given: An isolated course, teaching section, and teacher expose public codes in catalog lists, detail headers,
      and teaching-section history.
    when: A browser opens those surfaces at desktop and mobile widths.
    then:
    - Every visible occurrence of each public course or section code uses a computed monospace font.
    - None of those code labels is rendered inside a badge.
    test:
      file: tests/e2e/src/app/shared-policy/catalog-identity.test.ts
      name: ui.data-table-cells-3
- id: ui.catalog-table-column-alignment
  category: presentation
  topic: data-table-cells
  rule: Course, teacher and section collection tables and course/teacher offering-history tables align each header with its cell content. Text and categorical columns use their left edge; section counts, credits and capacity values use their right edge.
  acceptance:
    given: Isolated catalog fixtures populate all text columns and numeric section-count, credit and capacity columns.
    when: A desktop browser measures rendered text edges in all three collection tables and both offering-history tables.
    then:
    - Text headers and values share a left edge, and each numeric header and value shares a right edge.
    test:
      file: tests/e2e/src/app/shared-policy/catalog-mobile-hierarchy.test.ts
      name: ui.catalog-table-column-alignment
- id: ui.data-table-cells-4
  category: presentation
  topic: data-table-cells
  rule: In non-catalog application data tables, headers and cells use a consistent column alignment. Numeric measures and counts, including bytes, credits and capacity, align right. Text aligns left; status and action columns may center, and temporal columns use a consistent chosen alignment. Bus timetable stop columns preserve their positional left/center/right alignment.
  rationale: The five catalog collection/history tables have the independent owner ui.catalog-table-column-alignment. The remaining application tables retain this unbound obligation until their own rendered matrix is covered.
- id: ui.data-table-cells-5
  category: presentation
  topic: data-table-cells
  rule: Purely decorative blank table placeholders are absent from the accessibility tree. Meaningful unknown
    or TBD labels remain exposed.
  acceptance:
    given: Administrative table rows omit their optional secondary values, while a user lacks a username and a teacher lacks a title.
    when: The browser inspects the shared blank placeholders and the rendered accessibility trees for missing-value labels.
    then:
    - Blank placeholders are empty and aria-hidden; meaningful no-username and Unknown labels remain exposed.
    test:
      file: tests/e2e/src/app/shared-policy/admin-table-cell-policies.test.ts
      name: ui.data-table-cells-5
- id: ui.data-table-cells-6
  category: presentation
  topic: data-table-cells
  rule: Numeric, status, control, and action cells do not receive truncation tooltips when their content fits.
  rationale: Icon-only controls retain their intentional action-label tooltips; those communicate the control's purpose rather than duplicate clipped cell content. The shared text truncation primitive is exercised with a fitting status detail as well as plain numeric/status cells and action controls.
  acceptance:
    given: Isolated administrative tables contain fitting trip counts, role and moderation badges, suspension details and icon-only actions.
    when: The browser hovers the numeric/status cells and focuses fitting text and action controls across bus, comment, suspension and user tables.
    then:
    - Fitting cell content has no native title or truncation tooltip; icon controls expose only the intentional tooltip matching their accessible action label.
    test:
      file: tests/e2e/src/app/shared-policy/admin-table-cell-policies.test.ts
      name: ui.data-table-cells-6
- id: ui.detail-hero-2
  category: presentation
  topic: detail-hero
  rule: A directly opened course, section, or teacher detail page provides a reachable link to its owning collection
    without requiring browser history.
  acceptance:
    given: An anonymous user directly opens a course, section, or teacher detail at 1280 and 390 pixels.
    when: The user opens the mobile menu when needed and activates the shell link to that entity type’s owning
      collection.
    then:
    - A directly opened course, section, or teacher detail page provides a reachable link to its owning collection
      without requiring browser history.
    test:
      file: tests/e2e/src/app/shared-policy/test.ts
      name: ui.detail-hero-2
- id: ui.detail-hero-3
  category: presentation
  topic: detail-hero
  rule: h1 uses the primary display name of the current object, not an internal ID.
  acceptance:
    given: A seeded course, section, and teacher have Chinese and English display names.
    when: An anonymous browser selects Chinese and then English and loads each detail to read its level-one
      heading.
    then:
    - h1 uses the primary display name of the current object, not an internal ID.
    test:
      file: tests/e2e/src/app/shared-policy/test.ts
      name: ui.detail-hero-3
- id: ui.detail-hero-4
  category: presentation
  topic: detail-hero
  rule: Mobile catalog detail heroes keep public course or section codes and concise context visible alongside
    long localized names without horizontal overflow. Database row IDs and JW IDs do not substitute for that
    display context.
  acceptance:
    given: Isolated course, section and teacher details have long Chinese and English names and distinct
      public codes versus internal identifiers.
    when: The browser renders each detail at 320 and 390 CSS pixels in both locales.
    then:
    - The localized heading retains its complete text and fits the viewport; course and section codes remain
      visible and fit without clipping or horizontal document overflow.
    - Hero content never substitutes the database row ID or JW ID for the public display identity.
    test:
      file: tests/e2e/src/app/shared-policy/catalog-mobile-hierarchy.test.ts
      name: ui.detail-hero-4
- id: ui.detail-hero-5
  category: presentation
  topic: detail-hero
  rule: Course codes live in the title region, in plain monospace text before the name; the localized name
    remains the dominant h1.
  acceptance:
    given: An anonymous user opens a course detail with a public code at a 390-by-844 viewport.
    when: The browser measures the title, code, and document width, then follows the comments fragment.
    then:
    - Course codes live in the title region, in plain monospace text before the name; the localized name remains
      the dominant h1.
    test:
      file: tests/e2e/src/app/courses/[jwId]/test.ts
      name: ui.detail-hero-5
- id: ui.detail-two-column-stream-1
  category: presentation
  topic: detail-two-column-stream
  rule: Course, section and teacher detail pages keep all applicable reading sections rendered in one continuous stream. Moving through that stream does not select a detail tab or navigate to a detail subroute.
  rationale: Desktop facts-sidebar placement is owned by ui.layout-principles-3. Fragment-anchor scrolling is owned by ui.detail-two-column-stream-7, and entity-root canonical addresses by course.detail-canonical-url, teacher.detail-canonical-url and section.detail-canonical-url.
  acceptance:
    given: Isolated course, teacher and section details have descriptions and their applicable reading sections.
    when: Mobile and desktop browsers scroll through every section and inspect the detail links.
    then:
    - Every applicable section remains visible in the same ordered stream without changing the entity URL; in-page links do not use detail-tab queries or detail subroutes.
    test:
      file: tests/e2e/src/app/shared-policy/catalog-mobile-hierarchy.test.ts
      name: ui.detail-two-column-stream-1
- id: ui.detail-two-column-stream-2
  category: presentation
  topic: detail-two-column-stream
  expectation:
    kind: ordered_items
    surface: web
    target: section detail reading sections
    items:
    - introduction
    - calendar
    - exams
    - homework
    - comments
  acceptance:
    given: A public section detail contains introduction, calendar, exams, homework, and comments sections.
    when: The browser loads the detail at 1280 and 390 pixels and reads the section DOM order and vertical geometry.
    then:
    - Rendered reading sections follow the declared ordered_items expectation at desktop and mobile widths.
    test:
      file: tests/e2e/src/app/shared-policy/test.ts
      name: ui.detail-two-column-stream-2
  applies_to:
  - detail-two-column-stream
- id: ui.detail-two-column-stream-3
  category: presentation
  topic: detail-two-column-stream
  expectation:
    kind: ordered_items
    surface: web
    target: course and teacher detail reading sections
    items:
    - introduction
    - sections
    - comments
  acceptance:
    given: Public course and teacher details contain introduction, teaching-section, and comments sections.
    when: The browser loads both details at 1280 and 390 pixels and reads the section DOM order and vertical
      geometry.
    then:
    - Rendered reading sections follow the declared ordered_items expectation at desktop and mobile widths.
    test:
      file: tests/e2e/src/app/shared-policy/test.ts
      name: ui.detail-two-column-stream-3
  applies_to:
  - detail-two-column-stream
- id: ui.detail-two-column-stream-4
  category: presentation
  topic: detail-two-column-stream
  rule: Catalog detail information regions contain feature-specific structured facts. Section detail includes
    teacher links, with subscription and calendar actions reachable in the desktop header and mobile fixed action bar.
    Course and teacher pages do not offer section-specific actions before a section is selected.
  rationale: Identity and remaining facts share the desktop information column and follow the mobile detail hierarchy.
    Section primary actions stay in the header or fixed mobile bar so they remain reachable without duplication in the facts region.
  acceptance:
    given: Isolated catalog fixtures contain course classifications, teacher contact and affiliation facts, section counts and an authenticated viewer.
    when: Section, course and teacher detail pages are opened at 1280, 390 and 320 pixels.
    then:
    - Structured facts render in the information regions, sharing the right column on desktop and remaining reachable on mobile.
    - Section teacher links navigate to the matching teacher; header or mobile actions open the matching calendar URL and persist subscribe/unsubscribe changes.
    - Course and teacher pages expose applicable facts and section links without presenting section subscription or calendar actions before selection.
    test:
      file: tests/e2e/src/app/shared-policy/catalog-detail-facts.test.ts
      name: ui.detail-two-column-stream-4
- id: ui.detail-two-column-stream-6
  category: presentation
  topic: detail-two-column-stream
  rule: Public catalog detail HTML contains no personalized comment visibility or moderation permission state.
    The comment panel loads viewer-dependent results through its private client request.
  acceptance:
    given: Isolated owner, ordinary viewer, and administrator accounts and an anonymous browser visit
      course, section, and teacher details containing fixture public, logged-in-only, and hidden comments.
    when: Each browser loads the raw HTML and holds the comment client request before allowing it to complete.
    then:
    - Raw HTML includes neither fixture comment IDs/bodies nor viewer user IDs, and no fixture comments
      render before the private client response arrives.
    - The no-store client response identifies the current viewer and supplies the permitted comment bodies
      and owner edit/delete actions; ordinary catalog reads expose no administrator moderation capabilities.
    - Rendered comments match the current viewer's visibility instead of inheriting a previous visitor's data.
    test:
      file: tests/e2e/src/app/shared-policy/catalog-comment-privacy.test.ts
      name: ui.detail-two-column-stream-6
- id: ui.detail-two-column-stream-7
  category: presentation
  topic: detail-two-column-stream
  rule: Hash anchors scroll in-page.
  acceptance:
    given: Isolated course, teacher and section descriptions contain a rendered Markdown fragment link
      to their discussion section below a long reading stream.
    when: Mobile and desktop browsers click the actual rendered link.
    then:
    - The URL retains its route and gains the discussion fragment without a document or page-data navigation.
    - The existing page or detail scroll container moves to the discussion target and brings it into the viewport.
    test:
      file: tests/e2e/src/app/shared-policy/catalog-mobile-hierarchy.test.ts
      name: ui.detail-two-column-stream-7
- id: ui.model-property-priority-1
  category: presentation
  topic: model-property-priority
  rule: Each feature declares its identifying, task-critical, and disambiguating display fields in presentation
    data. UI and compact MCP projections retain those declared fields; JSON object key order is not a presentation
    contract.
- id: ui.model-property-priority-primary-2
  category: presentation
  topic: model-property-priority-primary
  rule: Each declared list, card, detail, and assistant projection puts its primary identity in that view’s
    title or leading summary slot; task-critical time and status remain available in its primary content.
- id: ui.model-property-priority-secondary-2
  category: presentation
  topic: model-property-priority-secondary
  rule: Secondary metadata uses shared secondary-text styling without hiding required disambiguation.
- id: ui.model-property-priority-tertiary-2
  category: presentation
  topic: model-property-priority-tertiary
  rule: Ordinary UI de-emphasizes internal reconstruction metadata.
- id: ui.basic-info-card-2
  category: presentation
  topic: basic-info-card
  rule: Course, teacher and section basic-information components render structured facts. Comment and homework interaction components remain outside their component dependency trees.
  rationale: This is a feature-component responsibility boundary; generic shared UI primitives are external leaves, and the current fact components do not re-export children through barrels. Public field allowlists are owned by course.public-detail-fields, teacher.public-detail-fields and section.public-teacher-reference; the visible localized identity facts are owned by ui.layout-principles-3.
  acceptance:
    given: The three catalog basic-information roots and all their composed local Svelte children.
    when: The Svelte compiler parses their feature-component dependency trees through relative and aliased Svelte imports and inspects element attributes.
    then:
    - Each tree contains definition-list fields and contains no comment/homework component imports, mutation forms, input controls or interaction handlers.
    test:
      file: tests/unit/features/catalog/basic-information-boundary.test.ts
      name: ui.basic-info-card-2
- id: ui.context-tabs-3
  category: presentation
  topic: context-tabs
  rule: Contextual section navigation, currently used by account settings, uses a scrollable horizontal row
    on mobile and a vertical rail on desktop. The active destination has aria-current=page and is scrolled
    into view; keyboard-focused destinations remain fully visible and reachable through overflow.
  rationale: Public catalog details use continuous reading streams. Young catalog view switches use a
    separate browse-navigation component; they are not contextual section rails.
  acceptance:
    given: An isolated signed-in user opens the last account-settings destination at 1280, 390 and 280 CSS pixels.
    when: The actual navigation reveals the active destination and the user visits every settings section with Tab and Enter.
    then:
    - Desktop links form a vertical rail; mobile links occupy one horizontally scrollable row without document overflow.
    - The directly opened active link and every keyboard-focused destination are fully inside the navigation viewport.
    - Each activated route renders its panel and has exactly one aria-current=page link.
    test:
