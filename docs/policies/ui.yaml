  acceptance:
    given: The fixed bundled 1200 by 630 PNG and requests with unrelated title/profile/avatar query parameters.
    when: Clients issue ordinary GET, query-bearing GET, HEAD, and conditional requests for /open-graph.png.
    then:
    - Both GETs return the exact bundled static bytes, with PNG metadata and public asset caching; query
      parameters never affect the image.
    - Static delivery has no application request ID, HEAD has no body, and a matching ETag returns 304.
    test:
      file: tests/e2e/src/app/courses/social-metadata.test.ts
      name: ui.social-sharing-metadata-6
- id: ui.localized-count-copy-1
  category: presentation
  topic: localized-count-copy
  rule: Outside catalog result summaries and profile contribution-day labels, user-visible English count copy distinguishes singular from plural forms; Chinese may share one count template when its grammar does not change.
  rationale: Catalog result summaries and profile contribution-day labels have the independent owners ui.catalog-count-copy and ui.profile-count-copy. Other user-visible counts retain this unbound obligation.
- id: ui.catalog-count-copy
  category: presentation
  topic: localized-count-copy
  rule: Course, teacher and section result summaries use singular English entity names when the total is one and plural names for zero or multiple results; Chinese summaries retain their natural classifiers.
  acceptance:
    given: Two isolated course, teacher and section fixtures can each be queried as zero, one or two matching results.
    when: English and Chinese desktop browsers open all three result collections for each count.
    then:
    - The rendered summary reports the actual shown and total counts with correct singular, plural or Chinese classifier wording.
    test:
      file: tests/e2e/src/app/shared-policy/catalog-mobile-hierarchy.test.ts
      name: ui.catalog-count-copy
- id: ui.profile-count-copy
  category: presentation
  topic: localized-count-copy
  rule: Public profile contribution-day labels use activity for one English contribution and activities for zero or multiple contributions, while Chinese labels retain one natural count template.
  acceptance:
    given: Isolated profiles have one or two public attributed comments on one Shanghai date, with empty days elsewhere.
    when: English and Chinese browsers focus empty and populated contribution days.
    then:
    - The accessible day name and visible live detail expose the database-backed count and the grammatical localized label for zero, one and two.
    test:
      file: tests/e2e/src/app/shared-policy/contribution-heatmap.test.ts
      name: ui.profile-count-copy
- id: ui.navigation-landmarks-1
  category: presentation
  topic: navigation-landmarks
  rule: The visible desktop primary-navigation landmark is named Primary navigation in English and 主导航 in Chinese.
  acceptance:
    given: An anonymous browser uses a 1280-pixel viewport.
    when: The browser opens the public course list in Chinese and English and locates the primary navigation
      by its localized accessible name.
    then:
    - The visible desktop primary-navigation landmark is named Primary navigation in English and 主导航 in Chinese.
    test:
      file: tests/e2e/src/app/shared-policy/test.ts
      name: ui.navigation-landmarks-1
- id: ui.navigation-landmarks-2
  category: presentation
  topic: navigation-landmarks
  rule: 'Signed-in mobile: distinct Mobile primary navigation / 移动主导航 and Secondary navigation / 次级导航 landmarks.'
  acceptance:
    given: A signed-in user opens the workspace overview at 390 pixels in Chinese and English.
    when: The browser reads the visible mobile primary navigation, opens the menu, and reads the secondary navigation’s
      accessible name.
    then:
    - 'Signed-in mobile: distinct Mobile primary navigation / 移动主导航 and Secondary navigation / 次级导航 landmarks.'
    test:
      file: tests/e2e/src/app/shared-policy/test.ts
      name: ui.navigation-landmarks-2
- id: ui.navigation-landmarks-3
  category: presentation
  topic: navigation-landmarks
  rule: Each navigation landmark contains at most one aria-current=page link. Separate primary and secondary
    navigation landmarks may each identify their own active destination.
  acceptance:
    given: A signed-in user visits workspace todos, the public course list, and preference settings at 1280
      and 390 pixels.
    when: The browser opens the mobile menu when needed and counts current-page links separately within every
      navigation landmark.
    then:
    - Each navigation landmark contains at most one aria-current=page link. Separate primary and secondary
      navigation landmarks may each identify their own active destination.
    test:
      file: tests/e2e/src/app/shared-policy/test.ts
      name: ui.navigation-landmarks-3
- id: ui.navigation-landmarks-4
  category: presentation
  topic: navigation-landmarks
  rule: The first focusable shell control is a localized skip link that moves keyboard focus to main content.
  acceptance:
    given: An anonymous home page has loaded and no control has keyboard focus.
    when: The user presses Tab once to reach the skip link and then presses Enter.
    then:
    - The first focusable shell control is a localized skip link that moves keyboard focus to main content.
    test:
      file: tests/e2e/src/app/test.ts
      name: ui.navigation-landmarks-4
- id: ui.navigation-landmarks-5
  category: presentation
  topic: navigation-landmarks
  rule: Campus services navigation exposes distinct entries for the academic catalog, Young activities, and
    news, each linking to its canonical destination.
  acceptance:
    given: An anonymous visitor opens the desktop navigation or mobile navigation drawer.
    when: The visitor separately activates Courses, Second Classroom, and News & Notices.
    then:
