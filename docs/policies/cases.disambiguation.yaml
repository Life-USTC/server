kind: policy
id: cases.disambiguation
title: 'Cross-feature scenarios: disambiguation'
requirements:
- id: cases.disambiguation.duplicate-course-names-1
  category: behavior
  topic: duplicate-course-names
  rule: Course search and course-list results display the localized course name and public course code, so
    courses with identical names remain distinguishable.
- id: cases.disambiguation.multiple-sections-same-course-1
  category: behavior
  topic: multiple-sections-same-course
  rule: Section search, course-detail offerings, and subscription match/import results display section code
    and semester alongside course identity. Missing semester data uses an explicit unknown label rather than
    a fabricated current semester.
refs:
- feature: course
  capability: course-list
- feature: section
  capability: section-list
- feature: subscription
  capability: batch-subscribe-by-codes
topics:
- id: duplicate-course-names
  title: Duplicate course names
- id: multiple-sections-same-course
  title: Multiple sections same course
- id: required-disambiguation-contexts
  title: Required disambiguation contexts
- id: scenario-guidance
  title: Scenario guidance
rationale:
- Public course/section codes and semester labels distinguish records whose localized names are identical.
