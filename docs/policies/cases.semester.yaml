kind: policy
id: cases.semester
title: 'Cross-feature scenarios: semester'
requirements:
- id: cases.semester.no-current-semester-1
  category: behavior
  topic: no-current-semester
  rule: When no current semester is available, /workspace/overview labels the semester context as unavailable.
    Independently available todos, subscribed activities, and past-term learning records remain accessible.
- id: cases.semester.no-current-semester-2
  category: behavior
  topic: no-current-semester
  rule: The no-current-semester state links to catalog browsing and existing subscribed-section history. A
    code-import flow requires selection of an available semester when no current semester can supply its scope.
- id: cases.semester.only-non-current-semester-subscriptions-1
  category: behavior
  topic: only-non-current-semester-subscriptions
  rule: When subscriptions exist only in other semesters, the workspace reports zero current-semester subscriptions
    and labels any historical work with its actual term instead of relabeling it current.
- id: cases.semester.only-non-current-semester-subscriptions-2
  category: behavior
  topic: only-non-current-semester-subscriptions
  rule: Must clearly indicate that no sections are subscribed for the current semester.
- id: cases.semester.only-non-current-semester-subscriptions-3
  category: behavior
  topic: only-non-current-semester-subscriptions
  rule: Must keep past-term homework, schedules, and subscribed sections reachable from the empty state.
  acceptance:
    given: A signed-in user subscribes only to a previous-semester section that has historical homework and
      schedule rows.
    when: At a 390-pixel viewport, the user reloads the workspace overview and requests the historical homework
      and date-bounded schedule endpoints.
    then:
    - Must keep past-term homework, schedules, and subscribed sections reachable from the empty state.
    test:
      file: tests/e2e/src/app/test.ts
      name: cases.semester.only-non-current-semester-subscriptions-3
- id: cases.semester.cross-semester-browsing-1
  category: behavior
  topic: cross-semester-browsing
  rule: A course with offerings in multiple semesters displays the semester on each offering. The course itself
    is not assigned a single inferred semester.
- id: cases.semester.cross-semester-browsing-3
  category: behavior
  topic: cross-semester-browsing
  rule: Homework shown across semesters includes its section semester; missing semester data is labeled unknown.
- id: cases.semester.cross-semester-browsing-4
  category: behavior
  topic: cross-semester-browsing
  rule: Exams shown across semesters include their section semester; missing semester data is labeled unknown.
refs:
- feature: overview
  capability: authenticated-overview
- feature: subscription
  capability: batch-subscribe-by-codes
- feature: subscribed-sections
  capability: subscribed-sections-tab
topics:
- id: no-current-semester
  title: No current semester
- id: only-non-current-semester-subscriptions
  title: Only non current semester subscriptions
- id: cross-semester-browsing
  title: Cross semester browsing
- id: scenario-guidance
  title: Scenario guidance
