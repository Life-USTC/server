  title: Locale, Caching, and SEO
rationale:
- This document defines the canonical information architecture shared by the Life@USTC web app, REST API, GraphQL
  API, MCP server, Bot, and CLI.
- Each transport may use its native syntax.
- The server repository is the source of truth for Web, REST, GraphQL, and MCP.
- Bot and CLI entries are integration contracts verified in their repositories.
- 'Human interfaces may adapt actions without changing semantics: CLI `complete` / `reopen` and Bot “完成” /
  “恢复” map to the capability action `completion_set`.'
- The first column is the capability ID (also the MCP name where exposed), not a promise that Bot exposes that
  tool.
- A dash in a client column means there is no dedicated command.
- REST and GraphQL clients exhaust pagination instead of using the bounded overview as a calendar dataset.
- See `docs/features/young-workspace.yaml` for the owner-scoped subscription and notification interfaces.
- Feature specifications in docs/features define product behavior, authorization, presentation and supported
  interface bindings. Exact REST wire shapes come from public/openapi.generated.json and GraphQL types from
  docs/graphql/schema.graphql.
- Authentication redirects, OAuth endpoints, cookie writes, and raw upload bytes are transport operations,
  not business capabilities.
- A tree entry alone does not imply a Web page. Workspace schedules have no dedicated page; owned upload management has the explicit /workspace/uploads binding.
- Bot exposes deterministic commands for frequent, short interactions.
- CLI-local configuration and Bot-local AI/tool settings are client state and remain outside the server capability
  tree.
- Contract `required_scopes` are checked against the OAuth registry and native MCP equivalents by `graphql-contract-parity.test.ts`.
- Locale is a presentation preference, not content identity.
- Domain records prefer locale-neutral values with presentation localized at the edge.
- Bot discovery, client annotation display, durable mutation confirmation, uncertain-write recovery and shared-conversation
  isolation are client-owned contracts. Their implementation and native acceptance evidence belong in the Bot
  repository; server token audience, feature scopes and ownership remain enforced here.

- Anonymous GraphQL root access has one canonical obligation, graphql.anonymous-roots; its real HTTP acceptance covers null account/workspace roots and readable catalog/community roots.
- Governance exclusion is owned by graphql.registered-operation-coverage for the executable GraphQL schema and mcp.personal-workspace-focus for the complete MCP tool inventory.
- Cross-surface conformance is split into the atomic semantic-parity requirements below this policy; the former umbrella statement did not define an independent testable obligation.
- Anonymous GraphQL catalog/community access is owned by graphql.anonymous-roots. MCP public access and authorization are owned by mcp.public-catalog-access, mcp.resource-bound-access-token and mcp.complete-batch-scope-enforcement; these transports intentionally have separate authentication contracts.
- Administration uses declared Web and session-only REST bindings (admin.admin-rest-session-only and openapi.session-and-bearer). GraphQL and MCP governance exclusion belong to graphql.registered-operation-coverage and mcp.personal-workspace-focus. CLI does not expose session-only governance commands; cli.admin-session-boundary is verified in the CLI repository.
