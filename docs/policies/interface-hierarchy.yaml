topics:
- id: interface-hierarchy
  title: Interface Hierarchy
- id: canonical-tree
  title: Canonical Tree
- id: surface-mapping
  title: Surface Mapping
- id: canonical-actions
  title: Canonical Actions
- id: representative-cross-surface-contract
  title: Representative Cross-Surface Contract
- id: transport-specific-exceptions
  title: Transport-Specific Exceptions
- id: semantic-parity
