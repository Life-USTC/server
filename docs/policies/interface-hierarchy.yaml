kind: policy
id: interface-hierarchy
title: Canonical capabilities and surface parity
requirements:
- id: interface-hierarchy.canonical-tree-2
  category: consistency
  topic: canonical-tree
  rule: Canonical product Web and business REST route segments, capability IDs, GraphQL business fields and MCP tools do not use me, viewer, my, own, or dashboard as hierarchy names. This rule does not rename
    third-party protocol fields, private internal hydration routes or internal helper variables. CLI command naming is verified in its own repository.
  acceptance:
    given: The complete product route tree, executable GraphQL business fields, MCP scope registry and persisted-operation registry.
    when: Inspect published hierarchy segments and operation identifiers.
    then:
    - No published product hierarchy uses me, viewer, my, own or dashboard as a segment.
    - Dynamic parameters and internal-only hydration paths remain implementation details.
    test:
      file: tests/unit/policies/interface-hierarchy.test.ts
      name: interface-hierarchy.canonical-tree-2
- id: interface-hierarchy.surface-mapping-1
  category: consistency
  topic: surface-mapping
  rule: GraphQL business queries are organized below Query.catalog, Query.workspace, Query.community, and Query.account
    rather than underscore-encoded RPC query fields.
  acceptance:
    given: The executable GraphQL schema and the canonical business scopes declared by this policy.
    when: The test enumerates Query fields and the fields exposed by each scope object.
    then:
    - Query contains exactly account, catalog, community, and workspace objects.
    - Each scope exposes business fields without underscore-encoded RPC names.
    test:
      file: tests/unit/policies/interface-hierarchy.test.ts
      name: interface-hierarchy.surface-mapping-1
- id: interface-hierarchy.surface-mapping-2
  category: consistency
  topic: surface-mapping
  rule: Business mutation fields are defined directly on GraphQL Mutation, not beneath nested query or mutation
    objects.
  acceptance:
    given: The executable GraphQL schema and every compiled registered mutation document.
    when: The test compares every mutation document root with Mutation fields and traverses every Query-reachable object type.
    then:
    - Every business mutation is selected directly below Mutation and has a matching executable root field.
    - No Query-reachable object exposes a Mutation root field or nests the Mutation object.
    test:
      file: tests/unit/policies/interface-hierarchy.test.ts
      name: interface-hierarchy.surface-mapping-2
- id: interface-hierarchy.surface-mapping-3
  category: consistency
  topic: surface-mapping
  rule: A mutation's capability ID still contains its full scope.
  acceptance:
    given: The mutation capability document, executable persisted operations and MCP scope registry.
    when: Resolve every mutation binding to its compiled operation and native or registered MCP entry.
    then:
    - Each mutation capability and its registered operation retain the same canonical scope.
    - A generic GraphQL runner points to a scoped registered operation rather than defining an unscoped business capability.
    test:
      file: tests/unit/policies/interface-hierarchy.test.ts
      name: interface-hierarchy.surface-mapping-3
- id: interface-hierarchy.canonical-actions-1
  category: consistency
  topic: canonical-actions
  rule: Published capability action names do not use view, query, or by_id. Internal implementation helper
    names are outside this naming rule.
  acceptance:
    given: The actual MCP tool scope and GraphQL operation registries.
    when: Inspect the published action component of every identifier.
    then:
    - Published actions do not end in view, query or by_id.
    test:
      file: tests/unit/policies/interface-hierarchy.test.ts
      name: interface-hierarchy.canonical-actions-1
- id: interface-hierarchy.canonical-actions-3
  category: consistency
  topic: canonical-actions
  rule: 'Todo and comment record-deletion capabilities distinguish singular domains for single-item deletion from plural domains for batch deletion. Batch results and registered-runner support are explicit; collective state domains such as bus preferences do not imply batch semantics.'
  acceptance:
    given: Single and batch todo/comment deletion capabilities and compiled operation variable types.
    when: Compare domain names, cardinality, result semantics and MCP transport mode.
    then:
    - Singular record deletion accepts a single identifier; plural deletion accepts a collection and per-item results.
    - Native single-item calls and registered batch execution remain explicitly distinguished.
    test:
      file: tests/unit/policies/interface-hierarchy.test.ts
      name: interface-hierarchy.canonical-actions-3
- id: interface-hierarchy.canonical-actions-4
  category: consistency
  topic: canonical-actions
  rule: Each batch capability declares structured per-surface identifier types, raw input limits and duplicate handling, separately from result shape, transaction atomicity and safe retry behavior. The canonical mutation contract references the owning feature requirements.
  acceptance:
    given: The complete canonical mutation document, strict schema, executable operation registry and requirement IDs.
    when: Validate each batch contract and try removing typed contract fields or substituting an undefined duplicate policy.
    then:
    - Every batch declares identifiers, limits and duplicate handling for its supported batch surfaces.
    - Result shape, accepted-write atomicity and uncertain-result retry behavior are independent fields.
    - References resolve to actual requirements; missing or free-form substitutes fail schema validation.
    test:
      file: tests/unit/policies/batch-specification-contract.test.ts
      name: interface-hierarchy.canonical-actions-4
- id: interface-hierarchy.representative-cross-surface-contract-4
  category: consistency
  topic: representative-cross-surface-contract
  rule: GET /api/workspace/subscriptions/current permits a signed-in session or REST-audience OAuth with workspace.subscription:read. Only OAuth additionally granted workspace.calendar-feed:read receives the credential-bearing calendar URL; ordinary session reads and subscription-only tokens receive null URLs. The ICS retrieval endpoint is a separate capability.
  acceptance:
    given: Separate real session users and resource-bound OAuth tokens with different subscription and feed grants.
    when: Real HTTP requests read current subscriptions using sessions, missing scopes, complete scopes and the wrong resource audience.
    then:
    - Session and subscription-read callers see only their own memberships.
    - Only the token with both scopes at the REST audience receives the stored calendar credential and its separate feed URL.
    - Missing subscription scope, anonymous requests and a wrong audience return 401 without membership or credential data.
    test:
      file: tests/integration/rest-subscription-kind-contract.test.ts
      name: interface-hierarchy.representative-cross-surface-contract-4
- id: interface-hierarchy.representative-cross-surface-contract-6
  category: consistency
  topic: representative-cross-surface-contract
  rule: The complete personal calendar is available through the calendar-events capability. Its paginated results
    cover all eligible events within the requested Shanghai date bounds; the bounded overview is not an exhaustive
    calendar dataset.
  acceptance:
    given: An isolated subscriber has all five calendar event types plus enough todos to span eight pages, with out-of-range, undated and foreign-owner records.
    when: Real REST and GraphQL requests read every page of an explicit Shanghai date range, and an OAuth MCP client reads the same range in default and full modes.
    then:
    - All 130 eligible events appear exactly once in chronological order across all three transports.
    - Every page reports the full total and exact continuation state, while native MCP returns the complete range without sample truncation.
    - Out-of-range and undated tasks are excluded; a different owner sees only that owner's eligible events.
    test:
      file: tests/e2e/src/app/workspace/calendar/transport-completeness.test.ts
      name: interface-hierarchy.representative-cross-surface-contract-6
- id: interface-hierarchy.transport-specific-exceptions-3
  category: consistency
  topic: transport-specific-exceptions
  rule: Public academic and campus resource pages use /catalog/*. Public landing, community, news, search, guides, usage, policy and API-documentation pages keep their explicit public routes; account sign-in, OAuth and error pages retain their protocol roles. The public page inventory records these exceptions.
  acceptance:
    given: The actual page route tree, public page inventory and academic/campus feature Web bindings.
    when: Compare every catalog binding with a real route and check public exception and obsolete root inventories.
    then:
    - Academic and campus pages use /catalog; public utility and protocol pages retain their explicit roots, and obsolete unscoped catalog pages do not exist.
    test:
      file: tests/unit/policies/interface-hierarchy.test.ts
      name: interface-hierarchy.transport-specific-exceptions-3
- id: interface-hierarchy.transport-specific-exceptions-4
  category: consistency
  topic: transport-specific-exceptions
  rule: Personal campus-work pages use /workspace/*; account settings use /account/settings/* and governance
    pages use /admin/*. A capability without a Web binding does not create a corresponding page route.
  acceptance:
    given: The real page routes, workspace and settings navigation constants, governance inventory and feature Web bindings.
    when: Resolve every workspace/settings link and every declared protected Web binding against the actual route tree.
    then:
    - Workspace, account-settings and governance routes retain their correct namespaces; Web uploads exist while API-only schedules do not create a page.
    test:
      file: tests/unit/policies/interface-hierarchy.test.ts
      name: interface-hierarchy.transport-specific-exceptions-4
- id: interface-hierarchy.transport-specific-exceptions-11
  category: consistency
  topic: transport-specific-exceptions
  rule: MCP schema resources expose the exact current canonical GraphQL SDL and the registered-operation manifest without executable operation documents, user identifiers or credentials. Planning prompt guidance is owned by graphql.graphql-operation-prompt.
  acceptance:
    given: A real authenticated MCP client, canonical SDL snapshot and compiled public operation manifest.
    when: List and read the registered schema and operation resources.
    then:
    - Resource payloads exactly equal the canonical SDL and complete public manifest.
    - The manifest omits executable documents and both resources omit the authenticated user identifier.
    test:
      file: tests/integration/graphql-mcp-resources.test.ts
      name: interface-hierarchy.transport-specific-exceptions-11
- id: interface-hierarchy.semantic-parity-1
  category: consistency
  topic: semantic-parity
  rule: For equivalent authenticated subjects, every supported surface enforces the same business ownership
    and suspension rules. Anonymous availability, session requirements, token audience, and OAuth scopes follow
    the explicit per-surface authorization matrix.
- id: interface-hierarchy.semantic-parity-2
  category: consistency
  topic: semantic-parity
  rule: Identifiers and filters keep the same domain meaning across surfaces. Any difference in accepted identifier
    form or available filter is declared on the feature binding; a database row ID is never silently interpreted
    as a public JW ID.
- id: interface-hierarchy.semantic-parity-3
  category: consistency
  topic: semantic-parity
  rule: Each surface declares bounded pagination and default ordering. Equivalent explicit filter, ordering,
    and page inputs select equivalent records; intentionally different defaults are tested on their respective
    bindings.
- id: interface-hierarchy.semantic-parity-4
  category: consistency
  topic: semantic-parity
  rule: Every supported surface of a capability must agree on Asia/Shanghai date boundaries and output timezone.
- id: interface-hierarchy.semantic-parity-5
  category: consistency
  topic: semantic-parity
  rule: Corresponding single or batch mutation forms preserve declared atomicity, per-item results, and idempotency.
    Repeated single-item tool calls do not claim the atomicity of a batch operation.
- id: interface-hierarchy.semantic-parity-6
  category: consistency
  topic: semantic-parity
  rule: Equivalent failures preserve the same domain error meaning and ownership-hiding behavior. HTTP status,
    GraphQL errors, and MCP error encoding follow their transport-specific contracts.
- id: interface-hierarchy.semantic-parity-7
  category: consistency
  topic: semantic-parity
  rule: Each read capability declares its freshness boundary, and each mutation defines whether its returned
    data represents the committed state. Cached reads do not silently promise the same freshness as uncached
    projections.
- id: interface-hierarchy.semantic-parity-8
  category: consistency
  topic: semantic-parity
  rule: Destructive capabilities document effects and safe retry behavior. Human interfaces provide their declared
    confirmation flow; server authorization never depends on trusting a client confirmation flag.
- id: interface-hierarchy.semantic-parity-9
  category: consistency
  topic: semantic-parity
  rule: OAuth feature scopes use the complete canonical feature name, for example `community.comment:write`,
    `workspace.subscription:write`, and `workspace.upload:write`.
  acceptance:
    given: The canonical OAuth feature registry, compiled operations and complete MCP scope bindings.
    when: Inspect every declared business scope.
    then:
    - Business scopes use the complete catalog, workspace, community or account feature name and a read/write action.
    - GraphQL and MCP bindings reference registered scopes and never expose reserved admin scopes.
    test:
      file: tests/unit/policies/interface-hierarchy.test.ts
      name: interface-hierarchy.semantic-parity-9
- id: interface-hierarchy.semantic-parity-12
  category: consistency
  topic: semantic-parity
  rule: Public course/section lookups and subscription-kind updates use `jwId` at external boundaries.
- id: interface-hierarchy.semantic-parity-13
  category: consistency
  topic: semantic-parity
  rule: A subscription binding that accepts numeric section identifiers states whether they are public JW IDs
    or internal row IDs. Clients do not guess the identifier type from its value.
- id: interface-hierarchy.semantic-parity-15
  category: consistency
  topic: semantic-parity
  rule: GraphQL and native MCP subscription add/remove accept public section JW IDs. Code-based clients resolve
    section/course codes within an explicit semester before executing the corresponding subscription change.
- id: interface-hierarchy.locale-caching-and-seo-1
  category: consistency
  topic: locale-caching-and-seo
  rule: Canonical product URLs have no locale prefix or locale query segment.
- id: interface-hierarchy.locale-caching-and-seo-3
  category: consistency
  topic: locale-caching-and-seo
  rule: Shared public URLs use Chinese as their canonical indexable representation; English adapts presentation
    on the same URL without creating a second locale-prefixed document identity.
- id: interface-hierarchy.locale-caching-and-seo-5
  category: consistency
  topic: locale-caching-and-seo
  rule: A cached locale-varying public representation includes the resolved locale in its cache identity. Any
    localized response outside that explicit cache policy is private and no-store.
scopes:
- id: catalog
  owns: Public academic and transit facts
  excludes: User state or shared user-authored content
- id: workspace
  owns: The current user's todos, completion state, subscriptions, preferences, files, and derived schedule
    views
  excludes: Identity, authentication, or globally shared records
- id: community
  owns: Public user profiles and shared comments, descriptions, and section homework records
  excludes: Private account data or file ownership
- id: account
  owns: The current principal's profile, session, security, locale preferences, and authorizations
  excludes: Campus work or another user's public profile
- id: admin
  owns: Moderation, user governance, OAuth client governance, and managed source data
  excludes: Ordinary user workflows
terms:
- name: schedule
  meaning: A class meeting or schedule view composed from class meetings
- name: calendar
  meaning: A time-ordered aggregation of schedules, exams, homework, todos, and subscribed activities
- name: subscription
  meaning: The current user's relationship to a section
- name: calendar feed
  meaning: An iCalendar representation exported from workspace data
- name: community section homework
  meaning: A shared homework record attached to a section
- name: workspace homework
  meaning: The current user's view and completion state for shared homework
- name: catalog link
  meaning: A public link-directory record
- name: workspace link pin
  meaning: The current user's pin or preference state for a catalog link
- name: workspace upload
  meaning: A file owned by the current user
- name: community attachment
  meaning: Shared content's authorized reference to a workspace upload
surface_forms:
- surface: Capability ID
  form: <scope>_<domain>_<action>
  example: workspace_todo_create
- surface: Web
  form: /<scope>/…
  example: '/workspace/todos (signed-in tabs: overview, calendar, homeworks, todos, exams, subscriptions)'
- surface: REST
  form: /api/<scope>/<plural-resource>
  example: /api/workspace/todos
- surface: GraphQL query
  form: <scope>.<field>
  example: workspace.todos
- surface: GraphQL mutation
  form: <domain><Action>
  example: todoCreate
- surface: GraphQL operation ID
  form: <scope>.<domain>.<action>.v1
  example: workspace.todo.create.v1
- surface: MCP
  form: Capability ID verbatim
  example: workspace_todo_create
- surface: Bot
  form: <Chinese domain> <Chinese action>
  example: 待办 添加
- surface: Bot extension action
  form: life_ustc.<capability_id>
  example: life_ustc.workspace_todo_list
- surface: CLI
  form: <scope> <domain> <action>
  example: workspace todo create
actions:
- action: get
  meaning: Read one object by a unique identifier
- action: list
  meaning: Read a bounded, filterable collection
- action: search
  meaning: Perform keyword or fuzzy discovery
- action: preview
  meaning: Calculate a match or change without side effects
- action: create
  meaning: Create a new entity
- action: update
  meaning: Partially change entity attributes
- action: delete
  meaning: Delete an entity
- action: set
  meaning: Idempotently set a state or complete collection
- action: add / remove
  meaning: Change membership in a collection
- action: import / export
  meaning: Move data across a system or representation boundary
