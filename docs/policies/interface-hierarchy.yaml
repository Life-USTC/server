kind: policy
id: interface-hierarchy
title: Canonical capabilities and surface parity
requirements:
- id: interface-hierarchy.canonical-tree-2
  category: consistency
  topic: canonical-tree
  rule: Canonical product Web and business REST route segments, capability IDs, GraphQL business fields and MCP tools do not use me, viewer, my, own, or dashboard as hierarchy names. This rule does not rename
    third-party protocol fields, private internal hydration routes or internal helper variables. CLI command naming is verified in its own repository.
  acceptance:
    given: The complete product route tree, executable GraphQL business fields, MCP scope registry and persisted-operation registry.
    when: Inspect published hierarchy segments and operation identifiers.
    then:
    - No published product hierarchy uses me, viewer, my, own or dashboard as a segment.
    - Dynamic parameters and internal-only hydration paths remain implementation details.
    test:
      file: tests/unit/policies/interface-hierarchy.test.ts
      name: interface-hierarchy.canonical-tree-2
- id: interface-hierarchy.surface-mapping-1
  category: consistency
  topic: surface-mapping
  rule: GraphQL business queries are organized below Query.catalog, Query.workspace, Query.community, and Query.account
    rather than underscore-encoded RPC query fields.
  acceptance:
    given: The executable GraphQL schema and the canonical business scopes declared by this policy.
    when: The test enumerates Query fields and the fields exposed by each scope object.
    then:
    - Query contains exactly account, catalog, community, and workspace objects.
    - Each scope exposes business fields without underscore-encoded RPC names.
    test:
      file: tests/unit/policies/interface-hierarchy.test.ts
      name: interface-hierarchy.surface-mapping-1
- id: interface-hierarchy.surface-mapping-2
  category: consistency
  topic: surface-mapping
  rule: Business mutation fields are defined directly on GraphQL Mutation, not beneath nested query or mutation
    objects.
  acceptance:
    given: The executable GraphQL schema and every compiled registered mutation document.
    when: The test compares every mutation document root with Mutation fields and traverses every Query-reachable object type.
    then:
    - Every business mutation is selected directly below Mutation and has a matching executable root field.
    - No Query-reachable object exposes a Mutation root field or nests the Mutation object.
    test:
      file: tests/unit/policies/interface-hierarchy.test.ts
      name: interface-hierarchy.surface-mapping-2
- id: interface-hierarchy.surface-mapping-3
  category: consistency
  topic: surface-mapping
  rule: A mutation's capability ID still contains its full scope.
  acceptance:
    given: The mutation capability document, executable persisted operations and MCP scope registry.
    when: Resolve every mutation binding to its compiled operation and native or registered MCP entry.
    then:
    - Each mutation capability and its registered operation retain the same canonical scope.
    - A generic GraphQL runner points to a scoped registered operation rather than defining an unscoped business capability.
    test:
      file: tests/unit/policies/interface-hierarchy.test.ts
      name: interface-hierarchy.surface-mapping-3
- id: interface-hierarchy.canonical-actions-1
  category: consistency
  topic: canonical-actions
  rule: Published capability action names do not use view, query, or by_id. Internal implementation helper
    names are outside this naming rule.
  acceptance:
    given: The actual MCP tool scope and GraphQL operation registries.
    when: Inspect the published action component of every identifier.
    then:
    - Published actions do not end in view, query or by_id.
    test:
      file: tests/unit/policies/interface-hierarchy.test.ts
      name: interface-hierarchy.canonical-actions-1
- id: interface-hierarchy.canonical-actions-3
  category: consistency
  topic: canonical-actions
  rule: 'Todo and comment record-deletion capabilities distinguish singular domains for single-item deletion from plural domains for batch deletion. Batch results and registered-runner support are explicit; collective state domains such as bus preferences do not imply batch semantics.'
  acceptance:
    given: Single and batch todo/comment deletion capabilities and compiled operation variable types.
    when: Compare domain names, cardinality, result semantics and MCP transport mode.
    then:
    - Singular record deletion accepts a single identifier; plural deletion accepts a collection and per-item results.
    - Native single-item calls and registered batch execution remain explicitly distinguished.
    test:
      file: tests/unit/policies/interface-hierarchy.test.ts
      name: interface-hierarchy.canonical-actions-3
- id: interface-hierarchy.canonical-actions-4
  category: consistency
  topic: canonical-actions
  rule: Each batch capability declares structured per-surface identifier types, raw input limits and duplicate handling, separately from result shape, transaction atomicity and safe retry behavior. The canonical mutation contract references the owning feature requirements.
  acceptance:
    given: The complete canonical mutation document, strict schema, executable operation registry and requirement IDs.
    when: Validate each batch contract and try removing typed contract fields or substituting an undefined duplicate policy.
    then:
    - Every batch declares identifiers, limits and duplicate handling for its supported batch surfaces.
    - Result shape, accepted-write atomicity and uncertain-result retry behavior are independent fields.
    - References resolve to actual requirements; missing or free-form substitutes fail schema validation.
    test:
      file: tests/unit/policies/batch-specification-contract.test.ts
      name: interface-hierarchy.canonical-actions-4
- id: interface-hierarchy.representative-cross-surface-contract-4
  category: consistency
  topic: representative-cross-surface-contract
  rule: GET /api/workspace/subscriptions/current permits a signed-in session or REST-audience OAuth with workspace.subscription:read. Only OAuth additionally granted workspace.calendar-feed:read receives the credential-bearing calendar URL; ordinary session reads and subscription-only tokens receive null URLs. The ICS retrieval endpoint is a separate capability.
  acceptance:
    given: Separate real session users and resource-bound OAuth tokens with different subscription and feed grants.
    when: Real HTTP requests read current subscriptions using sessions, missing scopes, complete scopes and the wrong resource audience.
    then:
    - Session and subscription-read callers see only their own memberships.
    - Only the token with both scopes at the REST audience receives the stored calendar credential and its separate feed URL.
    - Missing subscription scope, anonymous requests and a wrong audience return 401 without membership or credential data.
    test:
      file: tests/integration/rest-subscription-kind-contract.test.ts
      name: interface-hierarchy.representative-cross-surface-contract-4
- id: interface-hierarchy.representative-cross-surface-contract-6
  category: consistency
  topic: representative-cross-surface-contract
  rule: The complete personal calendar is available through the calendar-events capability. Its paginated results
    cover all eligible events within the requested Shanghai date bounds; the bounded overview is not an exhaustive
    calendar dataset.
  acceptance:
    given: An isolated subscriber has all five calendar event types plus enough todos to span eight pages, with out-of-range, undated and foreign-owner records.
    when: Real REST and GraphQL requests read every page of an explicit Shanghai date range, and an OAuth MCP client reads the same range in default and full modes.
    then:
    - All 130 eligible events appear exactly once in chronological order across all three transports.
    - Every page reports the full total and exact continuation state, while native MCP returns the complete range without sample truncation.
    - Out-of-range and undated tasks are excluded; a different owner sees only that owner's eligible events.
    test:
      file: tests/e2e/src/app/workspace/calendar/transport-completeness.test.ts
      name: interface-hierarchy.representative-cross-surface-contract-6
- id: interface-hierarchy.transport-specific-exceptions-3
  category: consistency
  topic: transport-specific-exceptions
  rule: Public academic and campus resource pages use /catalog/*. Public landing, community, news, search, guides, usage, policy and API-documentation pages keep their explicit public routes; account sign-in, OAuth and error pages retain their protocol roles. The public page inventory records these exceptions.
  acceptance:
    given: The actual page route tree, public page inventory and academic/campus feature Web bindings.
    when: Compare every catalog binding with a real route and check public exception and obsolete root inventories.
    then:
    - Academic and campus pages use /catalog; public utility and protocol pages retain their explicit roots, and obsolete unscoped catalog pages do not exist.
    test:
      file: tests/unit/policies/interface-hierarchy.test.ts
      name: interface-hierarchy.transport-specific-exceptions-3
- id: interface-hierarchy.transport-specific-exceptions-4
  category: consistency
  topic: transport-specific-exceptions
  rule: Personal campus-work pages use /workspace/*; account settings use /account/settings/* and governance
    pages use /admin/*. A capability without a Web binding does not create a corresponding page route.
  acceptance:
    given: The real page routes, workspace and settings navigation constants, governance inventory and feature Web bindings.
    when: Resolve every workspace/settings link and every declared protected Web binding against the actual route tree.
    then:
    - Workspace, account-settings and governance routes retain their correct namespaces; Web uploads exist while API-only schedules do not create a page.
    test:
      file: tests/unit/policies/interface-hierarchy.test.ts
      name: interface-hierarchy.transport-specific-exceptions-4
- id: interface-hierarchy.transport-specific-exceptions-11
  category: consistency
  topic: transport-specific-exceptions
  rule: MCP schema resources expose the exact current canonical GraphQL SDL and the registered-operation manifest without executable operation documents, user identifiers or credentials. Planning prompt guidance is owned by graphql.graphql-operation-prompt.
  acceptance:
    given: A real authenticated MCP client, canonical SDL snapshot and compiled public operation manifest.
    when: List and read the registered schema and operation resources.
    then:
    - Resource payloads exactly equal the canonical SDL and complete public manifest.
    - The manifest omits executable documents and both resources omit the authenticated user identifier.
    test:
      file: tests/integration/graphql-mcp-resources.test.ts
      name: interface-hierarchy.transport-specific-exceptions-11
- id: interface-hierarchy.semantic-parity-1
  category: consistency
  topic: semantic-parity
  rule: For equivalent authenticated subjects, every supported surface enforces the same business ownership
    and suspension rules. Anonymous availability, session requirements, token audience, and OAuth scopes follow
    the explicit per-surface authorization matrix.
- id: interface-hierarchy.semantic-parity-2
  category: consistency
  topic: semantic-parity
  rule: Identifiers and filters keep the same domain meaning across surfaces. Any difference in accepted identifier
    form or available filter is declared on the feature binding; a database row ID is never silently interpreted
    as a public JW ID.
- id: interface-hierarchy.semantic-parity-3
  category: consistency
  topic: semantic-parity
  rule: Each surface declares bounded pagination and default ordering. Equivalent explicit filter, ordering,
    and page inputs select equivalent records; intentionally different defaults are tested on their respective
    bindings.
- id: interface-hierarchy.catalog-explicit-read-parity
  category: consistency
  topic: semantic-parity
  rule: Course, section and teacher discovery through REST, GraphQL and MCP selects the same ordered
    identities and total for equivalent explicit common filters and page bounds. REST pageSize, GraphQL
    PageInput.pageSize and MCP limit express the same requested page size. Course/section detail keys
    are upstream JW IDs; teacher detail keys are database IDs. Only declared shared filters and ordering
    controls participate in this equivalence; transport-specific inputs and defaults remain explicit.
  acceptance:
    given: The same isolated catalog contains distinct row/JW IDs, multiple courses, sections, teachers and filter relationships.
    when: Actual REST, GraphQL and MCP reads apply equivalent explicit common filters, pages and supported Section search ordering.
    then:
    - All three transports return the same ordered IDs and matching total on every page, including empty results and reverse-inserted rows with tied primary sort keys.
    - Equivalent detail keys resolve the same entity; row IDs are never silently substituted for course or section JW IDs.
    test:
      file: tests/integration/catalog-semantic-parity.test.ts
      name: interface-hierarchy.catalog-explicit-read-parity
- id: interface-hierarchy.workspace-explicit-read-parity
  category: consistency
  topic: semantic-parity
  rule: Workspace todo, homework, schedule and exam reads select the same ordered identities for
    the same owner and equivalent supported filters across REST, GraphQL and native MCP. Paginated
    bindings return the corresponding slice and total; prefix-limited bindings return that prefix.
    Shared homework retains each owner's own completion state. Unsupported filters and pagination
    controls do not become implicit transport capabilities.
  rationale: Todo REST and MCP and schedule REST and MCP use prefix limits; homework and exam REST
    and all four GraphQL collections use pages. Native MCP collections use prefix limits. Todo
    priority and due bounds are shared only by REST and GraphQL; homework completion and semester
    filters and schedule semester filters are shared only by GraphQL and MCP. The native todo MCP
    includeCompleted flag maps to all versus incomplete records, not a completed-only filter.
  acceptance:
    given: Three isolated owners, resource-bound OAuth credentials, a restricted database role,
      overlapping and distinct subscriptions, differing homework completion and an empty workspace.
    when: Real loopback REST, GraphQL and MCP HTTP requests read each collection with supported
      common filters, two-item pages or limits and a limit large enough for the complete fixture.
    then:
    - Ordered identities equal the independently arranged fixture for each owner and filter, including reverse-inserted rows with tied primary sort keys.
    - Paginated bindings report exact totals and an empty page after the end; prefix bindings return the requested prefix.
    - Shared homework completion remains owner-specific and the empty owner receives no records.
    test:
      file: tests/integration/workspace-semantic-parity.test.ts
      name: interface-hierarchy.workspace-explicit-read-parity
- id: interface-hierarchy.public-schedule-read-parity
  category: consistency
  topic: semantic-parity
  rule: Public REST and native MCP schedule discovery interpret shared section, teacher, room, weekday
    and date filters identically and return the same date/start-time/row-ID ordered pages and totals.
    Section-specific schedule reads use the external section JW ID and return the same requested prefix.
  rationale: Numeric database IDs and public JW IDs remain distinct inputs; simultaneous selectors constrain
    the same record. Section-specific reads expose a limit rather than paginated metadata.
  acceptance:
    given: An isolated catalog has separate row/JW IDs, teachers, rooms and schedules inserted in reverse
      row-ID order with tied dates/start times, accessed through the restricted application database role.
    when: Real anonymous loopback REST and MCP HTTP requests combine shared filters, exhaust two-item
      pages, submit conflicting selectors and read section-JW-specific date ranges with explicit limits.
    then:
    - Both transports select exactly the expected ordered rows and totals, including empty/exhausted pages.
    - Conflicting identifiers and row/JW substitutions select no rows; tied sort keys use ascending row IDs.
    - Section-specific results retain the selected section JW identity and requested ordered prefix.
    test:
      file: tests/integration/schedule-subscription-semantic-parity.test.ts
      name: interface-hierarchy.public-schedule-read-parity
- id: interface-hierarchy.subscription-read-parity
  category: consistency
  topic: semantic-parity
  rule: REST current-subscription and native MCP subscription-list reads return the complete owning user's
    cross-semester section membership, including retired sections and each membership kind. GraphQL
    subscribedSections pages select slices of that same sequence ordered by descending semester JW ID,
    ascending section code and ascending unique section JW ID.
  rationale: REST and MCP expose the complete set without page inputs; GraphQL declares page bounds and totals.
    Current in the REST route names the user's current membership, not only the current semester.
  acceptance:
    given: Three isolated owners have distinct or empty membership, multiple semesters, retired records and
      reverse-inserted sections with tied semester/code values, plus audience-bound OAuth credentials.
    when: Real loopback REST, GraphQL and MCP HTTP reads use the restricted application database role;
      REST also receives a forged userId selector and GraphQL exhausts two-item pages.
    then:
    - Every owner receives exactly their ordered section IDs, JW IDs and membership kinds across transports.
    - GraphQL totals and exhausted pages match the complete REST/MCP sequence, including same-key boundaries.
    - The empty owner receives no records and forged query identity cannot select another user's membership.
    test:
      file: tests/integration/schedule-subscription-semantic-parity.test.ts
      name: interface-hierarchy.subscription-read-parity
- id: interface-hierarchy.public-profile-read-parity
  category: consistency
  topic: semantic-parity
  rule: Public profile identifiers resolve a case-insensitive username or exact user ID after trimming.
    REST and full MCP expose the same public profile and contribution hierarchy; GraphQL intentionally
    exposes only public identity. No projection exposes email or admin status.
  acceptance:
    given: An isolated administrator has a distinct public username, UUID, avatar and millisecond creation timestamp.
    when: REST and Yoga handlers and the registered native MCP tool resolve username, uppercase username,
      surrounding whitespace, exact ID and a missing identifier against the same database.
    then:
    - Found profiles share exact public identity and creation instant; REST and full MCP payloads match including zero contributions and the heatmap.
    - GraphQL returns only its five declared identity fields, private fields are absent, and missing identities retain each transport's not-found representation.
    test:
      file: tests/integration/profile-link-read-parity.test.ts
      name: interface-hierarchy.public-profile-read-parity
- id: interface-hierarchy.link-pin-read-parity
  category: consistency
  topic: semantic-parity
  rule: REST and MCP link-pin lists and the Web read model return only the current owner's pins in
    creation-time ascending order with slug ascending for ties. Mutation results and oldest-pin overflow
    use that same order. GraphQL has no link-pin collection read.
  acceptance:
    given: Three isolated owners include reverse-inserted pins with equal timestamps, distinct pins and no pins.
    when: Real session-authenticated REST reads, registered MCP tools with synthetic scoped AuthInfo,
      and bilingual Web read models load each owner's pins, then pin and unpin change the first owner's collection.
    then:
    - All readers preserve the exact independent order and empty state, ignore a foreign userId query and report the four-pin bound.
    - The Web overview starts with that owner's ordered pins and overflow removes the deterministically oldest pin.
    test:
      file: tests/integration/profile-link-read-parity.test.ts
      name: interface-hierarchy.link-pin-read-parity
- id: interface-hierarchy.overview-read-parity
  category: consistency
  topic: semantic-parity
  rule: All overview transports preserve authenticated-owner counts for the same explicit instant and
    default seven-day lookahead. GraphQL is counts-only and accepts only atTime. REST and MCP additionally
    preserve ordered samples and complete counts across supported limit and window inputs; compact and
    full projections retain the same identifiers and operational facts.
  acceptance:
    given: Three isolated owners include an empty workspace, tied deadlines, completed and deleted work,
      multiple schedules and exams, and records exactly on millisecond window boundaries.
    when: Signed REST and GraphQL handlers and registered native MCP tools read the same anchor instant,
      then REST and MCP vary sample limits, lookahead windows and projections.
    then:
    - All three return the exact owner counts and default seven-day window; GraphQL preserves anchor milliseconds.
    - REST and MCP return the independently expected ordered samples and equal full sample DTOs without truncating counts.
    - One-millisecond boundary shifts, empty owners and a foreign userId query preserve the declared inclusion and ownership rules.
    test:
      file: tests/integration/mcp/workspace/overview-transport-contract.test.ts
      name: interface-hierarchy.overview-read-parity
- id: interface-hierarchy.young-public-read-parity
  category: consistency
  topic: semantic-parity
  rule: Public Young event and organizer REST, GraphQL and native MCP reads select equivalent ordered
    identities and complete page totals for the same supported filters. Event filters distinguish source-active
    membership from signup-open state and preserve activity versus registration date semantics, including unknown dates.
  rationale: Events use active/start-date/unique-ID ordering by default and ascending selected time/ID for
    date ranges. Organizer APIs use name/ID ordering; Web active-first grouping is a separate declared presentation.
  acceptance:
    given: An isolated database has events and organizers inserted in reverse order under tied sort keys,
      independent source-active flags, both time bases and missing dates, accessed by the restricted app role.
    when: Real REST handlers, the actual Yoga request handler and native MCP JSON-RPC handlers combine
      category, module, level, search, organizer, date and unknown-date filters and exhaust two-item pages.
    then:
    - Single-character taxonomy values select the same rows on all surfaces; combinations and mismatched IDs retain exact meaning.
    - Ordered IDs, complete totals, unknownDateCount and exhausted empty pages match the independently arranged fixture.
    - Both date bases retain Shanghai overlap boundaries and missing-date records without guessing times.
    test:
      file: tests/integration/young-public-semantic-parity.test.ts
      name: interface-hierarchy.young-public-read-parity
- id: interface-hierarchy.semantic-parity-4
  category: consistency
  topic: semantic-parity
  rule: REST, GraphQL and native MCP personal-calendar ranges interpret date-only and timezone-less bounds
    in Asia/Shanghai and explicit-offset bounds as their represented instants. Equivalent bounds include the
    same events at both inclusive endpoints and exclude events one millisecond outside. Timestamp strings
    include an offset and represent equal instants; their literal offset spelling need not be identical.
  rationale: This requirement owns cross-transport calendar boundary equivalence across all five event kinds.
    Domain-specific time rules remain owned by semester.current-semester-by-rules, exam.completion-time-zone,
    exam.rest-date-semester-filters, graphql.calendar-date-filter-normalization, young-event.shanghai-local-times,
    young-event.date-range-overlap, bus.shanghai-time-interpretation, bus.weekday-by-shanghai-time,
    weather.location-provider-mapping and ical.rfc5545-dtstamp-utc. UTC and +08:00 are equivalent timestamp
    encodings, so enforcing the same textual offset across every protocol would add no user-visible correctness.
  acceptance:
    given: An isolated owner has schedule, exam, homework, todo and activity events plus todos exactly at and one millisecond outside the Shanghai window boundaries.
    when: Real REST, GraphQL and MCP default/full requests read equivalent date-only, Shanghai-local, explicit +08:00 and UTC windows.
    then:
    - All transports return the same seven events and exact start/end instants with explicit timestamp offsets.
    - Both endpoints are inclusive and the two outside records are absent.
    test:
      file: tests/e2e/src/app/workspace/calendar/time-boundaries.test.ts
      name: interface-hierarchy.semantic-parity-4
- id: interface-hierarchy.semantic-parity-6
  category: consistency
  topic: semantic-parity
  rule: Equivalent failures preserve the same domain error meaning and ownership-hiding behavior. HTTP status,
    GraphQL errors, and MCP error encoding follow their transport-specific contracts.
- id: interface-hierarchy.private-delete-error-parity
  category: authorization
  topic: semantic-parity
  rule: Deleting a missing todo or upload and deleting another owner's private todo or upload are indistinguishable on each transport. REST and GraphQL return 404, GraphQL uses NOT_FOUND, and MCP returns success=false with not_found. Denied requests do not alter the foreign record.
  acceptance:
    given: Two isolated owners have a private todo and upload; the caller has valid audience-bound write credentials and the rate-limit boundary admits requests.
    when: Real REST, GraphQL and MCP requests attempt deletion of both foreign and nonexistent IDs.
    then:
    - Foreign and missing responses have equal public error payloads within each transport and reveal no foreign owner identity.
    - The exact stored foreign rows remain unchanged.
    test:
      file: tests/integration/mutation-error-parity.test.ts
      name: interface-hierarchy.private-delete-error-parity
- id: interface-hierarchy.shared-delete-error-parity
  category: authorization
  topic: semantic-parity
  rule: Ordinary deletion of another author's visible comment or section homework returns a permission failure, while a missing target returns not_found. An author cannot delete a locked comment. REST and GraphQL encode permission failures as 403 (GraphQL FORBIDDEN); MCP distinguishes forbidden and locked. Rejections leave records unchanged.
  acceptance:
    given: An authenticated author, another author, visible shared content and an owned deleted comment exist; valid audience-bound tokens reach the actual services.
    when: Real REST, GraphQL and MCP delete requests target foreign shared records, nonexistent records and the owned locked comment.
    then:
    - Missing records return 404/NOT_FOUND/not_found; foreign shared records return 403/FORBIDDEN/forbidden.
    - The owned locked comment returns 403/FORBIDDEN/locked, and every rejected target remains unchanged.
    test:
      file: tests/integration/mutation-error-parity.test.ts
      name: interface-hierarchy.shared-delete-error-parity
- id: interface-hierarchy.suspended-delete-error-parity
  category: authorization
  topic: semantic-parity
  rule: An actively suspended owner cannot delete comments, section homework or uploads. REST and GraphQL return 403, GraphQL uses FORBIDDEN and MCP returns success=false with suspended. The original record remains committed unchanged.
  acceptance:
    given: An isolated owner has a comment, homework and upload, valid audience-bound write tokens and an active suspension; rate limiting admits the requests.
    when: Real REST, GraphQL and MCP requests attempt each owned deletion.
    then:
    - Every transport rejects the currently suspended actor with its declared permission encoding.
    - All three complete stored records remain unchanged.
    test:
      file: tests/integration/mutation-error-parity.test.ts
      name: interface-hierarchy.suspended-delete-error-parity
- id: interface-hierarchy.semantic-parity-7
  category: consistency
  topic: semantic-parity
  rule: Each read capability declares its freshness boundary, and each mutation defines whether its returned
    data represents the committed state. Cached reads do not silently promise the same freshness as uncached
    projections.
- id: interface-hierarchy.semantic-parity-8
  category: consistency
  topic: semantic-parity
  rule: Destructive capabilities document effects and safe retry behavior. Human interfaces provide their declared
    confirmation flow; server authorization never depends on trusting a client confirmation flag.
- id: interface-hierarchy.semantic-parity-9
  category: consistency
  topic: semantic-parity
  rule: OAuth feature scopes use the complete canonical feature name, for example `community.comment:write`,
    `workspace.subscription:write`, and `workspace.upload:write`.
  acceptance:
    given: The canonical OAuth feature registry, compiled operations and complete MCP scope bindings.
    when: Inspect every declared business scope.
    then:
    - Business scopes use the complete catalog, workspace, community or account feature name and a read/write action.
    - GraphQL and MCP bindings reference registered scopes and never expose reserved admin scopes.
    test:
      file: tests/unit/policies/interface-hierarchy.test.ts
      name: interface-hierarchy.semantic-parity-9
- id: interface-hierarchy.semantic-parity-12
  category: consistency
  topic: semantic-parity
  rule: Public course/section lookups and subscription-kind updates use `jwId` at external boundaries.
  acceptance:
    given: Two isolated courses and sections have crossed row IDs and public JW IDs, and one user subscribes to both sections.
    when: Real REST, GraphQL and native MCP read each record and update one subscription kind using the public ID.
    then:
    - Each lookup returns the record whose JW ID matches, even when another record has that numeric row ID.
    - Each kind update changes only the section selected by its public JW ID.
    test:
      file: tests/integration/rest-subscription-kind-contract.test.ts
      name: interface-hierarchy.semantic-parity-12
- id: interface-hierarchy.semantic-parity-13
  category: consistency
  topic: semantic-parity
  rule: Subscription bindings declare every numeric identifier input in identifier_inputs using its exact
    model field, including section row IDs, section JW IDs and semester row IDs. Nested GraphQL inputs use dotted paths.
  acceptance:
    given: The subscription specification, generated REST schemas, executable GraphQL schema and real MCP tool registry.
    when: Inspect the numeric identifier inputs of every supported subscription operation.
    then:
    - Every input has one unambiguous structured model-field declaration matching its actual wire name.
    - REST row-ID collection operations remain distinct from JW-ID single-section operations; semester selectors use Semester.id.
    test:
      file: tests/unit/contracts/subscription-identifier-bindings.test.ts
      name: interface-hierarchy.semantic-parity-13
- id: interface-hierarchy.semantic-parity-15
  category: consistency
  topic: semantic-parity
  rule: GraphQL and native MCP single-section subscription add/remove resolve only public section JW IDs.
    An equal-valued internal row ID of another section cannot redirect the membership change.
  acceptance:
    given: Two isolated sections have crossed internal row IDs and public JW IDs; the owner already subscribes to the witness section.
    when: Actual GraphQL HTTP and native MCP add then remove the target using its JW ID.
    then:
    - Only the target membership changes; the complete witness membership, including its kind and timestamps, stays unchanged.
    test:
      file: tests/integration/rest-subscription-kind-contract.test.ts
      name: interface-hierarchy.semantic-parity-15
- id: interface-hierarchy.locale-caching-and-seo-1
  category: consistency
  topic: locale-caching-and-seo
  rule: Canonical product Web URLs have no locale prefix or locale query segment. Explicit REST locale parameters are request inputs, not separate Web document identities.
  acceptance:
    given: The actual Web page route tree, complete concrete page inventory and production social metadata builder.
    when: Inspect locale route segments and generate canonical metadata for each page in every supported locale with locale and tracking queries.
    then:
    - All locales retain the same path identity and canonical metadata strips locale, tracking and fragment state.
    test:
      file: tests/unit/policies/interface-hierarchy.test.ts
      name: interface-hierarchy.locale-caching-and-seo-1
- id: interface-hierarchy.locale-caching-and-seo-3
  category: consistency
  topic: locale-caching-and-seo
  rule: Shared public URLs use Chinese as their canonical indexable representation; English adapts presentation
    on the same URL without creating a second locale-prefixed document identity.
  acceptance:
    given: Anonymous real course, section and teacher collection pages without a locale preference.
    when: Read their default SSR HTML, then switch to Chinese and English and compare full raw social metadata on the same URLs.
    then:
    - Default HTML is Chinese and indexable; translated presentation retains the identical canonical URL without locale-prefixed alternatives.
    test:
      file: tests/e2e/src/app/courses/social-metadata.test.ts
      name: interface-hierarchy.locale-caching-and-seo-3
- id: interface-hierarchy.locale-caching-and-seo-5
  category: consistency
  topic: locale-caching-and-seo
  rule: The internal shared public HTML entrypoint includes the resolved locale in its cache identity. Equivalent locale choices share a key regardless of preference source; Chinese and English representations never share one key.
  acceptance:
    given: Real Worker requests target public catalog list, detail and activity pages with default, language-header and cookie locale preferences.
    when: The Worker dispatches them to its cached public HTML entrypoint.
    then:
    - Each forwarded cache key contains the resolved locale and representation mode.
    - Equivalent cookie and language-header choices share a key while different locales use disjoint keys.
    test:
      file: tests/unit/lib/misc/worker-routing-entrypoint.test.ts
      name: interface-hierarchy.locale-caching-and-seo-5
scopes:
- id: catalog
  owns: Public academic and transit facts
  excludes: User state or shared user-authored content
- id: workspace
  owns: The current user's todos, completion state, subscriptions, preferences, files, and derived schedule
    views
  excludes: Identity, authentication, or globally shared records
- id: community
  owns: Public user profiles and shared comments, descriptions, and section homework records
  excludes: Private account data or file ownership
- id: account
  owns: The current principal's profile, session, security, locale preferences, and authorizations
  excludes: Campus work or another user's public profile
- id: admin
  owns: Moderation, user governance, OAuth client governance, and managed source data
  excludes: Ordinary user workflows
terms:
- name: schedule
  meaning: A class meeting or schedule view composed from class meetings
- name: calendar
  meaning: A time-ordered aggregation of schedules, exams, homework, todos, and subscribed activities
- name: subscription
  meaning: The current user's relationship to a section
- name: calendar feed
  meaning: An iCalendar representation exported from workspace data
- name: community section homework
  meaning: A shared homework record attached to a section
- name: workspace homework
  meaning: The current user's view and completion state for shared homework
- name: catalog link
  meaning: A public link-directory record
- name: workspace link pin
  meaning: The current user's pin or preference state for a catalog link
- name: workspace upload
  meaning: A file owned by the current user
- name: community attachment
  meaning: Shared content's authorized reference to a workspace upload
surface_forms:
- surface: Capability ID
  form: <scope>_<domain>_<action>
  example: workspace_todo_create
- surface: Web
  form: /<scope>/…
  example: '/workspace/todos (signed-in tabs: overview, calendar, homeworks, todos, exams, subscriptions)'
- surface: REST
  form: /api/<scope>/<plural-resource>
  example: /api/workspace/todos
- surface: GraphQL query
  form: <scope>.<field>
  example: workspace.todos
- surface: GraphQL mutation
  form: <domain><Action>
  example: todoCreate
- surface: GraphQL operation ID
  form: <scope>.<domain>.<action>.v1
  example: workspace.todo.create.v1
- surface: MCP
  form: Capability ID verbatim
  example: workspace_todo_create
- surface: Bot
  form: <Chinese domain> <Chinese action>
  example: 待办 添加
- surface: Bot extension action
  form: life_ustc.<capability_id>
  example: life_ustc.workspace_todo_list
- surface: CLI
  form: <scope> <domain> <action>
  example: workspace todo create
actions:
- action: get
  meaning: Read one object by a unique identifier
- action: list
  meaning: Read a bounded, filterable collection
- action: search
  meaning: Perform keyword or fuzzy discovery
- action: preview
  meaning: Calculate a match or change without side effects
- action: create
  meaning: Create a new entity
- action: update
  meaning: Partially change entity attributes
- action: delete
  meaning: Delete an entity
- action: set
  meaning: Idempotently set a state or complete collection
- action: add / remove
  meaning: Change membership in a collection
- action: import / export
  meaning: Move data across a system or representation boundary
