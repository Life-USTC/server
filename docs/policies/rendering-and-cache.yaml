kind: policy
id: rendering-and-cache
title: Public rendering, viewer overlays, and cache invalidation
requirements:
- id: rendering-and-cache.web-rendering-and-cache-1
  category: consistency
  topic: web-rendering-and-cache
  rule: Shared public course, section, and teacher HTML and page-data payloads contain only viewer-independent
    public facts and anonymous viewer identity. Locale can select a separate public representation; authenticated
    identity, permissions, and personal state cannot affect the shared payload.
  acceptance:
    given: Two isolated session viewers have distinct private identities, tasks and subscriptions; public
      course, section and teacher lists and details are available in Chinese and English.
    when: Anonymous and both authenticated clients request actual HTML and decoded SvelteKit page-data;
      one viewer navigates from the workspace through a catalog list to a detail page.
    then:
    - Public HTML and page-data contain neither viewer's identity or private navigation state; description,
      homework and section projections retain anonymous permissions and subscription state.
    - Page-data explicitly resolves the viewer through the private client shell, and client navigation
      preserves the current authenticated shell without embedding it in public data.
    test:
      file: tests/e2e/src/app/cache-policy/shell-projection.test.ts
      name: rendering-and-cache.web-rendering-and-cache-1
- id: rendering-and-cache.web-rendering-and-cache-2
  category: consistency
  topic: web-rendering-and-cache
  rule: For the same catalog URL and locale admitted to shared public rendering for both anonymous and session
    visitors, their HTML has equivalent public content and DOM relationships after excluding request nonce
    and request ID. Generated accessibility IDs may be renamed bijectively with their references; other
    text and attributes remain equivalent. Personal state is loaded separately through private endpoints.
  acceptance:
    given: Anonymous and two isolated session viewers request admitted academic catalog lists/details,
      campus links, and second-classroom lists/details/calendar/organizers in each locale.
    when: The real Worker renders their HTML and each session independently reads its private shell projection.
    then:
    - Public HTML content and DOM relationships agree across viewers; no private viewer identity occurs.
    - Only nonce, request ID and bijectively mapped generated accessibility identifiers differ; changed
      text or broken references remain observable.
    - Private shell projections retain their matching authenticated viewer and no-store headers.
    test:
      file: tests/e2e/src/app/cache-policy/shell-projection.test.ts
      name: rendering-and-cache.web-rendering-and-cache-2
- id: rendering-and-cache.cacheable-public-pages-1
  category: consistency
  topic: cacheable-public-pages
  rule: Course, section, and teacher list HTML is admitted to the public cache only for the canonical query
    forms declared by those list capabilities; invalid or unsupported filter forms do not share an admitted
    cache entry.
  acceptance:
    given: Canonical course, section and teacher list URLs and a URL with an unsupported filter.
    when: The public SSR admission resolver evaluates those requests.
    then:
    - Canonical lists are admitted and unsupported query forms are not.
    test:
      file: tests/unit/features/catalog/public-cache-policy-acceptance.test.ts
      name: rendering-and-cache.cacheable-public-pages-1
- id: rendering-and-cache.cacheable-public-pages-2
  category: consistency
  topic: cacheable-public-pages
  rule: Anonymous HTML cache admission includes catalog detail root paths (`/catalog/{courses|sections|teachers}/:id`).
  acceptance:
    given: Positive-ID public detail roots, a paginated offering query, and an invalid zero ID.
    when: The public SSR admission resolver evaluates each route.
    then:
    - Only the canonical valid detail root is admitted as a page.
    test:
      file: tests/unit/features/catalog/public-cache-policy-acceptance.test.ts
      name: rendering-and-cache.cacheable-public-pages-2
- id: rendering-and-cache.cacheable-public-pages-3
  category: consistency
  topic: cacheable-public-pages
  rule: Anonymous HTML cache admission includes campus links.
  acceptance:
    given: The campus links route requested anonymously and with a session cookie.
    when: The public SSR admission resolver evaluates both requests.
    then:
    - Both use the shared public page admission class.
    test:
      file: tests/unit/features/catalog/public-cache-policy-acceptance.test.ts
      name: rendering-and-cache.cacheable-public-pages-3
- id: rendering-and-cache.cacheable-public-pages-4
  category: consistency
  topic: cacheable-public-pages
  rule: Anonymous HTML cache admission includes second-classroom lists, details, calendars, and organizers
    without query parameters.
  acceptance:
    given: Young event list, detail, calendar and organizer URLs with and without query parameters.
    when: The public SSR admission resolver evaluates those routes.
    then:
    - Query-free routes are admitted and filtered variants are dynamic.
    test:
      file: tests/unit/features/catalog/public-cache-policy-acceptance.test.ts
      name: rendering-and-cache.cacheable-public-pages-4
- id: rendering-and-cache.cacheable-public-pages-5
  category: consistency
  topic: cacheable-public-pages
  rule: Anonymous HTML cache admission includes usage guides, privacy, terms, Markdown guide, and API docs.
  acceptance:
    given: Each declared static guide, privacy, terms, Markdown guide and API documentation URL.
    when: The public SSR admission resolver evaluates a document request.
    then:
    - The route is admitted as a public page.
    test:
      file: tests/unit/features/catalog/public-cache-policy-acceptance.test.ts
      name: rendering-and-cache.cacheable-public-pages-5
- id: rendering-and-cache.cacheable-public-pages-6
  category: consistency
  topic: cacheable-public-pages
  rule: Anonymous HTML cache admission includes sign-in without query parameters, for anonymous visitors only.
  acceptance:
    given: Anonymous sign-in, sign-in with a callback query and sign-in with a session cookie.
    when: The public SSR admission resolver evaluates the requests.
    then:
    - Only anonymous query-free sign-in is admitted.
    test:
      file: tests/unit/features/catalog/public-cache-policy-acceptance.test.ts
      name: rendering-and-cache.cacheable-public-pages-6
- id: rendering-and-cache.cacheable-public-pages-7
  category: consistency
  topic: cacheable-public-pages
  rule: Workspace, admin, OAuth, and private account pages use dynamic SSR. Requests carrying Authorization
    bypass shared HTML caching. Anonymous query-free sign-in is the explicit account-route exception.
  acceptance:
    given: Private workspace/account/admin/OAuth routes and otherwise public routes carrying an Authorization
      header.
    when: The public SSR admission resolver evaluates document requests.
    then:
    - All those requests bypass shared HTML admission.
    test:
      file: tests/unit/features/catalog/public-cache-policy-acceptance.test.ts
      name: rendering-and-cache.cacheable-public-pages-7
- id: rendering-and-cache.cacheable-public-pages-9
  category: consistency
  topic: cacheable-public-pages
  rule: SvelteKit __data.json navigations are excluded from shared HTML cache admission. Their underlying public-data
    reads may reuse the separately scoped public data caches.
  acceptance:
    given: Public and private SvelteKit __data.json navigation URLs.
    when: The public SSR admission resolver evaluates navigation requests.
    then:
    - No navigation response is admitted to the shared HTML cache.
    test:
      file: tests/unit/features/catalog/public-cache-policy-acceptance.test.ts
      name: rendering-and-cache.cacheable-public-pages-9
- id: rendering-and-cache.cacheable-public-pages-10
  category: consistency
  topic: cacheable-public-pages
  rule: Filtered second-classroom event lists, calendar ranges and organizer histories reuse public event
    data caches even when their HTML is dynamic. Different filters and import revisions use distinct cached facts.
  acceptance:
    given: Controlled database rows and an imported revision supply public event facts to the actual page loaders and process cache.
    when: Filtered list, dated calendar and paginated organizer-history loaders repeat reads, change revision,
      or change module filters; the production HTML admission resolver evaluates each URL.
    then:
    - Filtered HTML stays dynamic while repeated page loads reuse event rows and totals.
    - New revisions and different filters cause distinct fact reads rather than reusing the old selection.
    test:
      file: tests/unit/features/young/young-event-service.test.ts
      name: rendering-and-cache.cacheable-public-pages-10
- id: rendering-and-cache.cacheable-public-pages-11
  category: consistency
  topic: cacheable-public-pages
  rule: Bus pages use request-time SSR so next departures and map positions are computed for the request clock
    rather than reused from the public HTML cache.
  acceptance:
    given: Bus timetable and map routes requested anonymously and with a session cookie.
    when: The public SSR admission resolver evaluates them.
    then:
    - Both routes stay dynamic for either visitor.
    test:
      file: tests/unit/features/catalog/public-cache-policy-acceptance.test.ts
      name: rendering-and-cache.cacheable-public-pages-11
- id: rendering-and-cache.cacheable-public-pages-12
  category: consistency
  topic: cacheable-public-pages
  rule: Shared bus topology and timetable cache entries contain only public data. Per-request preferences
    are read separately and attached only after retrieving public facts; one viewer cannot populate another's preferences.
  rationale: Private HTTP delivery is owned by bus.cache-boundaries and bus.preference-hydration-write-gate.
    This requirement owns service/cache separation, including callers that read timetable facts directly.
  acceptance:
    given: Controlled database boundaries provide one timetable and distinct preferences for two users.
    when: Actual timetable services and the process cache handle both owners, anonymous reads and a changed
      preference while retaining the same imported timetable revision.
    then:
    - All calls share exactly the same cached public facts and load trips only once.
    - Static results omit preferences; anonymous results have null preferences and owner calls receive only their fresh personal preference.
    - Changing preferences neither changes nor reloads the cached public timetable.
    test:
      file: tests/unit/features/bus/bus-timetable-data.test.ts
      name: rendering-and-cache.cacheable-public-pages-12
- id: rendering-and-cache.cacheable-public-pages-13
  category: consistency
  topic: cacheable-public-pages
  rule: News and global-search pages remain dynamic.
  acceptance:
    given: News, source-directory and global-search routes, including a search query.
    when: The public SSR admission resolver evaluates them.
    then:
    - None is admitted to shared HTML caching.
    test:
      file: tests/unit/features/catalog/public-cache-policy-acceptance.test.ts
      name: rendering-and-cache.cacheable-public-pages-13
- id: rendering-and-cache.cacheable-public-pages-14
  category: consistency
  topic: cacheable-public-pages
  rule: A signed-in visitor to / continues to the canonical workspace or required onboarding flow; the public
    landing cache never replaces this redirect.
  acceptance:
    given: An anonymous landing request and isolated session users with complete profiles, a missing name,
      or a missing username.
    when: Warm anonymous HTML, request the same root HTML and page-data URL with each session, follow each
      redirect in a browser, and request anonymously again for Chinese and English.
    then:
    - Complete profiles receive a private no-store 303 to workspace overview; either incomplete profile
      receives a private no-store 303 to welcome with the original root callback.
    - Page-data preserves SvelteKit's JSON redirect shape with private browser/CDN no-store headers.
    - Browser navigation reaches the intended page, and anonymous landing HTML remains successful without
      any session user's identity.
    test:
      file: tests/e2e/src/app/cache-policy/shell-projection.test.ts
      name: rendering-and-cache.cacheable-public-pages-14
- id: rendering-and-cache.cacheable-public-pages-15
  category: consistency
  topic: cacheable-public-pages
  rule: The open tab reuses successful public SvelteKit __data.json navigations so a later visit does not
    request them again. Stable catalog, news, search, room, guide, and community pages stay reusable for
    300 seconds. Young event pages and section details stay reusable for at most 60 seconds and never past
    the next Asia/Shanghai midnight. A full invalidation mask drops the stored page and requests again.
    Clock-driven bus and weather pages, the site root, workspace, and other private routes are never stored.
    Responses that set a cookie or are not successful are never stored. HTTP responses stay private, no-store.
  acceptance:
    given: A tab cache in front of a controlled fetch, covering a partial invalidation, a repeat visit, an
      all-ones invalidation, a Set-Cookie response, and young/section reads at noon and ten seconds before
      Shanghai midnight.
    when: The same public navigation URL is requested twice, then fully invalidated, and excluded URLs are
      requested.
    then:
    - The second stable navigation is served from the tab cache and does not call fetch. Young data at noon
      expires after 60 seconds. Section detail stored ten seconds before midnight expires at midnight.
    - A full invalidation calls fetch again and the following partial navigation calls fetch again.
    - Workspace, bus, weather, the site root, and Set-Cookie responses always call fetch.
    test:
      file: tests/unit/lib/shell/public-navigation-cache.test.ts
      name: rendering-and-cache.cacheable-public-pages-15
- id: rendering-and-cache.personal-overlays-4
  category: privacy
  topic: personal-overlays
  rule: Pages without a workspace SSR projection hydrate viewer and navigation state through the same-origin,
    session-cookie-only /_internal/shell-bootstrap endpoint. It returns only viewer id, name, username, image
    and isAdmin plus matching navigation userId and calendar, pending homework, pending todo, upcoming exam, subscribed section,
    and unread activity notification counts, and subscribed section links limited to href and course label.
    Anonymous results have null viewer, null navigation, and an empty subscribed section list. Workspace SSR
    includes that same section list so hydration does not request shell bootstrap again. Every response
    uses Cache-Control private, no-store, Cloudflare-CDN-Cache-Control no-store, and Vary Cookie. Bearer
    authentication is rejected even alongside a session cookie.
  acceptance:
    given: Anonymous requests and two isolated session users with distinct navigation counts; each user
      also authorizes a valid profile-reading OAuth bearer.
    when: The real shell bootstrap endpoint is requested anonymously, with each session, with bearer only,
      and with both session and bearer; public catalog and account settings pages hydrate their shell.
    then:
    - Anonymous responses contain null viewer/navigation; session responses contain only the matching
      allowlisted viewer and navigation counts, without email or another user's identity.
    - Valid bearer-only and combined bearer/session requests receive 401 instead of shell identity.
    - Every response is private, no-store and varies on Cookie; hydrated pages obtain the identical
      projection through a private client fetch.
    test:
      file: tests/e2e/src/app/cache-policy/shell-projection.test.ts
      name: rendering-and-cache.personal-overlays-4
- id: rendering-and-cache.personal-overlays-5
  category: privacy
  topic: personal-overlays
  rule: Workspace SSR seeds the same projection directly.
  acceptance:
    given: Two isolated users have distinct pending todo and section subscription counts.
    when: Each user opens workspace todos first without JavaScript and then with hydration enabled,
      and independently reads the private shell projection.
    then:
    - Server-rendered viewer identity and all workspace navigation badges match the private projection.
    - Hydration preserves those values without requesting shell bootstrap.
    test:
      file: tests/e2e/src/app/cache-policy/shell-projection.test.ts
      name: rendering-and-cache.personal-overlays-5
- id: rendering-and-cache.personal-overlays-7
  category: privacy
  topic: personal-overlays
  rule: Viewer shell state is not persisted in localStorage or a shared cache. Signing out or changing the
    authenticated viewer clears the previous viewer projection before another user can observe it.
  acceptance:
    given: Two isolated users have distinct identities, pending todo counts and subscription counts.
    when: One browser signs out through the user menu, enters a second session, then reloads with the
      first user's fresh session.
    then:
    - Sign-out produces an anonymous shell; each subsequent session shows only its matching viewer and
      navigation, with no preceding user's tasks or identity.
    - Private shell responses do not reuse another user's projection, and localStorage contains none
      of either user's identity fields before or after those transitions.
    test:
      file: tests/e2e/src/app/cache-policy/shell-projection.test.ts
      name: rendering-and-cache.personal-overlays-7
- id: rendering-and-cache.personal-overlays-8
  category: privacy
  topic: personal-overlays
  rule: JSON responses default to `private, no-store`, including validation and auth errors.
  acceptance:
    given: The JSON response helpers receive success, creation, validation, authentication, authorization, not-found,
      rate-limit, and server-error outcomes.
    when: Each helper constructs its response, and the test reads its headers and JSON body.
    then:
    - JSON responses default to `private, no-store`, including validation and auth errors.
    test:
      file: tests/unit/lib/api/response-cache-policy.test.ts
      name: rendering-and-cache.personal-overlays-8
- id: rendering-and-cache.personal-overlays-9
  category: privacy
  topic: personal-overlays
  rule: Public APIs opt into caching explicitly and must remain independent of session/Bearer identity.
  acceptance:
    given: Two isolated users have different private profiles and todos, and only one subscribes to the seeded
      section. Each user has a valid session and a resource-bound bearer token issued through approved device
      authorization; the account-profile endpoint verifies all four identities.
    when: Anonymous, session, and bearer requests read the same Chinese course, section, teacher, schedule,
      semester, metadata, links, Young-event, organizer, and bus-route API representations.
    then:
    - Every response opts into public browser and CDN caching explicitly.
    - All authenticated bodies and cache headers equal the anonymous representation, no response sets a session
      cookie, and none includes either viewer's private identity or todo content.
    test:
      file: tests/e2e/src/app/cache-policy/test.ts
      name: rendering-and-cache.personal-overlays-9
- id: rendering-and-cache.personal-overlays-10
  category: privacy
  topic: personal-overlays
  rule: The HTTP boundary also sets CDN `no-store` for private responses.
  acceptance:
    given: Signed-in account, workspace, community, and shell-bootstrap requests resolve to responses with status
      200, 400, 401, 403, 404, or 500 and conflicting positive browser and CDN lifetimes.
    when: The production HTTP hook finalizes each response and the test reads both delivered cache headers.
    then:
    - The HTTP boundary also sets CDN `no-store` for private responses.
    test:
      file: tests/unit/lib/hooks/hooks-cache-control.test.ts
      name: rendering-and-cache.personal-overlays-10
- id: rendering-and-cache.personal-overlays-11
  category: privacy
  topic: personal-overlays
  rule: '`/_internal` endpoints stay outside public cache admission.'
  acceptance:
    given: The shell-bootstrap route and another internal route, including a query-bearing form.
    when: The public SSR admission resolver evaluates document requests.
    then:
    - Every internal route bypasses shared HTML caching.
    test:
      file: tests/unit/features/catalog/public-cache-policy-acceptance.test.ts
      name: rendering-and-cache.personal-overlays-11
- id: rendering-and-cache.personal-overlays-12
  category: privacy
  topic: personal-overlays
  rule: After one successful shell bootstrap, link and history navigations reuse that result, including an
    anonymous null viewer. The first load, a failed bootstrap, and programmatic navigations still request
    /_internal/shell-bootstrap. A workspace SSR shell that already has its viewer does not request it.
  acceptance:
    given: An unresolved shell, a resolved anonymous shell, a resolved signed-in shell, and workspace SSR
      without a viewer.
    when: The shell decides whether a mount, link, history, or programmatic navigation requests bootstrap.
    then:
    - The first load and a failed anonymous result request bootstrap. Later link and history navigations do not.
    - A programmatic navigation requests bootstrap again so sign-in can replace the anonymous shell.
    - A complete signed-in shell does not request bootstrap, and workspace SSR without a viewer does not either.
    test:
      file: tests/unit/lib/shell/shell-bootstrap-client.test.ts
      name: rendering-and-cache.personal-overlays-12
- id: rendering-and-cache.cache-layers-and-invalidation-1
  category: consistency
  topic: cache-layers-and-invalidation
  rule: Final HTML delivered to the browser and zone CDN uses private, no-store; shared storage applies only
    to the internal anonymous entrypoint representation.
  acceptance:
    given: The same Chinese course-list HTML URL is requested once anonymously and once with a signed-in session
      cookie.
    when: The production Worker dispatches each request through the public SSR entrypoint and finalizes its
      delivered response.
    then:
    - Final HTML delivered to the browser and zone CDN uses private, no-store; shared storage applies only
      to the internal anonymous entrypoint representation.
    test:
      file: tests/unit/lib/misc/worker-routing-entrypoint.test.ts
      name: rendering-and-cache.cache-layers-and-invalidation-1
- id: rendering-and-cache.cache-layers-and-invalidation-2
  category: consistency
  topic: cache-layers-and-invalidation
  rule: The stored anonymous entrypoint representation uses max-age=0 and a positive shared s-maxage. These
    are internal storage headers; final delivered-response privacy is governed separately.
  acceptance:
    given: An ordinary admitted public course-detail representation.
    when: The cache header builder produces stored-entrypoint headers.
    then:
    - The internal representation uses max-age=0 and a positive shared s-maxage.
    test:
      file: tests/unit/features/catalog/public-cache-policy-acceptance.test.ts
      name: rendering-and-cache.cache-layers-and-invalidation-2
- id: rendering-and-cache.cache-layers-and-invalidation-3
  category: consistency
  topic: cache-layers-and-invalidation
  rule: Ordinary admitted public HTML has a 86400-second shared fresh lifetime. Young event and calendar pages
    use their explicitly shorter freshness limits; fresh lifetime does not remove required write-triggered
    invalidation.
  acceptance:
    given: Ordinary public course, teacher and privacy pages.
    when: The cache header builder classifies their freshness.
    then:
    - The stored public representation has a 86400-second shared fresh lifetime.
    test:
      file: tests/unit/features/catalog/public-cache-policy-acceptance.test.ts
      name: rendering-and-cache.cache-layers-and-invalidation-3
- id: rendering-and-cache.cache-layers-and-invalidation-4
  category: consistency
  topic: cache-layers-and-invalidation
  rule: Young event list, detail, organizer, and calendar HTML has a shared lifetime of at most 60 seconds.
    Calendar entries also expire at the next Asia/Shanghai midnight, whichever boundary occurs first, without
    stale-while-revalidate.
  acceptance:
    given: Young pages at midday, ten seconds before Shanghai midnight, and a render crossing midnight.
    when: The cache header builder calculates freshness and stale policy.
    then:
    - Midday freshness is 60 seconds.
    - Before midnight freshness is bounded to 10 seconds with no stale-while-revalidate.
    - A render crossing midnight is private and no-store.
    test:
      file: tests/unit/features/catalog/public-cache-policy-acceptance.test.ts
      name: rendering-and-cache.cache-layers-and-invalidation-4
- id: rendering-and-cache.cache-layers-and-invalidation-5
  category: consistency
  topic: cache-layers-and-invalidation
  rule: A committed static import purges both the zone and Workers entrypoint layers.
  acceptance:
    given: A static import has committed and both the zone and Workers entrypoint purge endpoints are configured.
    when: The production post-import invalidator receives the committed report and both endpoints accept their
      purge requests.
    then:
    - A committed static import purges both the zone and Workers entrypoint layers.
    test:
      file: tests/unit/static-loader/post-import-cache-purge.test.ts
      name: rendering-and-cache.cache-layers-and-invalidation-5
- id: rendering-and-cache.cache-layers-and-invalidation-6
  category: consistency
  topic: cache-layers-and-invalidation
  rule: A failed purge fails the sync; rerunning the same already-committed snapshot retries the purge.
  acceptance:
    given: The CLI imports a snapshot successfully, but both configured purge endpoints reject invalidation
      with HTTP 503.
    when: The CLI completes, then runs again with the same snapshot hash and an unchanged import report after
      both purge endpoints recover.
    then:
    - A failed purge fails the sync; rerunning the same already-committed snapshot retries the purge.
    test:
      file: tests/unit/static-loader/cache-purge-cli-policy.test.ts
      name: rendering-and-cache.cache-layers-and-invalidation-6
- id: rendering-and-cache.cache-layers-and-invalidation-7
  category: consistency
  topic: cache-layers-and-invalidation
  rule: After a committed revision change and successful purge, a reused isolate cannot repopulate the public
    HTML cache using a previous revision. Revision memoization does not cross request boundaries.
  acceptance:
    given: A reused runtime data cache contains a value under the previous committed snapshot revision.
    when: A new request reads a changed committed revision and asks the same cache instance for the same catalog-list
      key.
    then:
    - After a committed revision change and successful purge, a reused isolate cannot repopulate the public
      HTML cache using a previous revision. Revision memoization does not cross request boundaries.
    test:
      file: tests/unit/features/catalog/catalog-detail-cache-revision.test.ts
      name: rendering-and-cache.cache-layers-and-invalidation-7
- id: rendering-and-cache.cache-layers-and-invalidation-9
  category: consistency
  topic: cache-layers-and-invalidation
  rule: Deployments do not reuse HTML cached by a previous Worker version; cache.cross_version_cache remains
    disabled.
  acceptance:
    given: The production and local Worker deployment configurations declare cached entrypoints.
    when: Their JSONC configuration is parsed and each cache-enabled entrypoint is inspected.
    then:
    - PublicSsr enables caching with cross_version_cache explicitly false in both configurations.
    - No cache-enabled entrypoint opts into reuse across Worker versions.
    test:
      file: tests/unit/lib/cloudflare/wrangler-rate-limit-config.test.ts
      name: rendering-and-cache.cache-layers-and-invalidation-9
- id: rendering-and-cache.cache-layers-and-invalidation-10
  category: consistency
  topic: cache-layers-and-invalidation
  rule: Catalog public data keys include revision, locale where applicable, entity kind, ID or canonical filters,
    and payload shape.
  acceptance:
    given: The same catalog-list query with separately varied revision, locale, kind, filter values and shape,
      plus equivalent reordered filters.
    when: Production cache key builders construct keys.
    then:
    - Every meaningful variation has a distinct key.
    - Equivalent canonical filter sets share one key.
    test:
      file: tests/unit/features/catalog/public-cache-policy-acceptance.test.ts
      name: rendering-and-cache.cache-layers-and-invalidation-10
- id: rendering-and-cache.cache-layers-and-invalidation-11
  category: consistency
  topic: cache-layers-and-invalidation
  rule: Null public catalog detail results and results rejected by the configured domain validator are not
    retained in isolate memory, the colo Cache API or KV. A later valid result can populate those caches.
  acceptance:
    given: The actual detail-cache wrapper and course/teacher validators, real isolate memory, and controlled
      colo/KV storage boundaries with observed writes.
    when: Read null and private-field-contaminated results twice, then replace the loader result with a valid core.
    then:
    - Both rejected-result reads invoke the loader and write neither colo nor KV; no rejected result survives
      in isolate memory.
    - The valid successor populates both persistent boundaries and serves the next read from isolate memory.
    test:
      file: tests/unit/features/catalog/catalog-detail-cache-eligibility.test.ts
      name: rendering-and-cache.cache-layers-and-invalidation-11
- id: rendering-and-cache.cache-origin-recovery
  category: consistency
  topic: cache-layers-and-invalidation
  rule: A public cache read failure still executes the original loader. Loader failures propagate unchanged,
    are not cached, and can be retried; cache recovery cannot turn a loader rejection into successful data.
  acceptance:
    given: The production detail-cache wrapper with both colo and KV reads failing and a loader rejecting
      with a specific error object.
    when: Read twice, then allow the same loader to return a valid domain core.
    then:
    - Every failed attempt calls the original loader and propagates its exact rejection without cache writes.
    - A subsequent valid result succeeds and is cached normally.
    test:
      file: tests/unit/features/catalog/catalog-detail-cache-eligibility.test.ts
      name: rendering-and-cache.cache-origin-recovery
- id: rendering-and-cache.contributor-notes-1
  category: consistency
  topic: contributor-notes
  rule: Shared academic, Young, bus and campus-link public fact reader interfaces exclude viewer identity,
    authentication context and saved preferences. Separate private projection or composition functions take
    explicit user identity; public readers do not directly call those private readers.
  rationale: This is an architectural interface constraint. Runtime privacy, cache eligibility and server
    authorization remain independently verified by the feature-specific public/private boundary requirements.
    Page loaders may receive a framework request context; the shared fact reader beneath them must not.
  acceptance:
    given: The actual TypeScript public fact readers for academic lists/details, semesters, Young events and
      organizers, static bus timetables and campus links, plus their owner-aware composition functions.
    when: The TypeScript compiler resolves each exported reader's parameter types and call expressions.
    then:
    - Public reader parameters expose no userId, viewer, authentication, session or preference fields and are not untyped.
    - Public function bodies do not directly invoke the private projection or identity readers.
    - Private Section, link, bus and Young compositions require an explicit userId parameter or field.
    test:
      file: tests/unit/policies/public-reader-boundaries.test.ts
      name: rendering-and-cache.contributor-notes-1
- id: rendering-and-cache.global-search-freshness
  category: consistency
  topic: cache-layers-and-invalidation
  rule: Global search shares only public catalog groups, keyed by imported revision, locale, normalized query
    and limit. Every runtime tier expires those groups at five minutes; private todos and subscribed homework
    are read on every request for the current owner and are never serialized into shared caches. Public REST
    responses separately allow 120 seconds fresh and 300 seconds stale-while-revalidate with the catalog tag.
  acceptance:
    given: Restricted-role search services use a real isolated catalog, two owners with distinct todos and
      subscribed homework, the production cache machinery and controlled external colo/KV stores.
    when: Reads reuse memory, colo and KV, committed public/private rows change, the clock reaches five minutes,
      and a subsequent static import revision changes.
    then:
    - Public groups retain their original values through 299999 milliseconds in every tier, then refresh at
      300000 milliseconds even with unchanged revision; a changed revision refreshes immediately.
    - Locale and limit select separate results; anonymous reads omit private groups and owner reads reflect
      changed todo/homework content and removed subscriptions immediately without leaking private IDs into KV.
    - The actual public REST route omits private groups and declares its exact independent browser/CDN lifetime
      and catalog purge tag.
    test:
      file: tests/integration/public-discovery-cache-contract.test.ts
      name: rendering-and-cache.global-search-freshness
- id: rendering-and-cache.sitemap-freshness
  category: consistency
  topic: cache-layers-and-invalidation
  rule: Sitemap generation caches current public catalog URLs in revision-scoped memory, colo and KV for
    twenty-four hours. A new imported revision regenerates URLs and ETag; retired sections and inactive Young
    events are excluded. Browser responses require revalidation; CDN freshness is 3600 seconds with 21600
    seconds of stale-while-revalidate and the catalog purge tag.
  acceptance:
    given: The actual sitemap route reads an isolated PostgreSQL catalog through restricted roles and uses
      production memory/colo/KV caching with controlled external stores and clock.
    when: Source records become retired/inactive, the same revision is read from each tier, a weak ETag is sent,
      the imported revision changes, and the unchanged-revision cache reaches its twenty-four-hour boundary.
    then:
    - Same-revision tiers reuse XML and a matching weak ETag returns empty 304; exact browser/CDN headers and
      catalog tag are preserved.
    - Revision changes remove retired/inactive URLs and change ETag; exactly twenty-four hours later newly
      committed course URLs appear without requiring another import revision.
    test:
      file: tests/integration/public-sitemap-cache-contract.test.ts
      name: rendering-and-cache.sitemap-freshness
- id: rendering-and-cache.static-location-freshness
  category: consistency
  topic: cache-layers-and-invalidation
  rule: Room-map manifests, building image rules and location coordinates loaded from mutable static JSON
    URLs expire in the serving process at five minutes independently of the imported database revision.
    This origin loader lifetime is separate from any downstream HTTP response lifetime.
  acceptance:
    given: The actual room-map and geographic services fetch controlled external manifests, image rules and
      coordinates at a fixed clock.
    when: The external files change and the same serving process reads just before and exactly at five minutes.
    then:
    - Highlighted room maps, building overviews and coordinates retain their first values through 299999
      milliseconds with one fetch each, then return the changed values with a second fetch at 300000 milliseconds.
    test:
      file: tests/unit/features/rooms/static-location-freshness.test.ts
      name: rendering-and-cache.static-location-freshness
- id: rendering-and-cache.contributor-notes-4
  category: consistency
  topic: contributor-notes
  rule: Application navigation configures route-code preload on hover and data preload on tap/click. Application
    links do not opt back into hover-triggered data preload.
  acceptance:
    given: The application HTML template and every Svelte/HTML component under src.
    when: The Svelte compiler parses their element and attribute syntax trees.
    then:
    - The application body declares code preload on hover and data preload on tap.
    - Every data preload override is tap or off; no component or element re-enables hover data preload.
    test:
      file: tests/unit/lib/navigation/navigation-preload-policy.test.ts
      name: rendering-and-cache.contributor-notes-4
