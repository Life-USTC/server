kind: policy
id: permission-ui
title: Permission-aware presentation
requirements:
- id: permission-ui.identity-4
  category: presentation
  topic: identity
  rule: Ordinary page headings and metadata do not display database row IDs. Public JW IDs remain valid API
    retrieval identifiers but do not replace localized names or public course/section codes in ordinary UI.
  acceptance:
    given: Isolated course, teacher, and section records have distinct large row IDs and JW IDs, bilingual names, public codes, and a signed-in profile with a private user ID.
    when: The browser reads all three catalog detail pages in both locales and the user profile and settings pages, then retrieves the course and section APIs by JW ID.
    then:
    - Visible main content and document titles contain names and public course/section codes without exposing any internal row ID or substituting a JW ID for the name.
    - Public course and section APIs still resolve their JW IDs to the correct records.
    test:
      file: tests/e2e/src/app/shared-policy/catalog-identity.test.ts
      name: permission-ui.identity-4 Course Web

applies_to:
- id: list-page
  title: List Page
- id: detail-page
  title: Detail Page
- id: card
  title: Card
- id: auxiliary-pages
  title: Auxiliary Pages
topics:
- id: identity
  title: Identity
rationale:
- Codes, semesters, and numbers primarily serve disambiguation and retrieval.
- Roles and delegated clients are distinct dimensions defined by docs/product.yaml. Feature authorization matrices
  govern schedule/exam authority, shared-content edits, suspension, and administration; presentation does not
  grant permissions.
