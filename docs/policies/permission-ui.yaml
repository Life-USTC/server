kind: policy
id: permission-ui
title: Permission-aware presentation
requirements:
- id: permission-ui.identity-4
  category: presentation
  topic: identity
  rule: Ordinary page headings and metadata do not display database row IDs. Public JW IDs remain valid API
    retrieval identifiers but do not replace localized names or public course/section codes in ordinary UI.
  acceptance:
    given: A seeded public course has a localized name, public course code, and a distinct JW retrieval ID.
    when: An anonymous browser opens the course detail and reads its visible main content.
    then:
    - Ordinary page headings and metadata do not display database row IDs. Public JW IDs remain valid API retrieval
      identifiers but do not replace localized names or public course/section codes in ordinary UI.
    test:
      file: tests/e2e/src/app/courses/[jwId]/test.ts
      name: permission-ui.identity-4
applies_to:
- id: list-page
  title: List Page
- id: detail-page
  title: Detail Page
- id: card
  title: Card
- id: auxiliary-pages
  title: Auxiliary Pages
topics:
- id: identity
  title: Identity
rationale:
- Codes, semesters, and numbers primarily serve disambiguation and retrieval.
- Roles and delegated clients are distinct dimensions defined by docs/product.yaml. Feature authorization matrices
  govern schedule/exam authority, shared-content edits, suspension, and administration; presentation does not
  grant permissions.
