kind: policy
id: cases.mcp-assistant-workflows
title: 'Cross-feature scenarios: mcp-assistant-workflows'
requirements:
- id: cases.mcp-assistant-workflows.preview-before-write-1
  category: behavior
  topic: preview-before-write
  rule: Subscription imports that can match a course code to multiple sections expose a read-only preview listing
    the matched sections, semester, and intended subscription effect before execution. Preview does not change
    user data.
- id: cases.mcp-assistant-workflows.compact-privacy-default-1
  category: privacy
  topic: compact-privacy-default
  rule: MCP default and full responses never contain a private personal calendar-feed URL, path credential,
    or token. Each tool defines its allowed output fields independently of display mode.
- id: cases.mcp-assistant-workflows.scenario-guidance-2
  category: behavior
  topic: scenario-guidance
  rule: The MCP workflow documentation identifies the snapshot, focused next-class/next-bus, and subscription-preview
    tools by their actual registered names and states their required scopes, defaults, and secret-redaction
    behavior.
refs:
- feature: mcp
  capability: tool-groups
- feature: overview
  capability: workspace-snapshot
- feature: subscription
  capability: batch-subscribe-by-codes
- feature: ical
  capability: personal-calendar-subscription
- feature: todo
  capability: todo-list
- feature: bus
  capability: bus-timetable
- feature: bus
  capability: bus-route-search
- feature: bus
  capability: bus-next-departures
topics:
- id: aggregate-first
  title: Aggregate first
- id: preview-before-write
  title: Preview before write
- id: focused-over-raw-for-common-questions
  title: Focused over raw for common questions
- id: compact-privacy-default
  title: Compact privacy default
- id: scenario-guidance
  title: Scenario guidance
rationale:
- Task-oriented snapshots reduce redundant calls and repeated context for multi-part workspace questions.
- Focused next-class and next-bus tools make common time-sensitive questions easier for client assistants to
  answer; client tool choice is not enforced by the server.
- Aggregate and filtered tools complement low-level data access when a concrete user workflow benefits from
  them.
