kind: policy
id: cases.mcp-assistant-workflows
title: 'Cross-feature scenarios: mcp-assistant-workflows'
requirements:
- id: cases.mcp-assistant-workflows.preview-before-write-1
  category: behavior
  topic: preview-before-write
  rule: Subscription imports resolve section codes within the selected semester, or the current semester when
    semesterId is omitted. A read-only preview lists every matched section, the resolved semester and the
    intended workspace/calendar subscription effect before execution, including when a code matches multiple
    sections. Preview does not change user data; execution subscribes only the sections in that semester.
  acceptance:
    given: An isolated user, two sections sharing a code in one isolated semester and another section with
      that code in a second semester, plus the current-term seed section.
    when: The real MCP SDK previews both semesters in default and full modes, previews with semesterId omitted,
      and then imports the code in the first semester.
    then:
    - Preview lists exactly the sections in the selected semester and identifies the workspace/calendar effect
      as distinct from official enrollment; omitted semesterId resolves to the current term.
    - User, subscription, todo and audit rows are unchanged by every preview.
    - Import creates exactly the two previewed memberships and never the other-semester membership.
    test:
      file: tests/integration/mcp/catalog/subscription-preview.test.ts
      name: cases.mcp-assistant-workflows.preview-before-write-1
- id: cases.mcp-assistant-workflows.scenario-guidance-2
  category: behavior
  topic: scenario-guidance
  rule: The MCP workflow documentation identifies the snapshot, focused next-class/next-bus, and subscription-preview
    tools by their actual registered names and states their required scopes, defaults, and secret-redaction
    behavior.
refs:
- feature: mcp
  capability: tool-groups
- feature: overview
  capability: workspace-snapshot
- feature: subscription
  capability: batch-subscribe-by-codes
- feature: ical
  capability: personal-calendar-subscription
- feature: todo
  capability: todo-list
- feature: bus
  capability: bus-timetable
- feature: bus
  capability: bus-route-search
- feature: bus
  capability: bus-next-departures
topics:
- id: aggregate-first
  title: Aggregate first
- id: preview-before-write
  title: Preview before write
- id: focused-over-raw-for-common-questions
  title: Focused over raw for common questions
- id: compact-privacy-default
  title: Compact privacy default
- id: scenario-guidance
  title: Scenario guidance
rationale:
- Task-oriented snapshots reduce redundant calls and repeated context for multi-part workspace questions.
- Focused next-class and next-bus tools make common time-sensitive questions easier for client assistants to
  answer; client tool choice is not enforced by the server.
- Aggregate and filtered tools complement low-level data access when a concrete user workflow benefits from
  them.
- The former compact-privacy-default requirement is owned by mcp.privacy-safe-default for identical
  default/full privacy and calendar-secret exclusion, mcp.openai-compatible-descriptors for every tool's
  closed output allowlist, mcp.typed-output-fields, mcp.typed-bus-output-fields and
  mcp.typed-community-output-fields for explicit domain field schemas, mcp.tool-registry-completeness for
  mandatory per-tool metadata, and mcp.output-modes for permitted mode projections.
