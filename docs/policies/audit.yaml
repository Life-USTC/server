kind: policy
id: audit
title: Audit events and retention
requirements:
- id: audit.writer-1
  category: privacy
  topic: writer
  rule: AuditLog is the authoritative store of security and business audit events. Operational logs and derived
    activity projections do not replace its records.
- id: audit.writer-2
  category: privacy
  topic: writer
  rule: Business mutations whose audit action declares an atomic trail commit the domain change and AuditLog
    row in one transaction; an audit insertion failure rolls back that change.
- id: audit.writer-3
  category: privacy
  topic: writer
  rule: A Section retirement or reactivation performed by static import commits its lifecycle change and corresponding
    audit row in the same transaction.
- id: audit.writer-4
  category: privacy
  topic: writer
  expectation:
    kind: retention
    operation: maintain_audit_log_retention
    network_days: 30
    attribution_days: 90
    event_days: 400
    boundary: inclusive
  acceptance:
    given: Persisted audit rows one millisecond before, exactly at, and one millisecond after each declared
      age threshold.
    when: The actual restricted maintenance role runs retention with an injected maintenance clock.
    then:
    - At network_days, ipAddress and userAgent are cleared; at attribution_days, oauthGrantId, sessionId, and
      requestId are cleared; at event_days, the entire row is deleted.
    - Each boundary is inclusive; younger rows retain the corresponding fields. Event identity, actor, and
      safe metadata survive until event expiry.
    test:
      file: tests/integration/audit-policy-retention.test.ts
      name: audit.writer-4
  applies_to:
  - writer
- id: audit.auth-hook-failure-isolation
  category: privacy
  topic: writer
  rule: Authentication lifecycle hooks write audit events after the authentication transaction commits. An
    audit logging failure is contained and produces a safe operational diagnostic without rolling back an already
    committed sign-in or leaking credentials.
- id: audit.retention-maintenance-cadence
  category: privacy
  topic: writer
  rule: Audit retention maintenance is scheduled every six hours. A failed or incomplete cleanup is reported
    rather than treated as a completed retention run.
- id: audit.retention-maintenance-authority
  category: authorization
  topic: writer
  rule: Audit retention cleanup is performed only through the maintenance-only SECURITY DEFINER function. Ordinary
    application and authentication database roles cannot invoke cleanup or delete audit history directly.
  acceptance:
    given: Separate application, authentication, and maintenance database role connections.
    when: Each role attempts cleanup and direct audit deletion; the function definition is inspected.
    then:
    - Only the maintenance role can execute the SECURITY DEFINER cleanup function; runtime roles cannot call
      it or directly delete audit rows.
    test:
      file: tests/integration/audit-policy-retention.test.ts
      name: audit.retention-maintenance-authority
- id: audit.action-comment-create
  category: privacy
  topic: actions
  rule: User creates a new comment on an object. MCP-originated writes include metadata.source=mcp.
  acceptance:
    given: An authenticated MCP user has a persisted course target and no comment from this operation.
    when: The user invokes the create-comment tool with private fixture content, then the test reads the persisted
      comment and audit event.
    then:
    - User creates a new comment on an object. MCP-originated writes include metadata.source=mcp.
    - Exactly one persisted event per actual change contains the actor, target, and source=mcp without copying
      private content.
    test:
      file: tests/integration/mcp/community/audit-policy.test.ts
      name: audit.action-comment-create
- id: audit.action-comment-edit
  category: privacy
  topic: actions
  rule: User edits their own comment. MCP-originated writes include metadata.source=mcp.
  acceptance:
    given: An authenticated MCP user owns a persisted active comment on a course.
    when: The user invokes the edit-comment tool with replacement private content, then the test reads the changed
      comment and audit event.
    then:
    - User edits their own comment. MCP-originated writes include metadata.source=mcp.
    - Exactly one persisted event per actual change contains the actor, target, and source=mcp without copying
      private content.
    test:
      file: tests/integration/mcp/community/audit-policy.test.ts
      name: audit.action-comment-edit
- id: audit.action-comment-delete
  category: privacy
  topic: actions
  rule: User deletes their own comment. Transport-originated writes include safe metadata.source where available.
  acceptance:
    given: An authenticated MCP user owns a persisted active comment on a course.
    when: The user invokes the delete-comment tool, then the test reads the deleted comment state and audit
      event.
    then:
    - User deletes their own comment. Transport-originated writes include safe metadata.source where available.
    - Exactly one persisted event per actual change contains the actor, target, and source=mcp without copying
      private content.
    test:
      file: tests/integration/mcp/community/audit-policy.test.ts
      name: audit.action-comment-delete
- id: audit.action-comment-react
  category: privacy
  topic: actions
  rule: User adds or removes a reaction on an active visible comment. MCP-originated writes include metadata.source=mcp.
  acceptance:
    given: An authenticated MCP user can view an active comment and has no reaction on it.
    when: The user adds a reaction twice and removes it twice through MCP, reading persisted reaction and audit
      rows after each operation.
    then:
    - User adds or removes a reaction on an active visible comment. MCP-originated writes include metadata.source=mcp.
    - Exactly one persisted event per actual change contains the actor, target, and source=mcp without copying
      private content.
    - Unchanged repeated add/remove operations add no audit event.
    test:
      file: tests/integration/mcp/community/audit-policy.test.ts
      name: audit.action-comment-react
- id: audit.action-description-edit
  category: privacy
  topic: actions
  rule: User updates an object description (content changed). The description row, edit history, and audit
    row are committed together.
  acceptance:
    given: An authenticated MCP user can edit a persisted course whose description and edit history are initially
      unchanged.
    when: A database constraint rejects the audit insertion for a description edit; the user retries after that
      constraint is removed and then repeats the identical content.
    then:
    - Audit insertion failure rolls back description and edit-history writes.
    - A successful change persists the description, one edit-history row, and one content-free audit event;
      an identical retry adds neither history nor audit rows.
    test:
      file: tests/integration/mcp/community/audit-policy.test.ts
      name: audit.action-description-edit
- id: audit.action-upload-delete
  category: privacy
  topic: actions
  rule: User deletes an upload they own. Transport-originated writes include metadata.source where available.
    After storage deletion succeeds, metadata deletion and the audit row are committed together.
  acceptance:
    given: An authenticated owner has uploaded real content and authorized an MCP client to delete uploads.
    when: An owner-scoped database constraint rejects the deletion audit; the owner retries through MCP after
      removing the constraint and repeats the completed deletion.
    then:
    - Storage deletion succeeds before the transaction, but audit failure preserves upload metadata and commits
      no audit event.
    - A successful retry deletes metadata and commits exactly one event with actor, upload target, OAuth client
      and grant, size, and source=mcp, without content, filename, storage key, or credentials.
    - Repeating the completed deletion returns not_found and adds no event.
    test:
      file: tests/e2e/src/app/account-policy/upload-audit.test.ts
      name: audit.action-upload-delete
- id: audit.action-section-retire
  category: privacy
  topic: actions
  rule: The importer marks one missing in-scope Section inactive without deleting the row or children. The
    same transaction records the Section target, source snapshot SHA-256, observation time, and jwId.
- id: audit.action-section-reactivate
  category: privacy
  topic: actions
  rule: The importer clears retiredAt when a Section reappears. The same transaction records the Section target,
    source snapshot SHA-256, observation time, jwId, and previous retiredAt.
- id: audit.action-admin-user-suspend
  category: privacy
  topic: actions
  rule: Admin suspends a user account. The suspension change and audit row are committed together.
  acceptance:
    given: An administrator replaces an isolated user's existing active suspension through the real REST endpoint.
    when: An actor-scoped database constraint rejects the audit insertion, then the administrator retries after
      the constraint is removed.
    then:
    - Audit failure leaves the previous suspension unchanged and commits neither a replacement nor an audit row.
    - Success lifts the previous suspension, creates one active replacement, and records one event identifying
      the administrator and subject with only reasonProvided metadata, excluding reason, note, and credentials.
    test:
      file: tests/e2e/src/app/account-policy/admin-audit.test.ts
      name: audit.action-admin-user-suspend
- id: audit.action-admin-user-unsuspend
  category: privacy
  topic: actions
  rule: Admin lifts a user suspension. The suspension change and audit row are committed together.
  acceptance:
    given: An administrator lifts an isolated user's active suspension through the real REST endpoint.
    when: An actor-scoped database constraint rejects the audit insertion, then the administrator retries after
      the constraint is removed.
    then:
    - Audit failure leaves the suspension unchanged and commits no audit row.
    - Success records the lift time and administrator and commits one event identifying the subject and suspension,
      excluding reason, note, user profile values, and credentials.
    test:
      file: tests/e2e/src/app/account-policy/admin-audit.test.ts
      name: audit.action-admin-user-unsuspend
- id: audit.action-admin-comment-moderate
  category: privacy
  topic: actions
  rule: Admin hides or moderates a comment. The moderation change and audit row are committed together.
  acceptance:
    given: An administrator hides an isolated user's active comment through the real REST endpoint.
    when: An actor-scoped database constraint rejects the audit insertion, then the administrator retries after
      the constraint is removed.
    then:
    - Audit failure preserves the complete previous comment and commits no audit row.
    - Success persists hidden status, moderation time, administrator, and note, and commits one event identifying
      the actor, author, and comment with only status and moderationNoteProvided metadata.
    - The event excludes comment content, moderation note, user profile values, and credentials.
    test:
      file: tests/e2e/src/app/account-policy/admin-audit.test.ts
      name: audit.action-admin-comment-moderate
- id: audit.action-admin-description-moderate
  category: privacy
  topic: actions
  rule: Admin updates description content from the moderation workflow. The description row, edit history,
    and audit row are committed together.
  acceptance:
    given: An administrator updates an isolated course description through the moderation REST endpoint.
    when: An actor-scoped database constraint rejects the audit insertion, then the administrator retries after
      the constraint is removed.
    then:
    - Audit failure preserves the previous description and editor and commits neither edit history nor audit.
    - Success persists the new content and editor, creates one history record with the actual previous and next
      content, and commits one event containing only changedFields=content metadata.
    - The audit event excludes previous and next content, user profile values, and credentials.
    test:
      file: tests/e2e/src/app/account-policy/admin-audit.test.ts
      name: audit.action-admin-description-moderate
- id: audit.action-admin-user-role-update
  category: privacy
  topic: actions
  rule: Admin changes administrator access. The user update and an audit row containing changedFields only
    are committed together.
  acceptance:
    given: An administrator grants administrator access to an isolated ordinary user through REST.
    when: An actor-scoped database constraint rejects the audit insertion, then the administrator retries after
      the constraint is removed and repeats the unchanged grant.
    then:
    - Audit failure preserves the complete previous user record and commits no event.
    - Success changes administrator access and commits one event identifying actor and subject with exactly
      changedFields=isAdmin metadata, excluding profile values and credentials.
    - Repeating the unchanged grant adds no event and never creates a profile-update audit.
    test:
      file: tests/e2e/src/app/account-policy/admin-audit.test.ts
      name: audit.action-admin-user-role-update
- id: audit.action-admin-user-profile-update
  category: privacy
  topic: actions
  rule: Admin changes managed profile fields. The audit row records field names, never previous or next values.
  acceptance:
    given: An administrator changes an isolated user's name and username through REST.
    when: An actor-scoped database constraint rejects the audit insertion, then the administrator retries after
      the constraint is removed and repeats the unchanged update.
    then:
    - Audit failure preserves the complete previous user record and commits no event.
    - Success changes both profile fields and commits one actor-and-subject event containing exactly the name
      and username field names, excluding all previous and next values and credentials.
    - An unchanged retry adds no event and never creates a role-update audit.
    test:
      file: tests/e2e/src/app/account-policy/admin-audit.test.ts
      name: audit.action-admin-user-profile-update
- id: audit.action-admin-oauth-client-create
  category: privacy
  topic: actions
  rule: Admin creates an OAuth client. Client secrets and redirect URI values are never stored in audit metadata.
- id: audit.action-admin-oauth-client-delete
  category: privacy
  topic: actions
  rule: Admin deletes an OAuth client after confirmation.
- id: audit.action-admin-bus-version-activate
  category: privacy
  topic: actions
  rule: Admin activates a timetable version; the version update and audit row are committed together.
- id: audit.action-admin-bus-version-delete
  category: privacy
  topic: actions
  rule: Admin deletes an inactive timetable version; the delete and audit row are committed together.
- id: audit.action-admin-bus-import
  category: privacy
  topic: actions
  rule: Admin imports the static timetable and records only version and aggregate row counts.
- id: audit.action-homework-create
  category: privacy
  topic: actions
  rule: Records actor, verified transport/OAuth attribution, target, sectionId, and changedFields without title
    or description content.
  acceptance:
    given: An isolated user completes device authorization for a resource-bound homework-write bearer and has a persisted OAuth consent grant.
    when: The real REST create endpoint writes a private title and description while a database CHECK first rejects homework audit insertion, then after the CHECK is removed.
    then:
    - Audit failure rolls back homework creation; retry commits the homework, description, edit history, and one audit event.
    - The event contains the verified actor, REST channel, client ID, grant ID, section, and changed fields, without title, content, token, cookie, or personal identity values.
    test:
      file: tests/e2e/src/app/account-policy/homework-audit.test.ts
      name: audit.action-homework-create
- id: audit.action-homework-update
  category: privacy
  topic: actions
  rule: Records the collaborative editor and changed field names in the same transaction as the update.
  acceptance:
    given: A homework belongs to another creator and an isolated collaborative editor has a real resource-bound homework-write bearer.
    when: The REST update endpoint changes title and description with audit insertion rejected by a CHECK, then retries after the CHECK is removed.
    then:
    - The failed attempt preserves the original title and absent description; the retry commits both changes and identifies the collaborative editor.
    - One event records the verified client/grant attribution, section and changed-field names while omitting the private title and description.
    test:
      file: tests/e2e/src/app/account-policy/homework-audit.test.ts
      name: audit.action-homework-update
- id: audit.action-homework-delete
  category: privacy
  topic: actions
  rule: Records the creator/admin actor and target without retaining a title snapshot.
  acceptance:
    given: An isolated homework creator has a real resource-bound homework-write bearer and an active homework with a private title.
    when: The REST delete endpoint runs with a CHECK rejecting the audit event, then retries after the CHECK is removed.
    then:
    - Audit failure preserves the active homework; retry commits deletedAt and exactly one successful event.
    - The event identifies the creator, target, verified client/grant and section; metadata contains no title snapshot or private content.
    test:
      file: tests/e2e/src/app/account-policy/homework-audit.test.ts
      name: audit.action-homework-delete
- id: audit.action-webhook-login
  category: privacy
  topic: actions
  rule: Internal debug login aid (not a product surface). When enabled in a private environment, audit metadata
    records the lookup mode only; secrets and session tokens are never stored.
- id: audit.action-account-create
  category: privacy
  topic: actions
  rule: Records successful account provisioning after the user transaction commits. Credentials, tokens, and
    request bodies are excluded.
- id: audit.action-account-sign-in
  category: privacy
  topic: actions
  rule: Records successful sign-in after the session transaction commits without copying the session token.
  acceptance:
    given: An isolated user registered a real browser passkey, then signed out with no remaining sessions.
    when: The browser completes passkey sign-in and the test reads its new committed session and audit event.
    then:
    - Exactly one successful sign-in event names the user and the new persisted session.
    - The event contains neither the session token nor the private passkey name.
    test:
      file: tests/e2e/src/app/account-policy/audit.test.ts
      name: audit.action-account-sign-in
- id: audit.action-account-sign-out
  category: privacy
  topic: actions
  rule: Records successful sign-out after the session transaction commits.
  acceptance:
    given: An isolated account has a valid persisted session and signed session cookie.
    when: The production Better Auth sign-out endpoint handles that cookie, after which the test reads the session
      and account-sign-out audit rows.
    then:
    - Records successful sign-out after the session transaction commits.
    - Exactly one successful persisted audit row identifies the actor and target without copying private field
      or token values.
    test:
      file: tests/integration/auth-lifecycle-audit.test.ts
      name: audit.action-account-sign-out
- id: audit.action-account-profile-update
  category: privacy
  topic: actions
  rule: Records successful profile changes with an allowlisted changed-field list, never field values or request
    bodies.
  acceptance:
    given: An isolated account has a valid session and an existing display name.
    when: The production Better Auth update-user endpoint receives a new private display name, after which the
      test reads the user and profile-update audit rows.
    then:
    - Records successful profile changes with an allowlisted changed-field list, never field values or request
      bodies.
    - Exactly one successful persisted audit row identifies the actor and target without copying private field
      or token values.
    test:
      file: tests/integration/auth-lifecycle-audit.test.ts
      name: audit.action-account-profile-update
- id: audit.action-account-credential-update
  category: privacy
  topic: actions
  rule: Records successful credential changes with changed-field names only; password and token values are
    excluded.
  acceptance:
    given: An isolated signed-in user has a valid password account and a recent session.
    when: The production change-password endpoint replaces its password; subsequent real sign-in attempts use the old and new passwords.
    then:
    - The persisted password hash changes; the old password fails with 401 and the new password succeeds.
    - One successful credential-update event records only changedFields=password, omitting passwords, hashes, and the session cookie.
    test:
      file: tests/e2e/src/app/account-policy/audit.test.ts
      name: audit.action-account-credential-update
- id: audit.action-account-link
  category: privacy
  topic: actions
  rule: Records successful linking for the authenticated user after commit, excluding provider credentials
    and tokens.
- id: audit.action-account-unlink
  category: privacy
  topic: actions
  rule: Records successful provider unlinking after commit, excluding provider credentials and tokens.
  acceptance:
    given: An isolated account has two linked providers and a valid session; the provider being removed has
      a private access token.
    when: The production Better Auth unlink-account endpoint receives that provider account ID, after which
      the test reads the provider and unlink audit rows.
    then:
    - Records successful provider unlinking after commit, excluding provider credentials and tokens.
    - Exactly one successful persisted audit row identifies the actor and target without copying private field
      or token values.
    test:
      file: tests/integration/auth-lifecycle-audit.test.ts
      name: audit.action-account-unlink
- id: audit.action-account-delete
  category: privacy
  topic: actions
  rule: Records denial or failure while the user exists. The success row deliberately omits the deleted user's
    raw identifier.
- id: audit.action-account-passkey-create
  category: privacy
  topic: actions
  rule: Records committed passkey registration from the final endpoint result, excluding attestation, credential
    material, and request bodies.
  acceptance:
    given: An isolated signed-in user has no passkeys and a real browser virtual WebAuthn authenticator.
    when: The account settings form completes WebAuthn registration and the test reads the committed passkey and audit rows.
    then:
    - One successful registration event identifies the user and committed passkey.
    - Audit rows omit the public key, credential ID, private name, session cookie, and email.
    test:
      file: tests/e2e/src/app/account-policy/audit.test.ts
      name: audit.action-account-passkey-create
- id: audit.action-account-passkey-update
  category: privacy
  topic: actions
  rule: Records committed passkey updates using only the passkey identifier and safe request context.
  acceptance:
    given: An isolated signed-in user has a real browser-registered passkey and recent session.
    when: The production passkey update endpoint receives a new private name and the test reads the persisted passkey and audit row.
    then:
    - The committed name changes and one successful audit event identifies the passkey and user.
    - Audit rows omit the name, key material, credential ID, session cookie, and email.
    test:
      file: tests/e2e/src/app/account-policy/audit.test.ts
      name: audit.action-account-passkey-update
- id: audit.action-account-passkey-delete
  category: privacy
  topic: actions
  rule: Records committed passkey deletion using only the passkey identifier and safe request context.
  acceptance:
    given: An isolated signed-in user has a real browser-registered passkey and a usable password account that permits removal.
    when: The production passkey deletion endpoint removes the key and the test reads the passkey table and audit row.
    then:
    - The key is absent and one successful deletion event identifies the removed passkey and user.
    - Audit rows omit the name, key material, credential ID, session cookie, and email.
    test:
      file: tests/e2e/src/app/account-policy/audit.test.ts
      name: audit.action-account-passkey-delete
- id: audit.action-account-session-revoke
  category: privacy
  topic: actions
  rule: Records successful current-user session revocation after commit without copying session tokens.
  acceptance:
    given: An isolated signed-in user has one active browser session and a second persisted session.
    when: The production revoke-session endpoint receives the second session token.
    then:
    - Only the selected session is removed and one successful audit event names its ID and user.
    - Neither session token nor the signed cookie appears in the audit rows.
    test:
      file: tests/e2e/src/app/account-policy/audit.test.ts
      name: audit.action-account-session-revoke
- id: audit.action-account-calendar-token-create
  category: privacy
  topic: actions
  rule: Records successful token creation without storing the calendar feed token value.
  acceptance:
    given: An isolated signed-in user has a null calendar-feed token and a recent session.
    when: Two real workspace subscription page requests request the private feed and the test reads the persisted token and audit events.
    then:
    - A token is persisted and exactly one successful creation event names the actor and calendar-feed target.
    - Repeated reads do not add creation events; token values, session cookies, and email are absent from the audit rows.
    test:
      file: tests/e2e/src/app/account-policy/audit.test.ts
      name: audit.action-account-calendar-token-create
- id: audit.action-account-calendar-token-rotate
  category: privacy
  topic: actions
  rule: Records denied, failed, and successful rotation without storing old or new token values.
  acceptance:
    given: An isolated signed-in user has an existing calendar token and a persisted session.
    when: The real settings action runs with an old session, then a fresh session while a database CHECK rejects token writes, then after the constraint is removed.
    then:
    - The three attempts return 403, 500, and 303 with denied, failure, and success audit outcomes.
    - Refused and failed attempts retain the old token; success changes it. Neither token, session cookie, email, nor private request body appears in audit rows.
    test:
      file: tests/e2e/src/app/account-policy/audit.test.ts
      name: audit.action-account-calendar-token-rotate
- id: audit.action-oauth-authorization-grant
  category: privacy
  topic: actions
  rule: Records a grant atomically with authorization state and verification-code creation, excluding codes,
    tokens, state, and request bodies.
- id: audit.action-oauth-authorization-update
  category: privacy
  topic: actions
  rule: Records an authorization scope change atomically with authorization state using scope counts and changed-field
    names only.
- id: audit.action-oauth-authorization-revoke
  category: privacy
  topic: actions
  rule: Records revocation atomically with authorization deletion using safe identifiers and counts only.
audit_actions:
- action: comment_create
  trigger: POST /api/community/comments or MCP community_comment_create
  description: Audit event for comment create.
  requirement_refs:
  - audit.action-comment-create
- action: comment_edit
  trigger: PATCH /api/community/comments/[id] or MCP community_comment_update
  description: Audit event for comment edit.
  requirement_refs:
  - audit.action-comment-edit
- action: comment_delete
  trigger: DELETE /api/community/comments/[id], DELETE /api/community/comments/batch, GraphQL commentDelete/commentsDelete,
    MCP community_comment_delete, or registered GraphQL operations
  description: Audit event for comment delete.
  requirement_refs:
  - audit.action-comment-delete
- action: comment_react
  trigger: POST /api/community/comments/[id]/reactions, DELETE /api/community/comments/[id]/reactions, MCP
    community_comment_reaction_add, or MCP community_comment_reaction_remove
  description: Audit event for comment react.
  requirement_refs:
  - audit.action-comment-react
- action: description_edit
  trigger: POST /api/community/descriptions or MCP community_description_set
  description: Audit event for description edit.
  requirement_refs:
  - audit.action-description-edit
- action: upload_delete
  trigger: DELETE /api/workspace/uploads/[id], GraphQL uploadDelete, MCP workspace_upload_delete, or the registered
    GraphQL operation
  description: Audit event for upload delete.
  requirement_refs:
  - audit.action-upload-delete
- action: section_retire
  trigger: Committed static Section snapshot import
  description: Audit event for section retire.
  requirement_refs:
  - audit.action-section-retire
- action: section_reactivate
  trigger: Committed static Section snapshot import
  description: Audit event for section reactivate.
  requirement_refs:
  - audit.action-section-reactivate
- action: admin_user_suspend
  trigger: POST /api/admin/suspensions
  description: Audit event for admin user suspend.
  requirement_refs:
  - audit.action-admin-user-suspend
- action: admin_user_unsuspend
  trigger: PATCH /api/admin/suspensions/[id]
  description: Audit event for admin user unsuspend.
  requirement_refs:
  - audit.action-admin-user-unsuspend
- action: admin_comment_moderate
  trigger: PATCH /api/admin/comments/[id]
  description: Audit event for admin comment moderate.
  requirement_refs:
  - audit.action-admin-comment-moderate
- action: admin_description_moderate
  trigger: PATCH /api/admin/descriptions/[id] or /admin/moderation description action
  description: Audit event for admin description moderate.
  requirement_refs:
  - audit.action-admin-description-moderate
- action: admin_user_role_update
  trigger: PATCH /api/admin/users/[id]
  description: Audit event for admin user role update.
  requirement_refs:
  - audit.action-admin-user-role-update
- action: admin_user_profile_update
  trigger: PATCH /api/admin/users/[id]
  description: Audit event for admin user profile update.
  requirement_refs:
  - audit.action-admin-user-profile-update
- action: admin_oauth_client_create
  trigger: POST /admin/oauth
  description: Audit event for admin oauth client create.
  requirement_refs:
  - audit.action-admin-oauth-client-create
- action: admin_oauth_client_delete
  trigger: POST /admin/oauth
  description: Audit event for admin oauth client delete.
  requirement_refs:
  - audit.action-admin-oauth-client-delete
- action: admin_bus_version_activate
  trigger: POST /admin/bus
  description: Audit event for admin bus version activate.
  requirement_refs:
  - audit.action-admin-bus-version-activate
- action: admin_bus_version_delete
  trigger: POST /admin/bus
  description: Audit event for admin bus version delete.
  requirement_refs:
  - audit.action-admin-bus-version-delete
- action: admin_bus_import
  trigger: POST /admin/bus
  description: Audit event for admin bus import.
  requirement_refs:
  - audit.action-admin-bus-import
- action: homework_create
  trigger: POST /api/community/section-homeworks
  description: Audit event for homework create.
  requirement_refs:
  - audit.action-homework-create
- action: homework_update
  trigger: PATCH /api/community/section-homeworks/[id]
  description: Audit event for homework update.
  requirement_refs:
  - audit.action-homework-update
- action: homework_delete
  trigger: DELETE /api/community/section-homeworks/[id]
  description: Audit event for homework delete.
  requirement_refs:
  - audit.action-homework-delete
- action: webhook_login
  trigger: Explicitly enabled non-production internal debug login
  description: Audit event for webhook login.
  requirement_refs:
  - audit.action-webhook-login
- action: account_create
  trigger: POST /api/auth/sign-up or another Better Auth user-provisioning endpoint
  description: Audit event for account create.
  requirement_refs:
  - audit.action-account-create
- action: account_sign_in
  trigger: POST /api/auth/sign-in or /api/auth/passkey/verify-authentication
  description: Audit event for account sign in.
  requirement_refs:
  - audit.action-account-sign-in
- action: account_sign_out
  trigger: POST /api/auth/sign-out
  description: Audit event for account sign out.
  requirement_refs:
  - audit.action-account-sign-out
- action: account_profile_update
  trigger: POST /api/auth/update-user, /api/auth/change-email, or settings profile action
  description: Audit event for account profile update.
  requirement_refs:
  - audit.action-account-profile-update
- action: account_credential_update
  trigger: POST /api/auth/change-password or /api/auth/set-password
  description: Audit event for account credential update.
  requirement_refs:
  - audit.action-account-credential-update
- action: account_link
  trigger: POST /api/auth/link-social or the settings account-link action after recent authentication
  description: Audit event for account link.
  requirement_refs:
  - audit.action-account-link
- action: account_unlink
  trigger: POST /api/auth/unlink-account or settings linked-account action
  description: Audit event for account unlink.
  requirement_refs:
  - audit.action-account-unlink
- action: account_delete
  trigger: POST /api/auth/delete-user or settings account-deletion action
  description: Audit event for account delete.
  requirement_refs:
  - audit.action-account-delete
- action: account_passkey_create
  trigger: POST /api/auth/passkey/verify-registration
  description: Audit event for account passkey create.
  requirement_refs:
  - audit.action-account-passkey-create
- action: account_passkey_update
  trigger: POST /api/auth/passkey/update-passkey
  description: Audit event for account passkey update.
  requirement_refs:
  - audit.action-account-passkey-update
- action: account_passkey_delete
  trigger: POST /api/auth/passkey/delete-passkey
  description: Audit event for account passkey delete.
  requirement_refs:
  - audit.action-account-passkey-delete
- action: account_session_revoke
  trigger: POST /api/auth/revoke-session, /api/auth/revoke-sessions, or /api/auth/revoke-other-sessions
  description: Audit event for account session revoke.
  requirement_refs:
  - audit.action-account-session-revoke
- action: account_calendar_token_create
  trigger: First authorized initialization of the current user calendar feed credential
  description: Audit event for account calendar token create.
  requirement_refs:
  - audit.action-account-calendar-token-create
- action: account_calendar_token_rotate
  trigger: POST /account/settings/security?/rotateCalendarToken
  description: Audit event for account calendar token rotate.
  requirement_refs:
  - audit.action-account-calendar-token-rotate
- action: oauth_authorization_grant
  trigger: POST /oauth/consent grant action
  description: Audit event for oauth authorization grant.
  requirement_refs:
  - audit.action-oauth-authorization-grant
- action: oauth_authorization_update
  trigger: POST /oauth/consent or PATCH /api/auth/oauth2/consent
  description: Audit event for oauth authorization update.
  requirement_refs:
  - audit.action-oauth-authorization-update
- action: oauth_authorization_revoke
  trigger: DELETE /api/auth/oauth2/consent or settings authorization action
  description: Audit event for oauth authorization revoke.
  requirement_refs:
  - audit.action-oauth-authorization-revoke
topics:
- id: writer
  title: Writer
- id: actions
  title: Audit event contracts
