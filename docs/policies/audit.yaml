kind: policy
id: audit
title: Audit events and retention
requirements:
- id: audit.writer-1
  category: privacy
  topic: writer
  rule: AuditLog is sole store.
- id: audit.writer-2
  category: privacy
  topic: writer
  rule: Mutations write trails transactionally where practical; Better Auth hooks contain logging failures.
- id: audit.writer-3
  category: privacy
  topic: writer
  rule: Static imports write lifecycle rows transactionally.
- id: audit.writer-4
  category: privacy
  topic: writer
  rule: Six-hour maintenance clears network data at 30 days, attribution at 90, and events at 400 via a maintenance-only
    SECURITY DEFINER function.
audit_actions:
- action: comment_create
  trigger: POST /api/community/comments or MCP community_comment_create
  description: User creates a new comment on an object. MCP-originated writes include metadata.source=mcp.
- action: comment_edit
  trigger: PATCH /api/community/comments/[id] or MCP community_comment_update
  description: User edits their own comment. MCP-originated writes include metadata.source=mcp.
- action: comment_delete
  trigger: DELETE /api/community/comments/[id], DELETE /api/community/comments/batch, GraphQL commentDelete/commentsDelete,
    MCP community_comment_delete, or registered GraphQL operations
  description: User deletes their own comment. Transport-originated writes include safe metadata.source where
    available.
- action: comment_react
  trigger: POST /api/community/comments/[id]/reactions, DELETE /api/community/comments/[id]/reactions, MCP
    community_comment_reaction_add, or MCP community_comment_reaction_remove
  description: User adds or removes a reaction on an active visible comment. MCP-originated writes include
    metadata.source=mcp.
- action: description_edit
  trigger: POST /api/community/descriptions or MCP community_description_set
  description: User updates an object description (content changed). The description row, edit history, and
    audit row are committed together.
- action: upload_delete
  trigger: DELETE /api/workspace/uploads/[id], GraphQL uploadDelete, MCP workspace_upload_delete, or the registered
    GraphQL operation
  description: User deletes an upload they own. Transport-originated writes include metadata.source where available.
    After storage deletion succeeds, metadata deletion and the audit row are committed together.
- action: section_retire
  trigger: Reserved
  description: The importer marks one missing in-scope Section inactive without deleting the row or children.
    The same transaction records the Section target, source snapshot SHA-256, observation time, and jwId.
- action: section_reactivate
  trigger: Reserved
  description: The importer clears retiredAt when a Section reappears. The same transaction records the Section
    target, source snapshot SHA-256, observation time, jwId, and previous retiredAt.
- action: admin_user_suspend
  trigger: POST /api/admin/suspensions
  description: Admin suspends a user account. The suspension change and audit row are committed together.
- action: admin_user_unsuspend
  trigger: PATCH /api/admin/suspensions/[id]
  description: Admin lifts a user suspension. The suspension change and audit row are committed together.
- action: admin_comment_moderate
  trigger: PATCH /api/admin/comments/[id]
  description: Admin hides or moderates a comment. The moderation change and audit row are committed together.
- action: admin_description_moderate
  trigger: PATCH /api/admin/descriptions/[id] or /admin/moderation description action
  description: Admin updates description content from the moderation workflow. The description row, edit history,
    and audit row are committed together.
- action: admin_user_role_update
  trigger: PATCH /api/admin/users/[id]
  description: Admin changes administrator access. The user update and an audit row containing changedFields
    only are committed together.
- action: admin_user_profile_update
  trigger: PATCH /api/admin/users/[id]
  description: Admin changes managed profile fields. The audit row records field names, never previous or next
    values.
- action: admin_oauth_client_create
  trigger: POST /admin/oauth
  description: Admin creates an OAuth client. Client secrets and redirect URI values are never stored in audit
    metadata.
- action: admin_oauth_client_delete
  trigger: POST /admin/oauth
  description: Admin deletes an OAuth client after confirmation.
- action: admin_bus_version_activate
  trigger: POST /admin/bus
  description: Admin activates a timetable version; the version update and audit row are committed together.
- action: admin_bus_version_delete
  trigger: POST /admin/bus
  description: Admin deletes an inactive timetable version; the delete and audit row are committed together.
- action: admin_bus_import
  trigger: POST /admin/bus
  description: Admin imports the static timetable and records only version and aggregate row counts.
- action: homework_create
  trigger: POST /api/community/section-homeworks
  description: Records actor, verified transport/OAuth attribution, target, sectionId, and changedFields without
    title or description content.
- action: homework_update
  trigger: PATCH /api/community/section-homeworks/[id]
  description: Records the collaborative editor and changed field names in the same transaction as the update.
- action: homework_delete
  trigger: DELETE /api/community/section-homeworks/[id]
  description: Records the creator/admin actor and target without retaining a title snapshot.
- action: webhook_login
  trigger: Reserved
  description: Internal debug login aid (not a product surface). When enabled in a private environment, audit
    metadata records the lookup mode only; secrets and session tokens are never stored.
- action: account_create
  trigger: POST /api/auth/sign-up or another Better Auth user-provisioning endpoint
  description: Records successful account provisioning after the user transaction commits. Credentials, tokens,
    and request bodies are excluded.
- action: account_sign_in
  trigger: POST /api/auth/sign-in or /api/auth/passkey/verify-authentication
  description: Records successful sign-in after the session transaction commits without copying the session
    token.
- action: account_sign_out
  trigger: POST /api/auth/sign-out
  description: Records successful sign-out after the session transaction commits.
- action: account_profile_update
  trigger: POST /api/auth/update-user, /api/auth/change-email, or settings profile action
  description: Records successful profile changes with an allowlisted changed-field list, never field values
    or request bodies.
- action: account_credential_update
  trigger: POST /api/auth/change-password or /api/auth/set-password
  description: Records successful credential changes with changed-field names only; password and token values
    are excluded.
- action: account_link
  trigger: POST /api/auth/link-social or the settings account-link action after recent authentication
  description: Records successful linking for the authenticated user after commit, excluding provider credentials
    and tokens.
- action: account_unlink
  trigger: POST /api/auth/unlink-account or settings linked-account action
  description: Records successful provider unlinking after commit, excluding provider credentials and tokens.
- action: account_delete
  trigger: POST /api/auth/delete-user or settings account-deletion action
  description: Records denial or failure while the user exists. The success row deliberately omits the deleted
    user's raw identifier.
- action: account_passkey_create
  trigger: POST /api/auth/passkey/verify-registration
  description: Records committed passkey registration from the final endpoint result, excluding attestation,
    credential material, and request bodies.
- action: account_passkey_update
  trigger: POST /api/auth/passkey/update-passkey
  description: Records committed passkey updates using only the passkey identifier and safe request context.
- action: account_passkey_delete
  trigger: POST /api/auth/passkey/delete-passkey
  description: Records committed passkey deletion using only the passkey identifier and safe request context.
- action: account_session_revoke
  trigger: POST /api/auth/revoke-session, /api/auth/revoke-sessions, or /api/auth/revoke-other-sessions
  description: Records successful current-user session revocation after commit without copying session tokens.
- action: account_calendar_token_create
  trigger: POST /settings subscription calendar initialization
  description: Records successful token creation without storing the calendar feed token value.
- action: account_calendar_token_rotate
  trigger: POST /settings subscription calendar token rotation
  description: Records denied, failed, and successful rotation without storing old or new token values.
- action: oauth_authorization_grant
  trigger: POST /oauth/consent grant action
  description: Records a grant atomically with authorization state and verification-code creation, excluding
    codes, tokens, state, and request bodies.
- action: oauth_authorization_update
  trigger: POST /oauth/consent or PATCH /api/auth/oauth2/consent
  description: Records an authorization scope change atomically with authorization state using scope counts
    and changed-field names only.
- action: oauth_authorization_revoke
  trigger: DELETE /api/auth/oauth2/consent or settings authorization action
  description: Records revocation atomically with authorization deletion using safe identifiers and counts
    only.
topics:
- id: writer
  title: Writer
