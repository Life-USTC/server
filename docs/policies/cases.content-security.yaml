kind: policy
id: cases.content-security
title: 'Cross-feature scenarios: content-security'
requirements:
- id: cases.content-security.suspended-user-1
  category: authorization
  topic: suspended-user
  rule: A suspended user cannot create a comment through any supported mutation surface, even when the caller
    otherwise has the comment-write OAuth scope.
  acceptance:
    given: An isolated active user has a browser session and separately authorized resource-bound REST, GraphQL, and MCP OAuth grants containing community.comment:write.
    when: The user creates one comment through each of the four principals, is suspended, repeats every mutation, and opens the section composer in English and Chinese.
    then:
    - All four initial writes succeed; after suspension the REST principals return 403 Suspended, GraphQL returns 403 FORBIDDEN, and MCP returns its suspended domain error.
    - The browser shows the localized suspension heading and disables its comment editor.
    - Exactly the four initial comments remain persisted while the write scope is still granted.
    test:
      file: tests/e2e/src/app/account-policy/comment-security.test.ts
      name: cases.content-security.suspended-user-1
- id: cases.content-security.upload-attachment-download-1
  category: authorization
  topic: upload-attachment-download
  rule: Each attachment-byte request checks the current upload and parent-content authorization before returning
    bytes. A previously issued attachment URL does not bypass ownership, visibility, moderation, or deletion
    checks.
- id: cases.content-security.destructive-actions-1
  category: presentation
  topic: destructive-actions
  rule: The deletion UI announces success, permission refusal, or request failure to assistive technology.
    Failed deletion keeps the item visible and does not announce success.
- id: cases.content-security.destructive-actions-2
  category: presentation
  topic: destructive-actions
  rule: The suspension UI announces success, permission refusal, or request failure to assistive technology
    and updates the displayed suspension state only after success.
- id: cases.content-security.destructive-actions-3
  category: presentation
  topic: destructive-actions
  rule: The moderation-hide UI announces success, permission refusal, or request failure to assistive technology
    and changes the displayed visibility only after success.
refs:
- feature: comment
  capability: object-comment-section
- feature: upload
  capability: comment-attachment-download
- feature: security
  capability: destructive-action-confirmation
topics:
- id: suspended-user
  title: Suspended user
- id: upload-attachment-download
  title: Upload attachment download
- id: destructive-actions
  title: Destructive actions
