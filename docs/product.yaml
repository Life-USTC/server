kind: product
id: life-ustc
title: Life@USTC
priorities:
- student learning workspace
- public campus info browser
- controlled REST / GraphQL / MCP surface
- admin maintenance surface
surfaces:
- web
- rest
- graphql
- mcp
roles:
- id: anon
  description: Unauthenticated principal. Availability of public information is declared per transport; some
    public-data tools still require an OAuth-authorized client.
- id: user
  description: Authenticated account. Feature permissions, ownership, suspension state, and recent authentication
    are evaluated independently for each action.
- id: admin
  description: Authenticated account with explicit governance authority. Administrative privileges apply only
    on the declared governance surfaces.
terms:
- name: sectionSubscription
  meaning: In-app section subscription; not equivalent to official course enrollment.
- name: homework
  meaning: Class-attached learning task; completion state is tracked per user independently.
- name: todo
  meaning: Personal user task; not attached to any class.
clients:
- id: first-party
  description: Web and trusted first-party clients use the authentication declared by each binding.
- id: agent
  description: Delegated OAuth or MCP client acting for a user. Token audience and granted scopes constrain
    the subject’s feature permissions; delegated access does not inherit administrator powers.
