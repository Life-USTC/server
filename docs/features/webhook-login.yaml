kind: feature
id: webhook-login
name: Webhook Login
areas:
- platform
policy_refs:
- interface-hierarchy
access:
  anon: Not a public product entry point.
  user: Not applicable.
  admin: Internal ops only when explicitly enabled in a private environment.
  agent: Not applicable.
requirements:
- id: webhook-login.no-session-in-body
  category: privacy
  rule: When used, the session token must never appear in JSON response bodies.
  acceptance:
    given: The internal session adapter returns a session containing a secret token.
    when: The enabled debug-login handler creates its response.
    then:
    - The response has exactly the safe identity/expiry fields.
    - The session token is absent from the JSON body.
    - Session-cookie establishment is delegated to the auth cookie helper.
    test:
      file: tests/unit/lib/auth/webhook-login-handler.test.ts
      name: webhook-login.no-session-in-body
- id: webhook-login.explicit-enablement
  category: authorization
  rule: Internal debug-login endpoints are registered only when explicitly enabled and a nonempty shared
    secret is configured.
  acceptance:
    given: Enabled, disabled, and missing-secret private-environment configurations.
    when: The actual authentication plugin list is constructed.
    then:
    - Only the explicitly enabled configuration with a secret registers the internal debug-login endpoint.
    test:
      file: tests/unit/lib/auth/webhook-login-enablement.test.ts
      name: webhook-login.explicit-enablement
- id: webhook-login.shared-secret
  category: authorization
  rule: Internal debug login rejects missing or incorrect shared secrets before looking up a user or creating
    a session.
  acceptance:
    given: Missing, wrong, or differently sized credentials.
    when: The internal login handler validates its caller.
    then:
    - The response is 403 and neither identity lookup nor session creation occurs.
    test:
      file: tests/unit/lib/auth/webhook-login-handler.test.ts
      name: webhook-login.shared-secret
capabilities:
  webhook-login:
    title: Webhook Login
    auth: internal
    web: unavailable
    rest: unavailable
    graphql: unavailable
    mcp: unavailable
    presentation:
      items:
      - Internal debugging aid only
      - Session established via cookie; never returned in JSON bodies
rationale:
- Webhook login is an internal debugging aid, not a Life@USTC product capability. Do not document enablement
  flags, paths, or rate limits in public materials.
