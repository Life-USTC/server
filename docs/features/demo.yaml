kind: feature
id: demo
name: Production Demo
areas:
- platform
policy_refs:
- interface-hierarchy
- ui
- permission-ui
- rendering-and-cache
access:
  anon: Demo mode is not shipped as a public product surface yet.
  user: Ordinary signed-in sessions are never converted to demo mode.
  admin: Admin capabilities are never simulated.
  agent: Demo mode is unavailable to OAuth and MCP clients.
requirements:
- id: demo.planned-only
  category: behavior
  rule: Demo mode has no public authentication entry point or supported REST, GraphQL, or MCP capability.
  rationale: Demo mode is an unshipped product experiment. A future design requires a separate product
    decision before any public surface is added.
- id: demo.no-live-writes
  category: authorization
  rule: Ordinary authenticated sessions cannot be converted into demo principals, and public inputs cannot
    impersonate a real user through a demo identity.
  rationale: Any future demo must isolate simulated state from durable business data; no such write capability
    is currently supported.
capabilities:
  demo-bootstrap:
    title: Demo Bootstrap
    auth: anon
    web: planned
    rest: unavailable
    graphql: unavailable
    mcp: unavailable
    presentation:
      items:
      - Demo mode unavailable
