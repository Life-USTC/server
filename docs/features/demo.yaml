kind: feature
id: demo
name: Production Demo
areas:
- platform
access:
  anon: Demo mode is not shipped as a public product surface yet.
  user: Ordinary signed-in sessions are never converted to demo mode.
  admin: Admin capabilities are never simulated.
  agent: Demo mode is unavailable to OAuth and MCP clients.
requirements:
- id: demo.planned-only
  category: behavior
  rule: Demo authentication is a planned product experiment. Implementation details, bootstrap URLs, kill
    switches, and overlay formats stay out of public docs until the feature ships.
- id: demo.no-live-writes
  category: authorization
  rule: Any future demo mode must not write business rows or impersonate real users.
- id: demo.ordinary-principals-unchanged
  category: authorization
  rule: Anonymous, authenticated, admin, GraphQL, REST, OAuth, and MCP behavior outside an explicit demo
    principal remains unchanged.
capabilities:
  demo-bootstrap:
    title: Demo Bootstrap
    auth: anon
    web: planned
    rest: unavailable
    graphql: unavailable
    mcp: unavailable
    presentation:
      items:
      - Persistent demo-mode banner when active
      - Clear exit-demo action
      - No demo credential on the sign-in page
