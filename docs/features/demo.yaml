kind: feature
id: demo
name: Read-only Demo
areas:
- platform
policy_refs:
- interface-hierarchy
- ui
- permission-ui
- rendering-and-cache
access:
  anon: An explicit demo gate enables entry from the existing sign-in page; the gate is unset by default.
  user: Ordinary signed-in sessions are never converted to demo mode.
  admin: Admin capabilities are never simulated.
  agent: Demo identity supplies no OAuth, GraphQL or MCP authority.
requirements:
- id: demo.young-workspace-projection
  category: privacy
  rule: Existing personal activity subscriptions and notifications project fixed fictional facts from the
    same 42-event and 22-organizer graph, without a real account, notification refresh or private reader.
    Twenty-one event and organizer subscriptions and twenty-three notifications retain the ordinary
    twenty-row continuation, All/Unread filtering, ordering, query limits and redirects. Twenty-one
    notifications are unread at the fixed Shanghai reference clock. Public subscription facts, Home,
    navigation counts and the combined personal calendar derive from this graph. Reminder and digest
    samples agree with fixed source times and expiration rules, without claiming a collector or delivery.
    Trusted page/data/API reads branch before authentication and refresh services. Subscription and
    mark-read writes stay forbidden, with native disabled controls and handler guards. Internal Manage,
    detail and calendar navigation remain readable; external registration stays disabled. Matching root
    and page epochs retire private rows, counts and old locale responses on mode, owner, expiry and exit.
  acceptance:
    given: A trusted Demo and independently prepared ordinary subscriptions and notifications.
    when: Read all three views, continue each page, filter unread, follow internal details and switch owners.
    then:
    - Exact list, detail, calendar and navigation facts agree across SSR and API without database changes.
    - Reminder flags and all five notification kinds remain visibly fixed fictional read-only examples.
    - Late ordinary reads and retired samples cannot restore previous rows or counts; writes never run.
    test:
      file: tests/e2e/src/app/demo/young-workspace.test.ts
      name: demo young workspace reads fixed facts en-us 1280
- id: demo.room-map-projection
  category: privacy
  rule: The existing classroom directory, lookup, preview and zoom controls project one closed
    fictional floor graph. DEMO-101 is highlighted, DEMO-1 has an overview, and DEMO-NONE honestly
    has no image. Original room-code normalization and validation remain intact; foreign codes
    never fall through to real manifests, building rules, database or static upstream reads.
    Only the two associated same-origin code-native schematic images can be loaded or opened;
    their bilingual labels explicitly disclaim actual university geography. Image GET, HEAD,
    content type and conditional ETags retain private Demo cache isolation. Shared previews receive
    their actual page owner and locale and compare them to the root session generation, retiring
    old maps and requests before applying another mode or language. Existing classroom and exam
    room facts stay unchanged, including unknowns; ordinary map readers keep their behavior.
  acceptance:
    given: A trusted Demo, alongside an independently readable ordinary map for the same room code.
    when: Browse the directory, query all three states, normalize a code, open and zoom a map,
      read its local images, switch identity or locale and attempt foreign reads or writes.
    then:
    - Directory, page data, map JSON and associated images agree without durable or external effects.
    - Only valid closed codes and image names succeed; unknown codes return 404 without a real-service fallback.
    - All previews discard old identity and language responses while preserving ordinary lookup and zoom behavior.
    test:
      file: tests/e2e/src/app/demo/rooms.test.ts
      name: 'demo rooms: fixed directory, map statuses and zoom en-us 1280'
- id: demo.search-projection
  category: privacy
  rule: The existing global search page, top-bar dialog and GET /api/search browse the same
    fictional catalog and workspace graph. Catalog word and SQL-pattern semantics, query aliases,
    validation, scopes, group order and per-group limits match ordinary search. Workspace scope
    includes the six homework and three todo samples, including historical and completed facts;
    it never grants a real principal. Website matches retain the public bilingual/pinyin search
    and enter the existing directory at a known visible entry, without external visits. Trusted
    Demo reads branch before ordinary authentication, database, caches or durable observations,
    with private no-store responses. Invalid, expired or mixed identities and all writes remain
    rejected; ordinary viewers keep their existing search and external-link behavior.
  acceptance:
    given: A trusted Demo and an ordinary owner with independently seeded searchable private records.
    when: Search both scopes and languages, exercise aliases and validation, and follow known results.
    then:
    - Groups, identifiers, localized labels and destinations agree with the existing fictional graph.
    - Ordinary positive controls return their own records; Demo never returns those private records.
    - Complete persisted state remains unchanged and Demo performs no binding or external effects.
    test:
      file: tests/integration/rest/demo/search.test.ts
      name: demo search seals shared catalog and workspace facts and effects en-us
- id: demo.website-projection
  category: privacy
  rule: The existing website directory retains its static names, URLs, slugs, groups and bilingual
    text, pinyin and field filters. Demo personal facts are explicitly fictional and fixed. jw and
    library are pinned; jw, library, mail and icourse have 12, 7, 4 and 2 visits, with zero elsewhere.
    Website SSR, private read DTOs and the four-link Home and calendar overview share these facts
    without a real viewer, database or external service. Public catalog JSON continues to omit all
    personal fields. Native pin, unpin, visit and external credit actions are disabled from SSR;
    direct mutations and the visit resolver remain refused without redirects or click writes.
    Root/page session and locale ownership retire private preference responses across identity,
    language, exit and re-entry. Ordinary viewers keep their existing catalog and preferences.
  acceptance:
    given: A trusted Demo and an ordinary owner with independently readable different pin and visit facts.
    when: Browse and filter the directory, inspect Home, switch owners and locales, and attempt external actions or writes.
    then:
    - The full catalog and fixed personal facts agree across pages and their existing read contracts.
    - Empty results, pinyin search and same-field and cross-field filters remain available.
    - Disabled native controls and the authoritative request boundary prevent every durable or external effect.
    - A late ordinary preference response cannot replace the current fictional pin or visit counts.
    test:
      file: tests/integration/rest/demo/links.test.ts
      name: demo websites seal shared facts, private preferences and effects en-us
- id: demo.young-projection
  category: privacy
  rule: The existing Young event list, detail, calendar, organizer directory and organizer detail
    project one sealed bilingual graph of 42 fictional events and 22 organizers. Home preserves
    its five existing titles, dates, keys and fictional metadata and links to these known details.
    Event, organizer and organizer-event twenty-row pages continue actual fixture records. Web
    table choice filters retain same-field OR and cross-field AND, numeric and date operations;
    REST keeps its existing single-category query contract. Activity and registration clocks,
    missing dates, cross-day windows, signup membership and missing sources remain distinct facts.
    Shanghai time is fixed at 2026-09-24T09:00:00+08:00; public day, Sunday week and naturally padded
    month ranges and today indicators use that same clock. Calendar conflicts project the existing
    Demo personal calendar through the ordinary interval rules, without a private reader or viewer.
    Known event discussion targets retain named fictional threads, twenty-root and ten-reply
    windows, reactions and permalinks. Poster reads serve only graph-associated local fixed raster
    bytes. Trusted Demo branches bypass database, R2, cache, provider and upstream reads. Subscription
    facts are explicitly fixed read-only samples; subscription, follow, reminder and
    external signup controls are disabled from SSR; internal management remains readable. Root/page epochs retire old rows and component
    reads across mode, locale, exit and re-entry. Ordinary user delegates and behavior remain intact.
    Unsupported ordinary families remain under the parent full-site task; disabled controls do not complete them.
  acceptance:
    given: A trusted Demo in either locale and an independently readable ordinary Young event.
    when: Browse all five pages, continue their pages, filter, switch calendar axes and ranges,
      read fixed discussions and posters, switch owners and attempt foreign reads or writes.
    then:
    - Counts, Home facts, organizers and the three continued lists agree with the fixed graph.
    - Sunday ranges, signup and activity dates, unknowns and known personal conflicts stay distinct.
    - Named discussion pagination, focus and local poster bytes preserve the ordinary read contracts.
    - Unknown IDs or poster paths never fall back; writes and external actions remain disabled.
    - Late ordinary rows or retired locale samples cannot overwrite the current Demo owner.
    test:
      file: tests/integration/rest/demo/young.test.ts
      name: demo Young graph, fixed dates and sealed effects en-us
- id: demo.news-projection
  category: privacy
  rule: Existing news list, detail and source pages project 22 sealed bilingual fictional publications.
    Home notices preserve their first five titles, dates and order and link to those same details.
    The existing twenty-row pagination, explicit known reprint pair, source and organization filters,
    empty source, first-scalar and repeated multi-value query semantics remain available. Fixed source
    counts and latest dates derive from that graph; ordinary SQL and normalization remain unchanged.
    Markdown, tables and a local raster diagram retain the existing reader. Current localized revisions
    alone authorize body_markdown, media and asset bytes; body_html and raw_page are not associated.
    Image source IDs hash original URL text, while object keys and ETags identify actual content bytes.
    Trusted reads bypass real database, R2, cache and origin adapters. Source-page external links are
    visibly disabled; a fixed local asset download is read-only. Root/page epochs and the existing
    endless-list identity guards retire old responses across mode, locale and session changes.
    Writes, ingestion, management and unsupported families remain forbidden; ordinary readers delegate
    to the existing services and retain their behavior. Unsupported ordinary families remain under the parent full-site task.
  acceptance:
    given: A trusted demo in either locale and viewport and an independently readable ordinary publication.
    when: Browse news, continue pages, filter and fold the known corpus, follow Home and source links,
      read Markdown, diagram and attachment bytes, switch identities and attempt foreign reads or writes.
    then:
    - The unfolded list has 22 publications and the explicitly related reprint pair folds to 21 groups.
    - Source counts, empty pages and Home facts agree with the same graph, without real business IO.
    - Known revision objects, image URL IDs, bytes, content types, HEAD and conditional ETags agree.
    - Unknown IDs, hashes, kinds and invalid values never fall through to real data or providers.
    - External actions stay disabled and late ordinary rows cannot reappear in demo mode.
    test:
      file: tests/integration/rest/demo/news.test.ts
      name: demo news seals pages, queries, revision bytes and effects en-us
- id: demo.campus-projection
  category: privacy
  rule: The existing weather, bus planner and SVG route map share sealed fictional data and the
    fixed reference clock with Home. Weather preserves both campuses, hourly and daily forecasts
    without inventing a provider or observation. Timetable, route search, departures and the schematic
    map use one closed graph; valid date and day-type browsing is read-only. Trusted demo SSR,
    page-data and exact read APIs branch before real services, authentication and durable adapters.
    Unknown query keys, duplicate keys, real IDs, unrelated dates and versions fail closed.
    Demo never reads, removes or writes ordinary recent-route storage or account preferences.
    Page and root session epochs retire old planners and reads across identity changes. Ordinary
    viewers retain existing preferences, live clocks and service behavior. No external map is loaded.
  acceptance:
    given: A trusted demo in either locale and viewport, alongside ordinary browser preferences.
    when: Browse weather, planner filters and the schematic map, read their APIs, switch identities
      and attempt unknown targets, invalid queries or writes.
    then:
    - Home, full pages, map and APIs agree on fixed weather, routes, stops, trips and reference time.
    - Fictional labeling is visible; no real provider, bus, database or storage effects occur.
    - Demo browsing does not access ordinary recent-route preferences, and late ordinary reads cannot reappear.
    - Existing anonymous and signed-in behavior remains available outside demo mode.
    test:
      file: tests/integration/rest/demo/campus.test.ts
      name: demo campus isolates fixed weather, bus graph and effects en-us
- id: demo.home-projection
  category: privacy
  rule: The existing Home retains personal overview, campus snapshot, notice and activity summaries and
    the searchable feature directory. Trusted demo SSR, page-data and exact Home internal reads use
    sealed fictional data without database, KV, object storage or provider access. Personal overview
    derives from the existing academic samples and fixed reference clock, without granting a real
    authenticated viewer. Session generations own client reads; exit, re-entry and late responses cannot
    restore an earlier identity. Public sample content is explicitly fictional, never an official notice,
    current weather observation or actual departure. Unsupported destinations remain visibly unavailable
    under the parent full-site task. Pinning, link resolution, external navigation and writes stay forbidden.
    Ordinary Home behavior is unchanged.
  acceptance:
    given: A trusted demo in either locale and viewport, alongside an ordinary owner with private records.
    when: Browse Home and its supported academic links, read Home internal endpoints, switch identities
      and attempt unsupported destinations, writes and caller-supplied clocks.
    then:
    - Home data agrees with the existing sample calendar, homework, todo, exam and navigation facts.
    - SSR, data and API responses remain private and no-store with no real service or durable effects.
    - Every public module contains clearly fictional content and unfinished destinations explain their restriction.
    - Identity changes discard old reads, while ordinary session Home continues to read its actual owner.
    test:
      file: tests/integration/rest/demo/home.test.ts
      name: demo Home isolates fixed overview, public samples and effects en-us
- id: demo.community-projection
  category: privacy
  rule: Existing catalog and homework discussions share 25 fixed public active roots and 36 named,
    non-anonymous nodes from two explicitly fictional authors. The main course has 21 roots and an
    eleven-reply thread; section, teacher, section-teacher and homework targets each add one root.
    Root pagination retains the existing twenty-root page and ten-descendant preview, chronological
    createdAt/ID ordering, root-bound reply cursors and focused/permalink navigation. Root totals never
    include replies. Locale changes content and presentation without changing identities or counts.
    These reads resolve only fixed targets before authentication, database, storage or outbound adapters.
    All write permissions remain false with visible read-only guidance; reaction totals stay readable,
    while copying links, locating comments and continuing pages remain usable. Author names and local
    avatars retain the existing presentation without new profile links or public-user read authority.
    No attachments, external images, link previews or governance identities are simulated.
  acceptance:
    given: A trusted demo in either locale and viewport, alongside independent real accounts and comments.
    when: Browse catalog and homework discussions, continue roots and replies, and open off-page and
      beyond-preview comment links; attempt writes and invalid targets, cursors or identities.
    then:
    - Page and API nodes, authors, reactions, target metadata and root totals agree; both continuations exhaust without duplicates.
    - Focused reads and canonical links locate the existing fixed target and requested node, including nested replies.
    - Writes and real-user profile routes remain forbidden; failures never fall back to real services or produce durable effects.
    - Identity transitions discard old responses, and ordinary session and OAuth comment behavior remains unchanged.
    test:
      file: tests/integration/rest/demo/community.test.ts
      name: demo community reads share fixed threads, pagination and no live effects en-us
- id: demo.profile-projection
  category: privacy
  rule: The existing /account/settings/profile page, page-data and same-origin account profile GET/HEAD API
    share one fixed presentation identity and reference dates. The nickname matches demo navigation;
    the sample ID never enables a real public-user profile. Valid demo reads bypass real session,
    account, user, storage and outbound adapters. Profile fields, avatar choices and save remain disabled
    from SSR through hydration, with an explicit read-only explanation. Query tabs and success messages
    neither expand the allowed settings scope nor display a successful mutation. Other settings,
    uploads and account linking remain unavailable; writes fail before their actions run.
    Ordinary session and OAuth profile reads and ordinary profile edits keep their existing behavior.
  acceptance:
    given: Valid, expired, invalid and mixed demo identities alongside an ordinary private account.
    when: Read profile HTML, page-data and API, navigate on desktop/mobile in both locales and attempt writes.
    then:
    - Page, API and navigation agree on fixed facts without reading the ordinary account or producing external effects.
    - Every editing control stays disabled; unknown profile routes and other settings fail closed.
    - Invalid HTML refresh clears the demo cookie and returns to sign-in; API/data remain unauthorized and mixed identities forbidden.
    - Responses and failures stay private and no-store, and identity changes cannot restore another viewer's profile.
    test:
      file: tests/integration/rest/demo/profile.test.ts
      name: demo profile isolates fixed page and API facts, identities and effects en-us
- id: demo.calendar-projection
  category: privacy
  rule: The existing personal calendar is a read-only projection of the fixed subscribed sections,
    catalog schedules and exams, pending dated homeworks and incomplete dated todos. It uses the fixture
    reference clock, stored teaching-week values and Shanghai range boundaries, including complete
    selected-semester data and normal pagination. It invents no recurrence or activity. All four academic
    views remain available at every width; narrow month and semester views use the existing complete agenda.
    Only a matching root-shell demo identity grants presentation ownership. Demo never becomes a real
    authenticated viewer, creates a calendar token or enables activity management, export or mutations.
  acceptance:
    given: Enabled demo sessions, expired and mixed identities, and an ordinary owner with private records.
    when: Browse the existing calendar across day, week, month and semester, then request paginated events.
    then:
    - Page, API and navigation derive from the same existing fixed facts; historical and unknown semester selection stay fixture-only.
    - Demo reads have no database, storage, queue or outbound effects and never reveal the ordinary owner's record.
    - Invalid or mixed identities and writes fail closed; the ordinary authenticated API still reads its actual owner.
    test:
      file: tests/integration/rest/demo/calendar.test.ts
      name: demo calendar isolates real owners, paginates fixed facts and rejects writes and forged identities
- id: demo.entry-gate
  category: authorization
  rule: Only an explicitly enabled deployment offers demo entry. Entry and exit require same-origin POST
    with an Origin header and fixed redirect destinations; encoded control aliases are rejected. Entry
    rejects existing real credentials and demo cookies. Exit clears only the demo cookie, including invalid
    or mixed cookies, without resolving or changing any real session.
  rationale: The first complete path is for isolated acceptance. The production binding stays unset until
    the wider ordinary-user demo boundary is complete.
  acceptance:
    given: Disabled and enabled deployments, and anonymous, real-session and demo callers.
    when: Callers submit entry and exit requests, including missing or foreign origins and encoded paths.
    then:
    - Only enabled same-origin anonymous entry establishes a demo cookie.
    - Rejected requests create no real users or sessions and issue no demo cookie.
    - Exit preserves real account state and redirects to sign-in.
    test:
      file: tests/integration/rest/demo/test.ts
      name: demo entry is explicit, same-origin and separate from real sessions
- id: demo.identity
  category: privacy
  rule: A demo identity is a separately signed, purpose-bound cookie with a fifteen-minute lifetime and
    supported fixture version, never a real user ID or session. Tampered, expired, future-issued, duplicate,
    unsupported-version and mixed credentials fail closed before real authentication. An invalid unmixed
    cookie on a supported top-level workspace, catalog or account profile HTML request is cleared with a fixed sign-in redirect;
    API and page-data requests remain unauthorized. No demo identity reaches a real-user data adapter.
  acceptance:
    given: Valid, forged, expired, duplicate, unsupported-version and mixed credentials.
    when: Actual demo requests and ordinary principal resolution run.
    then:
    - Only a valid independent identity reads fixtures; real account identifiers are never accepted from demo inputs.
    - Invalid API requests are unauthorized and a failed HTML refresh can return safely to sign-in.
    - Normal authenticated requests retain their own principal and permissions.
    test:
      file: tests/unit/features/demo/demo-session.test.ts
      name: fails closed for old fixture versions and account claims even with a valid signature
- id: demo.no-live-writes
  category: authorization
  rule: Public demo flags, victim IDs and unsigned legacy inputs cannot impersonate a real user or change
    an authoritative session's owner.
  acceptance:
    given: A signed authoritative session, a different real user and unsigned forged demo inputs.
    when: Ordinary principal resolution receives those fields in query parameters, JSON, cookies and headers.
    then:
    - The signed request retains its session principal and the unsigned request has no principal.
    - The session owner is unchanged and no victim session is created.
    test:
      file: tests/integration/demo-identity-boundary.test.ts
      name: demo.no-live-writes
- id: demo.read-only-boundary
  category: authorization
  applies_to:
  - demo-home
  - demo-todos
  - demo-subscriptions
  - demo-catalog-details
  - demo-course-list
  - demo-section-list
  - demo-teacher-list
  - demo-homeworks
  - demo-exams
  - demo-profile
  - demo-community
  expectation:
    kind: authorization
    surface: service
    operation: resolveDemoBoundary
    cases:
    - id: valid-demo-business-write
      authenticated: false
      suspended: false
      role: user
      relationship: other
      outcome: forbidden
    - id: valid-demo-unsupported-read
      authenticated: false
      suspended: false
      role: user
      relationship: other
      outcome: forbidden
    denied_effects:
    - durable business or authentication data
    - persistent telemetry or audit records
    - database reads under a real user
    - rate limiting, object storage, calendar queues and invalidation
    - OAuth and outbound requests
    - browser analytics scripts and telemetry
  rationale: Demo possession is not real-user authentication. The read allowlist comprises Todos, homeworks, exams and
    subscriptions HTML/page-data, the course, section and teacher listings, the three supported catalog-detail pages and their page-data,
    GET /api/catalog/courses, GET /api/catalog/sections, GET /api/catalog/teachers,
    GET /api/workspace/todos, GET /api/workspace/subscriptions/current, section detail/personal reads,
    fixture descriptions/comments, fixed comment focused/reply reads and canonical comment links,
    homework list/detail/audit reads and shell bootstrap. Same-origin locale-cookie updates are allowed. Entry and exit are cookie controls. Every other request is denied before its route runs, including visit-recording GET, uploads,
    private exports, administrator routes, GraphQL and MCP.
  acceptance:
    given: A signed demo and unrelated real private data in an isolated actual Worker.
    when: The caller submits business mutations, unsupported reads, guessed real IDs and protocol requests.
    then:
    - Unsupported requests are forbidden before real authentication or business adapters run.
    - Independent database snapshots and native side-effect observations remain unchanged.
    test:
      file: tests/integration/rest/demo/test.ts
      name: demo requests cannot reach durable data or external side effects
- id: demo.todos-projection
  category: consistency
  rule: The existing Todos page, its same-origin GET API and shell navigation share version workspace-v1,
    reference time 2026-09-24T09:00:00+08:00 and one deterministic sample dataset. Locale changes presentation
    consistently; filters, ordering, counts and pagination retain the existing Todo response shapes.
    Existing desktop/mobile lists and detail views remain usable. Add, edit, completion and delete controls
    are disabled with a visible read-only explanation; unimplemented destinations and search are disabled.
  acceptance:
    given: A demo entered from the ordinary sign-in page in either supported locale.
    when: The existing Todos page, detail, completion filters, API and language controls are used.
    then:
    - Page, API, detail and navigation show matching fixed samples and two pending tasks.
    - Business mutation controls explain that the demo is read-only.
    - Entry and exit use the existing app shell rather than a separate workbench.
    test:
      file: tests/e2e/src/app/demo/test.ts
      name: 'demo.todos: read-only browsing zh-cn 1280'
- id: demo.subscriptions-projection
  category: consistency
  rule: The existing subscriptions page, current-subscription GET API and shell navigation share fixture
    version workspace-v1 and reference time 2026-09-24T09:00:00+08:00. Three deterministic sections span two
    semesters and regular, auditor and teaching-assistant roles, retaining complete localized teacher lists.
    Desktop and mobile views preserve existing filters, including applying multiple fields and clearing
    an empty result. Quick add, import, role changes, unsubscribe, calendar feeds, activity subscriptions
    and unimplemented catalog collection destinations are disabled. Sample section, course and teacher details remain navigable. Demo reads never create a calendar token.
  acceptance:
    given: An independently signed demo in either supported locale, with ordinary account subscriptions unchanged.
    when: The caller navigates between Todos and subscriptions, filters samples, changes language and reads the API.
    then:
    - Page, API and navigation agree on the three fixed sections and two pending Todos.
    - Filters remain usable while mutations, exports and unimplemented destinations remain unavailable.
    - Calendar path and URL are null and there are no live database or external effects.
    test:
      file: tests/e2e/src/app/demo/test.ts
      name: 'demo.subscriptions: read-only browsing zh-cn 1280'
- id: demo.catalog-projection
  category: consistency
  rule: Demo subscription links open the existing section, course and teacher detail pages using the same
    three fixed sections, two teachers and localized course identities. Section schedules and exams use fixed
    dates; descriptions and fixed public discussions retain existing response shapes and an anonymous viewer.
    Only fixture identifiers and matching target aliases resolve; unknown or mixed targets cannot access
    ordinary data. Calendar exports, subscriptions, homework creation, description edits and comments are
    visibly disabled. Teacher, course and section collections and fixture homework details are read-only.
  acceptance:
    given: A valid demo in either supported locale on desktop or mobile.
    when: The visitor follows subscription, course and teacher links and reads detail sections and lazy data.
    then:
    - The linked pages, detail APIs, schedule, exam and section histories agree on the fixed sample identities.
    - Read-only controls and a visible explanation replace sign-in or mutation prompts.
    - No database access, external requests or writes occur, including for unknown and mixed identifiers.
    test:
      file: tests/e2e/src/app/demo/test.ts
      name: 'demo.catalog: linked read-only details zh-cn 1280'
- id: demo.homework-projection
  category: consistency
  rule: The existing workspace homework list, detail dialog and section context share six fixed workspace-v1
    assignments and reference time 2026-09-24T09:00:00+08:00, including after the dialog timer runs.
    Three regular incomplete assignments contribute to navigation counts; completed and auditor/teaching-assistant
    assignments retain their academic completion semantics. Filters remain usable. Creation, completion,
    editing and discussion writes are unavailable with visible read-only copy. Only known and consistently
    scoped fixture identifiers resolve; unknown or mixed targets never fall through to live services.
  acceptance:
    given: A valid demo in either supported locale on desktop or mobile.
    when: The visitor filters workspace homework, opens details and follows a section context or focused link.
    then:
    - Workspace, section, detail API, comments and navigation project the same six sample assignments.
    - Fixed deadlines and completion/advisory states remain consistent after a timer tick and navigation.
    - Write controls stay disabled and no live database or external effects occur.
    test:
      file: tests/e2e/src/app/demo/homeworks.test.ts
      name: 'demo.homeworks: read-only browsing zh-cn 1280'
- id: demo.course-list-projection
  category: consistency
  rule: The existing course listing and its page-data share the three fixed subscription courses with
    the read-only course API and linked course details. Ordering is by course code then upstream ID.
    Existing normalized Web search/name/code and classification filters remain usable; the REST API
    retains its validated search, scalar classification and pagination query contract. Both use the same
    filtering and pagination projection for shared inputs. Missing classifications offer no live options.
    Unknown filters/targets never fall through to ordinary data. Demo reads are private and do not access
    database, runtime caches or external services. Ordinary callers retain their existing read model.
  acceptance:
    given: A valid demo in either locale on desktop or mobile, and independent ordinary catalog records.
    when: The visitor opens Courses from the existing navigation, filters, clears an empty result and follows details.
    then:
    - Page, page-data, REST and details agree on course identities, text matching, ordering and counts.
    - Pagination beyond the sample set is empty; unknown classifications cannot expose live records.
    - Read-only labeling remains visible and business writes, exports and unsupported destinations stay blocked.
    test:
      file: tests/e2e/src/app/demo/courses.test.ts
      name: 'demo.courses: read-only browsing zh-cn 1280'
- id: demo.section-list-projection
  category: consistency
  rule: The existing section listing and page-data project the same three subscription sections, two
    semesters and two teachers as the read-only section API and catalog details. Web keeps normalized
    multi-value filters, numeric comparisons, advanced search and explicit-column precedence; REST keeps
    its scalar relation filters, identifier lists, advanced search and pagination schema. Shared inputs use
    one fixed matching and ordering projection, with filtering before pagination and upstream ID tie-breaks.
    Unknown or mixed unavailable identifier lists never fall through to live data. Null sample metadata
    stays null and demo enrollment displays unknown rather than zero; only existing sample semesters become filter options. No database, cache or external reads
    occur under demo identity. Ordinary callers keep their existing query services and behavior.
  acceptance:
    given: A valid demo in either locale on desktop or mobile, alongside independently seeded ordinary records.
    when: The visitor opens Sections, filters by semester and teacher, compares credits, clears an empty result and follows details.
    then:
    - Page, page-data, REST and linked details agree on fixed identities, localized relations, filtering, order and pagination.
    - Missing classifications and numeric metadata remain empty or null; unknown and mixed targets expose no real records.
    - Demo notice remains visible, writes and external exports stay refused, and ordinary filters retain their behavior.
    test:
      file: tests/e2e/src/app/demo/sections.test.ts
      name: 'demo.sections: read-only browsing zh-cn 1280'
- id: demo.teacher-list-projection
  category: consistency
  rule: The existing teacher listing and page-data, read-only collection API and linked details share the two subscription teachers and their complete fixed section counts. Web keeps normalized name, code, email, classification and numeric-count filters; REST retains its existing validated search, scalar department and pagination schema. Ordering is Chinese name then upstream ID. Missing contact/classification metadata stays null with no live options. Unknown filters never reach real data. Demo reads remain private and perform no database, cache or external access; ordinary callers retain their existing services.
  acceptance:
    given: A signed demo in either locale on desktop/mobile and independent ordinary teacher records.
    when: Open Teachers from shell navigation, filter, clear an empty result, paginate via REST and follow a fixed teacher detail.
    then:
    - Page, page-data, REST and details agree on identities, names and section counts.
    - Filters and pagination operate only on fixed samples; unavailable metadata cannot match live records.
    - Read-only notices remain visible, direct writes and unsupported exports stay refused, with no durable or external effects.
    test:
      file: tests/e2e/src/app/demo/teachers.test.ts
      name: 'demo.teachers: read-only browsing zh-cn 1280'
- id: demo.cache-isolation
  category: privacy
  rule: Demo cookie presence, including invalid cookies, bypasses shared HTML admission before cache hits
    and never marks page data reusable as public navigation. Responses and failures are private, no-store
    for browser and CDN, with noindex, nofollow and noarchive directives. Catalog detail pages omit structured
    indexing data. Entry and exit reload the document; shell/controller identity changes discard pending
    old identity responses and selected private details. Refresh, locale navigation and history must not restore
    another identity's state.
  acceptance:
    given: A real account response is delayed while a demo identity is entered or exited.
    when: The response resolves, the page reloads, or browser history and locale controls are used.
    then:
    - No real account detail or shell can overwrite the demo projection.
    - Invalid-cookie responses never enter shared caches or acquire public navigation attestations.
    test:
      file: tests/e2e/src/app/demo/test.ts
      name: 'demo.session: late real-account responses cannot restore the previous viewer'
- id: demo.exams-projection
  category: consistency
  rule: The existing Exams page and its page-data use the same three fixed exams as demo section details, across two semesters at reference time 2026-09-24T09:00:00+08:00. Two upcoming exams and one completed exam retain existing desktop/mobile filters and section links. Shell navigation counts only the two upcoming exams. No calendar credentials, exports or real account reads are introduced.
  acceptance:
    given: An independently signed demo in each supported locale and desktop/mobile viewport.
    when: The caller navigates from subscriptions to exams, changes completion filters and opens a sample section, while real Worker requests also probe page-data, writes, exports and invalid identities.
    then:
    - Page, section API and shell counts share the same fixed dates, times and identities.
    - Upcoming, completed and all filters show the corresponding samples in existing layouts.
    - Read-only identity remains visible and writes, exports and invalid credentials retain the fail-closed boundary without database or external effects.
    test:
      file: tests/e2e/src/app/demo/exams.test.ts
      name: 'demo.exams: read-only browsing zh-cn 1280'
