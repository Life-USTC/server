kind: feature
id: course
name: Course
areas:
- catalog
access:
  anon: Can browse course information.
  user: Can browse course information. Cannot modify course fact data.
  admin: Can browse course information. Does not directly modify course facts through ordinary pages.
  agent: Can read course search and detail capabilities.
requirements:
- id: course.public-web-personal-overlay
  category: consistency
  rule: Course detail HTML and page-data payloads are viewer-independent for both anonymous and signed-in
    requests. Public description content and structured data remain in SSR; description permissions and
    comments are resolved through private client requests.
- id: course.stable-entity
  category: behavior
  rule: A course is a stable course entity and does not represent a specific semester offering.
- id: course.static-course-identity
  category: consistency
  rule: Static ingestion stores the upstream Course id unchanged as Course.jwId and upserts only by jwId.
    Code, names, and classification metadata are mutable attributes and never participate in identity
    inference. Conflicting codes for one jwId abort; other metadata is selected deterministically from
    the latest semester occurrence.
- id: course.static-section-course-link
  category: consistency
  rule: Each imported Section resolves the upstream Course jwId attached to its lesson parent. Static
    sync updates courseId on both insert and conflict update; missing Course jwId mappings abort the transaction.
- id: course.retired-section-history
  category: consistency
  rule: Direct Course detail retains retired Section offerings as historical references; public Section
    discovery excludes them.
- id: course.jwid-url-only
  category: presentation
  rule: jwId is used only for URLs, APIs, MCP, and backend logic; it should not be directly displayed
    in ordinary course UI.
- id: course.education-level-display-casing
  category: presentation
  rule: English education-level filter labels uppercase only their initial character for consistent display
    while preserving all remaining source casing; non-English labels remain unchanged.
- id: course.public-list-cache
  category: consistency
  rule: 'Public Course REST responses are deterministic by URL: omitted locale uses canonical zh-cn and
    locale=en-us selects English. They do not derive output from Cookie or Accept-Language and may use
    shared CDN caching. REST, GraphQL, and MCP lists share revision-scoped locale/filter/pagination runtime
    caching. Localized HTML pages use their locale-partitioned SSR cache.'
- id: course.mobile-detail-hierarchy
  category: presentation
  rule: Course detail pages present the public course code before the localized display name on mobile,
    use a responsive title size, and use the Detail Two-Column Stream without a context-tab rail.
- id: course.detail-canonical-url
  category: behavior
  rule: The canonical course detail URL is `/catalog/courses/[jwId]`. Legacy path segments and `?tab=`
    deep links permanently redirect to the root; optional hash anchors scroll within the page.
- id: course.static-classification-unsupported
  category: behavior
  rule: Static course snapshots do not currently provide CourseClassify source data, so static-loaded
    courses keep classifyId/classify null and static-loaded metadata may expose courseClassifies as an
    empty array.
- id: course.bounded-detail-history
  category: consistency
  rule: 'Detail returns 20 Section offerings per page and the full count, including retired offerings.
    Web shows the total and sectionsPage=N pagination with #sections. Ordering ends in unique jwId. Paginated
    HTML bypasses shared SSR caching; page-core cache keys include the page; canonical URLs remain the
    entity root.'
  acceptance:
  - id: course.bounded-detail-history.paged-cache-and-total
    given: A course has 23 historical Section offerings, including retired offerings.
    when: The first and second history pages are loaded, followed by another first-page read.
    then:
    - The page-core cache keeps the pages separate.
    - The second query skips 20 and takes 20, with no retired filter.
    - The full relation count is 23 and ordering ends in unique jwId.
    tests:
    - file: tests/unit/features/catalog/catalog-detail-page-data.test.ts
      name: keeps history pages separate in the cache and counts the whole relation
  - id: course.bounded-detail-history.historical-navigation
    given: A course has 23 offerings with equal non-unique sort values and the last three are retired.
    when: A visitor opens page 2, reloads it, and returns to page 1 on desktop and mobile.
    then:
    - All 23 offerings are reachable without duplicates.
    - The total stays 23 and the entity-root canonical URL is preserved.
    - The page-2 reload is no-store and retains the retired offerings.
    tests:
    - file: tests/e2e/src/app/courses/history-pagination.test.ts
      name: 课程和教师历史分页包含第 21 条以后的已退役教学班
  surfaces:
  - web
- id: course.history-page-validation
  category: validation
  rule: sectionsPage defaults to 1 only when omitted. Supplied values must be positive decimal integers
    without leading zeros, signs, fractions, exponent notation, or whitespace. Reject invalid values and
    pages above 450359962737050 with 400 before database access, keeping the 20-row offset within Number.MAX_SAFE_INTEGER.
  acceptance:
  - id: course.history-page-validation.invalid-offset
    given: A course detail request explicitly supplies an invalid sectionsPage, including exponent notation
      or a page above the safe offset bound.
    when: The page loader validates the query parameter.
    then:
    - The request fails with 400 before any course, teacher or viewer lookup.
    tests:
    - file: tests/unit/lib/adapters/detail-page-loader-critical-path.test.ts
      name: rejects invalid sectionsPage=%s before catalog reads
  surfaces:
  - web
- id: course.public-detail-fields
  category: privacy
  rule: Nested teacher references expose only public identity and localized names; never contact or private
    source columns.
- id: course.public-detail-cache
  category: consistency
  rule: Anonymous REST, MCP, and single-entity GraphQL Course reads share a revision-, locale-, ID-, and
    response-shape-scoped runtime cache. Missing entities are not cached.
capabilities:
  course-list:
    title: Course List & Filter
    auth: anon
    links:
      models:
      - Course
      ui:
      - List Table
    web:
      pages:
      - /catalog/courses
    rest:
      routes:
      - path: /api/catalog/courses
        notes:
        - REST page accepts 1-100, pageSize accepts 1-100, and search accepts 2-200 characters; the deprecated
          limit alias remains accepted and pageSize wins when both are supplied. Out-of-range values are
          rejected instead of clamped.
    graphql:
      queries:
      - name: courses
        parent: Catalog
        rest_equivalent: GET /api/catalog/courses
        mcp_equivalent: catalog_course_search
        notes:
        - PageInput defaults to page=1 and pageSize=20; page and pageSize must remain within 1-100, and
          search within 2-200 characters.
    mcp:
      tools:
      - name: catalog_course_search
        rest_equivalent: GET /api/catalog/courses
        notes:
        - MCP limit accepts 1-100 and rejects out-of-range values instead of clamping.
    presentation:
      items:
      - course.code
      - course.namePrimary
      - course.nameSecondary (locale-dependent)
      - course.educationLevel.namePrimary
      - course.category.namePrimary
      - course.classType.namePrimary
      filters:
      - search
      - educationLevelId
      - categoryId
      - classTypeId
  course-detail:
    title: Course Detail
    auth: anon
    links:
      models:
      - Course
      ui:
      - Detail Hero
      - Detail Two-Column Stream
      - Basic Info Card
    web:
      pages:
      - /catalog/courses/[jwId]
    rest:
      routes:
      - path: /api/catalog/courses/[jwId]
        notes:
        - sections is a newest-first preview capped at 20 records; _count.sections is the complete historical
          total.
    graphql:
      queries:
      - name: course
        parent: Catalog
        rest_equivalent: GET /api/catalog/courses/[jwId]
        mcp_equivalent: catalog_course_get
    mcp:
      tools:
      - name: catalog_course_get
        rest_equivalent: GET /api/catalog/courses/[jwId]
    presentation:
      items:
      - course.namePrimary (h1 title)
      - course.nameSecondary (Locale-dependent subtitle)
      - course.code (Plain monospace text)
      - course.educationLevel.namePrimary
      - course.category.namePrimary
      - course.classType.namePrimary
      - section.semester.nameCn (Semester column)
      - section.code (Plain monospace text)
      - section.teachers[].namePrimary + nameSecondary (Teachers)
      - section.campus.namePrimary (Campus)
      - section.stdCount / section.limitCount (Capacity)
      - description.content (Markdown-rendered via DescriptionLoader)
