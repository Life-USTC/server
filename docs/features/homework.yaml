kind: feature
id: homework
name: Homework
areas:
- community
- workspace
- admin
policy_refs:
- interface-hierarchy
- ui
- permission-ui
- rendering-and-cache
- audit
- homework-naming
- cases.missing-data
requirements:
- id: homework.single-delete-replay
  category: consistency
  rule: Ordinary single-homework deletion retains a tombstone attributed to its creator and one deletion audit event. Retrying the delete succeeds without rewriting the tombstone or adding audit events; GraphQL and MCP report alreadyDeleted=true, while REST retains its success envelope.
  acceptance:
    given: An isolated unsuspended owner has a fresh homework for each transport and valid resource-bound OAuth write credentials; the rate-limit boundary admits requests.
    when: Actual REST, GraphQL and MCP requests delete the owned record without a confirmation flag and then repeat the deletion.
    then:
    - The first request stores deletedAt and deletedById and exactly one audit event.
    - A replay succeeds, preserves the exact committed row and audit count, and reports alreadyDeleted where that field is part of the transport.
    test:
      file: tests/integration/mutation-error-parity.test.ts
      name: homework.single-delete-replay
- id: homework.no-subscription-required
  category: authorization
  rule: Creating homework does not require the user to be subscribed to the section first.
  acceptance:
    given: Two active temporary users have no section subscriptions.
    when: Each uses the real homework creation service against an isolated public section.
    then:
    - Both creates persist shared homework with the actual creator identity.
    - No section subscription is required or implicitly created.
    test:
      file: tests/integration/homework-state-contract.test.ts
      name: homework.no-subscription-required
- id: homework.entity-and-completion-separated
  category: consistency
  rule: Homework entity and homework completion state are strictly separated to prevent 'I completed it'
    from becoming 'the homework was modified'.
  acceptance:
    given: A shared homework has a description, description history and creation audit; another user has
      no completion yet.
    when: Real completion writes complete, reopen and re-complete it; the creator then updates the shared
      title and description.
    then:
    - Completion changes do not modify any homework field, description/history row or entity audit record.
    - An entity edit updates the shared fields while preserving the other user’s completion identity and
      timestamp.
    test:
      file: tests/integration/homework-state-contract.test.ts
      name: homework.entity-and-completion-separated
- id: homework.completed-deadline-display
  category: presentation
  applies_to:
  - cross-section-homework-summary
  expectation:
    kind: state_visibility
    surface: web
    targets:
    - workspace-list
    - workspace-card
    - detail-dialog
    state:
      completed: true
    visible:
    - due_at
    - completion
    - major
    - team
    hidden:
    - deadline_reminder
    restore_on_incomplete:
    - deadline_reminder
  acceptance:
    given: Upcoming and overdue homework has both non-default badges.
    when: Completion is set and then cleared in desktop and mobile workspace views.
    then:
    - Each specified visible field remains visible on each target.
    - The specified reminder is hidden when complete and restored when incomplete.
    test:
      file: tests/e2e/src/app/workspace/homeworks/list-state.test.ts
      name: homework.completed-deadline-display
- id: homework.teaching-assistant-completion
  category: consistency
  applies_to:
  - cross-section-homework-summary
  - section-homework-tab
  - homework-completion
  expectation:
    kind: subscription_completion
    subscription_kind: teaching_assistant
    completion_required: false
    preserve_records: true
  acceptance:
    given: A viewer has the specified subscription kind and an existing completion record.
    when: Completion requirements are derived for that viewer.
    then:
    - The specified completionRequired value is attached.
    - The existing completion record is preserved.
    test:
      file: tests/unit/features/homeworks/homework-completion-state.test.ts
      name: homework.teaching-assistant-completion
- id: homework.mobile-toolbar-priority
  category: presentation
  applies_to:
  - cross-section-homework-summary
  expectation:
    kind: target_size
    surface: web
    target: workspace-homeworks-add
    viewport:
      width: 390
      height: 844
    min_width: 44
    min_height: 44
  acceptance:
    given: The workspace homework page is open at the specified mobile viewport.
    when: The create action is measured in the browser.
    then:
    - Its width and height meet the specified minimum CSS pixels.
    test:
      file: tests/e2e/src/app/workspace/homeworks/mobile.test.ts
      name: homework.mobile-toolbar-priority
  rationale: This requirement covers the create action touch target only. Responsive list/card layout
    and completion filters are specified independently.
- id: homework.compact-card-list-surface
  category: presentation
  rule: Default homework cards/lists show title, useful course subtitle, non-default major/team badges,
    due date, relative due label and completion action. Standard/default homework has no redundant badge.
  acceptance:
    given: A subscribed section has default homework and homework marked both major and team-required.
    when: The actual workspace renders desktop lists and mobile cards.
    then:
    - Both summaries show the title, course context, due datetime, relative deadline and completion action.
    - Major/team badges appear only for the corresponding non-default flags.
    - Default records have no redundant standard/default badge and compact summaries omit the full description.
    test:
      file: tests/e2e/src/app/workspace/homeworks/presentation-contract.test.ts
      name: homework.compact-card-list-surface
- id: homework.homework-style-guide-advisory
  category: presentation
  rule: Homework naming/description guidance is advisory on every surface and never rejects otherwise
    valid writes.
  acceptance:
    given: An isolated active owner supplies discouraged chapter-only wording with a course name/code
      and an unstructured description.
    when: Actual section create/edit and workspace create forms, REST, GraphQL and OAuth-authenticated
      MCP submit those otherwise valid writes.
    then:
    - Every surface successfully persists the discouraged title and the unchanged description.
    - Transport create/edit writes retain the same owner and edits retain the original record ID.
    test:
      file: tests/e2e/src/app/workspace/homeworks/advisory-viewer-contract.test.ts
      name: homework.homework-style-guide-advisory
- id: homework.creator-only-delete
  category: authorization
  applies_to:
  - section-homework-tab
  expectation:
    kind: authorization
    surface: service
    operation: deleteHomework
    cases:
    - id: user-creator-active
      authenticated: true
      suspended: false
      role: user
      relationship: creator
      outcome: allowed
    - id: admin-creator-active
      authenticated: true
      suspended: false
      role: admin
      relationship: creator
      outcome: allowed
    - id: user-other-active
      authenticated: true
      suspended: false
      role: user
      relationship: other
      outcome: forbidden
    - id: admin-other-active
      authenticated: true
      suspended: false
      role: admin
      relationship: other
      outcome: forbidden
    - id: user-creator-anonymous
      authenticated: false
      suspended: false
      role: user
      relationship: creator
      outcome: forbidden
    - id: user-creator-suspended
      authenticated: true
      suspended: true
      role: user
      relationship: creator
      outcome: suspended
    - id: admin-creator-suspended
      authenticated: true
      suspended: true
      role: admin
      relationship: creator
      outcome: suspended
    denied_effects:
    - homework
    - audit
    - calendar
  acceptance:
    given: Each specified identity attempts to delete an active homework.
    when: The ordinary delete service runs.
    then:
    - Each case returns the specified outcome.
    - Rejected cases perform none of the specified side effects.
    test:
      file: tests/unit/features/homeworks/homework-delete-authority.test.ts
      name: homework.creator-only-delete
- id: homework.completion-set-idempotency
  category: consistency
  rule: Setting completed=true on an existing completion preserves its original completedAt; repeated
    single and batch completion requests are idempotent. Setting false removes the completion, and a subsequent
    true records a new completion time.
  acceptance:
    given: A persisted completion already has an original timestamp.
    when: Real single and batch setters receive repeated true, false, then repeated true writes.
    then:
    - Repeated true preserves the original timestamp.
    - False removes completion; the next true creates a new timestamp that later retries preserve.
    - The final persisted database timestamp matches the returned state.
    test:
      file: tests/integration/calendar-write-state.test.ts
      name: homework.completion-set-idempotency
- id: homework.moderation-delete
  category: authorization
  applies_to:
  - homework-governance
  expectation:
    kind: authorization
    surface: service
    operation: deleteHomeworkForModeration
    cases:
    - id: admin-other-active
      authenticated: true
      suspended: false
      role: admin
      relationship: other
      outcome: allowed
    - id: user-creator-active
      authenticated: true
      suspended: false
      role: user
      relationship: creator
      outcome: forbidden
    - id: admin-other-suspended
      authenticated: true
      suspended: true
      role: admin
      relationship: other
      outcome: suspended
    - id: admin-other-anonymous
      authenticated: false
      suspended: false
      role: admin
      relationship: other
      outcome: forbidden
    denied_effects:
    - homework
    - audit
    - calendar
  acceptance:
    given: Each specified identity attempts to delete an active homework.
    when: The explicit moderation delete service runs.
    then:
    - Only allowed cases change the homework and write the deletion audit.
    - Rejected cases perform none of the specified side effects.
    test:
      file: tests/unit/features/homeworks/homework-delete-authority.test.ts
      name: homework.moderation-delete
- id: homework.teaching-assistant-pending
  category: consistency
  applies_to:
  - cross-section-homework-summary
  expectation:
    kind: pending_deadline
    subscription_kind: teaching_assistant
    without_deadline: true
    before_deadline: true
    at_deadline: false
    after_deadline: false
    completed: false
  acceptance:
    given: An incomplete homework is viewed by a subscriber of the specified kind.
    when: Pending membership is evaluated around the deadline and after actual completion.
    then:
    - Every boundary returns its specified pending value.
    test:
      file: tests/unit/features/homeworks/homework-completion-state.test.ts
      name: homework.teaching-assistant-pending
- id: homework.teaching-assistant-label
  category: presentation
  rule: Authenticated personal homework views display 无需完成 / No completion required for teaching-assistant
    subscriptions. Public and anonymous views do not infer or expose a viewer's subscription kind.
  acceptance:
    given: An isolated owner has a teaching-assistant subscription and a real section homework; anonymous
      users have no session.
    when: Personal workspace and section summaries/details render in Chinese and English at desktop/mobile
      widths, followed by anonymous section and REST reads.
    then:
    - Personal views display the corresponding localized no-completion-required label and omit completion
      actions.
    - Anonymous views do not display the teaching-assistant status and REST returns neutral completion
      state without subscription-kind disclosure.
    test:
      file: tests/e2e/src/app/workspace/homeworks/advisory-viewer-contract.test.ts
      name: homework.teaching-assistant-label
- id: homework.rest-completion-batch-input
  category: behavior
  applies_to:
  - homework-completion
  expectation:
    kind: collection_input
    surface: rest
    operation: PUT /api/workspace/homeworks/completions
    input: items
    min_items: 1
    max_items: 100
    unique_items: true
  acceptance:
    given: Authenticated completion writes provide boundary-sized item arrays and duplicate homework IDs.
    when: The real REST adapter parses each input.
    then:
    - Both inclusive size boundaries are accepted and out-of-range sizes rejected before writes.
    - Duplicate target IDs follow the specified uniqueness policy.
    test:
      file: tests/integration/rest/homeworks/completions/test.ts
      name: homework.rest-completion-batch-input
  rationale: Normalized duplicate targets are rejected before any write, matching GraphQL and avoiding conflicting repeated state changes in one batch.
- id: homework.graphql-completion-batch-input
  category: behavior
  applies_to:
  - homework-completion
  expectation:
    kind: collection_input
    surface: graphql
    operation: homeworkCompletionsSet
    input: items
    min_items: 1
    max_items: 100
    unique_items: true
  acceptance:
    given: Authenticated completion writes provide boundary-sized item arrays and duplicate homework IDs.
    when: The real GRAPHQL adapter parses each input.
    then:
    - Both inclusive size boundaries are accepted and out-of-range sizes rejected before writes.
    - Duplicate target IDs follow the specified uniqueness policy.
    test:
      file: tests/integration/graphql-homework-mutations.test.ts
      name: homework.graphql-completion-batch-input
  rationale: Normalized duplicate targets are rejected before any write, matching GraphQL and avoiding conflicting repeated state changes in one batch.
- id: homework.public-section-read
  category: authorization
  rule: Anonymous viewers can read homework under public sections.
  acceptance:
    given: An isolated public section has homework with a description and another user’s private completion
      record.
    when: Anonymous clients read the real REST summary/detail and registered MCP section-homework list.
    then:
    - Every available public read returns the homework identity and title; REST detail includes its description.
    - The anonymous result does not reveal another owner’s completion state.
    - The existing private completion remains intact.
    test:
      file: tests/integration/mcp/community/homework-transport-contract.test.ts
      name: homework.public-section-read
- id: homework.active-collaborator-write
  category: authorization
  rule: Signed-in unsuspended users can create and update section homework.
  acceptance:
    given: An isolated section has homework authored by one user, with another active user, an active
      administrator and a suspended user.
    when: The active actors create their own homework and update the first author’s homework; suspended,
      empty and nonexistent identities attempt the same writes.
    then:
    - Active collaborators can create and update shared homework while preserving the original creator.
    - Suspended and unauthenticated identities are rejected, leaving the stored homework rows unchanged.
    test:
      file: tests/integration/homework-state-contract.test.ts
      name: homework.active-collaborator-write
- id: homework.completion-owner
  category: authorization
  rule: Each user can only manage their own completion state.
  acceptance:
    given: One owner has completed a shared homework; another regular user and an administrator have no
      completion.
    when: Each foreign actor invokes their own completion service and attempts direct cross-owner reads,
      updates, deletes and insertion in the actual RLS context.
    then:
    - Foreign reads return no rows, cross-owner updates/deletes affect zero rows and forged-owner insertion
      fails.
    - The owner’s original completion remains byte-for-byte unchanged, including its timestamp.
    - Only the owner’s own uncomplete action removes that record.
    test:
      file: tests/integration/homework-state-contract.test.ts
      name: homework.completion-owner
- id: homework.oauth-write-gates
  category: authorization
  rule: Bearer-authenticated REST, GraphQL and MCP homework mutations require the action-specific OAuth
    scope.
  acceptance:
    given: The authenticated owner has a real OAuth client/grant; tokens carry either collaborative-homework
      write or personal-homework completion write permission.
    when: Signed REST, signed GraphQL and a real MCP HTTP SDK client exercise create, update, delete,
      single completion and available batch completion operations with the wrong and correct feature scope.
    then:
    - A scope for the other feature cannot authorize the mutation, and rejected attempts leave homework/completion
      data unchanged.
    - The action-specific scope permits the intended write and produces the expected persisted title,
      completion state and deletion attribution.
    - MCP uses the actual HTTP scope guard and verifies signed JWTs against the real issuer’s JWKS handler;
      the in-memory tool harness is not used to prove scope enforcement.
    test:
      file: tests/integration/mcp/community/homework-transport-contract.test.ts
      name: homework.oauth-write-gates
- id: homework.responsive-workspace-view
  category: presentation
  rule: Workspace homework displays cards on mobile and lists on desktop, with directly available completion
    filters and no view-mode control.
  acceptance:
    given: An authenticated owner subscribes to a section with actual homework records.
    when: The workspace renders at desktop and mobile widths and the viewer selects every completion filter.
    then:
    - Desktop displays the homework list and mobile displays cards.
    - Completion filters stay directly visible and selection works.
    - There is no display-mode selector or menu and no horizontal page overflow.
    test:
      file: tests/e2e/src/app/workspace/homeworks/presentation-contract.test.ts
      name: homework.responsive-workspace-view
- id: homework.detail-secondary-content
  category: presentation
  rule: Homework description, additional timestamps, discussion and secondary actions are available in
    the detail dialog rather than crowded into compact cards.
  acceptance:
    given: A homework has a description, publication and submission-opening timestamps and a future deadline.
    when: The owner opens it from desktop and mobile workspace summaries.
    then:
    - Compact summaries omit description, extra timestamps and discussion content.
    - The detail displays the actual description and both timestamp values, plus the homework discussion.
    - The detail offers the corresponding public section link for further context and actions.
    test:
      file: tests/e2e/src/app/workspace/homeworks/presentation-contract.test.ts
      name: homework.detail-secondary-content
- id: homework.detail-dialog-dismissal
  category: presentation
  rule: Homework detail uses a centered desktop dialog with Escape and outside-click dismissal. On mobile
    it fills the viewport and supports Escape and the visible close control.
  acceptance:
    given: An authenticated owner can open a homework from desktop and mobile workspace summaries.
    when: The viewer opens the detail, checks its bounds and closes/reopens it using the available controls.
    then:
    - Desktop detail is centered in the modal backdrop and outside click closes it.
    - Mobile detail fills the viewport and its close control dismisses it.
    - Escape closes the reopened detail at both widths.
    test:
      file: tests/e2e/src/app/workspace/homeworks/presentation-contract.test.ts
      name: homework.detail-dialog-dismissal
- id: homework.section-style-guide
  category: presentation
  rule: Section homework create/edit forms expose the collapsible homework-naming guide.
  acceptance:
    given: A signed-in Chinese-language viewer opens section homework create and edit forms on mobile.
    when: The viewer inspects, collapses and expands each naming guide.
    then:
    - Both forms expose the same title and description guidance with advisory wording.
    - The guide is collapsible and the relevant create/save action remains accessible.
    test:
      file: tests/e2e/src/app/sections/[jwId]/homeworks.test.ts
      name: homework.section-style-guide
- id: homework.workspace-style-guide-omitted
  category: presentation
  rule: The workspace homework create form omits the section-context advisory guide.
  acceptance:
    given: A signed-in English-language user opens the workspace homework create dialog.
    when: The form renders its title/details fields and submit action.
    then:
    - Useful title/details placeholders remain visible.
    - The section-specific style-guide control and redundant dialog description are absent.
    test:
      file: tests/e2e/src/app/workspace/homeworks/creation.test.ts
      name: homework.workspace-style-guide-omitted
- id: homework.transport-creator-delete
  category: authorization
  rule: Ordinary homework deletion retains creator-only authority on REST, GraphQL and MCP; administrator
    moderation is a separate capability.
  acceptance:
    given: An ordinary user authored homework under an isolated section; another ordinary user and an
      administrator have valid OAuth grants.
    when: REST, signed GraphQL and registered MCP attempt ordinary deletion as each foreign actor and
      then as the creator.
    then:
    - Foreign users and administrators are rejected through every ordinary delete surface, leaving deletedAt
      unset.
    - The creator succeeds through each surface and the stored deletion attribution names that creator.
    test:
      file: tests/integration/mcp/community/homework-transport-contract.test.ts
      name: homework.transport-creator-delete
- id: homework.section-completed-deadline-display
  category: presentation
  applies_to:
  - section-homework-tab
  rule: Completed homework in a personal section view retains due datetime, completion state and non-default
    major/team badges while hiding the deadline reminder; reopening restores the reminder.
  acceptance:
    given: A personal section view contains an incomplete, dated major homework requiring a team.
    when: On desktop and mobile the owner completes it in the detail dialog, closes/reopens the detail
      and marks it incomplete.
    then:
    - Completion preserves the due datetime, completion status and major/team details while removing the
      deadline reminder.
    - The section summary continues to show the due datetime and non-default badges.
    - Reopening the detail preserves the completed state and changing it back to incomplete restores the
      reminder.
    test:
      file: tests/e2e/src/app/sections/[jwId]/homeworks.test.ts
      name: homework.section-completed-deadline-display
capabilities:
  cross-section-homework-summary:
    title: Cross-Section Homework Summary
    auth: user
    links:
      models:
      - Homework
    web:
      pages:
      - /workspace/homeworks
    rest:
      routes:
      - path: /api/workspace/homeworks
        notes:
        - Returns homeworks across all subscribed sections in a single call; includes audit logs and viewer
          context.
        - REST localizes returned homework relation fields from the request locale; MCP accepts an explicit
          locale input.
    graphql:
      fields:
      - parent: Workspace
        name: homeworks
        auth: user
        required_scopes:
        - workspace.homework:read
        rest_equivalent: GET /api/workspace/homeworks
        mcp_equivalent: workspace_homework_list
        notes:
        - Inputs expose completion, due-time, semester, and bounded PageInput filters only; section ownership
          is relation-derived.
    mcp:
      tools:
      - name: workspace_homework_list
        notes:
        - Returns homeworks[]; each item contains title, submissionDueAt, section.course.namePrimary,
          section.code, description, and completion.
        - Omitting semesterId reads all subscribed semesters; pass a semesterId to recover one current
          or past term.
    presentation:
      items:
      - homework.title
      - homework.description.content
      - homework.submissionDueAt (with ETA label)
      - section.course.namePrimary
      - homework.isMajor badge
      - homework.requiresTeam badge
      - completionStatus (completed/pending)
      - 'filter: incomplete/completed/all'
      - 'detail popup is one scrollable column: due datetime, relative urgency, remaining facts in a table
        excluding platform createdAt, then description, then full-width discussion; completion stays in
        the footer; do not use a two-column overlay'
      - create form keeps major/team flags outside optional timestamps, omits subtitle and advisory style
        guide, and uses aligned date inputs with adjacent shortcut menus
      - create dialog uses a wider desktop layout with section, title, and timestamps on the left and
        description editing with simultaneous live Markdown preview on the right; mobile stacks the fields
      - create section options identify course, teachers, and semester; common deadlines include the selected
        section's next classes and future this/next-week weekend cutoffs in Asia/Shanghai
      requirement_refs:
      - homework.completed-deadline-display
      - homework.mobile-toolbar-priority
      - homework.responsive-workspace-view
  section-homework-tab:
    title: Section Homework Tab
    auth: anon
    links:
      models:
      - Homework
      ui:
      - Context Tabs
    web:
      pages:
      - /catalog/sections/[jwId]
    rest:
      routes:
      - path: /api/community/section-homeworks
        notes:
        - Accepts sectionJwId to match the MCP tool's public section identifier, and also supports sectionId
          and sectionIds for callers with resolved IDs.
        - 'The paginated list is summary-only: it keeps title, scheduling, completion, permission, and
          comment-count fields without descriptions, section/course relations, editor relations, or audit
          history.'
      - path: /api/community/section-homeworks/[id]
        method: GET
        auth: anon
        notes:
        - Loads one active homework's description, detail relations, completion state, and audit history
          after an explicit detail request.
      - path: /api/community/section-homeworks/audit
        method: GET
        auth: anon
        notes:
        - Loads section-wide audit history only after the explicit audit dialog request; the homework
          list never includes audit history.
      - path: /api/community/section-homeworks
        method: POST
        status: 201
        auth: user
        notes:
        - Returns the created homework snapshot so REST and MCP clients can continue with follow-up actions
          without an extra list call.
      - path: /api/community/section-homeworks/[id]
        method: PATCH
        auth: user
        notes:
        - Returns the updated homework snapshot after metadata and/or description changes are applied.
      - path: /api/community/section-homeworks/[id]
        method: DELETE
        auth: user
    graphql:
      mutations:
      - name: homeworkCreate
        required_scopes:
        - community.section-homework:write
        rest_equivalent: POST /api/community/section-homeworks
        mcp_equivalent: community_section_homework_create
        notes:
        - Accepts the public sectionJwId, returns the localized Homework snapshot, and writes the shared
          AuditLog event in the same transaction.
      - name: homeworkUpdate
        required_scopes:
        - community.section-homework:write
        rest_equivalent: PATCH /api/community/section-homeworks/[id]
        mcp_equivalent: community_section_homework_update
        notes:
        - Nullable description and timestamp fields clear existing values; omitted fields remain unchanged.
        - Description changes preserve the shared DescriptionEdit and description_edit audit transaction.
      - name: homeworkDelete
        required_scopes:
        - community.section-homework:write
        rest_equivalent: DELETE /api/community/section-homeworks/[id]
        mcp_equivalent: community_section_homework_delete
        notes:
        - Repeated creator deletion remains successful with alreadyDeleted=true and does not add another
          deletion audit row.
        requirement_refs:
        - homework.creator-only-delete
    mcp:
      tools:
      - name: community_section_homework_list
        rest_equivalent: GET /api/community/section-homeworks
        notes:
        - The top-level section scopes the list, so each item omits repeated section context.
        - Every mode is summary-only and omits descriptions, detail relations, and audit history; use
          community_description_get with targetType=homework for an explicit description request.
      - name: community_section_homework_create
        auth: user
        rest_equivalent: POST /api/community/section-homeworks
        notes:
        - REST accepts sectionId or sectionJwId to match the MCP tool's public section identifier; when
          both are supplied, they must resolve to the same section or the request returns 400.
        - Returns the created homework snapshot so MCP clients can continue with follow-up actions without
          an extra read.
        - Description advertises the advisory 第{N}次作业 / {主题}作业 title patterns and ordered 题目 / 提交方式 /
          提交地址 / 备注 template; formatting is not validated or enforced.
      - name: community_section_homework_update
        auth: user
        rest_equivalent: PATCH /api/community/section-homeworks/[id]
        notes:
        - Accepts locale for the returned homework snapshot, matching create/list localization.
        - Returns the updated homework snapshot after metadata and/or description changes are applied.
        - Description advertises the same advisory title and ordered description convention as community_section_homework_create;
          nonconforming existing or updated values remain accepted.
      - name: community_section_homework_delete
        auth: user
        rest_equivalent: DELETE /api/community/section-homeworks/[id]
        notes:
        - Deletes through the shared homework mutation so soft-delete and homework audit behavior stay
          shared.
        requirement_refs:
        - homework.creator-only-delete
    presentation:
      items:
      - homework.title
      - homework.description.content
      - homework.submissionDueAt
      - homework.submissionStartAt
      - homework.publishedAt as homework publication date
      - inline homework discussion
      - user completion status
      - edit action
      - cards/list view mode persisted in browser storage
      - 'detail popup is one scrollable column: due datetime is primary, relative urgency is secondary,
        remaining facts (status, tags, publication, submission opens) are a table that does not repeat
        due date or platform createdAt, then description, then full-width discussion; edit/completion
        stay in the footer; do not use a two-column overlay'
      - section cards use a responsive multi-column layout
      - create and edit forms expose the same collapsible advisory homework title and description style
        guide
    requirement_refs:
    - homework.creator-only-delete
  homework-governance:
    title: Homework Governance
    auth: admin
    web: stable
    rest:
      routes:
      - path: /api/admin/homeworks
        notes:
        - Accepts page and pageSize.
      - path: /api/admin/homeworks/[id]
        method: DELETE
    mcp: unavailable
    presentation:
      items:
      - homework.title
      - homework.section.code
      - creator
      - creation timestamp
      - 'Action: delete'
      - 'Status: active/deleted'
    requirement_refs:
    - homework.moderation-delete
  homework-completion:
    title: Homework Completion
    auth: user
    links:
      models:
      - Homework
    web: stable
    graphql:
      mutations:
      - name: homeworkCompletionSet
        auth: user
        required_scopes:
        - workspace.homework:write
        rest_equivalent: PUT /api/workspace/homeworks/[id]/completion
        mcp_equivalent: workspace_homework_completion_set
      - name: homeworkCompletionsSet
        auth: user
        required_scopes:
        - workspace.homework:write
        rest_equivalent: PUT /api/workspace/homeworks/completions
        mcp_equivalent: workspace_homework_completion_set
        notes:
        - Preserves REST per-item partial-success semantics.
        - Missing or deleted homework IDs are reported on their result item without aborting valid updates.
        requirement_refs:
        - homework.graphql-completion-batch-input
    rest:
      routes:
      - path: /api/workspace/homeworks/[id]/completion
        method: PUT
      - path: /api/workspace/homeworks/completions
        method: PUT
        notes:
        - 'Batch completion updates are partial by item: missing or deleted homework IDs return per-item
          errors while valid items still update.'
        - MCP remains single-item through workspace_homework_completion_set; this REST batch route exists
          for HTTP clients that otherwise fan out single-item requests.
        requirement_refs:
        - homework.rest-completion-batch-input
    mcp:
      tools:
      - name: workspace_homework_completion_set
        rest_equivalent: PUT /api/workspace/homeworks/[id]/completion
        notes:
        - Pass completed=true to mark as done, completed=false to revert to incomplete.
    presentation:
      items:
      - homework.title
      - homework.submissionDueAt
      - completion action button
      - completion status
    requirement_refs:
    - homework.rest-completion-batch-input
    - homework.graphql-completion-batch-input
rationale:
- Homework is attached to a section, not a personal user todo.
