kind: feature
id: homework
name: Homework
areas:
- community
- workspace
- admin
access:
  anon: Can read homework information under public sections, but cannot create, update, or delete.
  user: When signed in and not suspended, can create and update homework; ordinary deletion is limited
    to its creator, including when the caller is an administrator. Each user can only manage their own
    completion state.
  admin: Can delete other users' homework only through explicit admin governance surfaces; ordinary REST,
    GraphQL, MCP and detail-page actions retain creator ownership checks.
  agent: After authorization, can read, create, update, and delete permitted homework and set the current
    user's completion state; REST, GraphQL, and MCP provide the supported business mutations.
requirements:
- id: homework.attached-to-section
  category: behavior
  rule: Homework is attached to a section, not a personal user todo.
- id: homework.no-subscription-required
  category: authorization
  rule: Creating homework does not require the user to be subscribed to the section first.
- id: homework.entity-and-completion-separated
  category: consistency
  rule: Homework entity and homework completion state are strictly separated to prevent 'I completed it'
    from becoming 'the homework was modified'.
- id: homework.completed-deadline-display
  category: presentation
  rule: Completed homework hides overdue and remaining-time reminders in workspace lists, cards, and shared
    detail dialogs. Keep the submission due date, completion status, and attribute badges visible; restoring
    incomplete status restores deadline reminders.
- id: homework.teaching-assistant-completion
  category: consistency
  rule: For a viewer subscribed to a section as a teaching assistant, homework completion is never required
    and every homework surface displays 无需完成 / No completion required. The completionRequired field is
    derived from the current subscription kind; actual completion records remain preserved. TA homework
    with no due date remains in pending scopes, while TA homework is excluded from pending scopes at or
    after its due instant.
- id: homework.mobile-toolbar-priority
  category: presentation
  rule: At mobile widths, completion-status filters stay directly available, card/list display mode moves
    into an accessible overflow menu, and the create action remains a minimum 44 by 44 CSS pixel target.
    Desktop toolbar behavior remains unchanged.
- id: homework.compact-card-list-surface
  category: presentation
  rule: In card and list views, the default homework surface only shows title, subtitle (course name when
    useful plus non-default attribute badges), submission due date, relative due label, and a small completion
    action. Standard/default homework is not shown as a separate badge. Course/section context, description,
    homework timestamps, discussion, and secondary actions belong in a centered detail popup that opens
    on click and closes via outside click or Escape.
- id: homework.homework-style-guide-advisory
  category: presentation
  rule: Section create and edit forms expose a collapsible homework style guide. The workspace create
    form deliberately omits this guide; the title and description conventions remain advisory on all surfaces.
    Titles use 第{N}次作业 or {主题}作业 without course name/code, and explicitly avoid chapter-only titles such
    as 第一章作业. Descriptions list 题目, 提交方式, 提交地址, and 备注 in that order; 题目 uses 未记录 when unknown and unknown
    optional fields are omitted. The guide is advisory only and never blocks otherwise valid writes.
- id: homework.creator-only-delete
  category: authorization
  rule: Ordinary delete requires the authenticated unsuspended creator. Administrator account status never
    expands a community.section-homework:write grant; moderation deletion is available only through the
    guarded admin workflow.
  acceptance:
  - id: homework.creator-only-delete.ordinary-admin-rejected
    given: An unsuspended administrator is not the creator of an active homework.
    when: The administrator uses the ordinary homework delete use-case.
    then:
    - The request is forbidden.
    - The homework, deletion audit and calendar rebuild state remain unchanged.
    tests:
    - file: tests/unit/features/homeworks/homework-delete-authority.test.ts
      name: does not give an administrator ordinary delete access to another creator's homework
  - id: homework.creator-only-delete.explicit-moderation
    given: An unsuspended administrator is not the creator of an active homework.
    when: The administrator uses the guarded moderation delete use-case.
    then:
    - The homework is deleted through the moderation path and a homework_delete audit records the administrator.
    tests:
    - file: tests/unit/features/homeworks/homework-delete-authority.test.ts
      name: allows another creator's homework only through explicit admin moderation
- id: homework.completion-set-idempotency
  category: consistency
  rule: Setting completed=true on an existing completion preserves its original completedAt; repeated
    single and batch completion requests are idempotent. Setting false removes the completion, and a subsequent
    true records a new completion time.
  acceptance:
  - id: homework.completion-set-idempotency.preserved-owner-record
    given: The owner completion upsert returns an existing completedAt timestamp.
    when: The owner sets completed=true through the shared completion service.
    then:
    - The upsert leaves existing completion fields unchanged.
    - The service returns the stored completedAt timestamp.
    tests:
    - file: tests/unit/features/homeworks/homework-completion-rls-context.test.ts
      name: validates and upserts through one owner transaction
capabilities:
  cross-section-homework-summary:
    title: Cross-Section Homework Summary
    auth: user
    links:
      models:
      - Homework
    web:
      pages:
      - /workspace/homeworks
    rest:
      routes:
      - path: /api/workspace/homeworks
        notes:
        - Returns homeworks across all subscribed sections in a single call; includes audit logs and viewer
          context.
        - REST localizes returned homework relation fields from the request locale; MCP accepts an explicit
          locale input.
    graphql:
      fields:
      - parent: Workspace
        name: homeworks
        auth: user
        required_scopes:
        - workspace.homework:read
        rest_equivalent: GET /api/workspace/homeworks
        mcp_equivalent: workspace_homework_list
        notes:
        - Inputs expose completion, due-time, semester, and bounded PageInput filters only; section ownership
          is relation-derived.
    mcp:
      tools:
      - name: workspace_homework_list
        notes:
        - Returns homeworks[]; each item contains title, submissionDueAt, section.course.namePrimary,
          section.code, description, and completion.
        - Omitting semesterId reads all subscribed semesters; pass a semesterId to recover one current
          or past term.
    presentation:
      items:
      - homework.title
      - homework.description.content
      - homework.submissionDueAt (with ETA label)
      - section.course.namePrimary
      - homework.isMajor badge
      - homework.requiresTeam badge
      - completionStatus (completed/pending)
      - 'filter: incomplete/completed/all'
      - mobile compact toolbar with direct completion filters and overflow display-mode control
      - cards/list view mode persisted in browser storage
      - 'detail popup is one scrollable column: due datetime, relative urgency, remaining facts in a table
        excluding platform createdAt, then description, then full-width discussion; completion stays in
        the footer; do not use a two-column overlay'
      - create form keeps major/team flags outside optional timestamps, omits subtitle and advisory style
        guide, and uses aligned date inputs with adjacent shortcut menus
      - create dialog uses a wider desktop layout with section, title, and timestamps on the left and
        description editing with simultaneous live Markdown preview on the right; mobile stacks the fields
      - create section options identify course, teachers, and semester; common deadlines include the selected
        section's next classes and future this/next-week weekend cutoffs in Asia/Shanghai
  section-homework-tab:
    title: Section Homework Tab
    auth: anon
    links:
      models:
      - Homework
      ui:
      - Context Tabs
    web:
      pages:
      - /catalog/sections/[jwId]
    rest:
      routes:
      - path: /api/community/section-homeworks
        notes:
        - Accepts sectionJwId to match the MCP tool's public section identifier, while preserving sectionId
          and sectionIds for existing REST clients.
        - 'The paginated list is summary-only: it keeps title, scheduling, completion, permission, and
          comment-count fields without descriptions, section/course relations, editor relations, or audit
          history.'
      - path: /api/community/section-homeworks/[id]
        method: GET
        auth: anon
        notes:
        - Loads one active homework's description, detail relations, completion state, and audit history
          after an explicit detail request.
      - path: /api/community/section-homeworks/audit
        method: GET
        auth: anon
        notes:
        - Loads section-wide audit history only after the explicit audit dialog request; the homework
          list never includes audit history.
      - path: /api/community/section-homeworks
        method: POST
        status: 201
        auth: user
        notes:
        - Returns the created homework snapshot so REST and MCP clients can continue with follow-up actions
          without an extra list call.
      - path: /api/community/section-homeworks/[id]
        method: PATCH
        auth: user
        notes:
        - Returns the updated homework snapshot after metadata and/or description changes are applied.
      - path: /api/community/section-homeworks/[id]
        method: DELETE
        auth: user
    graphql:
      mutations:
      - name: homeworkCreate
        required_scopes:
        - community.section-homework:write
        rest_equivalent: POST /api/community/section-homeworks
        mcp_equivalent: community_section_homework_create
        notes:
        - Accepts the public sectionJwId, returns the localized Homework snapshot, and writes the shared
          AuditLog event in the same transaction.
      - name: homeworkUpdate
        required_scopes:
        - community.section-homework:write
        rest_equivalent: PATCH /api/community/section-homeworks/[id]
        mcp_equivalent: community_section_homework_update
        notes:
        - Nullable description and timestamp fields clear existing values; omitted fields remain unchanged.
        - Description changes preserve the shared DescriptionEdit and description_edit audit transaction.
      - name: homeworkDelete
        required_scopes:
        - community.section-homework:write
        rest_equivalent: DELETE /api/community/section-homeworks/[id]
        mcp_equivalent: community_section_homework_delete
        notes:
        - Only the unsuspended creator may delete, including for administrator accounts. Deleting another
          user's homework requires the admin governance surface. Repeated creator deletion remains successful
          with alreadyDeleted=true and does not add another deletion audit row.
    mcp:
      tools:
      - name: community_section_homework_list
        rest_equivalent: GET /api/community/section-homeworks
        notes:
        - The top-level section scopes the list, so each item omits repeated section context.
        - Every mode is summary-only and omits descriptions, detail relations, and audit history; use
          community_description_get with targetType=homework for an explicit description request.
      - name: community_section_homework_create
        auth: user
        rest_equivalent: POST /api/community/section-homeworks
        notes:
        - REST accepts either sectionId for compatibility or sectionJwId to match the MCP tool's public
          section identifier; when both are supplied, they must resolve to the same section or the request
          returns 400.
        - Returns the created homework snapshot so MCP clients can continue with follow-up actions without
          an extra read.
        - Description advertises the advisory 第{N}次作业 / {主题}作业 title patterns and ordered 题目 / 提交方式 /
          提交地址 / 备注 template; formatting is not validated or enforced.
      - name: community_section_homework_update
        auth: user
        rest_equivalent: PATCH /api/community/section-homeworks/[id]
        notes:
        - Accepts locale for the returned homework snapshot, matching create/list localization.
        - Returns the updated homework snapshot after metadata and/or description changes are applied.
        - Description advertises the same advisory title and ordered description convention as community_section_homework_create;
          nonconforming existing or updated values remain accepted.
      - name: community_section_homework_delete
        auth: user
        rest_equivalent: DELETE /api/community/section-homeworks/[id]
        notes:
        - Requires an unsuspended signed-in creator, matching ordinary REST deletion; administrator accounts
          do not inherit moderation rights through this tool.
        - Deletes through the shared homework mutation so soft-delete and homework audit behavior stay
          shared.
    presentation:
      items:
      - homework.title
      - homework.description.content
      - homework.submissionDueAt
      - homework.submissionStartAt
      - homework.publishedAt as homework publication date
      - inline homework discussion
      - user completion status
      - edit action
      - cards/list view mode persisted in browser storage
      - 'detail popup is one scrollable column: due datetime is primary, relative urgency is secondary,
        remaining facts (status, tags, publication, submission opens) are a table that does not repeat
        due date or platform createdAt, then description, then full-width discussion; edit/completion
        stay in the footer; do not use a two-column overlay'
      - section cards use a responsive multi-column layout
      - create and edit forms expose the same collapsible advisory homework title and description style
        guide
  homework-governance:
    title: Homework Governance
    auth: admin
    web: stable
    rest:
      routes:
      - path: /api/admin/homeworks
        notes:
        - Accepts page and pageSize; deprecated limit remains an alias for pageSize.
      - path: /api/admin/homeworks/[id]
        method: DELETE
    mcp: unavailable
    presentation:
      items:
      - homework.title
      - homework.section.code
      - creator
      - creation timestamp
      - 'Action: delete'
      - 'Status: active/deleted'
  homework-completion:
    title: Homework Completion
    auth: user
    links:
      models:
      - Homework
    web: stable
    graphql:
      mutations:
      - name: homeworkCompletionSet
        auth: user
        required_scopes:
        - workspace.homework:write
        rest_equivalent: PUT /api/workspace/homeworks/[id]/completion
        mcp_equivalent: workspace_homework_completion_set
      - name: homeworkCompletionsSet
        auth: user
        required_scopes:
        - workspace.homework:write
        rest_equivalent: PUT /api/workspace/homeworks/completions
        mcp_equivalent: workspace_homework_completion_set
        notes:
        - Accepts 1-100 unique homework IDs and preserves REST per-item partial-success semantics.
        - Missing or deleted homework IDs are reported on their result item without aborting valid updates.
    rest:
      routes:
      - path: /api/workspace/homeworks/[id]/completion
        method: PUT
      - path: /api/workspace/homeworks/completions
        method: PUT
        notes:
        - 'Batch completion updates are partial by item: missing or deleted homework IDs return per-item
          errors while valid items still update.'
        - MCP remains single-item through workspace_homework_completion_set; this REST batch route exists
          for HTTP clients that otherwise fan out single-item requests.
    mcp:
      tools:
      - name: workspace_homework_completion_set
        rest_equivalent: PUT /api/workspace/homeworks/[id]/completion
        notes:
        - Pass completed=true to mark as done, completed=false to revert to incomplete.
    presentation:
      items:
      - homework.title
      - homework.submissionDueAt
      - completion action button
      - completion status
