kind: feature
id: publications
name: Publications / Public Read and Crawler Ingestion
areas:
- catalog
- platform
policy_refs:
- interface-hierarchy
- ui
- permission-ui
- rendering-and-cache
access:
  anon: May read published news and notices, including verified linked media and attachments; cannot write
    or inspect crawler ingestion data.
  user: May use the same anonymous public read surface. Crawler writes use a dedicated Worker secret and
    are not user-authenticated.
  admin: May read the public surface. The publication crawler is a machine principal authenticated by
    a dedicated Worker secret.
  agent: A crawler submits REST ingestion requests with the X-Publication-Ingestion-Secret header. Public
    reads are anonymous REST/Web capabilities; ingestion remains a REST-only crawler exception and is
    not a Web, GraphQL, or MCP capability.
requirements:
- id: publications.public-read
  category: authorization
  rule: Anonymous reads expose only non-deleted publications whose effective type is news or notice; detail
    addresses are public by publication id. Deleted publications and other are never returned. The list
    supports type=news|notice, query, page, pageSize, and the source and organizationLevel list filters.
    A list filter accepts the documented comma-separated form (source=a,b) and the repeated form a checkbox
    group submits; duplicates collapse, a single value is unchanged, at most 20 source ids, and the facets
    intersect.
- id: publications.reprint-folding
  category: presentation
  rule: Publication lists default to unfolded rows. Explicit fold=1 groups matching normalized titles
    on the same Asia/Shanghai published day and chooses a university source first, then the most recently
    observed copy, then the lowest ID.
  rationale: Title-and-day folding is a discovery heuristic, not proof that two sources published identical
    content. Changing the default or equivalence criteria requires a product decision.
- id: publications.reprint-fold-title-normalization
  category: consistency
  rule: Reprint grouping uses NFKC-normalized titles with the configured invisible characters removed,
    whitespace collapsed, and text lowercased. Application and database grouping produce identical keys
    for the same title.
  rationale: SQL grouping avoids loading the full publication list into application memory; implementation
    paths are not part of the wire contract.
- id: publications.reprint-sibling-exposure
  category: presentation
  rule: A folded row representing two or more members carries foldGroup.siblingCount; an unfolded request
    never includes foldGroup. Independent of fold, the detail response always includes alsoPublishedIn,
    the sibling reprints sharing the same normalized title and published date, so a detail page can cross-link
    the other sections.
- id: publications.public-object-read
  category: authorization
  rule: Object reads require a verified or linked object associated with the current non-tombstone revision
    of a non-deleted news or notice publication. The server derives its content-addressed key, checks
    that relationship, and returns not found when the permitted object or bytes are missing.
  rationale: Public cache lifetime and removal freshness require a consistent delivery policy; historical
    revision links do not independently authorize a fresh origin read.
- id: publications.publication-markdown
  category: presentation
  rule: Detail loads a verified body_markdown object from R2 and returns bodyMarkdown or null, never substituting
    bodyText. body_html remains archived. Publication holds discovery fields; content and provenance live
    on revisions. Lists select summaries and object links; detail adds images with local proxy URLs and
    revision alt/title/caption. Web annotates sanitized Markdown with plain-text captions and metadata
    and displays structured attribution and attachment names.
- id: publications.publication-images
  category: presentation
  rule: Ingestion registers exact source URL SHA-256 hashes for current public revisions. Markdown uses
    /api/publications/images/{hash}. Fetches and redirects allow the registered exact public hostname,
    USTC and source allowed hosts; blocked hosts win. IP/local hosts, credentials, custom ports, non-HTTP(S),
    non-raster and oversized responses are rejected. Successful images are archived in R2 with finite
    response cache lifetimes; failures are not cached.
- id: publications.public-cache
  category: consistency
  rule: Public list/detail responses are cacheable JSON. Object responses use their content-addressed
    key as a long-lived immutable cache key and forward a provider ETag for conditional requests. Media
    may render inline; all other object kinds use a generated safe attachment filename and never trust
    crawler-provided filenames.
- id: publications.rest-only
  category: behavior
  rule: Publication ingestion and object upload planning are exposed only under /api/ingestion/publications.
    Do not add Web, GraphQL, or MCP transports for these writes, and do not treat the machine secret as
    a user OAuth credential.
- id: publications.read-transport-boundary
  category: behavior
  rule: The current product needs a public website preview plus public REST for read/list/detail, the
    source directory, and controlled object delivery. GraphQL and MCP are intentionally not added for
    publications, including the source registry, until a separate client contract requires them; this
    is a transport boundary, not an implicit GraphQL/MCP capability.
- id: publications.service-auth
  category: authorization
  rule: Ingestion writes require the X-Publication-Ingestion-Secret header, compared against the Worker
    secret PUBLICATION_INGESTION_SECRET with a timing-safe comparison. Missing or invalid configuration
    returns the same generic 401 response, and the secret is never logged or returned.
- id: publications.service-principal
  category: authorization
  rule: All crawler batches, runs, and object claims use the stable service:publication-crawler principal
    key. The service principal has no User row, OAuth grant, or administrator flag; this key scopes ownership
    and idempotency.
- id: publications.source-registration
  category: behavior
  rule: Every batch carries source descriptors, either the full id/name/organizationLevel/allowedHosts/seedUrls
    form or the minimal id/name form. The server upserts them in the same transaction, normalizing organizationLevel
    to the registry enum and reusing persisted host restrictions and the persisted level for minimal descriptors,
    then accepts an item only when its sourceId is in that batch, enabled and not discovery-only. Canonical
    URLs must match an allowed source host and no blocked host.
- id: publications.identity
  category: consistency
  rule: A publication is identified by (sourceId, canonicalUrl). A revision is identified by (publicationId,
    revisionHash), and each revision owns its object links. Reporter, editor and originalPublisher are
    distinct nullable revision fields. Per-revision image metadata (altText/title/caption) and attachment
    filename/sourceUrl are retained separately from shared URL/hash object identities and participate
    in replay equality.
- id: publications.revision-ordering
  category: consistency
  rule: observedAt is the source observation time. An older observation never overwrites the current revision;
    equal timestamps use the revision hash as a deterministic tie-breaker. A date-only or timezone-less
    crawler timestamp is interpreted as Asia/Shanghai local time before persistence.
- id: publications.tombstones
  category: consistency
  rule: 'Deletion is explicit: a tombstone item creates a tombstone revision for an existing publication
    and marks it deleted. Tombstoning an unknown publication is an idempotent no-op reported as unchanged
    with null publication and revision ids. A tombstone applied to an existing publication is reported
    as updated.'
- id: publications.batch-idempotency
  category: consistency
  rule: Batch identity is scoped by principalKey and batchId. Replaying the same canonical payload returns
    the stored result without reapplying writes; reusing the pair with another digest returns 409. clientRunId
    is likewise scoped by principalKey.
- id: publications.batch-size
  category: validation
  rule: A publication ingestion request body is at most 8 MiB. An oversized body returns 413 while streaming
    and the batch is refused whole without ingestion writes.
  rationale: The body-byte budget bounds memory independently of the per-batch item count; clients split
    oversized batches.
- id: publications.partial-item-rejection
  category: consistency
  rule: A source or item validation error is returned as a per-item rejected result and does not roll
    back other valid items in the batch. Batch-level identity, manifest, and database failures remain
    errors.
- id: publications.objects
  category: consistency
  rule: The server generates content-addressed object keys from registered manifests. Metadata may arrive
    before bytes. Planning permits only claims belonging to the accepted caller batch and distinguishes
    already verified objects from objects requiring upload. An authenticated Worker PUT verifies the declared
    size, content type and SHA-256 before linking the uploaded object; there is no separate completion
    endpoint.
- id: publications.unchanged-objects
  category: consistency
  rule: An unchanged item still re-registers its object claims against the current batch so a redelivery
    under a new batchId can plan uploads. When a claimed object has no verified bytes (status other than
    verified or linked), the item result carries objectsNeedingUpload entries ({ kind, sha256 }) and the
    client must plan and upload those objects against the new batchId; the field is absent when every
    claimed object is already verified.
- id: publications.outbox
  category: consistency
  rule: Accepted revisions write a durable PublicationEventOutbox row in the same transaction. A future
    Queue consumer may derive work from this outbox; the ingestion path does not claim delivery until
    a real publisher exists.
- id: publications.content-type
  category: validation
  rule: The first accepted content type for an object kind and SHA-256 is canonical. Later equivalent
    MIME labels cannot change its key, size, canonical delivery type, or revision identity. Plans, authenticated
    PUT validation, and object reads use the canonical content type; revision equality also includes object
    order and revision-specific media metadata.
- id: publications.required-upload-headers
  category: validation
  rule: An upload plan returns the authenticated on-site Worker PUT URL and its required Content-Type
    header. The registered manifest determines object kind, SHA-256 and storage key; callers cannot override
    them through metadata headers. Upload plans never return R2 credentials or presigned URLs.
- id: publications.source-registry
  category: behavior
  rule: PublicationSource is the registry of who publishes. organizationLevel is a closed enum (university,
    office, department, college, center, research, service, program, society, journal, student, unknown)
    whose declaration order is the directory's display order. The crawler owns the upstream vocabulary,
    so ingestion normalizes an unrecognized or absent level to unknown instead of rejecting the batch.
    The directory lists enabled, non-discovery-only sources, including one that has published nothing
    yet.
- id: publications.object-size-limit
  category: validation
  rule: Each object manifest declares at most 32 MiB of object bytes. The bound is inclusive and is separate
    from the ingestion JSON body limit.
  acceptance:
    given: An otherwise valid ingestion item has an object manifest.
    when: The actual request schema parses a 32 MiB object size and one byte more.
    then:
    - Exactly 32 MiB is accepted.
    - 32 MiB plus one byte is rejected.
    test:
      file: tests/unit/features/publications/publication-ingestion-contract.test.ts
      name: publications.object-size-limit
- id: publications.batch-item-count
  category: validation
  rule: An ingestion batch contains 1 through 100 items; empty and larger batches are rejected by the
    input schema.
  acceptance:
    given: An ingestion batch otherwise satisfies its source and item schema.
    when: The declared request schema parses empty, 100-item and 101-item batches.
    then:
    - The empty batch is rejected.
    - 100 items are accepted.
    - 101 items are rejected.
    test:
      file: tests/unit/features/publications/publication-ingestion-contract.test.ts
      name: publications.batch-item-count
- id: publications.manifest-content-type
  category: validation
  rule: Object manifests require a bare MIME type. MIME parameters such as charset are rejected.
  acceptance:
    given: A valid object manifest uses text/html.
    when: The input parser receives the bare MIME value and text/html with a charset parameter.
    then:
    - The bare MIME value is accepted.
    - The parameterized value is rejected.
    test:
      file: tests/unit/features/publications/publication-ingestion-contract.test.ts
      name: publications.manifest-content-type
capabilities:
  publication-read:
    title: Public publication list, detail, and verified object read
    auth: anon
    web: stable
    graphql: unavailable
    mcp: unavailable
    rest:
      routes:
      - path: /api/publications
        method: GET
        notes:
        - Defaults to non-deleted news and notices; optional type accepts only news or notice.
        - Supports source, organizationLevel, query, page, and pageSize filters. source and organizationLevel
          accept a list in either the comma-separated or the repeated-parameter form (see source-filtering).
          query searches the indexed canonical URL, title, and summary fields; raw crawler metadata and
          archive HTML are never exposed.
        - 'Optional fold=1 (issue #1068, opt-in, default off) groups reprints of the same article across
          sections by normalized title and published date, returning one representative row per group
          with an optional foldGroup.siblingCount when the group has 2+ members.'
      - path: /api/publications/{id}
        method: GET
        notes:
        - Returns the effective current revision with its verified/linked object metadata. Deleted, tombstoned,
          and other publications are not found.
        - alsoPublishedIn always lists sibling publications sharing this article's normalized title and
          published date (see reprint-folding), independent of the list fold parameter.
      - path: /api/publications/objects/{kind}/{sha256}
        method: GET
        notes:
        - The server derives and checks the R2 content-addressed key; clients cannot choose an arbitrary
          key.
        - Responses use ETag/immutable cache headers and safe content disposition.
      - path: /api/publications/images/{hash}
        method: GET
        notes:
        - Resolves only a hash linked to a current public news or notice revision from the ingestion imageSources
          map; there is no arbitrary URL proxy parameter.
        - Successful raster images are cached in R2 under a URL-hash namespace with finite cache headers
          because the upstream URL may change. Invalid origins, redirect targets, credentials, custom
          ports, private/local hosts, non-raster responses, oversized bodies, and origin failures are
          rejected without caching.
    presentation:
      items:
      - source name and organization level
      - news/notice type
      - current revision title, summary, and source URL
      - current bodyMarkdown loaded from the body_markdown R2 object
      - verified media and attachment links
  publication-source-directory:
    title: Public publication source directory
    auth: anon
    web: stable
    graphql: unavailable
    mcp: unavailable
    rest:
      routes:
      - path: /api/publications/sources
        method: GET
        notes:
        - Lists enabled, non-discovery-only sources grouped by organizationLevel in the registry's declaration
          order; a level with no registered source is omitted.
        - Each source carries its allowed hosts, its publication count, and the newest published date,
          all computed with the public list's visibility filter. Blocked hosts, seed URLs, aliases and
          crawler tuning stay internal.
        - The registry is bounded (~80 sources), so the directory is returned whole rather than paginated,
          under the same cache headers as the list read.
        - organizationLevel uses the same documented registry vocabulary in directory, list, and detail
          responses; unknown upstream values normalize to unknown.
    presentation:
      items:
      - organization level group with its source and publication counts
      - source name, id, and allowed hosts
      - per-source publication count and latest published date
      - cross-link to the list filtered by that source or level
  publication-ingestion:
    title: Crawler publication batch ingestion
    auth: internal
    web: unavailable
    graphql: unavailable
    mcp: unavailable
    rest:
      routes:
      - path: /api/ingestion/publications/batches
        method: POST
        notes:
        - Request and response use the shared camelCase fixture shape in tests/fixtures/publication-batch.json.
        - Each non-tombstone item may include imageSources, mapping lowercase SHA-256(UTF-8 original absolute
          image URL) keys to original URLs; the server stores the map in the indexed image-source registry,
          and body_markdown Markdown must reference the same-origin /api/publications/images/{hash} paths.
        - Each result includes sourceId, canonicalUrl, and revisionHash so repeated URLs or revisions
          remain unambiguous. Status is created, updated, unchanged, or rejected; rejected results include
          an error and nullable publicationId/revisionId.
        - An unchanged result may include objectsNeedingUpload ({ kind, sha256 }[]) listing claimed objects
          whose bytes were never verified; the client plans and uploads those objects against the response
          batchId.
      - path: /api/ingestion/publications/objects/plan
        method: POST
        notes:
        - Only manifests registered by the caller's accepted batch may be planned.
        - Each object is already_present or upload_required. An already_present object is trusted from
          a prior verification (status verified or linked) without re-heading R2; upload_required includes
          the authenticated Worker uploadUrl, r2Key, and requiredHeaders.
      - path: /api/ingestion/publications/objects/{batchId}/{kind}/{sha256}
        method: PUT
        notes:
        - The server resolves the key from the registered manifest, streams the body through the Worker
          R2 binding, and supplies the manifest SHA-256 to R2 for upload-time verification before linking
          it.
    presentation:
      items:
      - source descriptor registration
      - publication and revision metadata
      - per-item ingestion status
      - content-addressed object manifest and verification status
