kind: feature
id: todo
name: Todo
areas:
- workspace
policy_refs:
- interface-hierarchy
- ui
- permission-ui
- rendering-and-cache
- cases.mcp-assistant-workflows
requirements:
- id: todo.personal-ownership
  category: authorization
  surfaces:
  - web
  - rest
  - graphql
  - mcp
  applies_to:
  - todo-list
  - todo-edit
  rule: Anonymous callers cannot read or write personal todos. Authenticated users can only read and manage
    their own todos on every surface, including through OAuth-authorized clients. Administrator status
    never grants ordinary access to another user's todos.
  acceptance:
    given: An isolated regular user and administrator each own one private todo, and independent OAuth
      clients receive todo read/write grants.
    when: Anonymous, signed Web, REST, GraphQL and real HTTP MCP callers read lists, create/edit/delete
      owned todos, and attempt individual or batch writes to the other owner’s todo.
    then:
    - Anonymous reads and writes never reveal or modify private todos.
    - Each owner, including the administrator and OAuth clients, sees only their own list and can manage
      their own records.
    - Foreign IDs and caller-supplied user IDs cannot redirect ownership; mixed-owner batches mutate only
      the owned item.
    - The other owner’s complete stored record remains unchanged after every transport.
    test:
      file: tests/e2e/src/app/workspace/todos/ownership-contract.test.ts
      name: todo.personal-ownership
- id: todo.web-list-state
  category: presentation
  rule: The Web todo list preserves the selected completion filter even when it has no matching rows.
  acceptance:
    given: An isolated temporary owner and signed session have one incomplete todo and no completed rows.
    when: Desktop and mobile views repeatedly select the empty completed filter, switch to populated filters
      and explicitly clear the filter.
    then:
    - The selected completed filter remains checked while the actual empty state is rendered and no task
      actions exist.
    - Repeated selection does not fall back to another filter.
    - Explicitly clearing the filter selects All and restores the populated list.
    test:
      file: tests/e2e/src/app/workspace/todos/presentation-contract.test.ts
      name: todo.web-list-state
- id: todo.web-due-order
  category: presentation
  rule: The Web todo list orders dated tasks by deadline ascending, followed by undated tasks. This order applies to every completion filter and updates after edits; equal deadlines preserve the existing list order.
  rationale: Earliest deadlines keep overdue work ahead of future work. Undated tasks remain visible after dated tasks. Sorting does not depend on a moving page-reference time and agrees with the server's deadline ordering.
  acceptance:
    given: The owner has undated, long-overdue, near-past, near-future and next-day todos.
    when: Desktop and mobile Web lists select every completion filter, complete the fixtures and edit a deadline through the actual form.
    then:
    - Earlier deadlines appear first and undated tasks appear last.
    - Incomplete, completed and All filters preserve deadline order.
    - Editing the oldest deadline to a future time moves the task to its new chronological position.
    test:
      file: tests/e2e/src/app/workspace/todos/presentation-contract.test.ts
      name: todo.web-due-order
- id: todo.web-detail
  category: presentation
  rule: Todo detail and list views display the same priority value and localized badge semantics.
  acceptance:
    given: The authenticated owner has low-, medium- and high-priority todos.
    when: Each todo is opened from desktop and mobile views in Chinese and English.
    then:
    - List/card and detail display the same localized priority label.
    - Priority badge foreground, background and border colors match between the list/card and detail.
    - Raw priority enum values are not displayed in detail.
    test:
      file: tests/e2e/src/app/workspace/todos/presentation-contract.test.ts
      name: todo.web-detail
- id: todo.purely-personal
  category: authorization
  rule: A todo can be created and managed without a section or section subscription and never appears
    as shared section homework.
  acceptance:
    given: A new owner has no section subscriptions.
    when: Real owner-scoped services create, list, edit and delete a dated todo.
    then:
    - All operations succeed without adding a section subscription.
    - The updated todo appears in the owner calendar and no matching shared homework exists.
    - Deletion removes the personal task.
    test:
      file: tests/integration/todo-lifecycle-contract.test.ts
      name: todo.purely-personal
- id: todo.due-date-calendar
  category: behavior
  rule: Only incomplete todos with a due date appear in the calendar.
  acceptance:
    given: The owner has all four combinations of dated/undated and completed/incomplete todos.
    when: The real unified calendar reads those rows, then the dated incomplete todo is completed, reopened
      and made undated.
    then:
    - Only the dated incomplete todo appears initially.
    - Completion removes it, reopening restores it, and clearing the due date removes it again.
    test:
      file: tests/integration/todo-lifecycle-contract.test.ts
      name: todo.due-date-calendar
- id: todo.completed-retained
  category: presentation
  rule: Completing a todo preserves it in personal task history.
  acceptance:
    given: The owner has a dated high-priority todo with content.
    when: Real services complete it, read completion-filtered history and reopen it.
    then:
    - The completed history retains the same identity, title, content, priority, due date and creation
      time.
    - Completion removes it from incomplete reads without deleting it; reopening moves the same row back.
    test:
      file: tests/integration/todo-lifecycle-contract.test.ts
      name: todo.completed-retained
- id: todo.bounded-summary-read
  category: consistency
  rule: Incomplete, completed and overdue summary counts cover all of the authenticated owner's todos
    regardless of list filters. The returned list remains bounded by its requested limit.
  acceptance:
    given: The owner has completed, undated, overdue and future todos.
    when: The real summary service lists one row with all, completed and incomplete filters.
    then:
    - Counts always include the complete owner task population.
    - Each returned list obeys its limit and selected completion filter.
    test:
      file: tests/integration/todo-overview-counts.test.ts
      name: todo.bounded-summary-read
- id: todo.mobile-toolbar-priority
  category: presentation
  rule: At mobile widths, completion-status filters stay directly available and todos use cards. Desktop
    todos use the table view; there is no display-mode menu.
  acceptance:
    given: The authenticated owner has personal todos.
    when: The actual workspace is viewed at desktop and mobile widths and each completion filter is selected.
    then:
    - Desktop displays a table and mobile displays cards.
    - All completion filters remain directly visible and selectable; mobile controls have at least 44px
      targets within the viewport.
    - No view-mode menu or list/card selector is shown, and the page does not overflow horizontally.
    test:
      file: tests/e2e/src/app/workspace/todos/presentation-contract.test.ts
      name: todo.mobile-toolbar-priority
- id: todo.rest-list-limit
  category: validation
  applies_to:
  - todo-list
  expectation:
    kind: numeric_input
    surface: rest
    operation: GET /api/workspace/todos
    input: limit
    minimum: 1
    maximum: 200
    default: 100
    integer: true
  acceptance:
    given: An authenticated caller lists personal todos.
    when: The limit is omitted, on a boundary, fractional, or outside the interval.
    then:
    - The declared default reaches the read model and invalid limits are rejected before reading.
    test:
      file: tests/unit/features/todos/todo-specification-inputs.test.ts
      name: todo.rest-list-limit
- id: todo.mcp-list-limit
  category: validation
  applies_to:
  - todo-list
  expectation:
    kind: numeric_input
    surface: mcp
    operation: workspace_todo_list
    input: limit
    minimum: 1
    maximum: 200
    default: 50
    integer: true
  acceptance:
    given: An authenticated caller lists personal todos.
    when: The limit is omitted, on a boundary, fractional, or outside the interval.
    then:
    - The declared default reaches the read model and invalid limits are rejected before reading.
    test:
      file: tests/unit/features/todos/todo-specification-inputs.test.ts
      name: todo.mcp-list-limit
  rationale: The smaller default bounds assistant context; REST permits a larger initial list for general
    HTTP clients. Both retain the same maximum.
- id: todo.rest-batch-patch-bounds
  category: validation
  applies_to:
  - todo-edit
  expectation:
    kind: collection_input
    surface: rest
    operation: PATCH /api/workspace/todos/batch
    input: items
    min_items: 1
    max_items: 100
    unique_items: true
  acceptance:
    given: An authenticated caller sends a batch.
    when: The collection is empty, at each boundary, too large, or contains duplicate IDs.
    then:
    - Accepted requests reach the service for every item; invalid sizes or repeated normalized targets produce no service calls.
    test:
      file: tests/unit/features/todos/todo-batch-route.test.ts
      name: todo.rest-batch-patch-bounds
  rationale: Normalized duplicate targets are rejected before any write, matching GraphQL and avoiding conflicting repeated state changes in one batch.
- id: todo.rest-batch-delete-bounds
  category: validation
  applies_to:
  - todo-edit
  expectation:
    kind: collection_input
    surface: rest
    operation: DELETE /api/workspace/todos/batch
    input: ids
    min_items: 1
    max_items: 100
    unique_items: true
  acceptance:
    given: An authenticated caller sends a batch.
    when: The collection is empty, at each boundary, too large, or contains duplicate IDs.
    then:
    - Accepted requests reach the service for every item; invalid sizes or repeated normalized targets produce no service calls.
    test:
      file: tests/unit/features/todos/todo-batch-route.test.ts
      name: todo.rest-batch-delete-bounds
  rationale: Normalized duplicate targets are rejected before any write, matching GraphQL and avoiding conflicting repeated state changes in one batch.
- id: todo.rest-patch-ownership
  category: authorization
  applies_to:
  - todo-edit
  expectation:
    kind: authorization
    surface: rest
    operation: PATCH /api/workspace/todos/[id]
    cases:
    - id: anonymous
      authenticated: false
      suspended: false
      role: user
      relationship: other
      outcome: unauthenticated
    - id: user-owner
      authenticated: true
      suspended: false
      role: user
      relationship: owner
      outcome: allowed
    - id: user-other
      authenticated: true
      suspended: false
      role: user
      relationship: other
      outcome: not_found
    - id: admin-owner
      authenticated: true
      suspended: false
      role: admin
      relationship: owner
      outcome: allowed
    - id: admin-other
      authenticated: true
      suspended: false
      role: admin
      relationship: other
      outcome: not_found
    denied_effects:
    - todo
  acceptance:
    given: Fresh todos belong to signed-in ordinary and administrator users.
    when: Anonymous, owner and other-user contexts invoke the ordinary REST endpoint.
    then:
    - Observed HTTP outcomes match each case and denied writes leave the database row unchanged.
    test:
      file: tests/integration/rest/todos/[id]/test.ts
      name: todo.rest-patch-ownership
- id: todo.rest-delete-ownership
  category: authorization
  applies_to:
  - todo-edit
  expectation:
    kind: authorization
    surface: rest
    operation: DELETE /api/workspace/todos/[id]
    cases:
    - id: anonymous
      authenticated: false
      suspended: false
      role: user
      relationship: other
      outcome: unauthenticated
    - id: user-owner
      authenticated: true
      suspended: false
      role: user
      relationship: owner
      outcome: allowed
    - id: user-other
      authenticated: true
      suspended: false
      role: user
      relationship: other
      outcome: not_found
    - id: admin-owner
      authenticated: true
      suspended: false
      role: admin
      relationship: owner
      outcome: allowed
    - id: admin-other
      authenticated: true
      suspended: false
      role: admin
      relationship: other
      outcome: not_found
    denied_effects:
    - todo
  acceptance:
    given: Fresh todos belong to signed-in ordinary and administrator users.
    when: Anonymous, owner and other-user contexts invoke the ordinary REST endpoint.
    then:
    - Observed HTTP outcomes match each case and denied writes leave the database row unchanged.
    test:
      file: tests/integration/rest/todos/[id]/test.ts
      name: todo.rest-delete-ownership
- id: todo.web-detail-actions
  category: presentation
  applies_to:
  - todo-list
  expectation:
    kind: ordered_items
    surface: web
    target: '[data-slot="dialog-footer"]'
    items:
    - delete
    - completion
    - edit
  acceptance:
    given: An incomplete todo detail dialog is open.
    when: The footer actions are rendered.
    then:
    - The visible buttons occur in the specified order.
    test:
      file: tests/e2e/src/app/workspace/todos/test.ts
      name: todo.web-detail-actions
- id: todo.web-create-target
  category: presentation
  applies_to:
  - todo-list
  expectation:
    kind: target_size
    surface: web
    target: workspace-todos-add
    viewport:
      width: 390
      height: 844
    min_width: 44
    min_height: 44
  acceptance:
    given: The todo workspace is rendered at the specified viewport.
    when: The create button is measured.
    then:
    - Both CSS pixel dimensions meet the declared minimum.
    test:
      file: tests/e2e/src/app/workspace/todos/test.ts
      name: todo.web-create-target
- id: todo.web-completed-title
  category: presentation
  applies_to:
  - todo-list
  expectation:
    kind: state_presentation
    surface: web
    target: '[data-slot="dialog-title"]'
    state:
      completed: true
    text_decoration: line-through
  acceptance:
    given: A todo has the specified completed state.
    when: Its detail dialog opens.
    then:
    - The rendered title has the declared computed text decoration.
    test:
      file: tests/e2e/src/app/workspace/todos/test.ts
      name: todo.web-completed-title
- id: todo.update-calendar-after-commit
  category: consistency
  rule: A todo update enqueues exactly one owner calendar rebuild after commit and none while commit is
    pending.
  acceptance:
    given: A todo update has finished its transaction callback while commit is pending.
    when: The commit succeeds.
    then:
    - No rebuild is queued before commit.
    - Exactly one owner rebuild is queued after commit.
    test:
      file: tests/unit/features/todos/todo-calendar-invalidation.test.ts
      name: todo.update-calendar-after-commit
- id: todo.update-calendar-rollback
  category: consistency
  rule: A failed todo update commit reports its failure and enqueues no calendar rebuild.
  acceptance:
    given: A todo update has finished its transaction callback while commit is pending.
    when: The commit fails.
    then:
    - The update fails and no rebuild is queued.
    test:
      file: tests/unit/features/todos/todo-calendar-invalidation.test.ts
      name: todo.update-calendar-rollback
- id: todo.web-local-mutation-state
  category: presentation
  rule: Successful local todo creates, edits, completion changes and deletes update the list without a
    reload; changing filters does not resurrect stale rows.
  acceptance:
    given: An authenticated owner opens the todo workspace.
    when: The owner creates, edits, completes and deletes a todo through the actual Web controls, switching
      completion filters after changes.
    then:
    - The new and edited titles appear immediately; replaced titles disappear.
    - Completed state appears only in matching filters and deleted rows never reappear when filters change.
    - A marker on the original document survives the complete flow, proving that no full reload occurred.
    test:
      file: tests/e2e/src/app/workspace/todos/test.ts
      name: todo.web-local-mutation-state
- id: todo.completed-not-urgent
  category: presentation
  rule: Completed todos do not appear in urgent overview or calendar information.
  acceptance:
    given: The owner has overdue and upcoming completed tasks plus one upcoming incomplete task.
    when: Real compact overview and calendar reads run before and after the remaining task is completed.
    then:
    - Completed tasks contribute to history counts but never overdue or upcoming urgent items.
    - Only the incomplete task appears in due samples and calendar events.
    - Completing it leaves no urgent items or calendar events and retains all three completed history
      rows.
    test:
      file: tests/integration/todo-lifecycle-contract.test.ts
      name: todo.completed-not-urgent
- id: todo.delete-calendar-after-commit
  category: consistency
  rule: A successful todo delete requests an owner calendar rebuild only after commit; a rolled-back delete
    requests none.
  acceptance:
    given: The owner has a todo and a rebuild sender reads that row through a separate database connection.
    when: The actual delete service succeeds, then a second delete is rejected by a deferred constraint
      trigger at commit.
    then:
    - The successful rebuild observes that deletion has committed.
    - The failed deletion preserves the todo and emits no rebuild.
    test:
      file: tests/integration/calendar-commit-contract.test.ts
      name: todo.delete-calendar-after-commit
capabilities:
  todo-list:
    title: Todo List & Filter
    auth: user
    links:
      models:
      - Todo
    web:
      pages:
      - /workspace/todos
    graphql:
      fields:
      - parent: Workspace
        name: todos
        auth: user
        required_scopes:
        - workspace.todo:read
        rest_equivalent: GET /api/workspace/todos
        mcp_equivalent: workspace_todo_list
        notes:
        - Ownership comes from the authenticated principal; PageInput defaults to 1/20 and caps pageSize
          at 100.
      mutations:
      - name: todoCreate
        auth: user
        required_scopes:
        - workspace.todo:write
        rest_equivalent: POST /api/workspace/todos
        mcp_equivalent: workspace_todo_create
      - name: todoUpdate
        auth: user
        required_scopes:
        - workspace.todo:write
        rest_equivalent: PATCH /api/workspace/todos/[id]
        mcp_equivalent: workspace_todo_update
      - name: todoDelete
        auth: user
        required_scopes:
        - workspace.todo:write
        rest_equivalent: DELETE /api/workspace/todos/[id]
        mcp_equivalent: workspace_todo_delete
      - name: todoCompletionsSet
        auth: user
        required_scopes:
        - workspace.todo:write
        rest_equivalent: PATCH /api/workspace/todos/batch
        mcp_equivalent: workspace_todo_update
        notes:
        - Accepts 1-100 unique todo IDs and preserves REST per-item partial-success semantics.
        - Missing and non-owned todos are reported on their result item without aborting valid updates.
      - name: todosDelete
        auth: user
        required_scopes:
        - workspace.todo:write
        rest_equivalent: DELETE /api/workspace/todos/batch
        mcp_equivalent: workspace_todo_delete
        notes:
        - Accepts 1-100 unique todo IDs and preserves REST per-item partial-success semantics.
    rest:
      routes:
      - path: /api/workspace/todos
        notes:
        - Returns the same count summary as workspace_todo_list plus todos[]; each item contains id, title,
          content, completed, priority, dueAt, createdAt, and updatedAt.
        - Supports completed, priority, dueBefore, dueAfter, and limit query parameters.
        - Summary counts cover all of the current user's todos regardless of list filters and are computed
          in one aggregate statement.
        requirement_refs:
        - todo.rest-list-limit
    mcp:
      tools:
      - name: workspace_todo_list
        rest_equivalent: GET /api/workspace/todos?completed=false&limit=50
        notes:
        - includeCompleted defaults to false.
        - Incomplete items are returned first; completed items are excluded unless includeCompleted=true.
        requirement_refs:
        - todo.mcp-list-limit
    presentation:
      items:
      - todo.title
      - todo.content (description)
      - todo.priority
      - todo.dueAt
      - detail popup stacks title, then due datetime, relative urgency, a table of remaining facts (priority,
        completion), then content; completion/edit/delete stay in the footer
      - completed status action button
      - 'filter: incomplete/completed/all'
      - mobile compact toolbar with direct completion filters
    requirement_refs:
    - todo.rest-list-limit
    - todo.mcp-list-limit
    - todo.web-detail-actions
    - todo.web-create-target
    - todo.web-completed-title
  todo-edit:
    title: Todo Create/Edit Form
    auth: user
    links:
      models:
      - Todo
    web:
      pages:
      - /workspace/todos
    rest:
      routes:
      - path: /api/workspace/todos
        method: POST
        status: 201
      - path: /api/workspace/todos/[id]
        method: PATCH
        requirement_refs:
        - todo.rest-patch-ownership
        notes:
        - Returns the updated todo snapshot so callers can confirm applied changes without an extra read.
      - path: /api/workspace/todos/batch
        method: PATCH
        notes:
        - Each item reports success or a per-item not_found/forbidden error without aborting the whole
          batch.
        requirement_refs:
        - todo.rest-batch-patch-bounds
      - path: /api/workspace/todos/[id]
        method: DELETE
        requirement_refs:
        - todo.rest-delete-ownership
      - path: /api/workspace/todos/batch
        method: DELETE
        notes:
        - Each id reports success or a per-item not_found/forbidden error without aborting the whole batch.
        requirement_refs:
        - todo.rest-batch-delete-bounds
    mcp:
      tools:
      - name: workspace_todo_create
        rest_equivalent: POST /api/workspace/todos
      - name: workspace_todo_update
        rest_equivalent: PATCH /api/workspace/todos/[id]
        notes:
        - Returns the updated todo snapshot so callers can confirm the applied changes without an extra
          read. Missing todos and other users' todos hidden by row security return 404, including for
          admin callers.
      - name: workspace_todo_delete
        rest_equivalent: DELETE /api/workspace/todos/[id]
    presentation:
      items:
      - todo.title (text input)
      - todo.content (text/markdown input)
      - todo.priority (select)
      - todo.dueAt (date/time picker)
      - Save button
      - Delete button (edit mode)
      - Cancel button
    requirement_refs:
    - todo.rest-batch-patch-bounds
    - todo.rest-batch-delete-bounds
    - todo.rest-patch-ownership
    - todo.rest-delete-ownership
rationale:
- Todo create commit/rebuild ordering and rollback exclusion are canonically covered by the cross-source
  ical.committed-write-rebuilds contract.
