kind: feature
id: calendar
name: Calendar
areas:
- workspace
- catalog
policy_refs:
- interface-hierarchy
- ui
- permission-ui
- rendering-and-cache
access:
  anon: Can browse calendar information on public section detail pages.
  user: Can browse the personal calendar view.
  admin: Has no special calendar view separate from regular users.
  agent: Can read the complete personal date-range calendar through REST, GraphQL and MCP with workspace.calendar:read.
    REST/GraphQL use pagination.
requirements:
- id: calendar.personal-feed-http-cache
  category: privacy
  rule: Personal calendar HTTP responses and revoked-credential errors use private, no-store.
  acceptance:
    given: A persisted owner has a personal calendar with one dated item.
    when: The actual feed handler returns a cold 200, authorized ETag 304 and wrong-credential 410.
    then:
    - All three responses use private, no-store.
    test:
      file: tests/integration/calendar-feed-contract.test.ts
      name: calendar.personal-feed-http-cache
- id: calendar.views
  category: presentation
  rule: Personal calendars provide day, week, and month views with individually subscribed activities.
    Course subscriptions add a semester view while preserving day access on desktop and mobile.
  rationale: Day, week, and month remain useful with or without courses; semester adds the academic planning
    range without removing a shorter view. A day agenda preserves course context and subscription badges.
  acceptance:
    given: One isolated owner has a course and an activity subscription; another has only the same activity
      subscription.
    when: The actual desktop academic semester/month/week grids, desktop/mobile day agendas, and activity-only
      day/week/month views render; users navigate days and reload the selected day URL.
    then:
    - Academic grids include course events and subscribed activities; day agendas include only events
      on the selected day.
    - Previous day, next day, and today select the expected campus date; reloading preserves the selected
      day and its events.
    - Every activity-only mode displays the activity without requiring or leaking course subscriptions.
    test:
      file: tests/e2e/src/app/workspace/calendar/presentation-contract.test.ts
      name: calendar.views
- id: calendar.mobile-agenda-first
  category: presentation
  rule: At mobile widths, the personal academic calendar offers day and week as vertically readable agendas
    with time, title, type, and available location context. Previous day/week, today, next day/week, and
    iCal actions remain directly accessible without page-level horizontal scrolling; desktop also offers
    month and semester grids.
  acceptance:
    given: An isolated signed-in course subscriber opens a selected week on a 390px screen.
    when: The browser reads the agenda, uses its iCal action, navigates weeks, and switches between day
      and week.
    then:
    - Week mode shows seven vertical day groups and real event context; day mode shows one day group.
    - Day/week navigation and today/actions controls have at least 44px touch bounds and copied iCal links
      are usable.
    - Navigation preserves the agenda without page-level horizontal overflow.
    test:
      file: tests/e2e/src/app/workspace/calendar/test.ts
      name: calendar.mobile-agenda-first
- id: calendar.week-starts-monday
  category: presentation
  rule: All personal academic and activity calendar grids start on Monday and end on Sunday. Date cells
    remain aligned with their weekday headers.
  rationale: One weekday order keeps dates in the same columns when viewers change mode or add course
    subscriptions, matching the campus workweek.
  acceptance:
    given: Two isolated owners open academic and activity-only personal calendars in English.
    when: The real academic semester/month/week grids and activity week/month grids render, followed by
      the anonymous public Section lecture table.
    then:
    - Academic and activity grids order weekday headers Monday through Sunday.
    - Date cells and their actual course events align with the matching weekday column.
    - The public Section lecture table retains the correct date, teaching week, time and location cells;
      it does not present a weekday grid.
    test:
      file: tests/e2e/src/app/workspace/calendar/presentation-contract.test.ts
      name: calendar.week-starts-monday
- id: calendar.subscription-badges
  category: presentation
  rule: Personal Web calendar course cards show a localized teaching-assistant or auditor badge in desktop
    grids and desktop/mobile day or week agendas. Regular subscriptions show no badge. Web course titles
    and public calendar content remain unchanged.
  acceptance:
    given: A subscribed course cycles through regular, teaching assistant and auditor in Chinese and English.
    when: The actual personal calendar is rendered in week and day modes at desktop and mobile widths
      after each update.
    then:
    - Only non-regular roles render the correct localized badge on course cards.
    - Course titles remain identical to regular-role titles and badges stay within card bounds.
    - No viewport gains page-level horizontal overflow.
    test:
      file: tests/e2e/src/app/workspace/calendar/subscription-badge.test.ts
      name: calendar.subscription-badges
- id: calendar.event-card-types
  category: presentation
  rule: Calendar event cards carry course, exam, homework, todo, and individually subscribed Young activity
    events.
  acceptance:
    given: An isolated course subscriber owns real schedule, exam, homework, todo and individually subscribed
      activity events in one week.
    when: The actual desktop grid and mobile agenda render that selected week.
    then:
    - All five event kinds are visible with their correct times and titles.
    - Course, exam and activity cards retain their respective navigation destinations.
    test:
      file: tests/e2e/src/app/workspace/calendar/presentation-contract.test.ts
      name: calendar.event-card-types
- id: calendar.feed-cache-refresh
  category: consistency
  rule: A stale cached personal export remains available while an asynchronous refresh is requested.
  acceptance:
    given: A cached export has passed its freshness interval.
    when: A caller reads it while the refresh enqueue remains pending.
    then:
    - The stale export returns immediately.
    - A deferred refresh is requested without rebuilding on the read path.
    test:
      file: tests/unit/features/calendar/calendar-export-cache.test.ts
      name: calendar.feed-cache-refresh
- id: calendar.teaching-assistant-homework
  category: consistency
  rule: Personal pending-homework reads and calendar export sources preserve actual completion records.
    For teaching-assistant subscriptions, incomplete homework stops being pending at its due instant;
    undated homework stays pending in workspace lists but produces no dated calendar event. Unified calendar
    events and ICS include only future dated, uncompleted TA homework.
  acceptance:
    given: A teaching-assistant subscription has past, exact-deadline, future, undated and actually completed
      homework.
    when: The real pending read, unified calendar event service and ICS exporter read the same owner at
      the due boundary.
    then:
    - Only future uncompleted dated homework enters unified calendar and ICS.
    - Undated homework remains pending but has no dated calendar event.
    - Existing completion timestamps are unchanged.
    test:
      file: tests/integration/calendar-teaching-assistant-contract.test.ts
      name: calendar.teaching-assistant-homework
- id: calendar.revoked-feed-access
  category: privacy
  rule: The personal-feed access gate rejects a revoked credential with 410 and private, no-store, without
    returning an authorized user/cache identity.
  acceptance:
    given: A formerly valid credential differs from the stored current feed token.
    when: The feed access gate resolves that credential.
    then:
    - Access is denied with 410 and private, no-store.
    - No authorized user/cache identity is returned.
    test:
      file: tests/unit/features/calendar/calendar-route-user-access.test.ts
      name: calendar.revoked-feed-access
- id: calendar.feed-refresh-visible
  category: consistency
  rule: After a separate consumer stores a refreshed export, the serving instance observes it on shared-cache
    revalidation without rebuilding the export on the read path.
  acceptance:
    given: A serving isolate has a stale personal calendar export while a separate consumer writes a fresh
      export to shared KV.
    when: The serving isolate reaches its next shared-cache revalidation after the consumer finishes.
    then:
    - The served calendar contains the refreshed export.
    - The serving isolate does not rebuild the export on the request path.
    test:
      file: tests/unit/features/calendar/calendar-export-cache.test.ts
      name: calendar.feed-refresh-visible
- id: calendar.feed-auth-before-cache
  category: privacy
  rule: The personal feed route authorizes its current credential before reading any export cache. Authorized
    requests support strong, weak and multiple If-None-Match ETag forms; revoked credentials never receive
    cached content or a 304 response.
  acceptance:
    given: A real owner has a cached personal ICS with an ETag and a current feed credential.
    when: The actual feed route handles strong/weak/multiple If-None-Match, then the credential is rotated
      in the database.
    then:
    - Authorized matching conditions return empty 304 responses.
    - A revoked credential returns 410 before any export-cache read, despite a matching cached ETag.
    - The replacement credential can still retrieve the authorized conditional response.
    test:
      file: tests/integration/calendar-feed-contract.test.ts
      name: calendar.feed-auth-before-cache
- id: calendar.feed-refresh-coalescing
  category: consistency
  rule: Repeated stale reads coalesce refresh requests during a bounded interval.
  acceptance:
    given: Repeated concurrent readers observe the same stale export.
    when: Reads occur within successive refresh coalescing intervals.
    then:
    - The cached content remains readable.
    - One refresh request is emitted per coalescing interval.
    test:
      file: tests/unit/features/calendar/calendar-export-cache.test.ts
      name: calendar.feed-refresh-coalescing
- id: calendar.feed-enqueue-retry
  category: consistency
  rule: A failed refresh enqueue remains retryable on subsequent reads.
  acceptance:
    given: A stale private export exists and its refresh queue sender fails.
    when: The actual cache returns the stale export, then the sender recovers and another read occurs.
    then:
    - The failed enqueue is observed without blocking the stale response.
    - The subsequent read retries enqueue successfully rather than remaining suppressed by the failed
      attempt.
    test:
      file: tests/unit/features/calendar/calendar-export-cache.test.ts
      name: calendar.feed-enqueue-retry
- id: calendar.feed-write-rebuild-independent
  category: consistency
  rule: A source write requests a rebuild independently of stale-read refresh coalescing.
  acceptance:
    given: A stale read has already requested a refresh.
    when: A successful source write requests its calendar rebuild during that cooldown.
    then:
    - The write still emits its own rebuild request.
    test:
      file: tests/unit/features/calendar/calendar-export-cache.test.ts
      name: calendar.feed-write-rebuild-independent
capabilities:
  personal-calendar-view:
    title: Personal Calendar View
    auth: user
    links:
      models:
      - Schedule
      - Homework
      - Exam
      - Todo
      - YoungEvent
    web:
      pages:
      - /workspace/calendar
    rest:
      routes:
      - method: GET
        path: /api/workspace/calendar/events
    mcp:
      tools:
      - name: workspace_calendar_event_list
        notes:
        - Returns course, exam, homework, todo, and subscribed Young activity events unified by overlapping
          date range.
        - Each item has type, at, endsAt, and payload; young_event carries a public activity summary.
        - Date-only bounds include full Shanghai days, paired bounds or seven-day default, maximum 366
          days.
      - name: workspace_calendar_timeline_get
        notes:
        - Requires workspace.calendar:read, matching workspace_calendar_event_list; workspace.overview:read
          is not required.
      - name: workspace_schedule_list
        notes:
        - Omitting semesterId reads all subscribed semesters; pass a semesterId to recover one current
          or past term.
      - name: workspace_exam_list
        notes:
        - Omitting semesterId reads all subscribed semesters; pass a semesterId to recover one current
          or past term.
    presentation:
      items:
      - calendarEvents (schedules + exams + homeworks + todos + subscribed young events)
      - schedule.date, startTime, endTime
      - exam.examDate, startTime, endTime, examMode, examRooms
      - homework.submissionDueAt
      - todo.dueAt
      - Week numbers
      - Weekday labels (Sun-Sat)
      - Mobile week agenda
      filters:
      - View tabs
      - Previous/next semester controls
    requirement_refs:
    - section.retired-read-semantics
  section-calendar-view:
    title: Section Calendar View
    auth: anon
    links:
      ui:
      - Context Tabs
    web:
      pages:
      - /catalog/sections/[jwId]
    rest: stable
    presentation:
      items:
      - calendarMonthStart (Month view)
      - calendarEvents[]
      - schedule.date, startTime, endTime
      - schedule.room (with building/campus)
      - schedule.teachers[].namePrimary
      - exam.examDate, startTime, endTime
      - exam.examRooms[]
      - weekLabelTemplate (Week numbers)
      - weekdayLabels (Sun-Sat)
      - todayKey (Today highlight)
    requirement_refs:
    - section.retired-read-semantics
  event-card:
    title: Event Card
    auth: anon
    web: stable
    rest: unavailable
    mcp: unavailable
    presentation:
      items:
      - Event type (schedule/exam/homework/todo)
      - event.title or section.course.namePrimary
      - event.time or first metadata segment
      - Details/popover may show location
    requirement_refs:
    - section.retired-read-semantics
