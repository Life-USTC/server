kind: feature
id: calendar
name: Calendar
areas:
- workspace
- catalog
access:
  anon: Can browse calendar information on public section detail pages.
  user: Can browse the personal calendar view.
  admin: Has no special calendar view separate from regular users.
  agent: Can read the complete personal date-range calendar through REST, GraphQL and MCP with workspace.calendar:read.
    REST/GraphQL use pagination.
requirements:
- id: calendar.personal-feed-http-cache
  category: privacy
  rule: Personal calendar feed responses and revoked-credential errors use private, no-store. Authorization
    runs before the user-scoped server-side rendering cache and conditional ETag handling.
  acceptance:
  - id: calendar.personal-feed-http-cache.revoked-token
    given: A previously valid personal calendar feed token has been revoked.
    when: A request presents the revoked token for that user.
    then:
    - Authorization rejects the token before cached calendar identity or data can be read.
    tests:
    - file: tests/unit/features/calendar/calendar-route-user-access.test.ts
      name: rejects a revoked token before any rendered cache can be read
- id: calendar.views
  category: presentation
  rule: Course-subscribed workspaces provide semester, month, and week views with subscribed activities
    overlaid. Activity-only workspaces provide day, week, and month views without requiring course subscriptions.
- id: calendar.retired-sections
  category: consistency
  rule: Current/public collection calendars, personal calendar views, feeds, and calendar event tools
    exclude retired Sections. A direct single-Section detail/calendar URL remains available as a historical
    reference, and retirement does not delete underlying schedules, exams, homeworks, or subscription
    relationships.
- id: calendar.mobile-agenda-first
  category: presentation
  rule: At mobile widths, the personal calendar presents the selected week as a vertically readable agenda
    with time, title, type, and available location context. Previous week, today, next week, and iCal
    actions remain directly accessible without page-level horizontal scrolling; desktop retains the selectable
    grid views.
- id: calendar.week-starts-sunday
  category: presentation
  rule: Existing academic grids start on Sunday; activity calendars use Monday-start weeks.
- id: calendar.subscription-badges
  category: presentation
  rule: Personal calendar course cards show the viewer's teaching-assistant or auditor subscription as
    a localized top-right badge in desktop grids and mobile agendas. Regular subscriptions show no badge;
    course titles and public calendars are unchanged.
- id: calendar.event-card-types
  category: presentation
  rule: Calendar event cards carry course, exam, homework, todo, and individually subscribed Young activity
    events.
- id: calendar.feed-cache-refresh
  category: consistency
  rule: Personal iCal feeds serve a cached export while refreshing stale content asynchronously. Serving
    instances periodically revalidate shared cached exports so completed background refreshes become visible.
    Repeated stale reads briefly coalesce refresh requests; failed enqueue attempts remain retryable,
    and user writes still request a rebuild independently.
  acceptance:
  - id: calendar.feed-cache-refresh.consumer-update-visible
    given: A serving isolate has a stale personal calendar export while a separate consumer writes a fresh
      export to shared KV.
    when: The serving isolate reaches its next shared-cache revalidation after the consumer finishes.
    then:
    - The served calendar contains the refreshed export.
    - The serving isolate does not rebuild the export on the request path.
    tests:
    - file: tests/unit/features/calendar/calendar-export-cache.test.ts
      name: serving isolate observes a consumer's KV refresh after revalidation
- id: calendar.teaching-assistant-homework
  category: consistency
  rule: Personal calendar views, event sources, and iCal feeds preserve actual completion records but
    exclude a teaching-assistant homework from pending homework events at or after its due instant; no-deadline
    TA homework remains pending. Feed caching uses a short freshness window so due-time changes are observed
    promptly.
capabilities:
  personal-calendar-view:
    title: Personal Calendar View
    auth: user
    links:
      models:
      - Schedule
      - Homework
      - Exam
      - Todo
      - YoungEvent
    web:
      pages:
      - /workspace/calendar
    rest:
      routes:
      - method: GET
        path: /api/workspace/calendar/events
    mcp:
      tools:
      - name: workspace_calendar_event_list
        notes:
        - Returns course, exam, homework, todo, and subscribed Young activity events unified by overlapping
          date range.
        - Each item has type, at, endsAt, and payload; young_event carries a public activity summary.
        - Date-only bounds include full Shanghai days, paired bounds or seven-day default, maximum 366
          days.
      - name: workspace_calendar_timeline_get
        notes:
        - Requires workspace.calendar:read, matching workspace_calendar_event_list; workspace.overview:read
          is not required.
      - name: workspace_schedule_list
        notes:
        - Omitting semesterId reads all subscribed semesters; pass a semesterId to recover one current
          or past term.
      - name: workspace_exam_list
        notes:
        - Omitting semesterId reads all subscribed semesters; pass a semesterId to recover one current
          or past term.
    presentation:
      items:
      - calendarEvents (schedules + exams + homeworks + todos + subscribed young events)
      - schedule.date, startTime, endTime
      - exam.examDate, startTime, endTime, examMode, examRooms
      - homework.submissionDueAt
      - todo.dueAt
      - Week numbers
      - Weekday labels (Sun-Sat)
      - Mobile week agenda
      filters:
      - View tabs
      - Previous/next semester controls
  section-calendar-view:
    title: Section Calendar View
    auth: anon
    links:
      ui:
      - Context Tabs
    web:
      pages:
      - /catalog/sections/[jwId]
    rest: stable
    presentation:
      items:
      - calendarMonthStart (Month view)
      - calendarEvents[]
      - schedule.date, startTime, endTime
      - schedule.room (with building/campus)
      - schedule.teachers[].namePrimary
      - exam.examDate, startTime, endTime
      - exam.examRooms[]
      - weekLabelTemplate (Week numbers)
      - weekdayLabels (Sun-Sat)
      - todayKey (Today highlight)
  event-card:
    title: Event Card
    auth: anon
    web: stable
    rest: unavailable
    mcp: unavailable
    presentation:
      items:
      - Event type (schedule/exam/homework/todo)
      - event.title or section.course.namePrimary
      - event.time or first metadata segment
      - Details/popover may show location
