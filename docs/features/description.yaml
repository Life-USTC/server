kind: feature
id: description
name: Description
areas:
- community
- admin
policy_refs:
- interface-hierarchy
- ui
- permission-ui
- rendering-and-cache
- audit
requirements:
- id: description.homework-calendar-invalidation
  category: consistency
  rule: A committed homework description write enqueues a calendar export rebuild for its section after
    the changed content is visible. Unchanged retries enqueue the same rebuild so a previously failed
    enqueue can recover.
  acceptance:
    given: A subscribed section has a homework description that is created, changed, and submitted unchanged.
    when: The production description use case writes and schedules calendar rebuilds.
    then:
    - Each request schedules the correct section.
    - A separate database read observes committed content before the rebuild callback.
    test:
      file: tests/integration/calendar-write-state.test.ts
      name: description.homework-calendar-invalidation
- id: description.public-cache-invalidation
  category: consistency
  rule: A committed course, section, or teacher description write invalidates its cached public HTML and
    structured data only after the content is committed. Administrator moderation follows the same invalidation
    contract.
  acceptance:
    given: Public teacher HTML is cached before an ordinary edit and an admin moderation edit.
    when: The production write and moderation services commit and invoke the cache purge.
    then:
    - A separate database connection sees committed content before each purge.
    - The next rendered representation reflects the committed write and moderation.
    test:
      file: tests/integration/description-cache-invalidation.test.ts
      name: description.public-cache-invalidation
- id: description.public-web-personal-overlay
  category: consistency
  rule: Public course, teacher, and section SSR retains description text and structured data with an anonymous
    viewer. Hydration obtains current viewer permissions from the private descriptions API; a failed read
    remains retryable.
- id: description.supplement-not-comment
  category: behavior
  rule: Object pages present the shared Markdown supplement separately from the comment thread. The supplement
    displays its last editor and edit time.
  rationale: Descriptions organize collaboratively maintained information; comments express individual
    discussion and experience.
- id: description.attached-object-types
  category: behavior
  rule: Descriptions attach only to courses, sections, teachers, and homework. The target must resolve
    to an existing entity before a description is created or updated.
  acceptance:
    given: Description references use canonical or documented public identifiers for the four supported
      object types.
    when: The declared request schema and production target resolver process valid references and nonexistent
      targets.
    then:
    - Supported references resolve to the matching target.
    - Unsupported types fail validation and nonexistent entities cannot resolve as valid targets.
    test:
      file: tests/unit/features/descriptions/description-target-contract.test.ts
      name: description.attached-object-types
- id: description.platform-maintained
  category: authorization
  rule: Descriptions are collaboratively maintained supplements. The interface identifies the last editor
    and edit history and must not present ordinary user edits as university-verified information. Unsuspended
    users may edit; administrators moderate through the governance surface.
  rationale: A review or institutional-verification workflow is not currently part of this capability.
- id: description.server-rendered-markdown
  category: presentation
  rule: Description serialization retains source Markdown in content and provides sanitized server-rendered
    HTML in renderedHtml, including supported campus-reference links.
  acceptance:
    given: Description source includes a campus reference and script markup.
    when: The production description serializer renders the payload.
    then:
    - Source Markdown remains intact; rendered HTML includes the campus link and no executable script.
    test:
      file: tests/unit/features/markdown/markdown-renderer.test.ts
      name: description.server-rendered-markdown
- id: description.failed-write-invalidation
  category: consistency
  rule: A failed description transaction triggers neither public representation invalidation nor a homework
    calendar rebuild.
  acceptance:
    given: The description transaction rejects.
    when: Both public-object and homework description writes are attempted.
    then:
    - Neither public invalidation nor calendar enqueue runs.
    test:
      file: tests/unit/features/descriptions/description-upsert-service.test.ts
      name: description.failed-write-invalidation
- id: description.public-cache-retry
  category: consistency
  rule: An unchanged description write retries public cache invalidation after a previous purge failure
    without creating another content edit.
  acceptance:
    given: The content transaction commits but the first purge fails.
    when: The same content is submitted again.
    then:
    - The unchanged retry purges successfully without adding an edit.
    test:
      file: tests/unit/features/descriptions/description-upsert-service.test.ts
      name: description.public-cache-retry
- id: description.editor-permission-gate
  category: presentation
  rule: The description editor neither opens nor submits until current viewer permissions authorize editing.
  acceptance:
    given: The current permission state is unavailable or the viewer changes while a request is pending.
    when: The production editor controller handles the action or delayed response.
    then:
    - Neither editor-open state nor a save request is produced.
    test:
      file: tests/unit/features/descriptions/description-card-controller.test.ts
      name: description.editor-permission-gate
- id: description.editor-stale-save
  category: consistency
  rule: A description save response belonging to an earlier viewer session cannot alter the current editor
    state or trigger a success callback.
  acceptance:
    given: The current permission state is unavailable or the viewer changes while a request is pending.
    when: The production editor controller handles the action or delayed response.
    then:
    - A stale save cannot refresh, close the current editor, or invoke success.
    test:
      file: tests/unit/features/descriptions/description-card-controller.test.ts
      name: description.editor-stale-save
- id: description.editor-stale-permissions
  category: consistency
  rule: A description permission refresh belonging to an earlier viewer session cannot update the current
    viewer or description state.
  acceptance:
    given: The current permission state is unavailable or the viewer changes while a request is pending.
    when: The production editor controller handles the action or delayed response.
    then:
    - Neither viewer nor description is updated from the stale result.
    test:
      file: tests/unit/features/descriptions/description-card-controller.test.ts
      name: description.editor-stale-permissions
- id: description.web-markdown-hydration
  category: presentation
  rule: Web description surfaces consume server-provided renderedHtml without rerunning Markdown rendering
    during hydration.
- id: description.mcp-markdown-projection
  category: presentation
  rule: MCP full mode retains the shared description payload including renderedHtml; compact modes omit
    renderedHtml while retaining source Markdown.
- id: description.unchanged-write-history
  category: consistency
  rule: An unchanged description write returns updated=false and adds neither DescriptionEdit history
    nor a description_edit audit entry.
  acceptance:
    given: The submitted description equals stored content.
    when: The description use case processes the write.
    then:
    - The result has updated=false; no edit history or audit entry is written.
    test:
      file: tests/unit/features/descriptions/description-upsert-service.test.ts
      name: description.unchanged-write-history
- id: description.target-identifiers
  category: validation
  rule: Description reads and writes accept targetType with targetId or the documented sectionJwId, courseJwId,
    teacherId, or homeworkId public identifier.
  acceptance:
    given: Description references use canonical or documented public identifiers for the four supported
      object types.
    when: The declared request schema and production target resolver process valid references and nonexistent
      targets.
    then:
    - Canonical and public identifiers resolve to the same database target.
    - Public course and section identifiers use their JW lookup.
    test:
      file: tests/unit/features/descriptions/description-target-contract.test.ts
      name: description.target-identifiers
- id: description.target-not-found
  category: behavior
  rule: Description reads return not_found when the attached target entity does not exist; REST maps this
    result to 404.
  acceptance:
    given: Each supported target type refers to a nonexistent entity.
    when: The real REST description-read handler resolves public identifiers.
    then:
    - Each response has status 404 and the standard Target not found JSON error.
    test:
      file: tests/integration/description-write-contract.test.ts
      name: description.target-not-found
- id: description.concurrent-first-write
  category: consistency
  rule: Concurrent first description writes to the same target resolve to one durable description with
    a stable create/update result and preserve each successful DescriptionEdit operation. A previousContent
    snapshot reflects the content observed by its transaction and need not represent a total order of
    concurrent writes.
  acceptance:
    given: Two editors submit different contents for a target with no description.
    when: Both production writes execute concurrently against the real database.
    then:
    - Exactly one description exists.
    - Both successful writes preserve their edit history and audit records.
    test:
      file: tests/integration/description-write-contract.test.ts
      name: description.concurrent-first-write
- id: description.moderation-atomicity
  category: consistency
  rule: Administrator description moderation commits content, DescriptionEdit, and admin_description_moderate
    audit entries atomically through the shared governance service.
  acceptance:
    given: An administrator edits an existing description with a failing audit write, then retries normally.
    when: The production moderation service runs its transaction.
    then:
    - Audit failure leaves content and edit history unchanged.
    - Success commits content, editor, history, and moderation audit together.
    test:
      file: tests/integration/description-write-contract.test.ts
      name: description.moderation-atomicity
- id: description.rest-pagination-parameters
  category: validation
  rule: The REST description moderation list accepts page and pageSize; the retired limit alias is not
    accepted.
capabilities:
  object-description-section:
    title: Object Description Section
    auth: anon
    web: stable
    graphql:
      mutations:
      - name: descriptionSet
        auth: user
        required_scopes:
        - community.description:write
        rest_equivalent: POST /api/community/descriptions
        mcp_equivalent: community_description_set
        requirement_refs:
        - description.target-identifiers
    rest:
      routes:
      - path: /api/community/descriptions
        requirement_refs:
        - description.target-identifiers
        - description.target-not-found
      - path: /api/community/descriptions
        method: POST
        auth: user
        requirement_refs:
        - description.target-identifiers
        - description.concurrent-first-write
    mcp:
      tools:
      - name: community_description_get
        requirement_refs:
        - description.target-identifiers
      - name: community_description_set
        auth: user
        requirement_refs:
        - description.target-identifiers
        - description.concurrent-first-write
    presentation:
      items:
      - description.content (markdown-rendered)
      - description.renderedHtml (sanitized server-rendered HTML)
      - description.lastEditedBy.name
      - description.lastEditedAt / updatedAt
      - Edit button (if authorized)
      - history count
      - history editor
      - previous/updated diff content
    requirement_refs:
    - description.platform-maintained
    - description.attached-object-types
  description-governance:
    title: Description Governance
    auth: admin
    web:
      pages:
      - /admin/moderation
    rest:
      routes:
      - path: /api/admin/descriptions
        requirement_refs:
        - description.rest-pagination-parameters
      - path: /api/admin/descriptions/[id]
        method: PATCH
        requirement_refs:
        - description.moderation-atomicity
    mcp: unavailable
    presentation:
      items:
      - description.content / preview
      - object target
      - lastEditedBy name
      - timestamp
    requirement_refs:
    - description.platform-maintained
    - description.attached-object-types
