kind: feature
id: usage
name: Client Usage Guides
areas:
- platform
policy_refs:
- interface-hierarchy
- ui
- permission-ui
- rendering-and-cache
access:
  anon: Can read every public client usage guide page.
  user: Same public guides as anonymous visitors; guides do not expose personal workspace data.
  admin: Same public guides as anonymous visitors.
  agent: Usage guides are Web-only marketing and onboarding pages, not REST, GraphQL, or MCP capabilities.
requirements:
- id: usage.mobile-app-association
  category: consistency
  rule: The public Apple app-site association identifies the native app and only its supported content
    destinations. Account authentication, administration, guides, and unsupported detail subpages stay on the Web.
  acceptance:
    given: An anonymous request for the Apple association document.
    when: The request follows no redirects and reads the declared app and path components.
    then:
    - The document returns HTTP 200 JSON with the native application identifier.
    - Supported catalog, community, news, and workspace entries open the app.
    - Account, OAuth, administrative, and unsupported page paths are excluded from app routing.
    test:
      file: tests/integration/rest/site/apple-app-association.test.ts
      name: usage.mobile-app-association
- id: usage.public-cache-admission
  category: consistency
  rule: Anonymous HTML cache admission includes the mobile, Bot, MCP, and CLI usage guide routes.
  acceptance:
    given: Each declared usage guide URL.
    when: The public SSR admission resolver evaluates a document request.
    then:
    - Every usage guide route is admitted as a public page.
    test:
      file: tests/unit/features/catalog/public-cache-policy-acceptance.test.ts
      name: rendering-and-cache.cacheable-public-pages-5
- id: usage.page-contract
  category: presentation
  rule: Each usage guide satisfies the shared public page contract at desktop and mobile widths in Chinese
    and English.
  acceptance:
    given: The four client usage guide routes.
    when: An anonymous browser opens each route through the shared page contract helper.
    then:
    - Each page passes the public layout, navigation, and accessibility contract checks.
    test:
      file: tests/e2e/src/app/usage/test.ts
      name: /usage/mobile page contract
- id: usage.primary-handoffs
  category: presentation
  rule: Usage guides expose their primary client handoff controls, including download, contact, or repository
    links appropriate to each client surface.
  acceptance:
    given: Public usage guide fixtures for mobile, Bot, MCP, and CLI clients.
    when: An anonymous browser opens each guide and inspects its primary call to action.
    then:
    - Mobile exposes an App Store or download handoff.
    - Bot exposes the Presto contact handoff and illustrative response images without leaking private command
      paths.
    test:
      file: tests/e2e/src/app/usage/test.ts
      name: usage pages expose their primary handoff
- id: usage.marketing-composition
  category: presentation
  rule: Bot, MCP, and CLI marketing pages share one composition recipe — icon container, title, one-line blurb,
    primary CTA, three content-sized examples, and sequential numbered configuration steps. MCP keeps copy-endpoint as the primary
    CTA; CLI install exposes a copy affordance. MCP steps remain in reading order; terminal output preserves
    columns and Bot examples open in a keyboard-accessible image preview.
  acceptance:
    given: Anonymous desktop visits to /usage/bot, /usage/mcp, and /usage/cli.
    when: Each page renders its marketing hero and example or step strip.
    then:
    - Each page exposes the shared marketing markers for hero and three numbered example cards.
    - MCP primary CTA copies the MCP endpoint; CLI install exposes a copy control for the install command.
    test:
      file: tests/e2e/src/app/usage/test.ts
      name: bot mcp and cli marketing composition stays aligned
- id: usage.readable-content-layout
  category: presentation
  rule: MCP tutorial steps follow one reading order at narrow and wide widths. Tabs remain inside their
    rail, the hero figure fits its container, and complete copyable addresses remain readable. CLI output
    preserves terminal columns; Bot examples open in an image preview that returns keyboard focus on close.
  acceptance:
    given: Anonymous visits with a fresh browser and the existing public usage examples.
    when: Inspect MCP at390,768,1024,1144 and1440px, then CLI and Bot examples at768px.
    then:
    - The hero figure and tab bounds fit their containing regions, and numbered steps remain vertically ordered.
    - Copy fields do not hide overflow; CLI preformatted output retains its column whitespace.
    - The Bot schedule image opens in a dialog and Escape returns focus to its trigger.
    test:
      file: tests/e2e/src/app/usage/layout-recovery.test.ts
      name: usage content remains readable in narrow desktop and tablet layouts
- id: usage.bot-image-recovery
  category: behavior
  rule: Bot example and preview image failures show localized recovery controls with retry and the original image URL.
  acceptance:
    given: Anonymous English and Chinese visits with a controlled corrupt schedule image.
    when: Retry the example, then open the preview with another controlled failure and retry again.
    then:
    - The failure state identifies the unavailable image and provides the original URL.
    - Explicit retry loads a new image request and returns to the successful example or preview.
    - Closing the recovered preview returns focus to the image trigger.
    test:
      file: tests/e2e/src/app/usage/image-recovery.test.ts
      name: Bot example image load failure recovers (en-us)
- id: usage.mcp-client-navigation
  category: behavior
  rule: The MCP tutorial client is derived from the URL client parameter. Missing or unrecognized values
    select ChatGPT; supported selections preserve browser history, scroll and keyboard focus.
  acceptance:
    given: Anonymous English and Chinese browser visits to the Claude tutorial URL.
    when: Select the next tab with the keyboard, reload, select ChatGPT, navigate Back and Forward, and visit an invalid value.
    then:
    - The selected tab and tutorial panel follow the URL across direct navigation, reload and browser history.
    - Keyboard selection updates the URL and retains focus; invalid input uses the default tutorial.
    test:
      file: tests/e2e/src/app/usage/client-navigation.test.ts
      name: MCP client selection survives navigation (en-us)
- id: usage.client-specific-completion
  category: presentation
  rule: MCP tutorial completion instructions and examples match the selected client. Claude guidance does
    not reuse a ChatGPT success screenshot; it offers a public query and explains how to inspect its tool result.
  acceptance:
    given: Anonymous English and Chinese visits to the Claude tutorial URL.
    when: Inspect completion guidance, copy the public query, switch to ChatGPT and navigate Back.
    then:
    - Claude completion and hero contain no ChatGPT result image, and expose the public query and official guidance.
    - ChatGPT retains its own imagery and current plugin setup instructions; browser restoration returns the correct content.
    test:
      file: tests/e2e/src/app/usage/client-guidance.test.ts
      name: MCP tutorial completion matches selected client en-us
- id: usage.mcp-sidebar-content-bounds
  category: presentation
  rule: At laptop breakpoint widths, the MCP hero figure and image stay inside the padded content box
    with the sidebar expanded or collapsed. Client tabs keep symmetric vertical space and stable heights;
    tutorial text, ordered steps and complete copyable addresses stay inside their content bounds.
  acceptance:
    given: Anonymous English and Chinese visits at 1023, 1024, 1144 and 1440 pixels.
    when: Toggle the real sidebar rail, select every client by mouse or keyboard and copy each public endpoint.
    then:
    - All four figure and image edges remain within the hero grid content box in both sidebar states.
    - Tab rail and trigger heights stay stable, and upper and lower spacing remain symmetric.
    - Text lines and numbered steps stay within their panel, and URL fields remain complete without overlapping copy controls.
    test:
      file: tests/e2e/src/app/usage/sidebar-geometry.test.ts
      name: MCP content fits both sidebar states en-us 1023
- id: usage.mcp-copy-feedback-lifecycle
  category: behavior
  rule: Each successful MCP copy action owns a fresh feedback interval. Repeating a field or copying
    another field replaces the previous timer. Feedback belongs to the latest attempt even if clipboard
    completion arrives out of order; leaving the guide disposes its timer and pending feedback.
  acceptance:
    given: An English or Chinese visitor copies an MCP endpoint with the native clipboard.
    when: Copy again midway through the feedback interval, complete writes out of order, or leave before a write completes.
    then:
    - The newly copied field retains its localized success feedback through the old timer's deadline.
    - Feedback clears at the new interval's deadline, and only the latest field shows it.
    - An older pending copy cannot overwrite newer feedback or schedule feedback after the guide unmounts.
    test:
      file: tests/e2e/src/app/usage/copy-feedback.test.ts
      name: MCP copy feedback owns its latest timer en-us same
capabilities:
  usage-guides:
    title: Client Usage Guides
    auth: anon
    web:
      pages:
      - /usage/mobile
      - /usage/bot
      - /usage/mcp
      - /usage/cli
    rest: unavailable
    graphql: unavailable
    mcp: unavailable
    presentation:
      kind: fields
      views:
        web:
          primary:
          - guide.title
          secondary:
          - guide.summary
          tertiary:
          - guide.primaryHandoff
rationale:
- Usage guides explain how to adopt Life@USTC clients. Product behavior for each client remains in the
  owning repositories; these pages only document public entry points and handoffs.
