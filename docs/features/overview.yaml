kind: feature
id: overview
name: Overview
areas:
- workspace
- platform
policy_refs:
- interface-hierarchy
- ui
- permission-ui
- rendering-and-cache
- cases.mcp-assistant-workflows
- cases.semester
access:
  anon: The home page is a lightweight public catalog entry; bus and frequent links are independent pages
    at /catalog/bus and /catalog/links.
  user: Accessing the home page redirects to the personal workspace at /workspace.
  admin: Accessing the home page redirects to the personal workspace at /workspace, with the same workspace
    behavior as regular users.
  agent: Can read overview results with the same semantics as the authenticated workspace; REST and MCP
    should return consistent overview information.
requirements:
- id: overview.decision-page
  category: presentation
  rule: The anonymous home page prioritizes public course, section and teacher discovery.
- id: overview.now-next-first
  category: presentation
  rule: 'The overview focus is selected from today and the next six Shanghai calendar days: first the
    current incomplete timed event, then an overdue incomplete homework/todo from today, then the next
    incomplete item in timeline order. If none is actionable, no focus item is selected.'
  acceptance:
    given: The seven-day agenda includes an ongoing event, overdue homework, completed todo, next session
      and tomorrow exam.
    when: The real overview agenda builder and focus selector choose the next action.
    then:
    - Current events precede today overdue tasks; those precede the next incomplete item.
    - Later days are eligible within the seven Shanghai calendar-day agenda, and an all-completed agenda
      returns no action.
    test:
      file: tests/unit/features/workspace/workspace-agenda.test.ts
      name: overview.now-next-first
- id: overview.current-semester-priority
  category: presentation
  rule: The overview prioritizes actionable events from every subscribed Section within its rolling
    date window, including still-relevant events from past terms, personal todos and independently subscribed
    activities. Current-semester context and history links follow actionable content; no current-term
    subscriptions must not replace the overview. The semester calendar remains scoped to its selected term.
  acceptance:
    given: An isolated owner has a historical Section with a current makeup class and deadline, a personal
      todo and an independently subscribed activity, with and without an additional current-term subscription.
    when: Chinese and English overview pages render at class, deadline, todo and activity times on desktop
      and mobile.
    then:
    - The historical class, homework and activity remain eligible for the focus card, and the personal todo
      remains visible in summaries.
    - With only historical subscriptions, the term context and history links follow the focus instead of
      replacing it.
    test:
      file: tests/e2e/src/app/workspace/overview/term-priority.test.ts
      name: overview.current-semester-priority
- id: overview.homework-todo-layered
  category: presentation
  rule: 'Homework and todo deadline groups use Shanghai calendar days: due today, due in the next three
    days excluding today, and all pending. The first two groups are disjoint. Undated pending items remain
    in all-pending only; completed items are excluded from every pending group.'
  acceptance:
    given: Homework and todos cover the preceding day, both today boundaries, next three days, fourth
      day, no deadline and completed state.
    when: The real homework and todo bucket functions run under UTC, Shanghai and Los Angeles process
      time zones.
    then:
    - Today and upcoming-three-day buckets are disjoint and use Shanghai dates.
    - The upcoming bucket begins tomorrow at 00:00 and ends before the fourth day at 00:00.
    - Undated pending items appear only in all-pending; completed items appear in none of the pending
      buckets.
    test:
      file: tests/unit/features/workspace/overview-deadline-buckets.test.ts
      name: overview.homework-todo-layered
- id: overview.upcoming-exam-counts
  category: behavior
  rule: Upcoming exam counts are shared between the workspace web navigation, REST overview, and MCP overview.
    They include known-date exams that have not ended or start later today, and exclude date-unknown exam
    records that cannot be placed in the upcoming timeline.
  acceptance:
    given: An isolated subscriber has ended, date-unknown, all-day, ongoing, later-today and tomorrow exams.
    when: Real session shell navigation, REST, GraphQL and OAuth HTTP MCP overview reads run at the same
      reference time.
    then:
    - All four surfaces report the same four upcoming exams.
    - REST and MCP samples contain exactly the known-date all-day, ongoing, later-today and tomorrow records.
    test:
      file: tests/e2e/src/app/workspace/overview/read-contract.test.ts
      name: overview.upcoming-exam-counts
- id: overview.historical-subscriptions-remain-discoverable
  category: presentation
  rule: A zero current-semester subscription count must not be presented as no course history when total
    subscriptions remain; web and assistant surfaces must offer a path to past-term sections, homework,
    schedules, and exams.
- id: overview.focused-extracts-share-window
  category: consistency
  rule: With the same atTime and default inputs, the workspace snapshot, next-class and deadline tools
    use the same seven-day horizon. Explicit supported horizon arguments override only the requested tool's
    window.
  acceptance:
    given: An isolated subscriber has a next class and deadlines immediately before, at and within the
      default seven-day range, exactly at its exclusive end and one day later.
    when: Actual OAuth HTTP MCP snapshot, next-class and deadline tools run in default and full modes
      with a fixed atTime, then the deadline tool receives explicit one- and nine-day windows.
    then:
    - Snapshot and next-class agree; a class beyond seven days is absent from both.
    - Default full deadline lists match the snapshot, include the start and exclude the seven-day end.
    - Explicit deadline windows change only that call and leave the snapshot unchanged.
    test:
      file: tests/e2e/src/app/workspace/overview/read-contract.test.ts
      name: overview.focused-extracts-share-window
- id: overview.workspace-card-priority
  category: presentation
  rule: Workspace cards present the actionable title, time/status and direct destination before secondary
    details.
- id: overview.public-html-viewer-independent
  category: privacy
  rule: Public HTML contains no viewer identity, personal counts or other private workspace state.
- id: overview.personal-next-action-page
  category: presentation
  rule: The authenticated workspace overview prioritizes the next personal learning action rather than
    a complete catalog directory.
- id: overview.workspace-card-disambiguation
  category: presentation
  rule: Course, section, campus and relevant priority context remain available to distinguish similarly
    named objects without crowding the title.
- id: overview.compact-operational-fields
  category: presentation
  rule: Compact workspace cards and default MCP output omit platform audit timestamps and repeated parent
    objects.
- id: overview.activity-owner-transition
  category: privacy
  rule: Activity reads and rendered activity state are keyed by the authenticated owner as well as locale
    and dates. Changing owner clears the previous owner’s activities, cancels pending requests and rejects
    late results. An unresolved activity read shows loading rather than claiming the agenda is empty.
  acceptance:
    given: Two isolated owners have different ongoing subscribed activities, and the first owner’s response
      is either already displayed or held after the real server has answered.
    when: Session cookies change and same-document workspace navigation loads the second owner at the same
      locale and date range, then the first owner’s held response is released.
    then:
    - The second owner triggers a fresh read and displays only their own activity; a DOM observer detects
      no frame combining the second owner’s workspace with the first owner’s activity.
    - Pending activity reads display loading and suppress the empty-agenda claim.
    test:
      file: tests/e2e/src/app/workspace/overview/activity-owner.test.ts
      name: overview.activity-owner-transition
- id: overview.card-order
  category: presentation
  applies_to:
  - authenticated-overview
  expectation:
    kind: ordered_items
    surface: web
    target: workspace-overview-sections
    items:
    - workspace-overview-focus
    - workspace-overview-today-overdue
    - workspace-overview-week
    - workspace-overview-summaries
    - workspace-overview-links
  acceptance:
    given: An authenticated viewer opens the overview on desktop or mobile.
    when: The real overview renders its focus, urgency, week, summary and links sections.
    then:
    - The rendered document and vertical position follow the declared section order.
    test:
      file: tests/e2e/src/app/workspace/overview-order.test.ts
      name: overview.card-order
capabilities:
  authenticated-overview:
    title: Authenticated Workspace Overview
    auth: user
    links:
      models:
      - User
      - Section
      - Homework
      - Todo
      - Exam
    web:
      pages:
      - /workspace/overview
      - /workspace/calendar
      - /workspace/subscriptions
      - /workspace/exams
      - /workspace/homeworks
      - /workspace/todos
      - /catalog/bus
      - /catalog/links
    rest:
      routes:
      - path: /api/workspace/overview
        notes:
        - Compact authenticated overview for bot, CLI, and mobile clients.
        - Supports atTime, homeworkWindowDays, limit, and locale query parameters; date-only atTime values
          anchor to the start of that Asia/Shanghai day.
        - Includes today schedule samples and incomplete todo samples in addition to the due-todo, homework,
          and exam samples exposed by workspace_overview_get.
    graphql:
      fields:
      - parent: Workspace
        name: overview
        auth: user
        required_scopes:
        - workspace.overview:read
        rest_equivalent: GET /api/workspace/overview
        mcp_equivalent: workspace_overview_get
        notes:
        - The optional atTime argument is a strict zoned DateTime; the GraphQL output keeps the compact
          actionable counts.
    mcp:
      tools:
      - name: workspace_overview_get
        rest_equivalent: GET /api/workspace/overview
        notes:
        - overview contains pending todo, homework, today's schedule, and upcoming exam counts.
        - Accepts atTime, homeworkWindowDays, limit, and locale with the same bounds and sample-window
          semantics as GET /api/workspace/overview; date-only atTime values anchor to the start of that
          Asia/Shanghai day.
        - Default/full samples contain dueTodos[], dueHomeworks[], and upcomingExams[] from the same compact
          overview read operation.
    presentation:
      items:
      - pendingHomeworksCount
      - upcomingExamsCount
      - pendingTodosCount
      - todaySchedulesCount
      - Current or next actionable item
      - Today highlight
      - 7-day week grid
      - Schedule events per day
      - Pending homeworks (sorted by submissionDueAt)
      - Tomorrow schedule section
      - homework due today/due soon/all badges
      - todo due today/due soon/all badges
      - Pending todos
      - Tab icons and counts
    requirement_refs:
    - rendering-and-cache.personal-overlays-4
    - rendering-and-cache.personal-overlays-5
    - user.shell-viewer
    - overview.historical-subscriptions-remain-discoverable
  workspace-shell-navigation:
    title: Workspace Shell Navigation Summary
    description: Private Web-only projection used to hydrate viewer identity and workspace sidebar counts
      without adding a public API surface.
    auth: user
    links:
      models:
      - UserSectionSubscription
      - Schedule
      - Homework
      - Todo
      - Exam
    web:
      pages:
      - /workspace/overview
      - /workspace/calendar
      - /workspace/homeworks
      - /workspace/todos
      - /workspace/exams
      - /workspace/subscriptions
      - /catalog/courses
      - /catalog/sections
      - /catalog/teachers
    rest: unavailable
    graphql: unavailable
    mcp: unavailable
    presentation:
      items:
      - Calendar item count
      - Pending homework count
      - Pending todo count
      - Upcoming exam count
      - Subscribed section count
    requirement_refs:
    - rendering-and-cache.personal-overlays-4
    - rendering-and-cache.personal-overlays-5
    - user.shell-viewer
    - overview.historical-subscriptions-remain-discoverable
  workspace-snapshot:
    title: Assistant Workspace Snapshot & Focused Extracts
    auth: user
    links:
      models:
      - User
      - Section
      - Homework
      - Todo
      - Exam
    web: unavailable
    rest: unavailable
    mcp:
      tools:
      - name: workspace_snapshot_get
        notes:
        - Preferred single-call snapshot for assistant workflows.
        - Overlaps workspace_overview_get but adds currentSemester, currentSemesterSections, nextClass,
          merged deadlines, and preferred-bus departures; accepts optional atTime to anchor those time
          windows instead of using the server clock. When subscriptions.totalCount is greater than subscriptions.currentSemesterCount,
          past-term subscriptions remain available through workspace_subscription_list and the semesterId
          filters on workspace_homework_list, workspace_schedule_list, and workspace_exam_list.
        - Default mode should stay assistant-compact; request full mode when the caller explicitly needs
          full nested schedule, room, teacher, or homework payloads.
      - name: workspace_schedule_next
        notes:
        - Focused extract for 'what is my next class?' prompts; prefer workspace_snapshot_get when broader
          workspace context is needed.
        - Default mode compacts nextClass schedule payloads the same way as workspace_snapshot_get; request
          full mode for raw nested schedule, room, and teacher fields.
        - Accepts optional atTime to anchor the lookup instead of using the server clock.
      - name: workspace_deadline_list
        notes:
        - dayLimit defaults to 7.
        - Merges homework_due, exam, and todo_due entries into one ordered list.
        - Accepts optional atTime to anchor the deadline window instead of using the server clock.
    presentation:
      items:
      - currentSemester
      - subscriptions.currentSemesterCount
      - nextClass
      - upcomingDeadlines
      - todos.incompleteCount
      - bus.nextDeparture
    requirement_refs:
    - rendering-and-cache.personal-overlays-4
    - rendering-and-cache.personal-overlays-5
    - user.shell-viewer
    - overview.historical-subscriptions-remain-discoverable
  anonymous-overview:
    title: Anonymous Homepage
    auth: anon
    web:
      pages:
      - /
    presentation:
      items:
      - Public catalog introduction
      - Course discovery
      - Section discovery
      - Teacher discovery
    requirement_refs:
    - rendering-and-cache.personal-overlays-4
    - rendering-and-cache.personal-overlays-5
    - user.shell-viewer
    - overview.historical-subscriptions-remain-discoverable
rationale:
- Prefer a single aggregated snapshot tool for common assistant prompts before fanning out into multiple
  narrower tool calls.
- Use workspace_snapshot_get for broad assistant context; workspace_schedule_next for 'what is my next
  class?'; workspace_deadline_list for merged upcoming deadlines; workspace_overview_get only when lighter
  counts and samples suffice.
- The loader returns localized static copy only and performs no business-data queries.
