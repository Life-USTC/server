kind: feature
id: mcp
name: MCP
areas:
- platform
policy_refs:
- interface-hierarchy
- cases.mcp-assistant-workflows
access:
  anon: Cannot call MCP tools that require user context.
  user: After authorization, can call personal workspace-related tools.
  admin: Currently does not automatically gain additional MCP admin tools due to admin status.
  agent: MCP is one of the protocol entry points alongside REST, covering capabilities aligned with the
    web by default while enforcing resource-bound bearer tokens with canonical feature:action scopes.
requirements:
- id: mcp.personal-workspace-focus
  category: behavior
  rule: MCP exposes the listed public-information and ordinary user workspace/community capabilities.
    Administrator identity does not grant MCP governance capabilities; no administrator tools are exposed.
  rationale: This is the canonical MCP surface inventory and governance exclusion, including ordinary
    comment writes. Tool registration is independent of user role; neither admin-named tools nor governance
    scopes are registered.
  acceptance:
    given: The actual server is connected to an SDK client through in-memory JSON-RPC.
    when: The client lists tools and the raw wire result is compared with the documented tool groups.
    then:
    - Tool names match the complete documented inventory without duplicates.
    - Ordinary comment writes are present, while governance tools and scopes are absent.
    test:
      file: tests/unit/lib/mcp/mcp-registry-contracts.test.ts
      name: mcp.personal-workspace-focus
- id: mcp.text-formatted-json
  category: presentation
  rule: The canonical MCP tool-result serializer returns an object containing a boolean success field.
    Its text JSON and structuredContent are identical. Scalar and array payloads are nested under result;
    explicit success=false is preserved.
  acceptance:
    given: Domain results include object success/error, array, scalar and null payloads.
    when: The canonical serializer produces MCP text and structured output.
    then:
    - Every result contains boolean success.
    - Object payload fields and explicit false are retained.
    - Nonobjects are nested under result.
    - Text JSON and structuredContent equal the independent expected projection.
    test:
      file: tests/unit/lib/mcp/mcp-tool-helpers.test.ts
      name: mcp.text-formatted-json
- id: mcp.output-mode-input
  category: validation
  applies_to:
  - protocol-endpoint
  expectation:
    kind: enum_input
    surface: service
    operation: mcpModeInputSchema
    input: mode
    values:
    - default
    - full
    default: default
  acceptance:
    given: MCP output mode is absent, one of the supported values, or an unsupported input.
    when: The shared production MCP input schema parses each value.
    then:
    - An omitted mode uses the specified default.
    - Only the declared modes are accepted; retired summary and malformed inputs fail validation.
    test:
      file: tests/unit/lib/mcp/mcp-tool-helpers.test.ts
      name: mcp.output-mode-input
- id: mcp.output-modes
  category: presentation
  rule: Default and full outputs preserve top-level collection and key types; full adds only fields permitted
    by the corresponding domain projection.
- id: mcp.catalog-search-length
  category: validation
  rule: Course, section and teacher MCP search strings accept2-200 characters after trimming.
  rationale: Tool inventory is canonical in mcp.personal-workspace-focus. Young pagination has its own
    documented domain bounds.
  acceptance:
    given: Each of the three academic search tools receives1,2,200 and201 characters.
    when: Anonymous callers use the real HTTP MCP endpoint.
    then:
    - 2/200-character searches execute;1/201-character inputs return a tool validation error without a
      data payload.
    test:
      file: tests/integration/mcp-http-contracts.test.ts
      name: mcp.catalog-search-length
- id: mcp.catalog-pagination
  category: validation
  rule: Academic semester, course, section and teacher MCP lists accept page/limit1-100 with defaults
    page1 and limit20.
  rationale: Tool inventory is canonical in mcp.personal-workspace-focus. Young pagination has its own
    documented domain bounds.
  acceptance:
    given: All four academic catalog tools receive omitted, boundary and out-of-range pagination inputs.
    when: Anonymous clients invoke the real HTTP transport and read pagination metadata.
    then:
    - Default and1/100 values return the requested bounded page.
    - 0/101 page or limit values reject before data results.
    test:
      file: tests/integration/mcp-http-contracts.test.ts
      name: mcp.catalog-pagination
- id: mcp.aggregate-before-fanout
  category: presentation
  rule: Server instructions guide clients to workspace_snapshot_get or workspace_overview_get before narrower
    personal tools. Next-class and merged-deadline tools remain discoverable alongside underlying dataset
    tools and past-term subscription recovery.
  rationale: Payload compaction and full-mode shape rules are canonical in mcp.property-priority-parity
    and mcp.output-modes.
  acceptance:
    given: The actual SDK initialization instructions and tools/list descriptors.
    when: A client discovers the server.
    then:
    - Instructions name aggregate-first and subscription-based past-term recovery.
    - Next-class, deadline and underlying schedule/exam/homework tools are registered with task-specific
      descriptions.
    test:
      file: tests/unit/lib/mcp/mcp-registry-contracts.test.ts
      name: mcp.aggregate-before-fanout
- id: mcp.privacy-safe-default
  category: privacy
  rule: Authorization and privacy restrictions apply identically in default and full mode. Full mode may
    add documented nonsensitive fields but cannot disclose credentials, another user's private data, or
    hidden author identity. workspace_calendar_feed_get never returns a personal iCal URL, calendar path,
    credential, or token in any mode.
- id: mcp.property-priority-parity
  category: presentation
  rule: 'MCP default output follows the shared UI Model Property Priority contract: keep primary identity/task
    fields and useful disambiguators, compact repeated nested objects, and omit low-priority raw/audit
    fields unless full mode is explicitly requested.'
- id: mcp.actionable-errors
  category: presentation
  rule: Validation and not-found tool results contain a stable error classification and a user-readable
    message. Any recovery hint names an available tool or valid input correction and excludes credentials
    and hidden resource data.
- id: mcp.public-catalog-access
  category: authorization
  rule: MCP discovery and public catalog calls allow anonymous access. Personal tools require authenticated
    user context; absence of credentials rejects before private business execution.
  acceptance:
    given: The real HTTP MCP transport, public catalog data and a private tool.
    when: Anonymous requests list tools, read semesters and request private todos.
    then:
    - Discovery and catalog calls succeed; private calls return401 and a bootstrap resource-metadata challenge.
    test:
      file: tests/integration/mcp-http-contracts.test.ts
      name: mcp.public-catalog-access
- id: mcp.invalid-credentials-no-downgrade
  category: authorization
  rule: Any supplied invalid or unsupported authorization credential rejects the MCP request, including
    public catalog calls; it cannot fall back to anonymous access.
  acceptance:
    given: A public catalog request supplies invalid Bearer, Basic or DPoP credentials.
    when: The actual HTTP transport verifies the supplied header.
    then:
    - Every request returns401 without a successful tool result.
    test:
      file: tests/integration/mcp-http-contracts.test.ts
      name: mcp.invalid-credentials-no-downgrade
- id: mcp.resource-bound-access-token
  category: authorization
  rule: Authenticated MCP calls use Bearer JWTs bound to the MCP resource. The upstream verifier checks
    signature, issuer, expiry and resource audience; local authorization requires the exact active user-grant
    generation before SDK AuthInfo is constructed. Opaque and DPoP credentials are unsupported.
  acceptance:
    given: A real signer, publicly served Better Auth JWKS and production-role database grant.
    when: HTTP private calls use a valid JWT and tokens with wrong issuer/audience, expiry, grant generation,
      signature or opaque format.
    then:
    - The valid token returns only owner data.
    - Each invalid token returns401 before tool results; the upstream verifier fetches actual JWKS over
      HTTP.
    test:
      file: tests/integration/mcp-http-contracts.test.ts
      name: mcp.resource-bound-access-token
- id: mcp.refresh-resource-binding
  category: authorization
  rule: OAuth authorization resources remain code-bound; omitted-resource refresh maps to MCP only with
    an MCP feature scope and canonical MCP approval.
- id: mcp.complete-batch-scope-enforcement
  category: authorization
  rule: Each fixed-scope tool in a JSON-RPC batch requires all its declared scopes before any tool executes.
    A feature write grant satisfies read access for the same feature. GraphQL selected-field scopes remain
    canonical in graphql.scoped-query-auth and graphql.scoped-mutations.
  acceptance:
    given: A signed read-only grant and a batch containing read plus write tools.
    when: The real HTTP transport checks the batch, then checks a write-only token on a read tool.
    then:
    - The under-scoped batch returns403 with the required write scope and creates no todo.
    - The write token can read its owner’s todos.
    test:
      file: tests/integration/mcp-http-contracts.test.ts
      name: mcp.complete-batch-scope-enforcement
- id: mcp.bootstrap-auth-challenge
  category: authorization
  rule: Missing or invalid credentials on a private MCP call return the upstream JSON-RPC -32000 error
    and RFC9728 resource_metadata challenge with only account.profile:read as bootstrap scope.
  acceptance:
    given: Private HTTP requests with missing and invalid Bearer credentials.
    when: The actual transport rejects authorization.
    then:
    - Both responses are401 with JSON-RPC -32000, resource_metadata and the minimal bootstrap scope.
    test:
      file: tests/integration/mcp-http-contracts.test.ts
      name: mcp.bootstrap-auth-challenge
- id: mcp.safe-auth-challenges
  category: privacy
  rule: Local insufficient_scope challenges drive incremental authorization. WWW-Authenticate values escape
    quotes/backslashes and reject control characters; descriptions never reflect request-controlled tool
    names and required scope values come from the registry.
  acceptance:
    given: Challenge parameters contain quotes, backslashes and control characters; an under-scoped batch
      also contains a malicious unknown tool name.
    when: The real challenge formatter and fixed-tool scope authorizer produce headers.
    then:
    - Quotes/backslashes are escaped and all control characters reject.
    - The challenge includes the registered read/write scopes and insufficient_scope without reflecting
      the malicious tool name.
    test:
      file: tests/unit/lib/mcp/mcp-auth.test.ts
      name: mcp.safe-auth-challenges
- id: mcp.graphql-authorization
  category: authorization
  rule: The MCP GraphQL runner returns exact insufficient_scope tool-result challenges for missing selected-field
    scopes in both arbitrary documents and registered operations; aliases and fragments cannot hide the
    required feature scope.
  rationale: MCP audience/grant verification is canonical in mcp.resource-bound-access-token. Exactly-one
    source selection is graphql.graphql-operation-runner; prompt SDL/manifest and client retry guidance
    are graphql.graphql-operation-prompt; five-second timeout is graphql.registered-operation-timeout;
    cancellation and mutation commit ambiguity are graphql.mutation-timeout-ambiguity.
  acceptance:
    given: A real HTTP client has only todo-read scope and requests an account profile through a registered
      operation and an aliased document with a fragment.
    when: The actual MCP transport invokes the shared GraphQL runner.
    then:
    - Both return isError with insufficient_scope and only account.profile:read in the tool-result challenge.
    - No private account email is disclosed.
    test:
      file: tests/integration/mcp-http-contracts.test.ts
      name: mcp.graphql-authorization
- id: mcp.upload-put-resource-isolation
  category: authorization
  rule: An MCP-resource bearer cannot be replayed to the REST upload object PUT endpoint, even with workspace.upload:write
    scope and an owned valid reservation.
  rationale: Quota/metadata/lease/completion/rename/delete and the prohibition on raw bytes in GraphQL
    or MCP are canonical in graphql.upload-workflow-boundary and the individual graphql.upload-* invariants.
  acceptance:
    given: A real MCP-resource JWT with upload-write scope and an owned pending upload.
    when: The client sends bytes to the actual REST PUT route over HTTP using that JWT.
    then:
    - The request returns401 and leaves the reservation unchanged with no completed upload row.
    test:
      file: tests/integration/mcp-http-contracts.test.ts
      name: mcp.upload-put-resource-isolation
- id: mcp.request-body-limit
  category: validation
  rule: All MCP JSON request bodies have an inclusive64KiB byte limit before optional authentication or
    business dispatch. Oversized declared or streamed bodies return413.
  acceptance:
    given: A valid65536-byte JSON-RPC request and larger bodies, including a chunked Request stream.
    when: Anonymous, invalid-credential and authenticated clients submit bounded bodies over HTTP; the
      same route also processes a direct streamed Request.
    then:
    - The exact boundary executes successfully.
    - Every larger body returns413 before authentication or tool execution.
    test:
      file: tests/integration/mcp-http-contracts.test.ts
      name: mcp.request-body-limit
- id: mcp.request-batch-limit
  category: validation
  rule: An empty MCP JSON-RPC batch returns400/-32600. Batches of at most50 messages are accepted; larger
    batches return413 before handling.
  acceptance:
    given: JSON-RPC batches at0,50 and51 messages.
    when: The actual HTTP parser and SDK transport handle them.
    then:
    - The empty batch is Invalid Request;51 messages exceed the limit.
    - All50 valid requests produce distinct successful responses.
    test:
      file: tests/integration/mcp-http-contracts.test.ts
      name: mcp.request-batch-limit
- id: mcp.parsed-body-reuse
  category: consistency
  rule: Accepted MCP JSON request bodies are parsed once and the same parsed body is shared by scope enforcement,
    observability, rate limiting and SDK dispatch. Authentication and complete fixed-tool scope enforcement
    finish before restricted business execution.
  acceptance:
    given: The real request handler, body reader and fixed-tool mapping with mocked authentication, limiter
      and SDK boundaries.
    when: A duplicate-write JSON-RPC batch is accepted.
    then:
    - The request JSON is parsed exactly once without clone/json rereads.
    - Observability and SDK receive the same parsed object; authentication sees the complete deduplicated
      tool list.
    - Both write entries consume their preflight checks before SDK dispatch.
    test:
      file: tests/unit/lib/mcp/mcp-request-rate-limit.test.ts
      name: mcp.parsed-body-reuse
  rationale: This establishes transport orchestration and object identity, not cryptographic authentication.
    Actual authentication and complete-batch scope rejection are canonical in mcp.resource-bound-access-token
    and mcp.complete-batch-scope-enforcement.
- id: mcp.transport-observability
  category: privacy
  rule: MCP transport logging must never include bearer tokens, cookies, exception messages, or tool argument
    values.
  acceptance:
    given: The real transport handler, body summarizer, bookkeeping, app logger and verbose OAuth logger
      with external execution and emission sinks replaced.
    when: Successful and throwing SDK requests contain bearer/cookie/header/query/argument secrets and
      an exception with a malicious name.
    then:
    - Both log channels retain method/path/counts/status and the safe TypeError classification.
    - Neither channel emits secret values, argument keys or exception messages.
    test:
      file: tests/unit/lib/mcp/mcp-transport-privacy.test.ts
      name: mcp.transport-observability
- id: mcp.mutation-rate-limits
  category: validation
  rule: 'Ordinary MCP mutations are preflighted against the shared per-host, per-user feature-action Cloudflare
    budgets: 60 writes or 10 batch writes per minute. Registered GraphQL mutations instead use the shared
    resolver guard with the same feature:write key, avoiding duplicate consumption. Fixed-tool batches
    fail before side effects on limit or unavailable bindings; responses use 429 or 503 with Retry-After:
    60.'
- id: mcp.rate-limit-accuracy-boundary
  category: consistency
  rule: MCP mutation throttles are per-Cloudflare-location, permissive, eventually consistent abuse controls
    rather than global exact quotas. The protocol does not promise remaining/reset counters, and read-only
    tools do not consume mutation budgets.
- id: mcp.flexible-date-inputs
  category: validation
  rule: Date and datetime parameters on MCP tools accept ISO 8601 with timezone offset (2026-05-01T08:00:00+08:00),
    bare date strings (2026-05-01, treated as UTC midnight for @db.Date columns), or timezone-less datetimes
    (2026-05-01T08:00:00, interpreted as Asia/Shanghai). Invalid strings produce a descriptive error response
    rather than a validation rejection.
- id: mcp.time-override
  category: consistency
  rule: workspace_snapshot_get, workspace_schedule_next, workspace_calendar_timeline_get, workspace_deadline_list,
    workspace_overview_get, and catalog_bus_departure_next accept atTime to anchor their product query
    clock. atTime never changes credential expiration, suspension status, ownership, or rate-limit authorization
    clocks.
- id: mcp.openai-compatible-descriptors
  category: consistency
  rule: Every tool advertises a nonempty title, a closed object outputSchema with required boolean success,
    boolean read-only/destructive/open-world annotations, and matching top-level and _meta.securitySchemes.
    Public catalog tools advertise noauth; ordinary personal tools advertise their fixed feature scopes.
    graphql_operation_run advertises conservative write/destructive/open-world hints and delegates exact
    scopes to selected operations.
  rationale: Public catalog descriptor noauth and anonymous HTTP calls are canonical in mcp.public-catalog-access.
    Mode shape parity is canonical in mcp.output-modes.
  acceptance:
    given: Every actual server tool descriptor is captured before the SDK client strips extension fields.
    when: The raw tools/list wire response is inspected.
    then:
    - Every output schema is closed and declares boolean success; every safety hint is boolean and every
      title is nonempty.
    - Both securitySchemes copies match public noauth or explicit registered OAuth scopes.
    - The GraphQL runner has conservative mutation safety hints.
    test:
      file: tests/unit/lib/mcp/mcp-registry-contracts.test.ts
      name: mcp.openai-compatible-descriptors
- id: mcp.typed-output-fields
  category: consistency
  rule: Every known MCP output field has an explicit value schema; known fields must not silently become
    unconstrained unknown values.
  rationale: The descriptor contract separately verifies closed top-level objects and boolean success.
    Existing unconstrained domain fields remain an implementation and acceptance-test gap; shared error
    classification is canonical in mcp.error-classification-shape.
- id: mcp.tool-registry-completeness
  category: consistency
  rule: Server startup fails when any registered MCP tool lacks an explicit OAuth scope entry or output
    schema, so tool registration cannot silently fall back to generic metadata.
  acceptance:
    given: A complete production registry and an extra tool missing explicit scope/schema metadata.
    when: The actual startup metadata guard checks each registry.
    then:
    - The complete registry passes.
    - The incomplete registry throws naming both missing scope metadata and output schema.
    test:
      file: tests/unit/lib/mcp/mcp-registry-contracts.test.ts
      name: mcp.tool-registry-completeness
- id: mcp.subscription-kind-projection
  category: consistency
  rule: Personal subscription reads include membership kind in both default and full modes. workspace_subscription_kind_update
    changes only an existing subscription owned by the verified user.
  applies_to:
  - tool-groups
  acceptance:
    given: Two isolated authenticated MCP users and one public section.
    when: The owner adds and changes membership kind; a nonmember tries to change it and both output modes
      list memberships.
    then:
    - Only the existing owner membership changes to auditor.
    - Adding the existing membership preserves its kind and default/full reads include auditor.
    test:
      file: tests/integration/mcp/workspace/subscription-kind.test.ts
      name: mcp.subscription-kind-projection
- id: mcp.tool-result-envelope
  category: consistency
  rule: All ordinary MCP tool results use the canonical result envelope. JSON-RPC protocol and transport
    errors retain their protocol-specific error shapes.
- id: mcp.http-methods
  category: behavior
  rule: MCP uses POST for JSON-RPC and OPTIONS for trusted-origin CORS preflight. GET returns405. DELETE
    is idempotent on the stateless transport and succeeds with absent or valid credentials; invalid supplied
    credentials reject401.
  acceptance:
    given: The real HTTP route adapter and stateless SDK transport.
    when: A client sends GET, trusted OPTIONS and DELETE with absent, valid and invalid credentials.
    then:
    - GET returns405; OPTIONS returns204 with the trusted origin; valid/anonymous DELETE returns200.
    - Invalid credentials on DELETE return401.
    test:
      file: tests/integration/mcp-http-contracts.test.ts
      name: mcp.http-methods
- id: mcp.error-classification-shape
  category: consistency
  rule: A registered MCP result with a shared error classification uses a string code; null, numeric,
    boolean, object and array error values are rejected by its output schema.
  acceptance:
    given: Every registered descriptor containing the shared error classification field.
    when: Its raw advertised JSON Schema and actual Zod output validator are checked with string and nonstring
      failures.
    then:
    - Descriptors declare error as a string.
    - String-coded failures validate and all nonstring error variants reject.
    test:
      file: tests/unit/lib/mcp/mcp-registry-contracts.test.ts
      name: mcp.error-classification-shape
capabilities:
  protocol-endpoint:
    title: Protocol Endpoint
    auth: anon
    web: unavailable
    rest:
      routes:
      - path: /api/mcp
        method: POST
        notes:
        - Public discovery and catalog calls allow anonymous access. Personal tools require a resource-bound
          Bearer JWT, active grant and all declared scopes; supplied invalid credentials never downgrade
          to anonymous.
        - Trusted browser-origin clients receive MCP CORS headers. Foreign Origin requests reject before
          tool handling.
        auth: anon
      - path: /api/mcp
        auth: anon
      - path: /api/mcp
        method: DELETE
        auth: anon
      - path: /api/mcp
        method: OPTIONS
        auth: anon
        notes:
        - Answers browser CORS preflight requests for trusted origins before bearer-token MCP transport
          handling.
    presentation:
      items:
      - JSON-RPC over POST; trusted-origin OPTIONS preflight
      - GET returns method-not-allowed; stateless DELETE is idempotent
      - Returns JSON-RPC or transport responses
  tool-groups:
    title: Tool Groups
    auth: user
    mcp:
      groups:
      - name: Profile & Todo
        tools:
        - account_profile_get
        - account_client_activity_list
        - community_user_get
        - workspace_todo_list
        - workspace_todo_create
        - workspace_todo_update
        - workspace_todo_delete
      - name: Registered GraphQL
        tools:
        - graphql_operation_run
      - name: Workspace & Overview
        tools:
        - workspace_snapshot_get
        - workspace_overview_get
        - workspace_schedule_next
        - workspace_deadline_list
        - catalog_link_list
        - workspace_link_pin_list
        - workspace_link_pin_set
      - name: Course, Section & Semester
        tools:
        - catalog_semester_list
        - catalog_semester_current
        - catalog_course_search
        - catalog_course_get
        - catalog_section_search
        - catalog_section_get
        - catalog_teacher_search
        - catalog_teacher_get
        - catalog_section_match_preview
      - name: Comments
        tools:
        - community_comment_list
        - community_comment_get
        - community_comment_create
        - community_comment_update
        - community_comment_delete
        - community_comment_replies
        - community_comment_reaction_add
        - community_comment_reaction_remove
      - name: Descriptions
        tools:
        - community_description_get
        - community_description_set
      - name: Uploads
        tools:
        - workspace_upload_list
        - workspace_upload_rename
        - workspace_upload_delete
      - name: Calendar & Subscription
        tools:
        - workspace_calendar_event_list
        - workspace_calendar_timeline_get
        - workspace_calendar_feed_get
        - workspace_subscription_list
        - workspace_subscription_add
        - workspace_subscription_remove
        - workspace_subscription_kind_update
        - catalog_section_calendar_feed_get
        - workspace_subscription_import
      - name: Homework, Schedule & Exam
        tools:
        - workspace_homework_list
        - workspace_homework_completion_set
        - workspace_schedule_list
        - workspace_exam_list
        - community_section_homework_list
        - community_section_homework_create
        - community_section_homework_update
        - community_section_homework_delete
        - catalog_schedule_list
        - catalog_section_schedule_list
        - catalog_section_exam_list
      - name: Bus
        tools:
        - catalog_bus_timetable_get
        - catalog_bus_route_list
        - catalog_bus_route_get
        - workspace_bus_preferences_get
        - workspace_bus_preferences_set
        - catalog_bus_route_search
        - catalog_bus_departure_next
      - name: Weather and room maps
        tools:
        - catalog_weather_get
        - catalog_rooms_map
      - name: Young Events
        tools:
        - catalog_young_event_list
        - catalog_young_event_get
        - catalog_young_organizer_list
        - catalog_young_organizer_get
        - workspace_young_event_subscription_list
        - workspace_young_event_subscription_get
        - workspace_young_event_subscription_set
        - workspace_young_organizer_subscription_list
        - workspace_young_organizer_subscription_get
        - workspace_young_organizer_subscription_set
        - workspace_young_notification_list
        - workspace_young_notification_read
    presentation:
      items:
      - Schedule tools
      - Homework tools
      - Section tools
      - Tool name
      - Tool title
      - Tool description
      - Tool annotations
      - OAuth security schemes
      - Input schema
      - Output schema
      - Preferred tool for common prompts

rationale:
- Public room-map projection and anonymous transport parity are owned by room-map.public; input normalization is owned by room-map.normalization.
