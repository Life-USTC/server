kind: feature
id: oauth
name: OAuth
areas:
- account
- platform
- admin
policy_refs:
- interface-hierarchy
- ui
- permission-ui
- rendering-and-cache
access:
  anon: When accessing the authorization page, will first be guided to sign in.
  user: Can only approve or reject third-party client authorization requests.
  admin: Can manage OAuth clients in the admin backend.
  agent: Accesses restricted capabilities after obtaining a token through the standard authorization flow.
requirements:
- id: oauth.auth-page-clarity
  category: presentation
  rule: The authorization page must clearly display the application name, requested permissions, client-id
    host when URL-based, redirect host, per-scope controls, approve action, and reject action. Loopback
    redirects warn that the callback returns to a local application.
- id: oauth.user-consent-framing
  category: presentation
  rule: Consent describes the requesting application and permissions in user-facing terms, including the
    ability to approve a subset of the requested permissions.
- id: oauth.signed-consent-integrity
  category: authorization
  rule: Approval accepts only the current canonical signed-parameter format with an exact nonempty signed-name
    set. Invalid signatures, missing or duplicated signed-name declarations, expiry, and changes to signed
    scopes, resources, or UserInfo claims fail before a grant or code is issued. The approved scopes may
    be a subset, but never a superset, of the signed request.
  acceptance:
    given: A real registered public client and session, and a consent query generated by the installed
      Better Auth authorization endpoint.
    when: Submit legacy, incomplete, duplicate, extra-name, expired, and tampered signed queries; attempt
      an excessive scope selection; then approve a valid subset of the actual provider request.
    then:
    - Invalid requests issue no code and create no consent.
    - The unmodified current provider signature succeeds, persisting only selected scopes and the signed
      resource and UserInfo claims.
    test:
      file: tests/integration/oauth-consent-recent-auth.test.ts
      name: oauth.signed-consent-integrity
- id: oauth.dcr-via-provider
  category: consistency
  rule: Dynamic client registration is supported at the provider registration endpoint and returns 201
    Created. Registration shares the configured OAuth provider validation and persistence. A client requiring
    DPoP-bound tokens is rejected because the exposed resource servers accept Bearer tokens only.
  rationale: DCR is a supported current client-registration protocol, not a fallback for obsolete registration
    paths.
- id: oauth.dcr-device-only-no-redirect
  category: validation
  rule: Dynamic client registration for a device-only client may omit redirect_uris; any provider-adapter
    placeholder redirect URI must not be persisted or returned as registered client metadata.
- id: oauth.dcr-rules-from-provider
  category: consistency
  rule: Dynamic registration accepts explicitly allowlisted standard identity scopes and public feature:action
    scopes. It cannot grant administrator governance. Public clients require PKCE, issued tokens are resource-bound,
    and reuse of a rotated refresh token is rejected. Provider configuration is the shared source of registration
    defaults and validation.
- id: oauth.llm-platform-oauth-compatibility
  category: consistency
  rule: Remote MCP clients may use discovery, CIMD, authorization code with PKCE, /api/mcp resource indicators,
    and protected-resource metadata. CIMD requires an HTTPS URL client ID, matching client_id, nonempty
    client_name, and redirect_uris. Metadata retrieval fails closed for nonpublic DNS answers, disallowed
    redirects, exceeded size or timeout limits, unsupported grant requirements, and DPoP-only clients.
- id: oauth.trusted-clients-admin-backend
  category: authorization
  rule: Only an explicit persisted administrator-controlled trust marker or configured allowlist establishes
    a trusted OAuth client. A name, domain, upstream identity, or registration method cannot establish
    trust. Client trust does not confer administrator role or ownership of user resources.
  rationale: The supported trusted-client consent treatment is a separate explicit authorization policy;
    no additional cached-client or implicit trust mechanism is promised.
- id: oauth.public-clients-pkce
  category: authorization
  rule: Public MCP / CLI / native clients use public + PKCE mode and token_endpoint_auth_method=none stores
    or returns no client secret; the admin inventory must explicitly label trust and fixed authentication
    type to reduce misconfiguration probability.
- id: oauth.user-delegated-grants-only
  category: authorization
  rule: 'OAuth discovery metadata advertises only user-delegated grants: authorization_code, refresh_token,
    and the custom device_code grant. It must not advertise client_credentials unless a real service-account
    authority model is introduced.'
  acceptance:
    given: The installed provider behind each authorization-server and OpenID metadata route.
    when: Read grant_types_supported and device_authorization_endpoint over HTTP.
    then:
    - Only authorization_code, refresh_token, and the custom device_code grant are advertised; the device
      endpoint points to the local authorization server.
    test:
      file: tests/integration/oauth-discovery-contracts.test.ts
      name: oauth.user-delegated-grants-only
- id: oauth.client-validation-from-provider
  category: consistency
  rule: Administrator-created clients use the same redirect URI and client metadata validation as other
    supported registrations. Linked sign-in account identity is keyed by issuer and provider subject;
    matching subject values from different issuers do not identify the same external account.
- id: oauth.loopback-redirect-tolerance
  category: validation
  rule: A native client callback must use its registered loopback host, scheme, path, and query. localhost
    and 127.0.0.1 are distinct registered hostnames; the authorization server does not substitute one
    for the other. Any permitted ephemeral-port behavior is limited to the registered native loopback
    client pattern.
- id: oauth.device-grant-custom
  category: behavior
  rule: Device authorization is available only to enabled public clients registered for the device-code
    grant. Approved scopes and resources bind issued access tokens to the intended REST, GraphQL, or MCP
    resource. DPoP-bound clients and DPoP proofs are rejected.
  rationale: The implementation belongs to the shared provider adapter; package-version limitations are
    not product requirements.
- id: oauth.rest-bearer-scopes
  category: authorization
  rule: Protected REST and GraphQL endpoints accept OAuth bearer tokens only with the endpoint audience
    and explicit feature:action authority; shared verification rejects any DPoP-bound cnf.jkt token presented
    as Bearer. Browser cookie sessions continue to use normal signed-in user semantics without OAuth scopes.
- id: oauth.mcp-refresh-resource-binding
  category: authorization
  rule: Omitted-resource refresh requests map to canonical MCP only when the stored grant approves exactly
    that protected resource and includes an MCP feature scope, and the requested effective scope still
    includes MCP authority. Requested scopes cannot create missing stored approval; malformed or ambiguous
    resource lists do not select MCP.
  acceptance:
    given: Real database refresh records with MCP, absent, provider-only, ambiguous, or malformed approvals
      and feature or profile-only scopes.
    when: The production token request preparation adapter reads a refresh request that omits resource.
    then:
    - Only unambiguous stored MCP approval with stored and effective feature authority inserts the canonical
      resource into the prepared request.
    - Scope downselection to profile removes implicit binding; scope escalation from a profile-only stored
      grant cannot create it.
    test:
      file: tests/integration/oauth-resource-binding.test.ts
      name: oauth.mcp-refresh-resource-binding
- id: oauth.token-endpoint-observability
  category: privacy
  rule: OAuth token handling exports whole-request and fixed-stage durations to separate provider, grant
    validation, request preparation, and response checks. Better Auth solely owns idempotent resource
    initialization; the token route does not repeat it. Configured resource policies use the provider's
    write-invalidated cache, never an application token cache. Telemetry never includes token values,
    authorization codes, refresh tokens, client secrets, cookies, raw errors, or resource values.
- id: oauth.oauth-proxy-for-dev
  category: behavior
  rule: Local development and preview deployments without fixed hostnames can reuse the production site's
    registered provider callback address through an OAuth proxy; after sharing the proxy encryption key,
    production completes the callback and returns the encrypted profile to the current instance. Better
    Auth 1.7 uses /api/auth/callback/{provider-id}; provider redirect allowlists must include it before
    deployment.
- id: oauth.canonical-discovery-paths
  category: consistency
  rule: Canonical metadata is available at /.well-known/oauth-authorization-server/api/auth, /api/auth/.well-known/openid-configuration,
    /.well-known/openid-configuration/api/auth, /.well-known/oauth-protected-resource/api/mcp, and /.well-known/oauth-protected-resource/api/graphql.
    MCP protected-resource metadata supports GET and bodyless HEAD. Extra root and MCP-relative discovery
    aliases are not supported.
  acceptance:
    given: The actual mounted discovery route modules and installed Better Auth metadata provider, served
      over local HTTP.
    when: GET all five issuer/resource-derived metadata addresses, HEAD MCP metadata, and request seven
      retired aliases.
    then:
    - The canonical metadata responses identify the configured issuer or exact MCP/GraphQL resource.
    - MCP HEAD is bodyless and extra root/MCP-relative aliases return 404.
    test:
      file: tests/integration/oauth-discovery-contracts.test.ts
      name: oauth.canonical-discovery-paths
  rationale: 'The issuer is /api/auth: RFC 8414 inserts well-known before its path, while OIDC Discovery
    appends openid-configuration to it; both supported issuer-derived forms remain. RFC 9728 inserts well-known
    before each resource path, /api/mcp or /api/graphql. Removed aliases describe neither the configured
    issuer nor a resource metadata address.'
- id: oauth.protected-resource-scope-advertisement
  category: consistency
  rule: Canonical MCP protected-resource metadata is produced by the upstream @better-auth/mcp plugin
    and exposed through the local path-aware CORS facade. The facade advertises only canonical public
    non-admin feature:action scopes and removes DPoP metadata because the MCP transport remains Bearer-only.
    account.client-activity is an explicit read-only feature and no :write scope is generated, registered,
    or advertised.
  acceptance:
    given: The actual upstream MCP plugin behind the production metadata facade.
    when: Read MCP protected-resource metadata over HTTP.
    then:
    - It identifies the exact MCP resource and issuer and accepts Bearer via header.
    - Every scope is a canonical public feature:action scope; administrator, legacy mcp:tools, and client-activity
      write scopes are absent.
    - DPoP metadata is absent.
    test:
      file: tests/integration/oauth-discovery-contracts.test.ts
      name: oauth.protected-resource-scope-advertisement
- id: oauth.discovery-cors
  category: behavior
  rule: 'Discovery metadata should support cross-origin reading; at minimum return Access-Control-Allow-Origin:
    * for OpenID discovery, and keep the CORS behavior of authorization server metadata and protected
    resource metadata consistent, reducing compatibility risks for browser-type clients and debugging
    tools.'
  acceptance:
    given: All five actual discovery route modules behind local HTTP.
    when: Make GET and OPTIONS requests with an unrelated browser Origin.
    then:
    - Metadata GET succeeds and OPTIONS returns 204; both provide wildcard origin and consistent discovery
      methods/headers.
    test:
      file: tests/integration/oauth-discovery-contracts.test.ts
      name: oauth.discovery-cors
- id: oauth.transport-cors
  category: behavior
  rule: 'The MCP transport endpoint /api/mcp should also support browser-based clients and debugging tools
    using Bearer tokens: answer OPTIONS preflights, allow the MCP-specific request headers, and expose
    MCP-Session-Id and WWW-Authenticate on cross-origin transport responses.'
- id: oauth.transport-origin-validation
  category: authorization
  rule: Per the MCP Streamable HTTP transport guidance, /api/mcp should reject requests carrying an Origin
    header unless that origin matches the app's trusted origin set (public/canonical origin, localhost
    dev aliases, and allowed preview hosts). Non-browser clients that omit Origin remain supported.
- id: oauth.authorization-management.oauth-usage-aggregation
  category: privacy
  rule: Successful and failed completed OAuth operations are coalesced within a Worker into bounded per-grant,
    Shanghai-day, feature, and channel counters before atomic upsert. Rows contain no request targets,
    arguments, content, network, device, token, or secret data. The authorization page sums the current
    grant's last 30 days and selects the latest feature/channel by lastUsedAt.
  applies_to:
  - authorization-management
- id: oauth.authorization-management.recent-auth-for-consent
  category: authorization
  rule: Approving a new grant or expanding an existing grant requires an authoritative server-side session
    created within the last 15 minutes. A stale attempt records a denied audit event and returns sign-in
    guidance without issuing a code.
  applies_to:
  - authorization-management
  acceptance:
    given: Real registered clients, correctly signed consent requests, real signed session cookies, and
      isolated production-role session and consent rows for new grants and scope expansions.
    when: Submit approval with fresh, stale, exact 15-minute-old, future-created, revoked, or expired
      sessions, after priming the request session cache.
    then:
    - Only the fresh session creates an authorization code and persists the approved scopes.
    - All other sessions return the recent_auth_required sign-in guidance target, leave the grant unchanged,
      and issue no code.
    - Identified stale, boundary, and future-created sessions persist one denied audit event with the
      appropriate grant or update action.
    - The sign-in guidance is available in English and Chinese.
    test:
      file: tests/integration/oauth-consent-recent-auth.test.ts
      name: oauth.authorization-management.recent-auth-for-consent
- id: oauth.authorization-management.ownership-scoped-transaction
  category: authorization
  rule: Grant revocation atomically removes the selected user-client pair's consents, access-token rows,
    refresh-token rows, pending or approved device codes, and usage aggregates together with its audit
    event.
  applies_to:
  - authorization-management
- id: oauth.authorization-management.active-user-grant-enforcement
  category: authorization
  rule: User JWTs, opaque access tokens, and refresh tokens bind the exact consent generation and scopes
    that issued them. REST, GraphQL, MCP, userinfo, and introspection require that generation to remain
    active; reauthorization cannot revive old tokens and scope reduction cannot retain broader access.
    Admin-created skipConsent clients are the only bypass and still require an existing user. Missing
    evidence and database errors fail closed. Lookups stay uncached so revocation applies on the next
    request.
  applies_to:
  - authorization-management
- id: oauth.authorization-management.refresh-revocation-race
  category: consistency
  rule: Refresh exchange verifies the hashed token row and exact grant generation before delegation, preserves
    that generation on the returned JWT, opaque access token, and rotated refresh token, then verifies
    it again before returning success. If revocation or reauthorization wins the race, only the old lineage
    rows are purged and no token can continue under the newer grant.
  applies_to:
  - authorization-management
- id: oauth.authorization-management.singleton-form-parameters
  category: validation
  rule: OAuth token and introspection form parameters are single-valued and repeated values fail with
    invalid_request before delegation; resource remains multi-valued.
  applies_to:
  - authorization-management
- id: oauth.authorization-management.consent-mutations
  category: behavior
  rule: The direct provider consent-approval endpoint is unavailable. New grants and authority expansion
    use the signed authorization page; protocol grant-management endpoints cannot bypass that approval
    flow.
  applies_to:
  - authorization-management
  acceptance:
    given: A caller submits approval directly to the provider consent endpoint.
    when: The application auth adapter handles the request.
    then:
    - The endpoint returns not found.
    - No approval is delegated to the provider.
    test:
      file: tests/unit/features/oauth/oauth-consent-routes.test.ts
      name: oauth.authorization-management.consent-mutations
- id: oauth.authorization-revoke-valid-session
  category: authorization
  rule: A valid authoritative session may revoke its own application grants through settings or the supported
    protocol endpoint regardless of session age.
  applies_to:
  - authorization-management
  acceptance:
    given: A user has a valid session older than 15 minutes and two application grants.
    when: The user revokes one grant through the protocol endpoint and another through settings.
    then:
    - Both revocations succeed.
    - The selected grants are removed.
    test:
      file: tests/integration/account-authority-reduction.test.ts
      name: oauth.authorization-revoke-valid-session
- id: oauth.authorization-reduction-ownership
  category: authorization
  rule: Grant revocation and scope reduction derive the actor from the verified session and cannot change
    another user's grant. An inaccessible consent identifier returns not found.
  applies_to:
  - authorization-management
  acceptance:
    given: Two users have distinct sessions and application grants.
    when: One user attempts to revoke or reduce the other user's grant through protocol endpoints or settings.
    then:
    - The grant is not disclosed through the mutation result.
    - The original scopes and generation remain unchanged.
    test:
      file: tests/integration/account-authority-reduction.test.ts
      name: oauth.authorization-reduction-ownership
- id: oauth.authorization-reduction-origin
  category: authorization
  rule: Cookie-authenticated grant revocation and scope reduction require a trusted request origin before
    any grant state changes.
  applies_to:
  - authorization-management
  acceptance:
    given: A user has a valid session and an owned grant.
    when: Revocation or reduction is submitted with a foreign Origin through supported protocol endpoints
      or settings.
    then:
    - Every request is rejected.
    - The grant scopes and generation are unchanged.
    test:
      file: tests/integration/account-authority-reduction.test.ts
      name: oauth.authorization-reduction-origin
- id: oauth.authorization-reduction-authoritative
  category: authorization
  rule: Grant revocation and scope reduction revalidate the authoritative server session; a cached identity
    from a revoked or expired session cannot authorize a mutation.
  applies_to:
  - authorization-management
  acceptance:
    given: A request has already resolved its cookie identity, then its server session is revoked or expires.
    when: The same request invokes grant revocation or scope reduction.
    then:
    - The request is unauthorized despite its cached identity.
    - The grant scopes and generation are unchanged.
    test:
      file: tests/integration/account-authority-reduction.test.ts
      name: oauth.authorization-reduction-authoritative
- id: oauth.authorization-reduce-valid-session
  category: authorization
  rule: An owner with a valid authoritative session may reduce an existing grant without signing in again.
    A committed reduction rotates the grant generation and invalidates credentials issued under the previous
    generation.
  applies_to:
  - authorization-management
  acceptance:
    given: A user has a valid session older than 15 minutes, an existing grant and a token issued under
      it.
    when: The user reduces the grant scopes through update-consent.
    then:
    - The requested subset is persisted.
    - The grant generation rotates.
    - The old token row is removed.
    test:
      file: tests/integration/account-authority-reduction.test.ts
      name: oauth.authorization-reduce-valid-session
- id: oauth.authorization-reduce-no-expansion
  category: authorization
  rule: The direct update-consent endpoint accepts only subsets of the current user grant. Additional
    scopes require the signed authorization flow and its recent-authentication checks.
  applies_to:
  - authorization-management
  acceptance:
    given: A client permits a scope that the user has not granted.
    when: Fresh and stale valid sessions request that additional scope through update-consent.
    then:
    - Both requests fail.
    - The current scope set and generation remain unchanged.
    test:
      file: tests/integration/account-authority-reduction.test.ts
      name: oauth.authorization-reduce-no-expansion
- id: oauth.authorization-reduce-concurrent
  category: consistency
  rule: Concurrent scope reductions serialize against the current grant. A request based on superseded
    authority cannot restore a scope that another reduction has removed.
  applies_to:
  - authorization-management
  acceptance:
    given: A grant has two scopes.
    when: Two concurrent requests independently reduce it to different one-scope subsets.
    then:
    - Only one incompatible reduction succeeds.
    - The other request cannot restore a scope removed by the committed reduction.
    - The persisted grant contains one scope and a new generation.
    test:
      file: tests/integration/account-authority-reduction.test.ts
      name: oauth.authorization-reduce-concurrent
- id: oauth.authorization-code-resource-binding
  category: authorization
  rule: Authorization codes retain the resource approved at consent. Token exchange cannot substitute
    a different protected resource.
  acceptance:
    given: A real public PKCE client, user session row, accepted consent, and authorization codes created
      by the consent service.
    when: Exchange MCP-bound codes at the production token route with matching MCP and substituted GraphQL
      resource indicators.
    then:
    - The stored code contains the approved MCP resource; matching exchange returns a token whose audience
      includes MCP and OIDC userinfo.
    - Resource substitution returns400 invalid_target without an access token.
    test:
      file: tests/integration/oauth-resource-binding.test.ts
      name: oauth.authorization-code-resource-binding
- id: oauth.refresh-confirmation-binding
  category: authorization
  rule: Explicit-resource refresh JWT replacement verifies the current upstream JWT and requires cnf.jkt
    and token_type to agree. It preserves matching DPoP binding, permits a valid Bearer-to-DPoP upgrade,
    and skips replacement for malformed or conflicting confirmation data, token-type mismatch, downgrade,
    or invalid signature.
  rationale: This contract covers resource-bound token replacement after provider issuance; the provider
    owns validating the refresh request and DPoP proof. Skipping replacement preserves the upstream response
    rather than minting a weaker token.
  acceptance:
    given: Real stored refresh records and actual signed upstream JWTs, including a payload-tampered signature
      negative control.
    when: The production refresh replacement service evaluates10 stored/current confirmation and token-type
      cases.
    then:
    - Valid Bearer, matching DPoP, and new DPoP binding produce appropriately bound replacements.
    - Malformed or conflicting confirmations, dropped sender constraint, inconsistent token types, and
      invalid signatures produce no replacement.
    test:
      file: tests/integration/oauth-resource-binding.test.ts
      name: oauth.refresh-confirmation-binding
capabilities:
  authorization:
    title: Authorization
    auth: anon
    web:
      pages:
      - /oauth/authorize
      - /error
    rest: stable
    presentation:
      items:
      - client.name (which app is requesting)
      - Requested scopes[] (human-readable)
      - Requested scopes[] checkboxes so the user can approve a subset
      - Approve/Deny buttons
      - Consent failure message when authorization cannot continue
  authorization-management:
    title: Authorized Applications
    auth: user
    web:
      pages:
      - /account/settings/authorizations
    rest:
      routes:
      - path: /api/auth/oauth2/delete-consent
        method: POST
        reference_only: true
      - path: /api/auth/oauth2/update-consent
        method: POST
        reference_only: true
    graphql: unavailable
    mcp: unavailable
    presentation:
      items:
      - client.name (display name with an unnamed fallback)
      - client.uri (public application URI)
      - client.disabled (disabled badge)
      - consent.scopes[] (approved permissions)
      - consent.updatedAt (last authorization time)
      - Current grant lastUsedAt, last channel, and last feature
      - Current grant 30-day read, write, and error totals
      - Revoke action with confirmation
    requirement_refs:
    - oauth.authorization-revoke-valid-session
    - oauth.authorization-reduction-ownership
    - oauth.authorization-reduction-origin
    - oauth.authorization-reduction-authoritative
    - oauth.authorization-reduce-valid-session
    - oauth.authorization-reduce-no-expansion
    - oauth.authorization-reduce-concurrent
  client-registration:
    title: Client Registration & Discovery
    auth: admin
    web:
      pages:
      - /admin/oauth
    rest:
      routes:
      - path: /api/auth/.well-known/openid-configuration
        auth: anon
      - path: /api/auth/.well-known/openid-configuration
        method: OPTIONS
        auth: anon
      - path: /api/auth/{auth}
        method: POST
        auth: anon
      - path: /.well-known/oauth-authorization-server/api/auth
        auth: anon
      - path: /.well-known/oauth-authorization-server/api/auth
        method: OPTIONS
        auth: anon
      - path: /.well-known/openid-configuration/api/auth
        auth: anon
      - path: /.well-known/openid-configuration/api/auth
        method: OPTIONS
        auth: anon
      - path: /.well-known/oauth-protected-resource/api/mcp
        auth: anon
      - path: /.well-known/oauth-protected-resource/api/mcp
        method: OPTIONS
        auth: anon
    mcp: unavailable
    presentation:
      items:
      - 'Single client inventory: name/id, single-line trust/type/status badges, single-line scopes summary
        with full-value overflow tooltip, created time, confirmed delete'
      - client.name (required text input)
      - client.redirectUris[] (explicit inputs for redirect-based client patterns)
      - client.scopes[] (allowlisted checkboxes)
      - One of three fixed client patterns that derives token auth, PKCE, consent, and end-session settings
      - Register button and one-time post-create credentials dialog
  device-authorization-grant:
    title: Device Authorization Grant (RFC 8628)
    description: No MCP tool starts device authorization; bearer tokens minted by this flow can call REST
      and MCP when the approved device request is resource-bound and scoped appropriately, including feature:read/feature:write
      for REST.
    auth: anon
    web:
      pages:
      - /oauth/device
    rest:
      routes:
      - path: /api/auth/oauth2/device-authorization
        method: POST
        notes:
        - Request body is application/x-www-form-urlencoded.
        - The client must be an enabled public client registered with urn:ietf:params:oauth:grant-type:device_code;
          omitted scope defaults to low-risk openid/profile scopes allowed by the client, while optional
          repeated resource parameters are validated against provider audiences and persisted with the
          pending device code.
        - 'Supports CORS (Access-Control-Allow-Origin: *); OPTIONS returns a 204 CORS preflight response.'
        - .well-known/openid-configuration already includes device_authorization_endpoint and urn:ietf:params:oauth:grant-type:device_code
          in grant_types_supported.
      - path: /api/auth/oauth2/device-authorization
        method: OPTIONS
        auth: anon
        notes:
        - Supports unauthenticated browser preflight for public OAuth device authorization clients.
      - path: /api/auth/oauth2/token
        method: POST
        notes:
        - The device polls this endpoint with grant_type=urn:ietf:params:oauth:grant-type:device_code
          and device_code to obtain an access token.
        - If resource parameters are included while polling, they must match the resources approved through
          the device authorization request; resource-bound device grants return JWT access tokens accepted
          by matching REST/MCP audiences, but protected REST routes still require matching feature:read/feature:write
          scopes.
        - A refresh token is returned only for resource-less device grants when the approved scope includes
          offline_access; resource-bound device grants do not issue refresh tokens.
        - During polling, returns authorization_pending, slow_down, expired_token, access_denied, invalid_scope,
          or invalid_grant error codes based on state.
      - path: /api/auth/oauth2/token
        method: GET
    mcp: unavailable
    presentation:
      items:
      - One page-level title and description
      - One segmented user-code input labelled Device Code
      - One verify action
      - Approval/result screens
      - Requested scopes[] on approval screen
      - Requested resources[] on approval screen
      - device_auth status (pending/approved/denied)
