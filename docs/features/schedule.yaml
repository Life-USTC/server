kind: feature
id: schedule
name: Schedule
areas:
- catalog
- workspace
policy_refs:
- interface-hierarchy
- ui
- permission-ui
- rendering-and-cache
- cases.missing-data
access:
  anon: Can read public schedule information.
  user: Can read public schedule information. Cannot modify schedule fact data.
  admin: Can read public schedule information. Does not directly modify schedule facts through ordinary
    pages.
  agent: Can read schedules for specific sections; current-user schedule aggregation is primarily exposed
    via MCP; public schedule retrieval is available through REST and MCP.
requirements:
- id: schedule.teacher-participation
  category: behavior
  rule: A physical meeting is represented once even when several teachers participate.
  acceptance:
    given: One physical meeting has two distinct same-name teachers and independently stored participation
      facts.
    when: The database read model loads the meeting and filters by each teacher identity.
    then:
    - The section contains exactly one meeting and each teacher filter returns that same meeting once.
    - Both distinct teacher identities and their different facts survive the DTO projection.
    test:
      file: tests/integration/schedule-teacher-participations.test.ts
      name: schedule.teacher-participation
- id: schedule.schedule-as-context
  category: presentation
  rule: The section calendar presents meeting dates/times, teachers and available location context with
    links to the relevant public details.
  acceptance:
    given: A public Section has dated meetings with known teachers, room, building and campus.
    when: The browser displays the Section timetable and resolves its teacher links.
    then:
    - Meeting date/start/end and available room/building/campus context are visible.
    - Each teacher from the actual meeting appears with a working public identity link.
    - Desktop and mobile timetable screenshots preserve readable meeting context.
    test:
      file: tests/e2e/src/app/sections/[jwId]/calendar.test.ts
      name: schedule.schedule-as-context
- id: schedule.public-rest-locale-cache
  category: consistency
  rule: 'Public schedule REST output is determined by URL parameters: omitted locale uses zh-cn and locale=en-us
    selects English. Cookie and Accept-Language do not personalize the output.'
  acceptance:
    given: A course has distinct Chinese and English labels, and request cookies/Accept-Language conflict.
    when: The actual public schedule REST route handles omitted and explicit Chinese/English locale query
      values.
    then:
    - Omitted locale produces Chinese and explicit English produces the English course label.
    - Identical URLs retain identical public-cacheable output irrespective of cookies or Accept-Language.
    test:
      file: tests/integration/mcp/catalog/schedule-public-contract.test.ts
      name: schedule.public-rest-locale-cache
- id: schedule.teacher-participation-facts
  category: behavior
  rule: Each schedule teacher retains independent source periods and exerciseClass facts; unsupported
    participation facts remain null.
  acceptance:
    given: Three source teacher rows describe the same meeting with different fractional periods/flags
      and one unknown pair.
    when: The actual mapper and schedule importer write three input orders to PostgreSQL, followed by
      public REST reads.
    then:
    - The same meeting identity is retained across imports.
    - Each teacher retains its independent facts and unsupported values remain null in both storage and
      public output.
    test:
      file: tests/integration/mcp/catalog/schedule-public-contract.test.ts
      name: schedule.teacher-participation-facts
- id: schedule.teacher-participation-output
  category: behavior
  rule: Public schedule-list and Section-schedule REST/MCP reads expose each teacher identity and independent
    participation facts; teachers is the flat identity projection of the same relation.
  acceptance:
    given: One imported meeting has three same-name teachers with distinct public IDs/codes and different
      participation facts.
    when: Anonymous REST and registered MCP list and Section schedule calls retrieve the meeting.
    then:
    - All four outputs retain all three distinct public identities and exact independent facts.
    - Each flat teachers array equals the identity projection of teacherParticipations.
    test:
      file: tests/integration/mcp/catalog/schedule-public-contract.test.ts
      name: schedule.teacher-participation-output
- id: schedule.graphql-teacher-participation-output
  category: behavior
  rule: Authorized workspace GraphQL schedules expose teacher identities and independent participation
    facts through paginated teachers and teacherParticipations relations for the current user's subscribed
    sections.
  acceptance:
    given: Only one of two users subscribes to a meeting with three distinct same-name teachers and independent
      participation facts.
    when: The actual Yoga endpoint reads each user's workspace schedules and traverses two-item pages
      of both nested relations.
    then:
    - The subscriber sees one physical meeting; the unrelated user sees none.
    - Both nested relations report total three and return all exact public identities and facts across
      pages.
    test:
      file: tests/integration/mcp/catalog/schedule-public-contract.test.ts
      name: schedule.graphql-teacher-participation-output
capabilities:
  my-schedule:
    title: My Schedule
    auth: user
    links:
      models:
      - Schedule
    web:
      pages:
      - /workspace/calendar
    rest:
      routes:
      - path: /api/workspace/schedules
        notes:
        - Resolves the current user's subscribed sections server-side.
        - Supports dateFrom/dateTo, weekday, limit, and locale filters.
        - weekday accepts 1-7 and limit accepts 1-300 on both REST and MCP.
        - Use /api/catalog/schedules for public schedule queries without personal subscription scope.
    graphql:
      fields:
      - parent: Workspace
        name: schedules
        auth: user
        required_scopes:
        - workspace.schedule:read
        rest_equivalent: GET /api/workspace/schedules
        mcp_equivalent: workspace_schedule_list
        notes:
        - DateTime range inputs normalize to Asia/Shanghai calendar dates for the Schedule.date @db.Date
          column.
        - 'Each Schedule.teachers(page: PageInput) field returns TeacherPage! with the shared default
          page 1/pageSize 20 and maximum pageSize 100.'
    mcp:
      tools:
      - name: workspace_schedule_list
        rest_equivalent: GET /api/workspace/schedules
        notes:
        - Returns schedules[]; each item contains date, weekday, startTime, endTime, section.course.namePrimary,
          section.code, room, teachers[], and scheduleGroup.
        - weekday accepts 1-7 and limit accepts 1-300 on both REST and MCP.
        - Omitting semesterId reads all subscribed semesters; pass a semesterId to recover one current
          or past term.
    presentation:
      items:
      - 7-day grid (Sun-Sat)
      - Today highlight
      - schedule.date
      - schedule.startTime - endTime
      - schedule.room.namePrimary
      - section.course.namePrimary
      - teacher names
      filters:
      - Previous/next semester links
    requirement_refs:
    - calendar.event-card-types
  public-schedule-query:
    title: Public Schedule Query
    auth: anon
    links:
      models:
      - Schedule
    web: unavailable
    rest:
      routes:
      - path: /api/catalog/schedules
        notes:
        - Supports filtering by section, teacher, room, date range, and day of week.
        - REST/MCP both accept exact JW/code-style filters for schedules so callers do not need to resolve
          internal numeric IDs first.
        - REST page and pageSize accept 1-100. Out-of-range values are rejected instead of clamped.
        - REST localizes nested schedule labels from the request locale; MCP accepts an explicit locale
          input.
    mcp:
      tools:
      - name: catalog_schedule_list
        rest_equivalent: GET /api/catalog/schedules
        notes:
        - MCP limit accepts 1-100 and rejects out-of-range values instead of clamping.
    presentation:
      items: []
      filters:
      - sectionId
      - sectionJwId
      - sectionCode
      - teacherId
      - teacherCode
      - roomId
      - roomJwId
      - dateFrom/dateTo
      - weekday
    requirement_refs:
    - calendar.event-card-types
  section-schedule:
    title: Section Schedule
    auth: anon
    links:
      models:
      - Schedule
    web:
      pages:
      - /catalog/sections/[jwId]
    rest:
      routes:
      - path: /api/catalog/sections/[jwId]/schedules
        notes:
        - Returns a simplified variant of ScheduleEntry[] for the section.
        - Accepts optional dateFrom/dateTo and limit query parameters to narrow results to the same window
          supported by catalog_section_schedule_list.
        - REST localizes nested schedule labels from the request locale; MCP accepts an explicit locale
          input.
      - path: /api/catalog/sections/[jwId]/schedule-groups
        notes:
        - Returns schedule groups with schedules, not separate aggregated period summaries.
        - REST localizes nested schedule labels from the request locale; MCP accepts an explicit locale
          input.
    mcp:
      tools:
      - name: catalog_section_schedule_list
        rest_equivalent: GET /api/catalog/sections/[jwId]/schedules
        notes:
        - Default mode omit the repeated per-item section payload because the top-level section already
          scopes the list.
        - Accepts optional dateFrom/dateTo to narrow results to a specific window (e.g. the current week);
          both accept flexible date strings.
      - name: workspace_calendar_timeline_get
        auth: user
        notes:
        - Returns schedules as the schedule type within a unified event stream.
        - Accepts optional atTime to anchor the 7-day window to a specific moment instead of the server
          clock; useful for asking about a future week.
    presentation:
      items:
      - schedule.date
      - schedule.startTime - endTime
      - schedule.room (with building/campus)
      - schedule.weekday (1=Monday, 7=Sunday)
      - schedule.teachers[] names
    requirement_refs:
    - calendar.event-card-types
rationale:
- Schedule refers to a section's class times, locations, and week patterns.
- A section schedule read fetches section context and its filtered, ordered, optionally bounded schedules
  in one top-level Section query while preserving includeSection output semantics.
- GraphQL Schedule is currently a private workspace relation, while public schedule lists and Section
  schedules are exposed through REST/MCP; their transport obligations are separate.
