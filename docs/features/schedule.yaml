kind: feature
id: schedule
name: Schedule
areas:
- catalog
- workspace
policy_refs:
- interface-hierarchy
- ui
- permission-ui
- rendering-and-cache
- cases.missing-data
access:
  anon: Can read public schedule information.
  user: Can read public schedule information. Cannot modify schedule fact data.
  admin: Can read public schedule information. Does not directly modify schedule facts through ordinary
    pages.
  agent: Can read schedules for specific sections; current-user schedule aggregation is primarily exposed
    via MCP; public schedule retrieval is available through REST and MCP.
requirements:
- id: schedule.teacher-participation
  category: behavior
  rule: A physical meeting is represented once even when several teachers participate.
- id: schedule.schedule-as-context
  category: presentation
  rule: The section calendar presents meeting dates/times, teachers and available location context with
    links to the relevant public details.
- id: schedule.public-rest-locale-cache
  category: consistency
  rule: 'Public schedule REST output is determined by URL parameters: omitted locale uses zh-cn and locale=en-us
    selects English. Cookie and Accept-Language do not personalize the output.'
- id: schedule.teacher-participation-facts
  category: behavior
  rule: Each schedule teacher retains independent source periods and exerciseClass facts; unsupported
    participation facts remain null.
- id: schedule.teacher-participation-output
  category: behavior
  rule: Schedule list/detail REST, GraphQL and MCP expose public teacher identity and participation facts,
    with teachers as the flat identity projection of the same relation.
capabilities:
  my-schedule:
    title: My Schedule
    auth: user
    links:
      models:
      - Schedule
    web:
      pages:
      - /workspace/calendar
    rest:
      routes:
      - path: /api/workspace/schedules
        notes:
        - Resolves the current user's subscribed sections server-side.
        - Supports dateFrom/dateTo, weekday, limit, and locale filters.
        - weekday accepts 1-7 and limit accepts 1-300 on both REST and MCP.
        - Use /api/catalog/schedules for public schedule queries without personal subscription scope.
    graphql:
      fields:
      - parent: Workspace
        name: schedules
        auth: user
        required_scopes:
        - workspace.schedule:read
        rest_equivalent: GET /api/workspace/schedules
        mcp_equivalent: workspace_schedule_list
        notes:
        - DateTime range inputs normalize to Asia/Shanghai calendar dates for the Schedule.date @db.Date
          column.
        - 'Each Schedule.teachers(page: PageInput) field returns TeacherPage! with the shared default
          page 1/pageSize 20 and maximum pageSize 100.'
    mcp:
      tools:
      - name: workspace_schedule_list
        rest_equivalent: GET /api/workspace/schedules
        notes:
        - Returns schedules[]; each item contains date, weekday, startTime, endTime, section.course.namePrimary,
          section.code, room, teachers[], and scheduleGroup.
        - weekday accepts 1-7 and limit accepts 1-300 on both REST and MCP.
        - Omitting semesterId reads all subscribed semesters; pass a semesterId to recover one current
          or past term.
    presentation:
      items:
      - 7-day grid (Sun-Sat)
      - Today highlight
      - schedule.date
      - schedule.startTime - endTime
      - schedule.room.namePrimary
      - section.course.namePrimary
      - teacher names
      filters:
      - Previous/next semester links
    requirement_refs:
    - calendar.event-card-types
  public-schedule-query:
    title: Public Schedule Query
    auth: anon
    links:
      models:
      - Schedule
    web: unavailable
    rest:
      routes:
      - path: /api/catalog/schedules
        notes:
        - Supports filtering by section, teacher, room, date range, and day of week.
        - REST/MCP both accept exact JW/code-style filters for schedules so callers do not need to resolve
          internal numeric IDs first.
        - REST page and pageSize accept 1-100. Out-of-range values are rejected instead of clamped.
        - REST localizes nested schedule labels from the request locale; MCP accepts an explicit locale
          input.
    mcp:
      tools:
      - name: catalog_schedule_list
        rest_equivalent: GET /api/catalog/schedules
        notes:
        - MCP limit accepts 1-100 and rejects out-of-range values instead of clamping.
    presentation:
      items: []
      filters:
      - sectionId
      - sectionJwId
      - sectionCode
      - teacherId
      - teacherCode
      - roomId
      - roomJwId
      - dateFrom/dateTo
      - weekday
    requirement_refs:
    - calendar.event-card-types
  section-schedule:
    title: Section Schedule
    auth: anon
    links:
      models:
      - Schedule
    web:
      pages:
      - /catalog/sections/[jwId]
    rest:
      routes:
      - path: /api/catalog/sections/[jwId]/schedules
        notes:
        - Returns a simplified variant of ScheduleEntry[] for the section.
        - Accepts optional dateFrom/dateTo and limit query parameters to narrow results to the same window
          supported by catalog_section_schedule_list.
        - REST localizes nested schedule labels from the request locale; MCP accepts an explicit locale
          input.
      - path: /api/catalog/sections/[jwId]/schedule-groups
        notes:
        - Returns schedule groups with schedules, not separate aggregated period summaries.
        - REST localizes nested schedule labels from the request locale; MCP accepts an explicit locale
          input.
    mcp:
      tools:
      - name: catalog_section_schedule_list
        rest_equivalent: GET /api/catalog/sections/[jwId]/schedules
        notes:
        - Default mode omit the repeated per-item section payload because the top-level section already
          scopes the list.
        - Accepts optional dateFrom/dateTo to narrow results to a specific window (e.g. the current week);
          both accept flexible date strings.
      - name: workspace_calendar_timeline_get
        auth: user
        notes:
        - Returns schedules as the schedule type within a unified event stream.
        - Accepts optional atTime to anchor the 7-day window to a specific moment instead of the server
          clock; useful for asking about a future week.
    presentation:
      items:
      - schedule.date
      - schedule.startTime - endTime
      - schedule.room (with building/campus)
      - schedule.weekday (1=Monday, 7=Sunday)
      - schedule.teachers[] names
    requirement_refs:
    - calendar.event-card-types
rationale:
- Schedule refers to a section's class times, locations, and week patterns.
- A section schedule read fetches section context and its filtered, ordered, optionally bounded schedules
  in one top-level Section query while preserving includeSection output semantics.
