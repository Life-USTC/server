kind: feature
id: exam
name: Exam
areas:
- catalog
- workspace
policy_refs:
- interface-hierarchy
- ui
- permission-ui
- rendering-and-cache
- cases.missing-data
access:
  anon: Can read exam information.
  user: Can read exam information. Cannot modify exam fact data.
  admin: Maintains exam data through admin or import flows, not direct edits on ordinary pages.
  agent: After authorization, can read exams relevant to the current user through REST, GraphQL, and MCP.
requirements:
- id: exam.source-audience-and-monitors
  category: consistency
  rule: Exam grades, source administrative-class names, and monitor school IDs/localized names are preserved
    by import and exposed with exam records. Monitor school IDs are required, while missing names remain
    null. Monitor identities are not inferred from teacher names; no contact information is included.
  rationale: 'Confirmed publication decision: source grades and administrative-class names explain the
    exam audience; monitor school IDs distinguish same-named monitors and retain identity when a localized
    name is absent. Published monitor records contain only jwId, nameCn and nameEn. These facts do not
    establish account links and never include contact details or personal participation state.'
  acceptance:
    given: Source exam metadata contains grades, a class name and three monitors including equal names,
      absent names and private extra properties.
    when: The actual mapper and importer persist the exam and public section DTOs read both locales.
    then:
    - Monitor IDs distinguish same-name rows; absent names remain null and missing IDs reject mapping.
    - Only jwId/nameCn/nameEn monitor properties are published; no teacher/account identities are synthesized.
    - Source metadata remains exact and fields removed in a later import clear previous values.
    test:
      file: tests/integration/static-source-metadata.test.ts
      name: exam.source-audience-and-monitors
- id: exam.attached-to-section
  category: behavior
  rule: Every exam belongs to a section; personal exam views include the section and semester context
    needed to distinguish the offering.
  acceptance:
    given: Two owner subscriptions share a course across distinct section codes and semesters.
    when: The signed desktop and mobile exam lists display all exams and follow each offering link.
    then:
    - Both exam rows identify the course and section code and open the exact section detail.
    test:
      file: tests/e2e/src/app/workspace/exams/presentation-contract.test.ts
      name: exam.attached-to-section
- id: exam.read-only
  category: authorization
  rule: Exams are read-only; no ordinary user edit entry point is provided.
  acceptance:
    given: An ordinary isolated user subscribes to two sections with exams.
    when: The user browses signed desktop/mobile exam lists and the public section exam details.
    then:
    - Exam facts render without add, edit, delete, completion or text-edit controls; persisted exams remain unchanged.
    test:
      file: tests/e2e/src/app/workspace/exams/presentation-contract.test.ts
      name: exam.read-only
- id: exam.semester-required
  category: presentation
  rule: Semesters must be explicitly displayed when browsing exams across semesters.
  acceptance:
    given: The same course has owned exam offerings in current and historical semesters.
    when: The user reads all exams on desktop and mobile.
    then:
    - Every offering row explicitly displays its own semester alongside its section context.
    test:
      file: tests/e2e/src/app/workspace/exams/presentation-contract.test.ts
      name: exam.semester-required
- id: exam.completion-time-zone
  category: consistency
  rule: Exam completion uses the Asia/Shanghai calendar date and local HHMM times. When no exam time is
    available, the completion instant is the end of its exam date (23:59:59.999 Shanghai time); the exact
    end instant counts as completed.
  acceptance:
    given: Exams have an explicit end time or no times, under UTC, Shanghai and Los Angeles host timezones.
    when: The actual date helpers and row presentation model classify at the exact end and one millisecond
      before it.
    then:
    - HHMM uses Shanghai time; an untimed exam ends at 23:59:59.999 Shanghai.
    - The exact end is completed and the immediately preceding instant remains incomplete.
    test:
      file: tests/unit/features/workspace/exam-date-display.test.ts
      name: exam.completion-time-zone
- id: exam.mobile-toolbar-priority
  category: presentation
  rule: Mobile exam completion-status filters remain directly accessible.
  acceptance:
    given: The owner has one upcoming and one ended exam.
    when: The mobile user directly selects Upcoming, Ended and All.
    then:
    - Every filter remains visible and selects exactly the corresponding exams.
    test:
      file: tests/e2e/src/app/workspace/exams/presentation-contract.test.ts
      name: exam.mobile-toolbar-priority
- id: exam.owned-page-completeness
  category: consistency
  rule: The authenticated REST exam handler returns complete, stable paginated owner-subscription results
    across all semesters by default, including past and unknown-date exams with semester context and the
    same total on every page. Responses are private, no-store.
  acceptance:
    given: Two authenticated users subscribe to distinct active Sections; the first owns four exams across
      semesters, including past and unknown dates.
    when: Actual signed REST requests read successive two-row pages without a date or semester filter.
    then:
    - Pages retain total=4, stable ordering and all four owner exams, including unknown dates and semester
      context.
    - The second user sees only their own exam, and an exhausted page is empty.
    - Every response is private, no-store.
    test:
      file: tests/integration/workspace-exam-list.test.ts
      name: exam.owned-page-completeness
- id: exam.rest-read-scope
  category: authorization
  rule: A valid active REST bearer grant lacking workspace.exam:read cannot read subscribed exams.
  acceptance:
    given: An active OAuth grant has a correctly signed REST token containing only workspace.overview:read.
    when: The client requests the subscribed exam REST list with that token.
    then:
    - The request is rejected without returning exam data.
    test:
      file: tests/integration/workspace-exam-list.test.ts
      name: exam.rest-read-scope
- id: exam.retired-exam-exclusion
  category: consistency
  rule: Workspace exam lists and totals exclude retired sections without deleting their existing subscription
    relationships.
  acceptance:
    given: The owner still subscribes to a retired section with an exam.
    when: The owner requests the complete workspace exam list.
    then:
    - The retired exam is excluded from the list and total.
    - The subscription relationship is preserved.
    test:
      file: tests/integration/workspace-exam-list.test.ts
      name: exam.retired-exam-exclusion
- id: exam.mobile-display-overflow
  category: presentation
  rule: Mobile exam card/list display selection is available in a keyboard-accessible overflow menu.
  acceptance:
    given: The signed mobile exam list contains both upcoming and ended exams.
    when: The user opens the overflow menu and changes Card/List using only the keyboard.
    then:
    - Each selection changes the rendered display and returns focus to the trigger without horizontal document overflow.
    test:
      file: tests/e2e/src/app/workspace/exams/presentation-contract.test.ts
      name: exam.mobile-display-overflow
- id: exam.mobile-toolbar-targets
  category: presentation
  rule: Mobile exam toolbar controls provide touch targets at least 44 by 44 CSS pixels.
  acceptance:
    given: The exam workspace renders at 320 and 390 CSS pixels wide.
    when: The signed user inspects every direct filter and the display overflow control.
    then:
    - Every visible toolbar control is at least 44 by 44 CSS pixels.
    test:
      file: tests/e2e/src/app/workspace/exams/presentation-contract.test.ts
      name: exam.mobile-toolbar-targets
- id: exam.rest-date-semester-filters
  category: validation
  rule: The REST exam handler filters inclusive Shanghai calendar-day bounds and semester before pagination/counting.
    Unknown-date exams remain included by default and can be excluded explicitly; invalid dates, reversed
    bounds, invalid booleans or pageSize above 100 return 400.
  acceptance:
    given: Owned exams include dated and unknown-date records across two semesters.
    when: Signed REST requests apply datetime/date-only bounds, unknown-date options, semester filters
      and invalid query values.
    then:
    - Bounds normalize to inclusive Shanghai days; unknown dates follow the explicit/default option.
    - Filtering precedes total and stable page slicing.
    - Invalid date/range/boolean/page-size input returns 400.
    test:
      file: tests/integration/workspace-exam-list.test.ts
      name: exam.rest-date-semester-filters
- id: exam.graphql-page-completeness
  category: consistency
  rule: Workspace.exams GraphQL pages cover all subscribed active Sections across semesters by default,
    including past and unknown-date exams. Every page retains the complete total and each result exposes
    Section semester context; retired and unowned exams are excluded.
  acceptance:
    given: An OAuth principal subscribes to active Sections in two semesters and a retired Section, while an unowned Section also has exams.
    when: Actual signed GraphQL requests exhaust one-item pages and read an extra empty page.
    then:
    - The four active owned exams appear exactly once, including past and unknown dates and their semester context.
    - Every page retains total=4; retired and unowned exams are excluded.
    test:
      file: tests/integration/graphql-exam-page-completeness.test.ts
      name: exam.graphql-page-completeness
capabilities:
  cross-section-exam-list:
    title: Cross-Section Exam List
    auth: user
    links:
      models:
      - Exam
    web:
      pages:
      - /workspace/exams
    rest:
      routes:
      - path: /api/workspace/exams
        method: GET
        auth: user
        notes:
        - Requires workspace.exam:read. Ownership is derived from the authenticated principal's subscriptions.
        - Accepts dateFrom, dateTo, includeDateUnknown (default true), semesterId, page (default 1), pageSize
          (default 20, maximum 100), and locale.
        - Date-only and datetime bounds normalize to inclusive Asia/Shanghai calendar dates. Invalid or
          reversed bounds return 400. Results use stable examDate/startTime/jwId order.
    graphql:
      fields:
      - parent: Workspace
        name: exams
        auth: user
        required_scopes:
        - workspace.exam:read
        rest_equivalent: GET /api/workspace/exams
        mcp_equivalent: workspace_exam_list
        notes:
        - DateTime range inputs normalize to Asia/Shanghai calendar dates; unknown-date exams remain included
          by default.
        - 'Each Exam.examRooms(page: PageInput) field returns ExamRoomPage! with the shared default page
          1/pageSize 20 and maximum pageSize 100.'
    mcp:
      tools:
      - name: workspace_exam_list
        notes:
        - Returns exams[]; each item contains section.course.namePrimary, section.code, section.semester?.nameCn,
          examDate, startTime, endTime, examBatch, and examRooms[].
        - Omitting semesterId reads all subscribed semesters; pass a semesterId to recover one current
          or past term.
    presentation:
      kind: fields
      views:
        web:
          primary:
          - section.course.namePrimary
          - exam.examDate
          - exam.startTime
          - exam.endTime
          - exam.completed
          secondary:
          - section.semester.nameCn
          - exam.examMode
          - exam.examBatch.namePrimary
          - exam.examType
          - exam.examTakeCount
          - exam.examRooms.namePrimary
          tertiary:
          - exam.id
          - exam.examBatch.id
        mcp-workspace-exam-list:
          primary:
          - exams.examDate
          - exams.startTime
          - exams.endTime
          - exams.section.course.nameCn
          secondary:
          - exams.examMode
          - exams.examRooms
          - exams.section.semester.nameCn
          - exams.id
          tertiary: []
      items:
      - 'completion filter: incomplete/completed/all'
      - mobile compact toolbar with direct completion filters and overflow display-mode control
      - Filter-empty explanation and clear-filter action
  section-exam-info:
    title: Section Exam Info
    auth: anon
    links:
      models:
      - Exam
    web:
      pages:
      - /catalog/sections/[jwId]
    rest: unavailable
    mcp:
      tools:
      - name: catalog_section_exam_list
        notes:
        - Returns a single section's exams[].
    presentation:
      kind: fields
      views:
        web:
          primary:
          - exam.examDate
          - exam.startTime
          - exam.endTime
          secondary:
          - exam.examMode
          - exam.examBatch.namePrimary
          - exam.examRooms.namePrimary
          tertiary:
          - exam.id
          - exam.examBatch.id
        mcp-catalog-section-exam-list:
          primary:
          - exams.examDate
          - exams.startTime
          - exams.endTime
          secondary:
          - exams.examMode
          - exams.examBatch.namePrimary
          - exams.examRooms
          - exams.id
          tertiary: []
rationale:
- A public section exam read fetches section context and its ordered exam children in one top-level Section
  query.
- CLI owns its client requirements and literal command acceptance tests in docs/specifications/contracts.json
  in the CLI repository; server tests do not prove client command behavior.
