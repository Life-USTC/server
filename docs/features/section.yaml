kind: feature
id: section
name: Section
areas:
- catalog
- workspace
access:
  anon: Can browse public section information.
  user: Can perform subscription, homework, comment, and description collaborative actions around sections,
    but cannot modify section fact data.
  admin: Does not directly modify academic section facts through ordinary pages.
  agent: Can read section information and manage personal section-related state through OAuth-authorized
    REST / MCP endpoints.
requirements:
- id: section.public-web-personal-overlay
  category: consistency
  rule: Section detail HTML and page-data payloads contain public facts and description content only.
    After hydration a session-only private no-store Web projection resolves subscription status, homework
    completion and viewer permissions. The homeworkId and subscribe=1 deep links wait for that projection;
    unresolved or failed personal state cannot expose writable subscription controls. This Web assembly
    route adds no REST, GraphQL or MCP capability.
- id: section.source-planning-metadata
  category: consistency
  rule: Required teaching weeks and catalog admin-class localized names are preserved. Catalog names without
    IDs remain catalogAdminClasses metadata, separate from authoritative AdminClass relations; no identities
    are invented or matched by name.
- id: section.semester-offering
  category: behavior
  rule: A section is a specific teaching class for a course in a given semester.
- id: section.source-lifecycle
  category: consistency
  rule: Before any database write, static sync rejects incomplete snapshots and generated_at values more
    than 15 minutes in the future. It also rejects snapshots older than the last completed import and
    two different files claiming the same generated_at. Once validation passes, Sections absent from the
    current snapshot are marked inactive automatically and Sections that reappear are made active again.
    The import and its generated_at/SHA-256 are committed together.
- id: section.retirement-preserves-data
  category: consistency
  rule: Marking a Section inactive never deletes the Section or its comments, description, homeworks,
    subscriptions, schedules, exams, or audit history. Each change writes a Section-targeted audit row,
    and the import report includes missing, before/after, deactivated, and reactivated counts. Semesters
    with no source lessons are excluded from this step.
- id: section.retired-read-semantics
  category: consistency
  rule: Public Section/search/match and public/current calendar collection queries exclude retired rows.
    Direct Section detail and single-Section calendar access remain available for historical references;
    the detail page labels the record historical and does not offer a new subscription. Course/Teacher
    detail histories and the owner's subscribed Sections list also retain retired rows. New subscription
    discovery/add operations reject retired rows, while an existing owner can still remove one.
- id: section.subscription-not-enrollment
  category: behavior
  rule: Pages involving subscription actions must clearly state this is not official academic course enrollment.
- id: section.jwid-url-only
  category: behavior
  rule: jwId is used only for routing and API endpoints; it should not be directly displayed in ordinary
    section UI.
- id: section.student-identity-teachers
  category: presentation
  rule: Student-facing section identity is the course display name plus teachers. Section code is secondary
    (monospace in lists, search descriptions, and the Basic Info Card) and must not dominate search titles
    or the detail hero.
- id: section.public-list-cache
  category: consistency
  rule: 'Public Section REST responses are deterministic by URL: omitted locale uses canonical zh-cn and
    locale=en-us selects English. They do not derive output from Cookie or Accept-Language and may use
    shared CDN caching. REST, GraphQL, and MCP lists share revision-scoped locale/filter/pagination/shape
    runtime caching. Localized HTML pages use their locale-partitioned SSR cache.'
- id: section.mobile-detail-actions
  category: presentation
  rule: Section detail pages present concise metadata and teachers with a responsive course title, use
    the Detail Two-Column Stream (no context-tab rail), and keep the primary calendar and subscription
    actions available in a bottom sticky action bar that stays above the signed-in shell navigation.
- id: section.detail-canonical-url
  category: behavior
  rule: The canonical section detail URL is `/catalog/sections/[jwId]`. Legacy path segments and `?tab=`
    deep links permanently redirect to the root; optional hash anchors scroll within the page.
- id: section.public-teacher-reference
  category: privacy
  rule: Teachers embedded in Section list/detail payloads contain only public identity and localized names,
    with department/title added only where the detail UI requests that context. TeacherAssignment links
    by teacherId and does not duplicate the nested Teacher object. Contact and private source columns
    are available only on the teacher's own public detail where explicitly permitted.
- id: section.public-detail-cache
  category: consistency
  rule: Anonymous REST, MCP, and single-entity GraphQL Section reads share revision-, locale-, ID-, and
    include-shape-scoped runtime caching. Missing entities are not cached.
- id: section.relational-course-filter
  category: validation
  rule: Section courseJwId filtering is applied through the Course relation in the same paginated query.
    When courseId and courseJwId are both present they are ANDed, so mismatches return no rows without
    a separate Course lookup.
- id: section.bounded-related-sections
  category: validation
  rule: The Section detail page returns the 20 newest active offerings of the same Course and the complete
    active related-Section count. The current Section is excluded.
capabilities:
  section-list:
    title: Section List & Filter
    auth: anon
    links:
      models:
      - Section
      ui:
      - List Table
    web:
      pages:
      - /catalog/sections
    rest:
      routes:
      - path: /api/catalog/sections
        notes:
        - REST page accepts 1-100, pageSize accepts 1-100, and search accepts 2-200 characters; the deprecated
          limit alias remains accepted and pageSize wins when both are supplied. Out-of-range values are
          rejected instead of clamped.
        - Retired Sections are excluded.
    graphql:
      queries:
      - name: sections
        parent: Catalog
        rest_equivalent: GET /api/catalog/sections
        mcp_equivalent: catalog_section_search
        notes:
        - PageInput defaults to page=1 and pageSize=20; page and pageSize must remain within 1-100, and
          search within 2-200 characters.
        - Retired Sections are excluded.
    mcp:
      tools:
      - name: catalog_section_search
        rest_equivalent: GET /api/catalog/sections
        notes:
        - MCP limit accepts 1-100 and rejects out-of-range values instead of clamping.
        - Retired Sections are excluded.
    presentation:
      items:
      - section.course.namePrimary
      - section.teachers[].namePrimary
      - section.semester.nameCn
      - section.campus.namePrimary
      - section.code (secondary monospace)
      - section.credits
      - section.stdCount / section.limitCount (capacity)
      filters:
      - Semester selector
      - Generic search
      - 'REST/MCP: campusId, departmentId, teacherId, teacherCode, ids, jwIds, courseId, courseJwId, semesterId,
        semesterJwId, advanced search syntax'
  section-detail:
    title: Section Detail
    auth: anon
    links:
      models:
      - Section
      ui:
      - Detail Hero
      - Detail Two-Column Stream
      - Basic Info Card
    web:
      pages:
      - /catalog/sections/[jwId]
    rest:
      routes:
      - path: /api/catalog/sections/[jwId]
        notes:
        - Direct historical lookup remains available for inactive Sections; retiredAt records when the
          Section was marked inactive.
        - Optional includeExams, includeSchedules, and includeTeacherDepartments query flags return narrow
          stream-block payloads without loading unrelated child collections.
    graphql:
      queries:
      - name: section
        parent: Catalog
        rest_equivalent: GET /api/catalog/sections/[jwId]
        mcp_equivalent: catalog_section_get
    mcp:
      tools:
      - name: catalog_section_get
        rest_equivalent: GET /api/catalog/sections/[jwId]
    presentation:
      items:
      - section.course.namePrimary (h1)
      - section.course.nameSecondary (Locale subtitle)
      - section.teachers[] (hero + side linked list)
      - section.semester.nameCn
      - section.campus.namePrimary + nameSecondary
      - section.code (Monospace secondary in side column)
      - section.graduateAndPostgraduate (yes/no)
      - section.credits
      - section.period + actualPeriods (if different)
      - section.examMode.namePrimary
      - section.remark (Whitespace-preserved)
      - section.adminClasses[] (Collapsible details)
      - section.timesPerWeek
      - section.periodsPerWeek
      - section.theoryPeriods
      - section.practicePeriods
      - section.experimentPeriods
      - section.machinePeriods
      - section.designPeriods
      - section.testPeriods
      - section.teachLanguage.namePrimary
      - section.roomType.namePrimary
      - description.content (main stream)
      - scheduleDateKeys / schedule.* (main stream calendar)
      - examDateKeys / exam.* (main stream exams)
      - homework.title, submissionDueAt, description, completionStatus
      - comment.* (client-fetched main stream only)
  section-ical:
    title: Section iCal Export
    auth: anon
    links:
      ui:
      - Calendar Export Dialog
    web: stable
    rest:
      routes:
      - path: /api/catalog/sections/[jwId]/calendar.ics
        reference_only: true
    mcp:
      tools:
      - name: catalog_section_calendar_feed_get
        rest_equivalent: GET /api/catalog/sections/[jwId]/calendar.ics
        notes:
        - Returns a single-section iCal link and usage instructions.
    presentation:
      items:
      - iCalendar URL (copyable)
      - Export format indicator
