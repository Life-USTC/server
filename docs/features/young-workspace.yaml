        rest_equivalent: POST /api/workspace/young-notifications/[id]/read
    requirement_refs:
    - young-event.snapshot-authoritative
rationale:
- Organizer-only digest behavior and exclusion from individual event subscriptions are canonically owned
  by young-workspace.digest; the removed organizer-digest-only rule was a strict duplicate.
