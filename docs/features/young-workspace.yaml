      - /workspace/calendar
    rest:
      routes:
      - method: POST
        path: /api/workspace/young-notifications/[id]/read
    graphql:
      mutations:
      - name: youngNotificationRead
        parent: Mutation
        required_scopes:
        - workspace.young-notification:write
        mcp_equivalent: workspace_young_notification_read
    mcp:
      tools:
