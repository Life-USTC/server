kind: feature
id: young-workspace
name: Young Workspace
areas:
- workspace
policy_refs:
- interface-hierarchy
- ui
- permission-ui
- rendering-and-cache
access:
  anon: Public catalog and permitted comments only.
  user: Own activity and organizer subscriptions, notifications and personal calendar.
  admin: Same personal capabilities as users.
  agent: Same capabilities through feature-scoped OAuth.
requirements:
- id: young-workspace.subscription
  category: behavior
  rule: Subscribing to an activity does not register attendance with the official activity system.
- id: young-workspace.ownership
  category: authorization
  rule: User identity for activity subscriptions and notifications comes only from the authenticated principal;
    only the owner may read or mutate personal state.
- id: young-workspace.reminders
  category: behavior
  rule: Signup-opening reminders apply only when registration opens after subscription.
  acceptance:
    given: The viewer subscribes after registration has opened.
    when: Signup-opening reminder candidates are evaluated.
    then:
    - No retroactive signup-opening reminder is generated.
    test:
      file: tests/unit/features/young/young-reminders.test.ts
      name: young-workspace.reminders
- id: young-workspace.digest
  category: behavior
  rule: Previous Shanghai day newly discovered future events, after follow time, grouped per organizer;
    no retroactive flood and no automatic event subscriptions.
- id: young-workspace.calendar
  category: behavior
  rule: Inclusive Shanghai date-only bounds; explicit-offset instants and Shanghai timezone-less datetime
    bounds, maximum 366 days, paired bounds or default seven-day window. REST/GraphQL paginated; MCP complete
    unified event list. GraphQL boundary strings share service validation. Unknown event start times are
    not invented.
- id: young-workspace.event-calendar-membership
  category: behavior
  rule: Individual event subscriptions add known activity instants to personal calendars and ICS.
- id: young-workspace.organizer-digest-only
  category: behavior
  rule: Organizer follows create new-event digests without automatically subscribing to their events.
- id: young-workspace.private-response-cache
  category: authorization
  rule: Personal activity subscription and notification reads use private, no-store.
- id: young-workspace.reminder-deadline-window
  category: behavior
  rule: Deadline reminders become eligible 24 hours before the deadline.
  acceptance:
    given: A subscribed event has a known future signup deadline and deadline reminders enabled.
    when: Reminder candidates are evaluated immediately before and at the 24-hour threshold.
    then:
    - The deadline reminder is absent before the threshold and eligible at the threshold.
    - At the deadline the expired candidate is absent.
    test:
      file: tests/unit/features/young/young-reminders.test.ts
      name: young-workspace.reminder-deadline-window
- id: young-workspace.reminder-start-window
  category: behavior
  rule: Event-start reminders become eligible one hour before the event starts.
- id: young-workspace.reminder-settings
  category: behavior
  rule: Signup-opening, deadline and event-start reminders are independently configurable.
- id: young-workspace.reminder-generation
  category: behavior
  rule: Reminder generation runs every ten minutes and refreshes on notification listing.
- id: young-workspace.reminder-expiry
  category: behavior
  rule: Expired reminders are excluded from notification results.
- id: young-workspace.reminder-source-change
  category: behavior
  rule: Material activity changes refresh the personal calendar export and remove superseded reminders.
capabilities:
  workspace-young-event-subscription-list:
    title: youngEventSubscriptions
    auth: user
    web:
      pages:
      - /workspace/subscriptions/activities
      - /workspace/calendar
    rest:
      routes:
      - method: GET
        path: /api/workspace/young-event-subscriptions
    graphql:
      queries:
      - name: youngEventSubscriptions
        parent: Workspace
        required_scopes:
        - workspace.young-subscription:read
        mcp_equivalent: workspace_young_event_subscription_list
    mcp:
      tools:
      - name: workspace_young_event_subscription_list
        rest_equivalent: GET /api/workspace/young-event-subscriptions
    requirement_refs:
    - young-event.snapshot-authoritative
