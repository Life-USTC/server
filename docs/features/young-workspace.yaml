kind: feature
id: young-workspace
name: Young Workspace
areas:
- workspace
policy_refs:
- interface-hierarchy
- ui
- permission-ui
- rendering-and-cache
access:
  anon: Public catalog and permitted comments only.
  user: Own activity and organizer subscriptions, notifications and personal calendar.
  admin: Same personal capabilities as users.
  agent: Same capabilities through feature-scoped OAuth.
requirements:
- id: young-workspace.subscription
  category: behavior
  rule: Subscribing to an activity does not register attendance with the official activity system.
  acceptance:
    given: A real event source row exists and all outgoing HTTP is denied.
    when: The actual subscription service subscribes and unsubscribes the owner.
    then:
    - Only the owner subscription row is created/deleted.
    - The full official source record remains unchanged and no outgoing registration request occurs.
    test:
      file: tests/integration/young-workspace.test.ts
      name: young-workspace.subscription
- id: young-workspace.ownership
  category: authorization
  rule: User identity for activity subscriptions, organizer follows and notifications comes only from
    the authenticated principal; only the owner may read or mutate personal state.
  acceptance:
    given: Two authenticated owners have different activity subscriptions, organizer follows and unread
      notifications.
    when: Both owners use signed REST and GraphQL requests and registered MCP tools to list state and
      target the other owner’s resources; an anonymous client also requests personal state.
    then:
    - Every list contains only the authenticated owner’s rows, even with a foreign userId query parameter.
    - A foreign userId in a REST mutation body is rejected; unsubscribing a foreign-only activity or organizer
      never removes the other owner’s subscription.
    - Reading the other owner’s notification fails without changing its read state.
    - Anonymous REST and MCP reads are rejected; GraphQL returns no workspace. Anonymous REST subscription writes are rejected.
    test:
      file: tests/integration/mcp/workspace/young-transport-contract.test.ts
      name: young-workspace.ownership
- id: young-workspace.list-transport-pagination
  category: consistency
  rule: REST, GraphQL and MCP return equivalent ordered pages of the authenticated owner's activity subscriptions,
    organizer follows and unexpired notifications. Subscriptions/follows sort by creation descending then
    source ID ascending; notifications sort by creation descending then ID descending. The unread filter
    selects unread notices; omitted or false includes both read states.
  acceptance:
    given: Isolated owners have subscriptions, organizer follows and notifications with tied nonzero-millisecond creation times,
      read/unread states and an expired notice; insertion order differs from display order.
    when: Signed REST and GraphQL requests and registered native MCP tools read two-item pages through exhaustion,
      with omitted, false and true notification unread filters.
    then:
    - All transports return the same exact IDs, positions, operational fields and stable page totals.
    - Every matching row appears once; expired and foreign-owner notices never appear, and exhausted pages are empty.
    - Timestamp ties follow the documented ID direction and unread filtering preserves that order.
    - Differently formatted transport timestamps preserve the exact millisecond instant.
    test:
      file: tests/integration/mcp/workspace/young-list-contract.test.ts
      name: young-workspace.list-transport-pagination
- id: young-workspace.reminders
  category: behavior
  rule: Signup-opening reminders apply only when registration opens after subscription.
  acceptance:
    given: The viewer subscribes after registration has opened.
    when: Signup-opening reminder candidates are evaluated.
    then:
    - No retroactive signup-opening reminder is generated.
    test:
      file: tests/unit/features/young/young-reminders.test.ts
      name: young-workspace.reminders
- id: young-workspace.digest
  category: behavior
  rule: Organizer digests include available-source events first discovered in the previous Shanghai calendar
    day [00:00, next 00:00), strictly after the follow, whose startAt is at or after refresh time. Digests
    group by organizer, deduplicate by owner/organizer/day, and never create event subscriptions.
  acceptance:
    given: The owner follows multiple organizers; events were discovered before/at/after the follow, at
      previous-day midnight, during the previous day and today, with future, started and missing-source
      variants.
    when: The real notification refresh runs twice against the restricted application database connection.
    then:
    - One deduplicated digest per organizer contains only future available-source events first discovered
      in the previous Shanghai day and strictly after the follow.
    - The previous-day midnight is included for older follows; today, pre-follow, already-started and
      missing-source events are excluded.
    - No event subscriptions are created.
    test:
      file: tests/integration/young-organizer-digest-contract.test.ts
      name: young-workspace.digest
- id: young-workspace.calendar
  category: behavior
  rule: The shared personal-calendar range parser accepts paired valid ordered bounds spanning at most
    366 days. Date-only bounds include full Shanghai days; explicit-offset datetimes preserve instants
    and timezone-less datetimes use Shanghai. Omitted bounds select seven days from the current Shanghai
    day start; explicit datetime endpoints are inclusive.
  acceptance:
    given: Calendar bounds are omitted, date-only, explicit-offset, timezone-less, malformed, unpaired
      or span the size boundary.
    when: The shared personal calendar parser resolves its exact event window.
    then:
    - Date-only bounds include complete Shanghai days; timezone-less datetimes are Shanghai instants and
      explicit offsets are preserved.
    - Both bounds must be supplied together, must be valid and ordered, and may span no more than 366
      days.
    - Omitted bounds select a seven-day half-open window from Shanghai day start.
    test:
      file: tests/unit/features/young/personal-calendar-range.test.ts
      name: young-workspace.calendar
- id: young-workspace.event-calendar-membership
  category: behavior
  rule: Individual event subscriptions add known activity instants to personal calendars and ICS.
  acceptance:
    given: An owner follows an organizer but has no event subscription.
    when: The owner individually subscribes, the event changes, loses its timestamps, and is unsubscribed.
    then:
    - Organizer follow alone creates no ICS event.
    - An individual subscription adds its known start/end to the actual personal calendar and ICS with
      stable UID across source changes.
    - Unknown timestamps never fabricate an event; unsubscribe removes the event.
    test:
      file: tests/integration/young-workspace.test.ts
      name: young-workspace.event-calendar-membership
- id: young-workspace.private-response-cache
  category: authorization
  rule: Personal activity subscription, organizer follow and notification REST reads use private, no-store.
    GraphQL and MCP follow their shared transport cache policies.
  acceptance:
    given: Two authenticated owners have nonempty activity subscriptions, organizer follows and notification
      lists.
    when: Each owner reads actual REST lists and individual activity/organizer subscription state.
    then:
    - 'Every successful REST response uses Cache-Control: private, no-store.'
    - Lists retain actual personal data and individual subscribed state remains correct.
    test:
      file: tests/integration/mcp/workspace/young-transport-contract.test.ts
      name: young-workspace.private-response-cache
- id: young-workspace.reminder-deadline-window
  category: behavior
  rule: Deadline reminders become eligible 24 hours before the deadline.
  acceptance:
    given: A subscribed event has a known future signup deadline and deadline reminders enabled.
    when: Reminder candidates are evaluated immediately before and at the 24-hour threshold.
    then:
    - The deadline reminder is absent before the threshold and eligible at the threshold.
    - At the deadline the expired candidate is absent.
    test:
      file: tests/unit/features/young/young-reminders.test.ts
      name: young-workspace.reminder-deadline-window
- id: young-workspace.reminder-start-window
  category: behavior
  rule: Event-start reminders become eligible one hour before the event starts.
  acceptance:
    given: An event has a known start and start reminders are enabled.
    when: The actual reminder policy evaluates just before one hour, exactly one hour, just before start
      and at start.
    then:
    - Eligibility begins exactly one hour before the event and expires at its start.
    test:
      file: tests/unit/features/young/young-reminders.test.ts
      name: young-workspace.reminder-start-window
- id: young-workspace.reminder-settings
  category: behavior
  rule: Signup-opening, deadline and event-start reminders are independently configurable.
  acceptance:
    given: An event currently qualifies for signup opening, deadline and start reminders.
    when: The actual service enables each reminder alone, lists notifications, then disables it.
    then:
    - Each setting is stored independently and produces only its own reminder kind.
    - Disabling that setting removes its unread reminder.
    test:
      file: tests/integration/young-workspace.test.ts
      name: young-workspace.reminder-settings
- id: young-workspace.reminder-generation
  category: behavior
  rule: Reminder generation runs every ten minutes and refreshes on notification listing.
  acceptance:
    given: Two real users subscribe to an upcoming event and have no notifications.
    when: The actual Worker scheduled entrypoint receives the configured ten-minute cron twice using distinct
      application/maintenance database bindings; a later notification listing runs after one owner's generated
      row is removed.
    then:
    - The scheduled path discovers recipients through the maintenance role and creates each owner's reminder
      through the runtime role.
    - Repeated scheduled delivery preserves reminder IDs.
    - Notification listing also recreates an eligible missing reminder without requiring a cron run.
    test:
      file: tests/integration/young-notification-cron-contract.test.ts
      name: young-workspace.reminder-generation
- id: young-workspace.reminder-expiry
  category: behavior
  rule: Expired reminders are excluded from notification results.
  acceptance:
    given: Stored owner reminders expire immediately before, exactly at, immediately after the reference
      time, or never.
    when: The actual list and unread-count services read notifications.
    then:
    - Before/exact-boundary reminders are excluded from results and totals.
    - Future/permanent reminders remain visible and historical rows remain stored.
    test:
      file: tests/integration/young-workspace.test.ts
      name: young-workspace.reminder-expiry
- id: young-workspace.reminder-source-change
  category: behavior
  rule: Material activity changes refresh the personal calendar export and remove superseded reminders.
  acceptance:
    given: An individually subscribed event already has reminders and a real personal calendar.
    when: Its venue and then its start/end change, and actual notification listing refreshes source state.
    then:
    - Venue-only changes keep applicable reminder identities; rescheduling removes the superseded start
      reminder.
    - Each material change requests one owner calendar rebuild whose independent read contains committed
      updated venue/time.
    test:
      file: tests/integration/young-workspace.test.ts
      name: young-workspace.reminder-source-change
- id: young-workspace.calendar-transport-pagination
  category: behavior
  rule: Personal calendar REST and GraphQL results are paginated; MCP returns the complete unified event
    list for the requested bounded window.
  acceptance:
    given: An owner has seven same-day events spanning schedules, exams, homework, todos and three subscribed
      Young activities; another owner subscribes only a fourth activity.
    when: Signed REST and GraphQL requests traverse four pages of size two, and registered MCP reads the
      same bounded day.
    then:
    - REST and GraphQL return identical chronological event identities, types and timestamps, with page
      sizes 2/2/2/1, total 7 and no duplicate events.
    - MCP returns all seven events in one bounded-window response, retaining the subscribed activity and
      personal item identities.
    - The other owner’s REST calendar contains only their subscribed activity.
    test:
      file: tests/integration/mcp/workspace/young-transport-contract.test.ts
      name: young-workspace.calendar-transport-pagination
capabilities:
  workspace-young-event-subscription-list:
    title: youngEventSubscriptions
    auth: user
    web:
      pages:
      - /workspace/subscriptions/activities
      - /workspace/calendar
    rest:
      routes:
      - method: GET
        path: /api/workspace/young-event-subscriptions
    graphql:
      queries:
      - name: youngEventSubscriptions
        parent: Workspace
        required_scopes:
        - workspace.young-subscription:read
        mcp_equivalent: workspace_young_event_subscription_list
    mcp:
      tools:
      - name: workspace_young_event_subscription_list
        rest_equivalent: GET /api/workspace/young-event-subscriptions
    requirement_refs:
    - young-event.snapshot-authoritative
  workspace-young-event-subscription-get:
    title: youngEventSubscription
    auth: user
    web:
      pages:
      - /workspace/subscriptions/activities
