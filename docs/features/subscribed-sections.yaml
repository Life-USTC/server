kind: feature
id: subscribed-sections
name: Subscribed Sections
areas:
- workspace
policy_refs:
- interface-hierarchy
- ui
- permission-ui
- rendering-and-cache
- cases.semester
access:
  anon: Cannot view their own subscribed sections list.
  user: Can only view and manage their own subscribed sections list.
  admin: Does not view or edit other users' subscription lists through ordinary pages.
  agent: Can read and manage the subscribed sections list data with the same semantics as the web through
    REST and MCP.
requirements:
- id: subscribed-sections.grouped-by-semester
  category: presentation
  rule: The list is grouped by semester rather than presented as a single flat list.
- id: subscribed-sections.section-codes-promoted
  category: presentation
  rule: Subscribed-section management shows the section code alongside course name and teachers so multiple
    offerings of the same course can be distinguished.
- id: subscribed-sections.sidebar-summary-only
  category: presentation
  rule: The shell exposes one Section Subscriptions destination and an optional count badge; it must not
    mirror subscribed sections as dynamic child navigation.
capabilities:
  subscribed-sections-tab:
    title: Subscribed Sections Tab
    auth: user
    links:
      models:
      - User
      - Section
      ui:
      - List Table
    web:
      pages:
      - /workspace/subscriptions
    rest:
      routes:
      - path: /api/workspace/subscriptions/current
        notes:
        - Returns the current user's subscribed section details and personal subscription feed information;
          supports the subscribed sections list and personal calendar subscription entry.
    graphql:
      fields:
      - parent: Workspace
        name: subscribedSections
        auth: user
        required_scopes:
        - workspace.subscription:read
        rest_equivalent: GET /api/workspace/subscriptions/current
        mcp_equivalent: workspace_subscription_list
        notes:
        - Each item contains kind and section. The nested Section is the public catalog shape.
    mcp:
      tools:
      - name: workspace_subscription_list
        rest_equivalent: GET /api/workspace/subscriptions/current
        notes:
        - Returns subscribed sections across all semesters, including past terms.
      - name: workspace_calendar_feed_get
        rest_equivalent: GET /api/workspace/subscriptions/current
        notes:
        - Returns subscription information and subscribed sections without a personal iCal feed URL, calendarPath,
          credential, or token.
        - Use full mode only when the caller explicitly needs the full subscribed section list on the
          same response; full mode still does not include the private feed URL.
    presentation:
      items:
      - semester group label and count
      - subscription.sections[].code
      - subscription.sections[].course.namePrimary
      - section.teachers[]
      - section.credits
      - Row opens section subscription details and the available actions, including Unsubscribe
    requirement_refs:
    - section.retired-read-semantics
    - subscription.personal-kind
