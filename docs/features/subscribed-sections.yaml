kind: feature
id: subscribed-sections
name: Subscribed Sections
areas:
- workspace
policy_refs:
- interface-hierarchy
- ui
- permission-ui
- rendering-and-cache
- cases.semester
access:
  anon: Cannot view their own subscribed sections list.
  user: Can only view and manage their own subscribed sections list.
  admin: Does not view or edit other users' subscription lists through ordinary pages.
  agent: Can read and manage the subscribed sections list data with the same semantics as the web through
    REST and MCP.
requirements:
- id: subscribed-sections.grouped-by-semester
  category: presentation
  rule: The list is grouped by semester rather than presented as a single flat list.
  acceptance:
    given: An isolated owner subscribes to two offerings in one semester and one offering in another.
    when: The actual subscriptions workspace renders at desktop and mobile widths.
    then:
    - Two separate semester groups display their exact labels and counts.
    - Every subscribed offering appears only under its own semester.
    test:
      file: tests/e2e/src/app/workspace/subscriptions/presentation-contract.test.ts
      name: subscribed-sections.grouped-by-semester
- id: subscribed-sections.section-codes-promoted
  category: presentation
  rule: Subscribed-section management shows the section code alongside course name and teachers so multiple
    offerings of the same course can be distinguished.
  acceptance:
    given: An isolated owner subscribes to distinct offerings of the same course with the same teachers.
    when: The actual subscriptions table and mobile cards render.
    then:
    - Every offering shows its distinct section code alongside the course name and teachers.
    - Both widths fit the viewport without horizontal page overflow.
    test:
      file: tests/e2e/src/app/workspace/subscriptions/presentation-contract.test.ts
      name: subscribed-sections.section-codes-promoted
- id: subscribed-sections.sidebar-summary-only
  category: presentation
  rule: The shell exposes one Section Subscriptions destination and an optional count badge; it must not
    mirror subscribed sections as dynamic child navigation.
  acceptance:
    given: An isolated owner has three real section subscriptions.
    when: The desktop sidebar and opened mobile sidebar render the subscriptions destination.
    then:
    - Exactly one active Section Subscriptions link is visible in each sidebar.
    - No per-section links or section-code child navigation mirror the subscribed offerings.
    test:
      file: tests/e2e/src/app/workspace/subscriptions/presentation-contract.test.ts
      name: subscribed-sections.sidebar-summary-only
capabilities:
  subscribed-sections-tab:
    title: Subscribed Sections Tab
    auth: user
    links:
      models:
      - User
      - Section
      ui:
      - List Table
    web:
      pages:
      - /workspace/subscriptions
    rest:
      routes:
      - path: /api/workspace/subscriptions/current
        notes:
        - Returns the current user's subscribed section details and personal subscription feed information;
          supports the subscribed sections list and personal calendar subscription entry.
    graphql:
      fields:
      - parent: Workspace
        name: subscribedSections
        auth: user
        required_scopes:
        - workspace.subscription:read
        rest_equivalent: GET /api/workspace/subscriptions/current
        mcp_equivalent: workspace_subscription_list
        notes:
        - Each item contains kind and section. The nested Section is the public catalog shape.
    mcp:
      tools:
      - name: workspace_subscription_list
        rest_equivalent: GET /api/workspace/subscriptions/current
        notes:
        - Returns subscribed sections across all semesters, including past terms.
      - name: workspace_calendar_feed_get
        rest_equivalent: GET /api/workspace/subscriptions/current
        notes:
        - Returns subscription information and subscribed sections without a personal iCal feed URL, calendarPath,
          credential, or token.
        - Use full mode only when the caller explicitly needs the full subscribed section list on the
          same response; full mode still does not include the private feed URL.
    presentation:
      kind: fields
      views:
        web:
          primary:
          - section.course.namePrimary
          - section.teachers.namePrimary
          secondary:
          - semester.nameCn
          - section.code
          - section.credits
          - subscription.kind
          tertiary:
          - section.id
        mcp-workspace-subscription-list:
          primary:
          - sections.course.nameCn
          - sections.teachers.nameCn
          secondary:
          - sections.code
          - sections.semester.nameCn
          - sections.jwId
          tertiary: []
        mcp-workspace-calendar-feed-get:
          primary:
          - subscription.currentSemesterSections.course.namePrimary
          secondary:
          - subscription.currentSemesterSections.code
          - subscription.currentSemesterSections.semester.nameCn
          - subscription.sectionCount
          tertiary: []
      items:
      - Rows open subscription details and their available actions.
    requirement_refs:
    - section.retired-read-semantics
    - subscription.personal-kind
