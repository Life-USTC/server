kind: feature
id: weather
name: Weather
areas:
- catalog
policy_refs:
- interface-hierarchy
- ui
- permission-ui
- rendering-and-cache
access:
  anon: Can query weather for USTC campus locations.
  user: Can query weather for USTC campus locations.
  admin: Can query weather for USTC campus locations.
  agent: Can read weather snapshots for USTC campus locations.
requirements:
- id: weather.public-no-signin
  category: authorization
  rule: REST and GraphQL weather reads are anonymous; the MCP weather tool is viewer-independent under
    the platform MCP endpoint authentication policy.
  acceptance:
    given: Fresh cached weather exists for both supported campuses and no viewer is authenticated.
    when: Anonymous REST/GraphQL and the viewer-independent registered MCP tool read each campus.
    then:
    - Each transport returns the current weather successfully without user context.
    test:
      file: tests/integration/mcp/catalog/weather.test.ts
      name: weather.public-no-signin
- id: weather.two-locations-only
  category: presentation
  applies_to:
  - weather
  expectation:
    kind: localized_regions
    route: /catalog/weather
    selector: '#main-content h2'
    labels:
      zh-cn:
      - 本部
      - 高新校区
      en-us:
      - Main campus
      - Gaoxin campus
    location_keys:
    - ustc-main
    - ustc-gaoxin
    viewports:
    - width: 1280
      height: 900
    - width: 390
      height: 900
    regions: 2
  rationale: Accepted API location keys and provider mapping are independently owned by weather.location-key-boundary
    and weather.location-provider-mapping.
  acceptance:
    given: The production weather page receives valid forecast fixtures built for its configured locations.
    when: The browser renders Chinese and English at desktop and mobile widths.
    then:
    - Exactly the main-campus and Gaoxin panels appear in order, each with its own forecast chart and localized heading.
    test:
      file: tests/e2e/src/app/weather/test.ts
      name: weather.two-locations-only
- id: weather.amap-primary
  category: behavior
  rule: Current conditions prefer an available Amap current observation and otherwise use an available
    Open-Meteo current observation. If neither exists, current.temperature is null and condition is unknown;
    successful forecast-only responses never imply 0°C current weather.
  acceptance:
    given: Both providers, only Open-Meteo or neither provider supplies current observations.
    when: The real weather merge selects current weather.
    then:
    - Amap current takes precedence when present.
    - Missing Amap current falls back to actual Open-Meteo current; missing observations from both yield
      null temperature and unknown condition.
    test:
      file: tests/unit/features/weather/weather-merge.test.ts
      name: weather.amap-primary
- id: weather.rolling-hourly-forecast
  category: behavior
  rule: The shared weather service returns available hourly points in [request time, request time + 24
    hours), including points on the following Shanghai day. Every weather surface consumes this projected
    snapshot.
  acceptance:
    given: A fresh cached forecast contains several days of hourly points.
    when: The real weather service reads around hour and Shanghai midnight transitions.
    then:
    - Exactly the points in the next half-open 24-hour window are returned.
    - The cached full series is not mutated and no provider call is needed.
    test:
      file: tests/unit/features/weather/weather-service.test.ts
      name: weather.rolling-hourly-forecast
- id: weather.raw-extensions-preserved
  category: behavior
  rule: Provider response payloads are preserved under extensions in REST and MCP full weather snapshots,
    including unknown provider fields. MCP default mode omits extensions while retaining canonical weather values.
    Extensions contain provider response data, not request credentials or URLs.
  rationale: Raw weather responses let clients inspect provider-specific measurements and compare normalized
    values with their source. Compact display does not need these payloads; the full public weather contract retains them.
  acceptance:
    given: Real weather merging receives Amap and Open-Meteo response payloads with nested unknown provider fields for both campuses.
    when: Actual REST and MCP default/full reads consume the merged cached snapshot.
    then:
    - REST and MCP full preserve both original JSON payloads exactly alongside normalized current conditions.
    - MCP default omits extensions without changing normalized current weather.
    test:
      file: tests/integration/mcp/catalog/weather.test.ts
      name: weather.raw-extensions-preserved
- id: weather.cache-and-history
  category: consistency
  expectation:
    kind: cache_freshness
    surface: service
    operation: getWeatherSnapshot
    timestamp: fetchedAt
    max_age_seconds: 900
    expires_at_boundary: true
    invalid_timestamps: refresh
    future_timestamps: refresh
    refresh_failure: unavailable
  applies_to:
  - weather
  rationale: The age is measured from snapshot fetchedAt, not the upstream observation timestamp. KV edge
    cache lifetimes and scheduled refresh cadence do not establish data freshness.
  acceptance:
    given: A cache hit has a valid, expired, invalid or future fetchedAt timestamp.
    when: The real weather service reads the snapshot around its declared age boundary.
    then:
    - Fresh hits are reused without provider calls.
    - Expired or invalid/future hits refresh through providers.
    - A failed refresh returns unavailable rather than relabeling the stale snapshot.
    test:
      file: tests/unit/features/weather/weather-freshness-specification.test.ts
      name: weather.cache-and-history
- id: weather.location-key-boundary
  category: consistency
  rule: REST, GraphQL, and MCP accept only the canonical locationKey values ustc-main and ustc-gaoxin;
    unknown keys are rejected as bad input.
  acceptance:
    given: A client supplies an empty, unknown, uppercase or whitespace-padded campus key.
    when: The real REST, GraphQL and registered MCP boundaries parse the key.
    then:
    - Every boundary rejects the key as bad input before reading the weather cache.
    test:
      file: tests/integration/mcp/catalog/weather.test.ts
      name: weather.location-key-boundary
- id: weather.location-provider-mapping
  category: behavior
  rule: Amap requests use adcode 340100 for main campuses and 340104 for Gaoxin; Open-Meteo uses coordinates
    (31.826,117.27) and (31.839,117.094), respectively. Forecast times use Asia/Shanghai.
  acceptance:
    given: The main and Gaoxin campus mappings are configured.
    when: The real Amap and Open-Meteo adapters issue requests to stubbed HTTP providers.
    then:
    - Main requests adcode 340100 and coordinates 31.826,117.27; Gaoxin requests 340104 and 31.839,117.094.
    - Open-Meteo requests Asia/Shanghai and its unzoned hourly times receive +08:00.
    test:
      file: tests/unit/features/weather/weather-adapters.test.ts
      name: weather.location-provider-mapping
- id: weather.hourly-forecast-expiry
  category: behavior
  rule: Unavailable or expired hourly data is empty; past hourly points never masquerade as the current
    forecast window.
  acceptance:
    given: A freshly fetched snapshot has only past hourly points or no hourly data.
    when: The real weather service selects its current hourly window.
    then:
    - No past hourly point appears in the result.
    test:
      file: tests/unit/features/weather/weather-freshness-specification.test.ts
      name: weather.hourly-forecast-expiry
- id: weather.weather-observation-history
  category: consistency
  rule: Successful refreshes persist the first merged snapshot and provider payloads for each campus and
    fetchedAt hour; later refreshes in that hour leave the existing observation intact.
  acceptance:
    given: Two successful provider refreshes occur in one hour for the same campus.
    when: The real refresh service merges HTTP responses and writes through the application database role.
    then:
    - The first timestamped snapshot and raw provider payload persist once for that campus/hour.
    - A later refresh returns new data without rewriting the historical observation.
    test:
      file: tests/integration/weather-history-runtime.test.ts
      name: weather.weather-observation-history
- id: weather.weather-refresh-budget
  category: consistency
  rule: Scheduled weather refreshes run every 20 minutes for ustc-main and every 30 minutes for ustc-gaoxin.
    Each delivery bypasses cached snapshots and makes at most two Amap requests and one Open-Meteo request,
    with no application retries. One nominal day therefore schedules 240 Amap and 120 Open-Meteo requests.
  rationale: This is the budget for one execution per scheduled delivery. On-demand refreshes, platform
    redelivery and provider-account quotas are separate; a cron frequency alone cannot guarantee their total.
  acceptance:
    given: The deployed cron configuration and real Worker scheduled handler use actual weather refresh and provider adapters with controlled HTTP and storage IO.
    when: Execute every nominal daily weather tick and a provider failure tick.
    then:
    - Both campus schedules dispatch their correct location, producing 72 and 48 refreshes and exactly 240 Amap and 120 Open-Meteo requests.
    - Scheduled runs bypass reads from cache; failures do not retry provider requests or persist failed snapshots.
    test:
      file: tests/unit/lib/misc/worker-routing-entrypoint.test.ts
      name: weather.weather-refresh-budget
- id: weather.hourly-provider-supplement
  category: behavior
  rule: Hourly forecasts and precipitation fields come from Open-Meteo and remain aligned with their timestamps.
  acceptance:
    given: Open-Meteo supplies seven days of hourly values including precipitation.
    when: The real merge normalizes hourly points.
    then:
    - Every timestamp remains aligned with its temperature, condition, precipitation probability and amount.
    test:
      file: tests/unit/features/weather/weather-merge.test.ts
      name: weather.hourly-provider-supplement
- id: weather.daily-provider-fallback
  category: behavior
  rule: Daily forecasts prefer nonempty Amap casts; if Amap has no casts, available Open-Meteo daily forecasts
    are used.
  acceptance:
    given: Amap current exists with and without daily casts; Open-Meteo also supplies daily data.
    when: The real merge selects daily forecasts.
    then:
    - Nonempty Amap daily data wins; absent Amap casts fall back to Open-Meteo daily values.
    test:
      file: tests/unit/features/weather/weather-merge.test.ts
      name: weather.daily-provider-fallback
- id: weather.provider-attribution
  category: behavior
  rule: The snapshot providers list includes only providers contributing selected current, hourly or daily
    data; provider request success alone does not count.
  acceptance:
    given: Providers return overlapping, complementary or empty successful responses.
    when: The real merge computes source attribution.
    then:
    - Only providers supplying selected current, hourly or daily values appear.
    test:
      file: tests/unit/features/weather/weather-merge.test.ts
      name: weather.provider-attribution
- id: weather.missing-current-display
  category: presentation
  rule: The weather page displays an em dash for unknown current temperature rather than a numeric zero.
  acceptance:
    given: The weather page receives a valid snapshot whose current temperature is null.
    when: The real weather component renders the campus panel.
    then:
    - The temperature is displayed as an em dash.
    test:
      file: tests/e2e/src/app/weather/test.ts
      name: weather.missing-current-display
capabilities:
  weather:
    title: Campus Weather
    auth: anon
    web:
      pages:
      - /catalog/weather
    rest:
      routes:
      - path: /api/catalog/weather
        notes:
        - 'Optional locationKey query parameter: ustc-main (default) or ustc-gaoxin.'
        - Returns 503 when every provider is unavailable.
    graphql:
      queries:
      - name: weather
        parent: Catalog
        rest_equivalent: GET /api/catalog/weather
        mcp_equivalent: catalog_weather_get
        notes:
        - locationKey must be one of the canonical weather location keys.
        - Returns null when every provider is unavailable.
    mcp:
      tools:
      - name: catalog_weather_get
        rest_equivalent: GET /api/catalog/weather
        notes:
        - Accepts locationKey (default ustc-main) and mode inputs.
        - Default mode returns the merged snapshot without provider extensions; full mode returns the
          complete payload including raw provider extensions.
    presentation:
      kind: fields
      views:
        web:
          primary:
          - location.name
          - current.temperature
          - current.condition
          secondary:
          - hourly.time
          - hourly.temperature
          - hourly.precipitationProbability
          - daily.high
          - daily.low
          - alerts.title
          tertiary:
          - provider.rawResponse
        mcp-catalog-weather-get:
          primary:
          - location.key
          - location.name
          secondary:
          - current.temperature
          - current.condition.text
          tertiary: []
      items:
      - Hourly temperature and precipitation probability share one full-width plot; details respond to hover, touch
        and keyboard focus.
