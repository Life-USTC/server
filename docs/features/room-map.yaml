kind: feature
id: room-map
name: Room maps
areas:
- catalog
access:
  anon: Read room maps
  user: Read room maps
  admin: Read room maps
  agent: Read room maps
requirements:
- id: room-map.source
  category: behavior
  rule: Published static room_maps.json contains exact annotated rooms and generated PNG paths. building_img_rules.json
    identifies overview images only.
- id: room-map.normalization
  category: consistency
  rule: Trim, normalize full-width input with NFKC, and uppercase room codes. Accept ASCII letters, digits
    and separating hyphens, at most 64 input characters.
- id: room-map.coverage
  category: behavior
  rule: highlighted means a verified room annotation; overview means only a matching floor/building image
    and does not assert room existence; unavailable means no map. Unmapped rooms are not guessed.
- id: room-map.public
  category: authorization
  rule: Lookup is public and does not disclose personal schedules.
- id: room-map.calendar
  category: behavior
  rule: Course and exam iCalendar events attach public image URLs, preferring highlighted room maps. Every
    mapped exam room contributes an attachment, deduplicated by URL. Descriptions include room-labeled
    map links. Missing maps never suppress events.
- id: room-map.web
  category: presentation
  rule: Room labels support lazy hover/focus preview and click/tap expansion, with keyboard access and
    full-size image viewing.
- id: room-map.bot
  category: behavior
  rule: Explicit room queries and recognized bare room codes return the available map image without a
    caption. When image responses are disabled, return map text and the available public image URL; unavailable
    maps return an explanatory message. Public room queries are available in shared conversations; private
    AI conversations can also use catalog_rooms_map. Do not attach every room map to ordinary timetable
    replies. Resolve ambiguous class references before querying a map.
capabilities:
  room-map:
    title: Room map lookup
    auth: anon
    web:
      pages:
      - /catalog/rooms
      - /catalog/sections/[jwId]
    rest:
      routes:
      - path: /api/catalog/rooms/{code}/map
    graphql:
      queries:
      - name: roomMap
        parent: Catalog
        rest_equivalent: GET /api/catalog/rooms/{code}/map
        mcp_equivalent: catalog_rooms_map
    mcp:
      tools:
      - name: catalog_rooms_map
        rest_equivalent: GET /api/catalog/rooms/{code}/map
