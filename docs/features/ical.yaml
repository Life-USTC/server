kind: feature
id: ical
name: Personal Calendar Subscription iCal
areas:
- catalog
- workspace
policy_refs:
- interface-hierarchy
- ui
- permission-ui
- rendering-and-cache
- cases.mcp-assistant-workflows
- cases.missing-data
access:
  anon: Can copy a single-section iCal link from the public section detail page and can retrieve a personal
    feed only when holding its token-bearing URL.
  user: Can copy their own personal subscription iCal link.
  admin: No additional exclusive iCal capabilities.
  agent: After authorization, can read the current user's personal calendar subscription information.
    REST requires workspace.subscription:read and exposes the private feed URL only with the additional
    workspace.calendar-feed:read capability; MCP workspace_calendar_feed_get returns subscription information
    without the personal feed URL, path, credential, or token.
requirements:
- id: ical.committed-write-rebuilds
  category: consistency
  rule: Calendar export rebuild requests are enqueued only after the source write commits; rolled-back
    writes never request a rebuild.
  acceptance:
    given: Each todo/homework creation and section/activity subscription case owns its PostgreSQL database
      and request-local recording queue binding.
    when: Independent success and rejection cases execute each source write; rejection uses a deferred
      constraint trigger that fails at commit.
    then:
    - An independent database connection sees the committed source row when each successful rebuild is
      requested.
    - Commit rejection rolls back the row and emits no rebuild request for any of the four source domains.
    test:
      file: tests/integration/calendar-commit-contract.test.ts
      name: Todo rebuild observes the committed source row
- id: ical.copyable-links
  category: presentation
  rule: iCal links should be presented as copyable links rather than requiring users to manually construct
    them.
  acceptance:
    given: A signed-in user can open personal and public Section calendar export dialogs.
    when: The browser copies each presented URL and retrieves it.
    then:
    - The clipboard contains the exact presented canonical personal or Section URL.
    - Both copied URLs return a valid text/calendar response.
    test:
      file: tests/e2e/src/app/workspace/calendar/test.ts
      name: ical.copyable-links
- id: ical.rfc5545-dtstamp-utc
  category: consistency
  rule: Every VEVENT in section, multi-section, and personal feeds serializes DTSTAMP as a UTC DATE-TIME
    with a Z suffix while retaining Asia/Shanghai TZID values for event start and end times.
  acceptance:
    given: A fixed clock and fixtures include schedule, exam, homework, todo and Young activity timestamps.
    when: The actual single-section, multi-section and personal factories serialize their calendars.
    then:
    - Every event contains the exact UTC DTSTAMP with Z suffix.
    - Every start and end carries Asia/Shanghai TZID and preserves its intended local time.
    test:
      file: tests/unit/features/calendar/ical-export-contract.test.ts
      name: ical.rfc5545-dtstamp-utc
- id: ical.bounded-multi-section-export
  category: validation
  rule: A multi-section iCalendar export accepts at most 50 unique positive Section IDs and rejects malformed
    or empty input before loading expanded section data.
  acceptance:
    given: Requests contain exactly 50 IDs, 51 unique IDs, empty input or malformed/nonpositive/unsafe
      numbers.
    when: The actual multi-section calendar route parses the requests.
    then:
    - Exactly 50 valid IDs reach calendar generation.
    - Invalid and oversized input returns 400 before expanded section data loading.
    test:
      file: tests/unit/features/calendar/sections-calendar-route.test.ts
      name: ical.bounded-multi-section-export
- id: ical.static-json-resilient
  category: consistency
  rule: Unavailable or malformed optional location/image metadata does not prevent a valid iCalendar export
    or suppress its events.
  acceptance:
    given: Optional geographic, building image and room manifest fetches fail, return non-JSON or wrong
      JSON shapes, alongside a valid-metadata control.
    when: The actual single-section, multi-section and personal calendar factories load the metadata and
      serialize their events.
    then:
    - All exports retain every expected schedule, exam and personal event.
    - Invalid optional metadata omits coordinates and attachments without throwing; valid metadata still
      adds both.
    test:
      file: tests/unit/features/calendar/ical-export-contract.test.ts
      name: ical.static-json-resilient
- id: ical.multi-section-canonical-set
  category: validation
  rule: Multi-section export IDs are deduplicated and sorted into a canonical URL before section relations
    are loaded; equivalent sets share a URL.
  acceptance:
    given: A multi-section URL contains unordered and repeated positive IDs.
    when: The actual REST route handles the URL.
    then:
    - It redirects to one sorted deduplicated URL before invoking expanded calendar data loading.
    test:
      file: tests/unit/features/calendar/sections-calendar-route.test.ts
      name: ical.multi-section-canonical-set
- id: ical.feed-telemetry-private
  category: privacy
  rule: Calendar cache telemetry never includes user IDs, feed credentials or token-bearing URLs.
  acceptance:
    given: A private owner export contains a token-bearing feed URL and uses a shared KV cache with recorded
      analytics.
    when: The actual cache builds a miss and a second isolate reuses the fresh export.
    then:
    - Cache miss and hit analytics contain only fixed cache/status labels and numeric measurements.
    - Neither owner ID, feed credential nor token-bearing URL appears in any telemetry payload.
    test:
      file: tests/unit/features/calendar/calendar-export-cache.test.ts
      name: ical.feed-telemetry-private
- id: ical.feed-cold-miss
  category: consistency
  rule: A valid personal feed request with no usable cached export builds and returns its current export
    rather than an empty cache placeholder.
  acceptance:
    given: A real owner has a dated todo and the export cache is empty.
    when: The actual feed route performs an authorized read.
    then:
    - The response is a 200 text/calendar containing the actual private item and VEVENT.
    - An ETag is returned for the built export instead of an empty cache placeholder.
    test:
      file: tests/integration/calendar-feed-contract.test.ts
      name: ical.feed-cold-miss
capabilities:
  section-calendar-dialog:
    title: Section Calendar Dialog
    auth: anon
    links:
      ui:
      - Calendar Export Dialog
    web:
      pages:
      - /catalog/sections/[jwId]
    rest:
      routes:
      - path: /api/catalog/sections/[jwId]/calendar.ics
        notes:
        - Returns text/calendar synthesized from the section's schedule and exams.
    presentation:
      kind: fields
      views:
        web:
          primary:
          - calendar.url
          secondary:
          - calendar.description
          tertiary: []
      items:
      - Copy the displayed iCalendar URL.
    requirement_refs:
    - room-map.calendar
  personal-calendar-subscription:
    title: Personal Calendar Subscription
    auth: user
    links:
      models:
      - User
      - Section
      ui:
      - Calendar Export Dialog
    web:
      pages:
      - /workspace/calendar
    rest:
      routes:
      - path: /api/calendar-feeds/[credential].ics
        notes:
        - The opaque credential authorizes feed retrieval.
        - The credential is carried only in the canonical path segment.
        - An existing user with a valid feed token receives a valid empty VCALENDAR when no items are
          currently available, so calendar clients can keep the subscription active.
        - When the user exists but the feed token is wrong or revoked, the route returns 410 Gone with
          a private, no-store Cache-Control so calendar clients stop aggressive re-polling; unknown users
          return 404.
      - path: /api/workspace/subscriptions/current
        reference_only: true
    mcp:
      tools:
      - name: workspace_calendar_feed_get
        rest_equivalent: GET /api/workspace/subscriptions/current
        notes:
        - Requires workspace.subscription:read. Returns the current user's subscription information and
          subscribed sections; it never returns the private personal iCal feed URL, calendarPath, credential,
          or token-bearing URL.
        - Full mode adds the complete subscribed section list but does not add a personal iCal feed URL
          or other feed credential.
    presentation:
      kind: fields
      views:
        web:
          primary:
          - calendar.url
          secondary:
          - calendar.description
          tertiary: []
        mcp-workspace-calendar-feed-get:
          primary:
          - subscription.currentSemesterSections.course.namePrimary
          secondary:
          - subscription.currentSemesterSections.code
          - subscription.currentSemesterSections.semester.nameCn
          - subscription.sectionCount
          tertiary: []
      items:
      - Copy the private iCalendar URL.
    requirement_refs:
    - room-map.calendar
  multi-section-ical:
    title: Multi-Section iCal Export
    auth: anon
    web: unavailable
    rest:
      routes:
      - path: /api/catalog/sections/calendar.ics
        notes:
        - Generates a multi-section iCal based on a comma-separated sectionIds query parameter.
        - Accepts at most 50 unique positive Section IDs. Malformed or empty input returns 400.
        - IDs are deduplicated and sorted; non-canonical requests permanently redirect to the canonical
          cache URL before loading calendar relations.
    requirement_refs:
    - room-map.calendar
rationale:
- iCal is an export / subscription capability and should not carry a second business model.
- The former cache implementation description used Workers KV, a 30-minute freshness interval, a 24-hour
  stale retention window and a rebuild queue. The maximum acceptable freshness for deadline-driven changes
  remains a product decision; those storage details do not override per-request credential validation
  or HTTP privacy.
- Empty Section, multi-Section and authorized personal calendar validity, including unchanged missing-target/authentication
  errors, is canonically owned by cases.missing-data.ical-no-events-1.
- Current authorization before personal cache reads and strong/weak/multiple ETag conditional responses
  are canonically owned by calendar.feed-auth-before-cache.
- Independent homework description writes and unchanged retries enqueue after-commit calendar rebuilds
  under description.homework-calendar-invalidation.
