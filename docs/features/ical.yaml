kind: feature
id: ical
name: Personal Calendar Subscription iCal
areas:
- catalog
- workspace
policy_refs:
- interface-hierarchy
- ui
- permission-ui
- rendering-and-cache
- cases.mcp-assistant-workflows
- cases.missing-data
access:
  anon: Can copy a single-section iCal link from the public section detail page and can retrieve a personal
    feed only when holding its token-bearing URL.
  user: Can copy their own personal subscription iCal link.
  admin: No additional exclusive iCal capabilities.
  agent: After authorization, can read the current user's personal calendar subscription information.
    REST requires workspace.subscription:read and exposes the private feed URL only with the additional
    workspace.calendar-feed:read capability; MCP workspace_calendar_feed_get returns subscription information
    without the personal feed URL, path, credential, or token.
requirements:
- id: ical.committed-write-rebuilds
  category: consistency
  rule: Calendar export rebuild requests are enqueued only after the source write commits; rolled-back
    writes never request a rebuild.
- id: ical.copyable-links
  category: presentation
  rule: iCal links should be presented as copyable links rather than requiring users to manually construct
    them.
- id: ical.rfc5545-dtstamp-utc
  category: consistency
  rule: Every VEVENT in section, multi-section, and personal feeds serializes DTSTAMP as a UTC DATE-TIME
    with a Z suffix while retaining Asia/Shanghai TZID values for event start and end times.
- id: ical.bounded-multi-section-export
  category: validation
  rule: A multi-section iCalendar export accepts at most 50 unique positive Section IDs and rejects malformed
    or empty input before loading expanded section data.
- id: ical.personal-feed-cache
  category: consistency
  rule: Private calendar exports may be cached server-side, but valid credential authorization is required
    on every request before cached content or a 304 response is returned.
  rationale: HTTP privacy is canonical in calendar.personal-feed-http-cache; server cache storage is not
    permission to cache personal responses publicly.
- id: ical.static-json-resilient
  category: consistency
  rule: Unavailable or malformed optional location/image metadata does not prevent a valid iCalendar export
    or suppress its events.
- id: ical.homework-description-rebuild
  category: consistency
  rule: An independent homework description edit requests export rebuilds for the same subscribed users
    as a homework edit.
- id: ical.description-retry-rebuild
  category: consistency
  rule: A successfully retried unchanged homework description edit still requests the affected calendar
    export rebuilds.
- id: ical.multi-section-canonical-set
  category: validation
  rule: Multi-section export IDs are deduplicated and sorted into a canonical URL before section relations
    are loaded; equivalent sets share a URL.
- id: ical.feed-empty-calendar
  category: behavior
  rule: A valid personal feed with no current items returns a valid empty VCALENDAR so the calendar subscription
    stays active.
- id: ical.feed-etag
  category: consistency
  rule: An authorized personal feed supports conditional ETag requests; a revoked credential never receives
    a cached 304 response.
- id: ical.feed-telemetry-private
  category: privacy
  rule: Calendar cache telemetry never includes user IDs, feed credentials or token-bearing URLs.
- id: ical.feed-cold-miss
  category: consistency
  rule: A valid personal feed request with no usable cached export builds and returns its current export
    rather than an empty cache placeholder.
capabilities:
  section-calendar-dialog:
    title: Section Calendar Dialog
    auth: anon
    links:
      ui:
      - Calendar Export Dialog
    web:
      pages:
      - /catalog/sections/[jwId]
    rest:
      routes:
      - path: /api/catalog/sections/[jwId]/calendar.ics
        notes:
        - Returns text/calendar synthesized from the section's schedule and exams.
    presentation:
      items:
      - iCalendar URL (copyable)
      - section.code (context)
      - 'Export format: .ics'
      - Copy button
    requirement_refs:
    - room-map.calendar
  personal-calendar-subscription:
    title: Personal Calendar Subscription
    auth: user
    links:
      models:
      - User
      - Section
      ui:
      - Calendar Export Dialog
    web:
      pages:
      - /workspace/calendar
    rest:
      routes:
      - path: /api/calendar-feeds/[credential].ics
        notes:
        - The opaque credential authorizes feed retrieval.
        - The credential is carried only in the canonical path segment.
        - An existing user with a valid feed token receives a valid empty VCALENDAR when no items are
          currently available, so calendar clients can keep the subscription active.
        - When the user exists but the feed token is wrong or revoked, the route returns 410 Gone with
          a private, no-store Cache-Control so calendar clients stop aggressive re-polling; unknown users
          return 404.
      - path: /api/workspace/subscriptions/current
        reference_only: true
    mcp:
      tools:
      - name: workspace_calendar_feed_get
        rest_equivalent: GET /api/workspace/subscriptions/current
        notes:
        - Requires workspace.subscription:read. Returns the current user's subscription information and
          subscribed sections; it never returns the private personal iCal feed URL, calendarPath, credential,
          or token-bearing URL.
        - Full mode adds the complete subscribed section list but does not add a personal iCal feed URL
          or other feed credential.
    presentation:
      items:
      - iCalendar URL copy button
    requirement_refs:
    - room-map.calendar
  multi-section-ical:
    title: Multi-Section iCal Export
    auth: anon
    web: unavailable
    rest:
      routes:
      - path: /api/catalog/sections/calendar.ics
        notes:
        - Generates a multi-section iCal based on a comma-separated sectionIds query parameter.
        - Accepts at most 50 unique positive Section IDs. Malformed or empty input returns 400.
        - IDs are deduplicated and sorted; non-canonical requests permanently redirect to the canonical
          cache URL before loading calendar relations.
    requirement_refs:
    - room-map.calendar
rationale:
- iCal is an export / subscription capability and should not carry a second business model.
- The former cache implementation description used Workers KV, a 30-minute freshness interval, a 24-hour
  stale retention window and a rebuild queue. The maximum acceptable freshness for deadline-driven changes
  remains a product decision; those storage details do not override per-request credential validation
  or HTTP privacy.
