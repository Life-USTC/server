kind: feature
id: young-event
name: Young Events
areas:
- catalog
policy_refs:
- interface-hierarchy
- ui
- permission-ui
- rendering-and-cache
access:
  anon: Can browse second-classroom (第二课堂) signup events from young.ustc.edu.cn.
  user: Can browse second-classroom (第二课堂) signup events from young.ustc.edu.cn.
  admin: Can browse second-classroom (第二课堂) signup events from young.ustc.edu.cn.
  agent: Can read second-classroom (第二课堂) signup events from young.ustc.edu.cn.
requirements:
- id: young-event.shared-public-cache
  category: consistency
  rule: Public event facts, sanitized detail, categories and organizer identity remain viewer-independent
    and reflect the current imported revision. Moving source-freshness and upcoming/history counts use
    the current reference clock.
  acceptance:
    given: Controlled database results and an imported-revision boundary supply event, sanitized detail, category and organizer facts.
    when: The actual public services read cold/warm revisions and the clock crosses source-freshness and activity-time boundaries.
    then:
    - A warm revision reuses public facts; changing the revision refreshes every fact surface and sanitizes the new detail.
    - Source freshness and upcoming/history counts advance with the current clock while underlying facts remain cached.
    test:
      file: tests/unit/features/young/young-event-service.test.ts
      name: young-event.shared-public-cache
- id: young-event.private-client-overlays
  category: privacy
  rule: Private event subscription and conflict APIs are requested with no-store only for signed-in viewers;
    an expired session restores sign-in state.
- id: young-event.public-no-signin
  category: authorization
  rule: Young events are public campus activity information; sign-up itself still happens on young.ustc.edu.cn,
    so sign-in is not a prerequisite for browsing.
  acceptance:
    given: An anonymous browser opens an imported activity.
    when: The actual detail page renders and the viewer returns to the public catalog.
    then:
    - Activity facts and public navigation are available without sign-in.
    - Official registration links to young.ustc.edu.cn.
    test:
      file: tests/e2e/src/app/young-events/[youngId]/test.ts
      name: young-event.public-no-signin
- id: young-event.static-snapshot-sourced
  category: behavior
  rule: Catalog activity reads use the imported static snapshot and do not require request-time access
    to authenticated Young APIs. Image retrieval is handled separately through the public image proxy.
  acceptance:
    given: An activity has been imported into PostgreSQL and no source data is cached.
    when: All network fetches are denied while anonymous REST/GraphQL/MCP detail operations execute.
    then:
    - Every operation still returns the persisted event.
    - No upstream network request is attempted.
    test:
      file: tests/integration/mcp/catalog/young-public-contract.test.ts
      name: young-event.static-snapshot-sourced
- id: young-event.snapshot-authoritative
  category: consistency
  rule: A complete snapshot marks absent events sourceMissing with lastSeenAt and keeps their rows. It
    never infers cancellation. Incomplete snapshots leave existing rows unchanged.
  acceptance:
    given: Two previously observed published events exist and a later source is incomplete, complete with
      one event, empty, or reintroduces an absent event.
    when: The real snapshot gate and Young importer reconcile these sources in a database transaction.
    then:
    - Incomplete snapshots leave rows unchanged.
    - Complete missing and empty sources retain rows with sourceMissing=true and prior lastSeenAt, without
      inferring cancellation.
    - Observed and reappearing events update lastSeenAt and clear sourceMissing.
    test:
      file: tests/integration/young-source-contract.test.ts
      name: young-event.snapshot-authoritative
- id: young-event.organizer-identity
  category: consistency
  rule: Organizer names use Unicode NFKC, trim, whitespace collapse, and lowercase. Exact normalized names
    resolve to stable local YoungOrganizer IDs; matching never uses fuzzy similarity.
  acceptance:
    given: Source organizer labels vary by full-width Unicode, whitespace and case; a similar but unequal
      name and a blank label also occur.
    when: The actual Young importer runs repeatedly against a real database.
    then:
    - Exactly normalized names share one stable local organizer ID across imports.
    - A merely similar name remains distinct, and a blank label creates no organizer.
    test:
      file: tests/integration/young-source-contract.test.ts
      name: young-event.organizer-identity
- id: young-event.raw-payload-preserved
  category: consistency
  rule: Curated columns cover the high-value upstream fields, including the rich-text description and
    participation notes, the 第二课堂 module, activity level and participation form, attendance and hour counters,
    the sponsor and contact person, and the per-slot venue list. The upstream record, including itemPlaceDTO
    and its place details split into snapshot subtables, stays available under rawJson for REST, GraphQL,
    and MCP consumers.
  rationale: 'Confirmed publication decision: retain the existing source activity record and structured
    participation fields so clients can explain source audience, registration eligibility, venue slots
    and provenance. Source identity/scope codes are opaque source facts, not account identifiers or proof
    of personal eligibility. Activity contact fields identify the published event contact only; they must
    not reveal a viewer''s contact details, account links or personal participation state. rawJson is
    data; only separately sanitized description and participationNotes may be rendered as rich text.'
  acceptance:
    given: An upstream activity contains rich text, module/level/form labels, source sponsor/contact,
      hour and attendance counters, and nested venue subtables.
    when: The actual source loader and importer persist it; anonymous REST, GraphQL and registered MCP
      detail operations read it.
    then:
    - Raw source fields and reconstructed itemPlaceDTO are retained exactly (GraphQL uses a JSON string).
    - Curated public activity facts and venue slots retain their values without adding viewer/account/participation
      state.
    test:
      file: tests/integration/mcp/catalog/young-public-contract.test.ts
      name: young-event.raw-payload-preserved
- id: young-event.rich-text-sanitized
  category: validation
  rule: 'Every public interface sanitizes description and participationNotes before exposing renderable
    rich text: scripts, iframes and event handlers are removed, and young.ustc.edu.cn image URLs use the
    local image proxy.'
  acceptance:
    given: The imported description and participation notes contain script/iframe tags, event handlers
      and a Young image.
    when: The actual source loader and importer persist it; anonymous REST, GraphQL and registered MCP
      detail operations read it.
    then:
    - Both rendered HTML fields remove executable tags and event handlers.
    - Benign text remains and Young image URLs point to the local proxy.
    test:
      file: tests/integration/mcp/catalog/young-public-contract.test.ts
      name: young-event.rich-text-sanitized
- id: young-event.signup-state
  category: behavior
  rule: The upstream activity status label and code (status, activityStatusCode) are distinct from the
    signup phase code (signupStatusCode). requiresSignup reflects the upstream needApply flag. isActive
    identifies the source list and alone does not guarantee that registration is currently possible. The
    empty upstream registrationStatus key remains only in rawJson.
  acceptance:
    given: A source-active activity has different activity/signup codes, needApply=0 and an empty legacy
      registrationStatus field.
    when: The actual source loader and importer persist it; anonymous REST, GraphQL and registered MCP
      detail operations read it.
    then:
    - Activity label/code, signup code and requiresSignup remain distinct even on a source-active record.
    - The legacy registrationStatus exists only in rawJson.
    test:
      file: tests/integration/mcp/catalog/young-public-contract.test.ts
      name: young-event.signup-state
- id: young-event.image-proxy-cached
  category: consistency
  rule: Public Young image responses use the local proxy. Immutable cache entries must identify the poster
    representation; changing an event's poster must not continue serving old bytes under an unchanged
    immutable representation.
- id: young-event.shanghai-local-times
  category: consistency
  rule: Upstream datetimes are Asia/Shanghai local times and returned with the +08:00 offset. Date-only
    range boundaries use Asia/Shanghai day boundaries.
  acceptance:
    given: Upstream activity times are timezone-less Shanghai local text.
    when: The actual importer and all public transports return timestamps, then the catalog reads date-only
      day ranges.
    then:
    - Returned instants carry the matching +08:00 local time.
    - The matching Shanghai day includes the event and the previous day excludes it.
    test:
      file: tests/integration/mcp/catalog/young-public-contract.test.ts
      name: young-event.shanghai-local-times
- id: young-event.date-range-overlap
  category: consistency
  rule: Activity and registration date-range searches use the selected time basis and include intervals
    overlapping the requested Shanghai days. Interval ends are exclusive; a known start with no end is
    treated as a point.
  acceptance:
    given: Persisted events span midnight, end exactly at day start, have only a start, or have registration
      timing distinct from activity timing.
    when: The actual catalog service queries one Shanghai day using activity and registration time bases.
    then:
    - Overlapping and known-start-only events are included; intervals ending exactly at the day start
      are excluded.
    - Registration filtering uses registration timing independently of activity timing.
    test:
      file: tests/integration/young-catalog.test.ts
      name: young-event.date-range-overlap
- id: young-event.read-only
  category: authorization
  rule: Events are imported facts; no transport exposes writes.
- id: young-event.structured-participation
  category: behavior
  rule: Source category/module/form/level, organization, tag and signup-scope codes remain opaque and
    separate from labels and local organizer identity.
  acceptance:
    given: An upstream record has distinct category/module/form/level labels and codes plus source organization,
      tag and audience IDs.
    when: The actual source loader, database importer and public summary serializer process the record.
    then:
    - Published fields preserve opaque codes separately from labels.
    - Source identity arrays retain stable deduplicated order and remain distinct from local organizer
      identity.
    test:
      file: tests/integration/young-source-contract.test.ts
      name: young-event.structured-participation
- id: young-event.display-known-values
  category: presentation
  rule: Published registration requirements, meeting information, accepted attachment formats and external
    sponsor are shown when supplied.
  acceptance:
    given: A persisted activity provides registration requirements, accepted attachments, online meeting
      information and an external sponsor.
    when: The actual detail page renders at desktop and mobile widths.
    then:
    - Every supplied participation fact is visible.
    test:
      file: tests/e2e/src/app/young-events/detail-contract.test.ts
      name: young-event.display-known-values
- id: young-event.web-browse-context
  category: presentation
  rule: Activity list and calendar retain shared search/category/module/level/organizer/source-list filters;
    detail return links preserve the originating catalog browse route. Unknown-date results show their
    active filter explicitly.
- id: young-event.web-organizer-order
  category: presentation
  rule: Web organizer discovery places organizers with source-active events before other organizers, with
    alphabetical order and stable ID ties within each group. REST, GraphQL and MCP order alphabetically.
    Source-active does not imply registration is open.
- id: young-event.web-detail-priority
  category: presentation
  rule: Detail pages prioritize time, venue, hours and signup deadline. Official signup remains external;
    poster, statistics and record metadata are expandable.
- id: young-event.web-mobile-calendar
  category: presentation
  rule: Month mobile agendas exclude adjacent-month padding and initially show the selected date onward;
    earlier dates remain available by expanding the earlier-date section. Day/week/month controls identify
    their current view and title the matching date range.
- id: young-event.fixed-browse-filter-options
  category: presentation
  rule: Web module filters use the fixed choices 德, 智, 体, 美 and 劳. Activity-level filters use 班级, 院级,
    校级, 省级 and 国家级. Other upstream values remain visible as badges but do not become filter choices.
  surfaces:
  - web
  rationale: 'Product decision required: Fixed known taxonomy is simple but hiding valid other upstream
    values from filters can make relevant events undiscoverable; decide unknown/other filtering policy.'
- id: young-event.overlay-shared-viewer-state
  category: privacy
  rule: Event subscription/conflict controls reuse root viewer state without issuing a separate shell
    bootstrap request.
- id: young-event.unknown-date-results
  category: consistency
  rule: Rows lacking the selected start time contribute to unknownDateCount and are available through
    paginated dateUnknown results.
  acceptance:
    given: Five real events have one unknown activity start and four unknown registration starts.
    when: The actual catalog service queries date-bounded and dateUnknown pages for both time bases.
    then:
    - unknownDateCount reflects the selected start field.
    - Unknown-date pages report complete stable totals and jointly return every matching record exactly
      once.
    test:
      file: tests/integration/young-catalog.test.ts
      name: young-event.unknown-date-results
- id: young-event.participation-flag-normalization
  category: behavior
  rule: Participation signup-info and online flags use strict binary source interpretation; missing arrays
    serialize as empty arrays.
  acceptance:
    given: Source binary flags are 1/0 numbers or strings, invalid values or missing, with absent arrays.
    when: The actual source loader, database importer and public summary serializer process the record.
    then:
    - Only exact binary source values become booleans; missing and invalid flags are null.
    - Absent identity/tag/attachment arrays serialize as empty arrays.
    test:
      file: tests/integration/young-source-contract.test.ts
      name: young-event.participation-flag-normalization
- id: young-event.participation-sponsor-normalization
  category: behavior
  rule: Blank or placeholder sponsor values serialize as null; attachment extensions are normalized without
    inventing unsupported formats.
  acceptance:
    given: Source sponsor values are blank, placeholders or a real label; extensions include mixed case,
      dots, duplicates and invalid separators.
    when: The actual source loader, database importer and public summary serializer process the record.
    then:
    - Blank/placeholder sponsors serialize as null and a real sponsor is trimmed.
    - Allowed extensions normalize to stable unique lowercase names without inventing extra formats.
    test:
      file: tests/integration/young-source-contract.test.ts
      name: young-event.participation-sponsor-normalization
- id: young-event.online-option-uncertainty
  category: presentation
  rule: isOnline describes the upstream online-meeting option; false does not imply in-person attendance.
  acceptance:
    given: Persisted activities have true, false and missing online-meeting flags.
    when: Their actual detail pages render at desktop and mobile widths.
    then:
    - Only true displays the online-meeting option.
    - False and missing do not claim in-person attendance.
    test:
      file: tests/e2e/src/app/young-events/detail-contract.test.ts
      name: young-event.online-option-uncertainty
- id: young-event.occupancy-uncertainty
  category: presentation
  rule: Unknown activity occupancy is displayed as unknown rather than zero.
  acceptance:
    given: Persisted activities have unknown or explicitly zero registrations and capacity 20.
    when: The detail pages render on desktop/mobile, then the desktop catalog table renders.
    then:
    - Unknown counts are omitted from detail facts and shown as unknown in the catalog.
    - A known zero remains an explicit zero.
    test:
      file: tests/e2e/src/app/young-events/detail-contract.test.ts
      name: young-event.occupancy-uncertainty
- id: young-event.partial-time-uncertainty
  category: presentation
  rule: Partial time ranges label the known endpoint in Asia/Shanghai.
  acceptance:
    given: Persisted activities have only a start or only an end timestamp.
    when: Their actual detail summaries render on desktop and mobile.
    then:
    - Each summary labels the known endpoint and formats its instant in Shanghai time.
    test:
      file: tests/e2e/src/app/young-events/detail-contract.test.ts
      name: young-event.partial-time-uncertainty
- id: young-event.scope-uncertainty
  category: presentation
  rule: Unknown signup-scope codes are never translated into eligibility claims.
  acceptance:
    given: A persisted activity has an unrecognized signup-scope code and opaque source department identity.
    when: The actual detail page renders on desktop and mobile.
    then:
    - The page directs viewers to the official eligibility source.
    - It does not invent an eligibility claim or present opaque IDs as audience labels.
    test:
      file: tests/e2e/src/app/young-events/detail-contract.test.ts
      name: young-event.scope-uncertainty
capabilities:
  young-event:
    title: Second-Classroom Events
    auth: anon
    web:
      pages:
      - /catalog/young-events
      - /catalog/young-events/[youngId]
      - /catalog/young-events/calendar
      - /catalog/young-events/organizers
      - /catalog/young-events/organizers/[organizerId]
    rest:
      routes:
      - path: /api/catalog/young-events
        notes:
        - 'Optional query parameters: active, category, module, activityLevel, search, organizerId, dateFrom,
          dateTo, timeBasis, page, pageSize.'
        - Summaries carry the structured upstream fields (activityStatusCode, signupStatusCode, requiresSignup,
          module, activityLevel, form, grades, sponsor, contactName, contactTel, duration, serviceHour,
          sumHours, sumPersons, partakeNum, favCount, limitNum, createdAtUpstream, auditedAt, updatedAtUpstream,
          places) but not the rich-text bodies, which only the detail route returns.
        - Date ranges include overlapping known intervals; unknown start times are counted separately
          and available through the paginated dateUnknown filter. source reports fresh, stale, or unknown
          snapshot freshness; sourceMissing marks rows absent from the latest complete snapshot.
        - 'Default order: source-active events first, then by startAt descending; imageUrl is the local
          cached proxy path.'
      - path: /api/catalog/young-events/[youngId]
        notes:
        - 404 when the youngId is unknown.
      - path: /api/catalog/young-organizers
        notes:
        - 'Optional query parameters: search, page, pageSize.'
        - Each organizer has a stable id and totalCount, activeCount, upcomingCount, historyCount. Counts
          are independent facts; activity histories use the paginated event list filtered by organizerId.
      - path: /api/catalog/young-organizers/[organizerId]
        notes:
        - 404 when the organizer ID is unknown.
      - path: /api/catalog/young-events/[youngId]/image
        notes:
        - 'Cache-aside proxy: serves the R2-cached copy under young-events/images/<pic> with immutable
          year-long cache headers and ETag/304 support; on a miss it fetches https://young.ustc.edu.cn/login/<pic>
          and stores the result. Repeat requests are served from the per-colo Cache API keyed by youngId.'
        - 404 when the youngId is unknown or the event has no image (cached for 300s); 502 when the origin
          fetch fails (cached for 60s).
        - A companion route, GET /api/catalog/young-events/images/[...path], serves rich-text inline images
          by their upstream pic path. It shares the same R2 objects and validation; because the bytes
          are event-independent it skips the per-colo cache keyed by youngId.
    graphql:
      queries:
      - name: youngEvents
        parent: Catalog
        rest_equivalent: GET /api/catalog/young-events
        mcp_equivalent: catalog_young_event_list
        notes:
        - filter accepts module and activityLevel for exact matches.
      - name: youngEvent
        parent: Catalog
        rest_equivalent: GET /api/catalog/young-events/[youngId]
        mcp_equivalent: catalog_young_event_get
        notes:
        - Returns null when the youngId is unknown.
        - Only this query populates description, participationNotes, and rawJson; rawJson is a JSON string
          because the schema has no JSON scalar.
      - name: youngOrganizers
        parent: Catalog
        rest_equivalent: GET /api/catalog/young-organizers
        mcp_equivalent: catalog_young_organizer_list
      - name: youngOrganizer
        parent: Catalog
        rest_equivalent: GET /api/catalog/young-organizers/[organizerId]
        mcp_equivalent: catalog_young_organizer_get
    mcp:
      tools:
      - name: catalog_young_event_list
        rest_equivalent: GET /api/catalog/young-events
        notes:
        - Accepts active, category, module, activityLevel, search, organizerId, dateFrom, dateTo, timeBasis,
          page, limit, and mode inputs.
        - Default mode returns compact summaries with category, module, activityLevel, and form; full
          mode adds the organizer, department, poster, counters, timestamps, and places.
      - name: catalog_young_event_get
        rest_equivalent: GET /api/catalog/young-events/[youngId]
        notes:
        - Accepts youngId and mode inputs.
      - name: catalog_young_organizer_list
        rest_equivalent: GET /api/catalog/young-organizers
      - name: catalog_young_organizer_get
        rest_equivalent: GET /api/catalog/young-organizers/[organizerId]
    presentation:
      items:
      - event name
      - category (单次项目 / 系列项目), module (德/智/体/美/劳), activity level, and participation form
      - rich-text description and participation notes, sanitized with proxied inline images
      - signup window, event time, and the upstream created, approved, and updated timestamps
      - capacity, seat limit, applied count, actual participants, and total attendances
      - credited hours, total credited hours, volunteer hours, and activity duration
      - sponsor, organizer, department, and the published contact name and phone
      - per-slot venues, falling back to the single location when there are none
      - target years and favorite count
      - status and source freshness
      - organizer and stable organizer ID
      - sourceMissing and lastSeenAt when applicable
