      items:
      - event name
      - category (单次项目 / 系列项目), module (德/智/体/美/劳), activity level, and participation form
      - Rich descriptions and participation notes use sanitized content with proxied images.
      - title and status badges on the lower edge of the poster banner
      - status and source freshness as a short footnote
      - organizer and stable organizer ID
      - sourceMissing and lastSeenAt when applicable
