kind: feature
id: user
name: User
areas:
- account
- community
policy_refs:
- interface-hierarchy
- ui
- permission-ui
- rendering-and-cache
- cases.account
access:
  anon: Can browse all public information; further actions are not available before entering the sign-in
    flow.
  user: Can subscribe to sections, manage todos, mark homework completion, export iCal, pin frequent links,
    save bus preferences, post comments/replies/reactions and upload attachments, and manage personal
    profile and OAuth connections.
  admin: Can review comments, maintain descriptions, manage users, suspend accounts, manage OAuth clients,
    maintain bus data, and handle user content and platform security issues.
  agent: Can only access restricted capabilities after OAuth authorization; does not inherit admin permissions
    by default; REST and MCP for the same abstract endpoint maintain consistent fields and permissions.
requirements:
- id: user.shell-viewer
  category: behavior
  rule: The root layout owns the client viewer state and issues at most one shell bootstrap request per
    mount. Public page controls reuse that in-memory state instead of issuing duplicate identity requests.
    Navigation-summary failures preserve the authenticated viewer and return null navigation; identity
    failures remain distinguishable from an anonymous viewer. Neither response nor viewer state is stored
    in a shared cache.
- id: user.sign-in-providers
  category: behavior
  rule: Sign-in supports USTC, GitHub, and Google OAuth; custom username/password login is not considered
    due to security and maintenance cost.
- id: user.passkey-server-boundary
  category: authorization
  rule: Passkey registration, rename, and deletion require an authoritative recent session under the account
    action policy. The RP ID is derived from the canonical configured origin, and only explicitly trusted
    origins on that RP ID or its subdomains may complete ceremonies. localhost and 127.0.0.1 are separate
    relying parties.
- id: user.passkey-user-flow
  category: presentation
  rule: The sign-in page offers a WebAuthn passkey ceremony when supported. Signed-in users list, add,
    rename, and delete their own passkeys in linked-account settings through the Better Auth client plugin.
    Unsupported browsers, cancelled ceremonies, stale registration sessions, empty lists, and request
    failures have explicit user-visible states.
- id: user.debug-password-boundary
  category: authorization
  rule: Email/password authentication is enabled only for local development or the explicit non-production
    E2E debug mode; production does not expose debug password authentication.
- id: user.oauth-callback-integrity
  category: authorization
  rule: On a canonical same-origin deployment, OAuth login callbacks must complete state validation and
    session creation directly, without losing state due to proxy wrapping or container-internal host differences.
- id: user.welcome-flow-required
  category: behavior
  rule: New users who have not set a name or username on first login must complete the welcome flow before
    proceeding.
- id: user.welcome-staged-steps
  category: presentation
  rule: 'Welcome renders one URL step at a time: required profile, skippable subscriptions, then orientation.
    Incomplete profiles always land on profile; completed ones never return to it. Only the last step
    leaves for the callback. Welcome hides sidebar, search, and mobile primary nav. Subscriptions cannot
    read official enrollment; they inline undergraduate and graduate academic-system links and match pasted
    course codes.'
- id: user.welcome-avatar-upload
  category: behavior
  rule: During welcome, signed-in users may upload a JPG, PNG, WebP, or AVIF avatar up to 5 MB. The Worker
    uses the Cloudflare Images binding to auto-crop it to a 256-by-256 WebP before storing it in private
    R2; public avatar delivery is limited to URLs currently referenced by that user's profile.
- id: user.welcome-oauth-refresh
  category: consistency
  rule: A signed-in user may refresh an already linked provider's upstream profile options. Missing profile
    values may be filled and new avatar choices added, but user-entered values are preserved. This refresh
    does not authorize a third-party application to use Life@USTC APIs.
- id: user.welcome-completion-resume
  category: consistency
  rule: If the welcome flow was reached from an app-relative callbackUrl, successful completion returns
    to that page; otherwise completion returns home.
- id: user.auth-callback-not-intercepted
  category: behavior
  rule: Authorization callback continuation requests carrying OAuth code/error and state must be allowed
    to complete the protocol redirect; the welcome page interceptor must not break the authorization result
    redirect.
- id: user.post-login-redirect
  category: behavior
  rule: After successful login, the user should be redirected back to the originally requested app-relative
    page whenever possible; unsafe external callbacks fall back to the home page.
- id: user.oauth-login-resume
  category: behavior
  rule: If an OAuth authorization request lands on /account/sign-in with raw authorization query parameters
    instead of callbackUrl, the sign-in flow should resume that exact authorization request after login
    rather than falling back to /.
- id: user.oauth-consent-loopback-continuation
  category: behavior
  rule: The OAuth consent step must continue working for loopback public clients even when the client
    uses 127.0.0.1 and the app itself is being browsed via localhost; consent submission should preserve
    the original authorization query and complete the redirect back to the registered loopback callback.
- id: user.public-identity-display
  category: presentation
  rule: Public identity uses the display name, then username, then a non-identifying localized fallback.
    Internal user IDs may locate a profile but are never its primary display label. Anonymous comments
    use the anonymous label regardless of the author's profile.
- id: user.public-profile-canonical-route
  category: behavior
  rule: Username, differently cased username and stable user-ID addresses resolve the same public profile;
    its canonical and Open Graph URLs use the current username when available.
  rationale: Usernames are mutable. Keeping ID addresses usable avoids permanently caching a redirect
    to an old username; canonical metadata identifies the preferred current address.
  acceptance:
    given: A public profile has a username and a stable ID.
    when: A browser loads its username, uppercase username and ID URLs.
    then:
    - All three addresses render the same public profile.
    - Canonical and Open Graph URLs identify the lowercase username address without query parameters.
    test:
      file: tests/e2e/src/app/u/[username]/test.ts
      name: user.public-profile-canonical-route
- id: user.public-profile-id-addressability
  category: behavior
  rule: A profile without a username is addressable by its stable ID, with its display name as primary
    identity and its ID address as the canonical URL.
  acceptance:
    given: A user has a display name and no username.
    when: A browser visits that user's ID URL.
    then:
    - The profile and canonical URL resolve successfully.
    - Primary heading and page title show the display name, not the internal ID.
    test:
      file: tests/e2e/src/app/u/[username]/test.ts
      name: user.public-profile-id-addressability
- id: user.account-deletion-retention
  category: consistency
  rule: Settings account deletion requires an authoritative session created within the last 15 minutes.
    Actor and subject relations are anonymized by their database foreign keys; the post-deletion success
    event does not retain the deleted user ID. Deleting an admin account is allowed only when at least
    one other admin remains.
- id: user.sensitive-account-recent-auth
  category: authorization
  rule: Adding credentials or linked accounts, expanding OAuth grants, changing passwords or email, deleting
    an account, and rotating calendar feed credentials require an authoritative session created within
    the last 15 minutes. Stale authority-expanding actions provide explicit sign-in guidance.
  rationale: 'Revocation and scope reduction have their own valid-session requirements: reducing existing
    authority does not require a new sign-in.'
- id: user.oauth-authorization-management
  category: behavior
  rule: Settings presents linked sign-in identities separately from delegated application grants. Authorized-application
    entries show safe client metadata and content-free 30-day usage; only the owning user may revoke a
    grant. Explicit client trust does not follow from its display name or domain.
- id: user.account-security-activity
  category: presentation
  rule: The session-only /account/settings/security page lists the owning user's sensitive account events
    with cursor pagination, masked network prefixes, coarse device families, and safe OAuth client names.
    OAuth clients cannot access this all-clients security view.
- id: user.oauth-client-activity-isolation
  category: authorization
  rule: REST, GraphQL, and MCP expose only events whose subject user and OAuth client both come from the
    verified principal. Callers cannot provide either identity, and the projection excludes IP, user agent,
    grant, session, request, and other-client data.
- id: user.account-profile-oauth-projection
  category: privacy
  rule: Cookie sessions receive their full private account profile. OAuth account.profile:read returns
    email only when the standard email scope is also granted and never discloses administrative status.
- id: user.public-comment-contribution-privacy
  category: privacy
  rule: Named public profile comment totals and contribution dates include only active, public, non-anonymous
    comments. Login-only, anonymous, hidden and deleted comments do not change those public values.
  acceptance:
    given: A named profile has public, anonymous, logged-in-only, softbanned, deleted and tombstoned comments.
    when: The restricted runtime reads public contribution days and public profile counts, then a public
      comment becomes anonymous.
    then:
    - Only active, public, non-anonymous and non-deleted comments contribute to counts or dates.
    - Changing a comment to anonymous immediately removes its attributed contribution.
    test:
      file: tests/integration/user-profile-contributions.test.ts
      name: user.public-comment-contribution-privacy
- id: user.public-upload-contribution-privacy
  category: privacy
  rule: Named public profile upload totals and contribution dates include only uploads attached to active,
    public, non-anonymous comments. Unattached uploads and attachments of invisible or anonymous comments
    do not change those public values.
  acceptance:
    given: The profile owns public attachments, private attachments and unattached uploads.
    when: The restricted runtime reads totals and contribution dates before and after publishing and restricting
      an attachment comment.
    then:
    - Only uploads attached to active public non-anonymous comments by the same owner contribute.
    - Unattached, anonymous, restricted and deleted attachments do not change either projection.
    test:
      file: tests/integration/user-profile-contributions.test.ts
      name: user.public-upload-contribution-privacy
- id: user.private-workspace-profile-exclusion
  category: privacy
  rule: Public profiles do not expose private section subscription counts or homework completion state.
    Private workspace actions do not change public contribution totals or date cells.
  acceptance:
    given: A public profile exists for a user with private homework completion state.
    when: The user changes subscriptions and completion state while their public profile is read.
    then:
    - Public output and contribution counts do not change.
    - Neither subscription totals nor the removed privileged subscription-count function remain available.
    test:
      file: tests/integration/user-profile-contributions.test.ts
      name: user.private-workspace-profile-exclusion
- id: user.session-revocation-valid-session
  category: authorization
  rule: Session revocation requires a valid authoritative session and does not require a recent sign-in.
    Single-session, other-session, and all-session operations remove only the selected sessions belonging
    to the actor.
  applies_to:
  - settings
  acceptance:
    given: A user has a valid session older than 15 minutes and another active owned session.
    when: The user invokes single, other-session, or all-session revocation.
    then:
    - The selected owned sessions are removed.
    - Another user's sessions are retained.
    - The current session is retained except for revoke-all.
    test:
      file: tests/integration/account-authority-reduction.test.ts
      name: user.session-revocation-valid-session
- id: user.session-revocation-ownership
  category: authorization
  rule: Single-session revocation cannot delete a session belonging to another user, even when its token
    is supplied.
  applies_to:
  - settings
  acceptance:
    given: The actor and another user each have an active session.
    when: The actor submits the other user's session token to single-session revocation.
    then:
    - The other user's session is not deleted.
    - The actor session remains valid.
    test:
      file: tests/integration/account-authority-reduction.test.ts
      name: user.session-revocation-ownership
- id: user.session-revocation-origin
  category: authorization
  rule: Cookie-authenticated session revocation rejects untrusted request origins before changing any
    session.
  applies_to:
  - settings
  acceptance:
    given: An authenticated user has two active sessions.
    when: Each session-revocation endpoint receives a foreign Origin.
    then:
    - Each response is 403.
    - Neither session is deleted.
    test:
      file: tests/integration/account-authority-reduction.test.ts
      name: user.session-revocation-origin
- id: user.session-revocation-authoritative
  category: authorization
  rule: A revoked session cannot authorize session revocation; session validity is checked against authoritative
    server state.
  applies_to:
  - settings
  acceptance:
    given: A signed cookie refers to a session that has been revoked.
    when: The cookie calls each session-revocation endpoint.
    then:
    - Each request is unauthorized.
    - Other owned sessions are unchanged.
    test:
      file: tests/integration/account-authority-reduction.test.ts
      name: user.session-revocation-authoritative
capabilities:
  sign-in:
    title: Sign In
    auth: anon
    web:
      pages:
      - /account/sign-in
    rest: stable
    mcp: unavailable
    presentation:
      items:
      - 'OAuth provider buttons: GitHub, Google, OIDC/USTC'
      - Passkey sign-in button with unsupported, cancelled, and failure states
      - Error message (if login fails)
      - Terms and privacy links
  first-login-welcome:
    title: First Login & Welcome Page
    auth: user
    web:
      pages:
      - /account/welcome
    rest: unavailable
    mcp: unavailable
    links:
      models:
      - User
    presentation:
      items:
      - user.name (Current value display)
      - user.username (Current value display)
      - user.image (Current avatar)
      - user.profilePictures[] (Avatar selector grid)
      - Custom avatar upload (server-cropped 256x256 WebP in R2)
      - Linked OAuth providers (reauthorize to refresh upstream profile options)
      - Step progress indicator with back, skip, and finish controls
      - semesters[] (Semester dropdown options, subscriptions step)
      - defaultSemesterId (Preselected semester)
      - Platform guidance for subscriptions, workspace, planning, and account security (final step)
  post-login-redirect:
    title: Post-Login Redirect
    auth: anon
    web: stable
    rest: unavailable
    presentation:
      items:
      - callbackUrl query parameter (origin page)
      - External or protocol-relative callbackUrl values are rejected
      - Sign-in action links include the current path and query as callbackUrl
      - Fallback to home page if no origin
  public-profile:
    title: Public Profile
    auth: anon
    web:
      pages:
      - /community/users/$identifier
    rest:
      routes:
      - path: /api/account/profile
        auth: user
        notes:
        - Cookie sessions receive email and isAdmin. OAuth callers receive email only with the standard
          email scope and isAdmin is null.
      - path: /api/community/users/[identifier]
        notes:
        - The path identifier accepts either a username or user ID and returns the same public profile
          hierarchy as /community/users/$identifier.
    graphql:
      queries:
      - parent: Community
        name: user
        auth: anon
        rest_equivalent: GET /api/community/users/:identifier
        mcp_equivalent: community_user_get
        notes:
        - GraphQL community.user is an anonymous public identity read with no required OAuth scope. The
          native MCP community_user_get tool requires community.user:read; its transport authorization
          is intentionally stricter than this GraphQL field.
      fields:
      - parent: Account
        name: profile
        auth: user
        required_scopes:
        - account.profile:read
        rest_equivalent: GET /api/account/profile
        mcp_equivalent: account_profile_get
    mcp:
      tools:
      - name: account_profile_get
        auth: user
        rest_equivalent: GET /api/account/profile
      - name: community_user_get
        rest_equivalent: GET /api/community/users/:identifier
        notes:
        - 'Accepts exactly one lookup key: identifier (username or user ID).'
    links:
      models:
      - User
    presentation:
      items:
      - user.image (Avatar)
      - user.name (Display name)
      - user.username (@username)
      - user.createdAt (Join date)
      - user._count.comments (Total comments)
      - user._count.uploads (Total uploads)
      - user._count.homeworksCreated (Homeworks created)
      - weeks[].date (YYYY-MM-DD)
      - weeks[].count (Contribution count)
      - totalContributions (Aggregate)
      - Keyboard- and touch-accessible horizontally scrollable contribution history
      - Public contribution counts and dates follow user.public-comment-contribution-privacy, user.public-upload-contribution-privacy,
        and user.private-workspace-profile-exclusion
  settings:
    title: Settings
    auth: user
    web:
      pages:
      - /account/settings/profile
      - /account/settings/preferences
      - /account/settings/accounts
      - /account/settings/security
      - /account/settings/authorizations
      - /account/settings/danger
    rest: unavailable
    mcp: unavailable
    links:
      models:
      - User
    presentation:
      items:
      - user.profilePictures[] (Avatar options)
      - user.image (Current avatar)
      - user.name (Display name)
      - user.username (Username)
      - user.accounts[].provider (github, google, oidc)
      - user passkeys with add, rename, and delete controls
      - Fresh-session and WebAuthn support states for passkey registration
      - Disconnect control reflects whether another supported sign-in method remains
      - 'Security activity: sensitive action, outcome, channel, masked network, coarse device, client
        display name, and cursor pagination'
      - 'Authorized OAuth applications: client display name, public URI, disabled state, scopes, last
        authorization time, last usage channel/feature, 30-day read/write/error counts, and revoke action'
      - Compact responsive section navigation with active-section description
      - Navigation links to sections and comment guide
      - Visually separated danger region and account deletion confirmation interface
    requirement_refs:
    - user.session-revocation-valid-session
    - user.session-revocation-ownership
    - user.session-revocation-origin
    - user.session-revocation-authoritative
  oauth-client-activity:
    title: Current OAuth Client Activity
    auth: user
    web: unavailable
    rest:
      routes:
      - path: /api/account/client-activity
        method: GET
        notes:
        - Requires the read-only account.client-activity:read OAuth scope.
        - OAuth Bearer only; userId and clientId are always derived from the verified principal.
    graphql:
      fields:
      - parent: Account
        name: clientActivity
        required_scopes:
        - account.client-activity:read
    mcp:
      tools:
      - name: account_client_activity_list
        notes:
        - Requires the read-only account.client-activity:read OAuth scope.
    links:
      models:
      - AuditLog
