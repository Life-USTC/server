<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-JNK35J2Q3R"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        // biome-ignore lint/complexity/noArguments: Keep Google's canonical gtag bootstrap.
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-JNK35J2Q3R");
    </script>
    <script>
      (() => {
        let themeMode = "system";
        try {
          const storedTheme = localStorage.getItem("life-ustc-theme");
          if (
            storedTheme === "light" ||
            storedTheme === "dark" ||
            storedTheme === "system"
          ) {
            themeMode = storedTheme;
          }
        } catch {}

        const prefersDark = window.matchMedia(
          "(prefers-color-scheme: dark)",
        ).matches;
        document.documentElement.dataset.theme =
          themeMode === "dark" || (themeMode === "system" && prefersDark)
            ? "dark"
            : "light";
      })();
    </script>
    %sveltekit.head%
  </head>
  <body
    data-sveltekit-preload-code="hover"
    data-sveltekit-preload-data="tap"
  >
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
