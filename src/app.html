<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    %life.analytics%
    <script>
      (() => {
        const rememberMenuClick = (event) => {
          const button = event.target.closest?.("[data-topbar-menu]");
          if (button) button.toggleAttribute("data-pending-menu-toggle");
        };
        document.addEventListener("click", rememberMenuClick, true);
        document.addEventListener("life:topbar-ready", () => {
          document.removeEventListener("click", rememberMenuClick, true);
        }, { once: true });

        let themeMode = "system";
        try {
          const storedTheme = localStorage.getItem("life-ustc-theme");
          if (
            storedTheme === "light" ||
            storedTheme === "dark" ||
            storedTheme === "system"
          ) {
            themeMode = storedTheme;
          }
        } catch {}

        const prefersDark = window.matchMedia(
          "(prefers-color-scheme: dark)",
        ).matches;
        document.documentElement.dataset.theme =
          themeMode === "dark" || (themeMode === "system" && prefersDark)
            ? "dark"
            : "light";
      })();
    </script>
    %sveltekit.head%
  </head>
  <body
    data-sveltekit-preload-code="hover"
    data-sveltekit-preload-data="tap"
  >
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
